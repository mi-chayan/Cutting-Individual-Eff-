<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Individual PIB Report</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --card:#fff; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
    --red:#D64550; --green:#1E8E4E; --blue:#1D6FD0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  /* One vertical flex column, so the table reaches the bottom of the window
     instead of stopping short and leaving dead space above the footer. */
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}

  .strip{background:#fff;border-bottom:1px solid var(--line);padding:7px 16px;
         display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:30;flex:0 0 auto}
  .strip h2{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap}
  .sep{width:1px;height:22px;background:var(--line)}
  .strip label{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .showing{font-size:11px;color:var(--mut);white-space:nowrap}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
  .mini{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:7px;
        padding:5px 11px;font-family:inherit;font-weight:700;font-size:11.5px;cursor:pointer;
        display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .mini:hover{background:var(--cream);border-color:var(--peach)}
  .mini svg{width:12px;height:12px;fill:var(--navy)}
  .mini.xls{background:#E8F5EE;color:#14663A;border-color:#9FD5B8;font-weight:800}
  .mini.xls svg{fill:#1E8E4E}
  .mini.xls:hover{background:#1E8E4E;color:#fff;border-color:#1E8E4E}
  .mini.xls:hover svg{fill:#fff}
  .mini.prn{background:#EEF1FA;color:#2B3566;border-color:#B9C2E4;font-weight:800}
  .mini.prn svg{fill:#333D6D}
  .mini.prn:hover{background:#333D6D;color:#fff;border-color:#333D6D}
  .mini.prn:hover svg{fill:#fff}
  select,input[type=text]{font-family:inherit;font-size:12px;font-weight:700;color:var(--txt);
        padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
  select:focus,input:focus{outline:none;border-color:var(--violet)}
  .dpick{position:relative;display:inline-flex;align-items:center;gap:6px;
         border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;
         font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
  .dpick:hover{border-color:var(--violet)}
  .dpick svg{width:13px;height:13px;fill:var(--violet);flex:0 0 auto}
  .dpick input[type=date]{position:absolute;inset:0;width:100%;height:100%;
         opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-family:inherit}
  .hide{display:none !important}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .seg button{border:0;background:#fff;color:var(--navy);font-family:inherit;font-weight:800;
              font-size:11.5px;padding:6px 14px;cursor:pointer;white-space:nowrap}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--navy);color:#fff}

  /* ---- filter bar ---- */
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:9px 16px 0;flex:0 0 auto}
  .chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;
        font-size:11.5px;font-weight:800;color:var(--navy);cursor:pointer;white-space:nowrap}
  .chip:hover{border-color:var(--navy)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip.fact{border-style:dashed}
  /* metric picker, the one deliberately different colour on this bar */
  .mchip{background:#fff;border:1px solid var(--peach);border-radius:99px;padding:5px 12px;
         font-size:11.5px;font-weight:800;color:#8A5B12;cursor:pointer;white-space:nowrap}
  .mchip:hover{background:var(--cream)}
  .mchip.on{background:#8A5B12;color:#fff;border-color:#8A5B12}
  /* marks an operator who moved between floors inside the period */
  .movd{font-size:9px;color:#723EC3;opacity:.85;vertical-align:1px}
  .away{font-size:9px;color:#C77700;vertical-align:1px}
  .noro{font-size:9px;color:#7A81A0;vertical-align:1px;font-weight:800}
  /* a central booster belongs to no floor by design */
  .ctrl{font-size:8.5px;font-weight:800;color:#fff;background:#723EC3;
        border-radius:20px;padding:1px 6px;letter-spacing:.3px}
  .fsep{width:1px;height:20px;background:var(--line);margin:0 3px}

  .wrap{padding:11px 16px 12px;max-width:1560px;margin:0 auto;width:100%;
        flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        box-shadow:0 1px 2px rgba(37,42,69,.05);overflow:hidden;
        flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .card .hd{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
            font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;
            flex:0 0 auto}
  .scroll{flex:1 1 auto;min-height:0;overflow:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
  thead th{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;
           padding:8px;text-align:right;font-weight:700;font-size:10.5px;
           text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;cursor:pointer;user-select:none}
  thead th.l{text-align:left}
  thead th.c{text-align:center}
  thead th:hover{background:#2B3566}
  thead th .arr{font-size:8px;margin-left:3px}
  thead th .d2{display:block;font-size:8.5px;font-weight:600;opacity:.7;letter-spacing:0}
  thead th.wr{white-space:normal;width:58px;min-width:58px;line-height:1.15}
  tbody td.wr{width:58px;min-width:58px}
  /* Two-line heading: the label reads as a label and the unit sits beneath it in
     small muted type, instead of both fighting for room inside one phrase. */
  thead th.two{white-space:normal;line-height:1.2;vertical-align:bottom;padding:7px 8px}
  thead th .u{display:block;font-size:8.5px;font-weight:600;opacity:.6;
              letter-spacing:.2px;text-transform:none;margin-top:2px}
  table.fixed{table-layout:fixed}
  /* faint rules marking where the band-count block begins and ends */
  thead th.bs,tbody td.bs{border-left:2px solid #DDE1EC}
  thead th.be,tbody td.be{border-right:2px solid #DDE1EC}
  tr.totalrow td.bs,tr.totalrow td.be{border-color:rgba(255,255,255,.28)}
  tbody td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  tbody td.l{text-align:left}
  tbody td.c{text-align:center}
  tbody tr:nth-child(even) td{background:#F6F7FB}
  /* Full row highlight. The band classes below carry two class selectors, which
     outrank a plain tr:hover td, so without !important only the uncoloured
     columns would light up and the row would look broken in half. */
  tbody tr:hover td{background:var(--cream) !important}
  tr.totalrow td{background:var(--navy) !important;color:#fff;font-weight:800;
                 position:sticky;bottom:0;z-index:5}
  tbody tr.totalrow:hover td{background:var(--navy) !important}
  /* Band classes carry their own text colour, which is unreadable on the navy
     total row. Force white there, the band is not meaningful on a grand total. */
  tr.totalrow td.sc{color:#fff !important}
  /* factory subtotal rows in the Summary view */
  tbody tr.grp td{background:#EEF1FA !important;font-weight:800;
                  border-top:2px solid var(--navy);border-bottom:2px solid var(--navy)}
  tbody tr.grp:hover td{background:#E2E8F7 !important}
  .mono{font-variant-numeric:tabular-nums}
  .loading{text-align:center;padding:56px;color:var(--mut);font-size:12px}
  /* Armed Load button and the resting state. */
  .mini.load.needs{background:var(--violet);color:#fff;border-color:var(--violet)}
  .mini.load.needs svg{fill:#fff}
  .mini.load.needs:hover{background:#5F31A6;border-color:#5F31A6}
  .mini.load svg{width:13px;height:13px;fill:currentColor}
  td.ready{text-align:center;padding:56px 20px;color:var(--mut);font-size:12.5px;line-height:1.9}
  td.ready b{display:block;color:var(--navy);font-size:15px;margin-bottom:5px}
  .err{padding:22px;color:var(--red);font-size:12.5px;line-height:1.8;font-weight:600}

  .sc{font-weight:800}
  .sc.lo{background:#FBE9EB;color:#A3252F}
  .sc.mid{background:#FFF6E6;color:#8A5B12}
  .sc.hi{background:#E7F4EC;color:#12653A}
  .sc.top{background:#E8F0FC;color:#14509E}
  .sc.na{color:#C2C6D6}
  td.tot{background:#F1F2F7 !important;font-weight:800}
  .lgd{display:flex;gap:14px;align-items:center;font-size:10px;color:var(--mut);
       font-weight:700;padding:8px 13px;border-top:1px solid var(--line);flex:0 0 auto}
  .lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  td.sc[data-op]{cursor:help}

  /* ---- score breakdown tooltip ---- */
  #tip{position:fixed;z-index:9500;pointer-events:none;display:none;width:235px;
       background:#1F2740;color:#fff;border-radius:8px;padding:8px 10px;
       font-size:10.5px;line-height:1.3;box-shadow:0 10px 26px rgba(0,0,0,.3)}
  #tip.on{display:block}
  #tip h4{font-size:11.5px;font-weight:800;line-height:1.25}
  #tip .sub{font-size:9px;opacity:.6;font-weight:700;margin-bottom:6px;letter-spacing:.2px}
  #tip .g{display:grid;grid-template-columns:1fr auto;gap:0 10px}
  #tip .g span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  #tip .g span:nth-child(odd){opacity:.7}
  #tip .r{border-top:1px solid rgba(255,255,255,.22);margin-top:5px;padding-top:4px;
          display:flex;justify-content:space-between;font-weight:800;font-size:11.5px}
  #tip .note{margin-top:3px;font-size:9.5px;opacity:.65;font-weight:700}
  #tip i{font-style:normal;opacity:.55}

  /* ---- modal ---- */
  .ovl{display:none;position:fixed;inset:0;z-index:9000;background:rgba(37,42,69,.45);
       backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:22px}
  .ovl.on{display:flex;align-items:center;justify-content:center}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:1240px;max-height:90vh;
         display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 54px rgba(37,42,69,.3)}
  .modal .mh{display:flex;align-items:center;gap:10px;padding:11px 15px;background:var(--navy);color:#fff;flex:0 0 auto}
  .modal .mh b{font-size:12.5px;font-weight:800}
  .modal .mh .sub{font-size:10.5px;opacity:.75;font-weight:600}
  .modal .mh .gap{flex:1}
  .modal .mh .mini{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.25)}
  .modal .mh .mini:hover{background:#fff;color:var(--navy)}
  .modal .mh .x{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:6px;width:26px;height:26px;
                font-family:inherit;font-size:16px;line-height:1;cursor:pointer;font-weight:700}
  .modal .mh .x:hover{background:var(--red)}
  .modal .mb{flex:1 1 auto;overflow:auto}
  .modal table thead th{cursor:default}
  .modal table thead th:hover{background:var(--navy)}

  .printhead{display:none}
  .printfoot{display:none}
  @media print{
    @page{size:A4 landscape;margin:9mm 8mm}
    body{background:#fff;font-size:8pt}
    .strip,.chips,.lgd,.ovl{display:none !important}
    html,body{height:auto;display:block}
    .wrap{padding:0;max-width:none;display:block}
    .card{border:0;box-shadow:none;border-radius:0;display:block}
    .card .hd{display:none}
    .scroll{max-height:none;min-height:0;overflow:visible}
    .printhead{display:flex;align-items:center;gap:5mm;margin-bottom:4mm;
               border-bottom:.6mm solid #333D6D;padding-bottom:2.5mm}
    .printhead img{height:9mm;width:auto;flex:0 0 auto;display:block}
    .printhead h1{font-size:11pt;font-weight:800;color:#333D6D;margin:0 0 1.5mm 0}
    .printhead .meta{display:flex;gap:6mm;font-size:7pt;color:#555;flex-wrap:wrap}
    .printhead .meta b{color:#111}
    thead th{background:#333D6D !important;color:#fff !important;font-size:6.4pt;padding:1.5mm 1mm;
             -webkit-print-color-adjust:exact;print-color-adjust:exact}
    tbody td{font-size:6.8pt;padding:1.1mm}
    tbody tr:nth-child(even) td{background:#F6F7FB !important;
             -webkit-print-color-adjust:exact;print-color-adjust:exact}
    tr.totalrow td{background:#333D6D !important;color:#fff !important;position:static;
             -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sc,td.tot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    tbody tr{page-break-inside:avoid}
    thead{display:table-header-group}
    .printfoot{display:block !important;margin-top:4mm;font-size:6.5pt;color:#666;text-align:center;
               border-top:.3mm solid #ccc;padding-top:2mm}

    /* printing a modal rather than the page behind it */
    body.pmodal .printhead,body.pmodal .printfoot,body.pmodal .wrap{display:none !important}
    body.pmodal .ovl{display:block !important;position:static;background:none;padding:0;backdrop-filter:none}
    body.pmodal .modal{max-width:none;max-height:none;box-shadow:none;border-radius:0}
    body.pmodal .modal .mh{background:#fff !important;color:#333D6D !important;
                           border-bottom:.6mm solid #333D6D;padding:0 0 2.5mm 0}
    body.pmodal .modal .mh .mini,body.pmodal .modal .mh .x{display:none !important}
    body.pmodal .modal .mb{overflow:visible}
  }
  @media(max-width:700px){ .strip{padding:6px 9px;gap:7px} .wrap{padding:10px 9px 20px} .chips{padding:8px 9px 0} }


  /* ================= the loading island =================
     Two pieces that work together.

     1. A REAL progress bar across the very top. It used to be a block sliding
        left to right for ever, which says "something is happening" and
        nothing else. Left is 0, right is 100, and it only ever moves
        forwards.

        Most of these fetches are ONE request, so there is no honest fraction
        to report until it lands. Rather than lie with a fake percentage, it
        eases toward 90 and waits there: fast at first, slower the longer it
        takes, which is the same trick GitHub uses and it reads as real
        because it never goes backwards and never completes early. Where a
        genuine fraction IS known, the weekly report fetching six days in
        chunks, barSet() overrides the easing with the true number.

     2. An island under the header saying WHAT is loading. Detached from the
        title bar, dark, rounded, with a progress ring on the left. It springs
        in, morphs when the text changes, and springs out.
     ---------------------------------------------------------------- */
  #bar{position:fixed;top:0;left:0;height:3px;width:100%;z-index:400;
       pointer-events:none;opacity:0;transition:opacity .3s ease}
  #bar.on{opacity:1}
  #bar i{display:block;height:100%;width:0;border-radius:0 3px 3px 0;
         background:linear-gradient(90deg,#5B33A8,#723EC3 55%,#B07CFF);
         box-shadow:0 0 10px rgba(176,124,255,.7);
         transition:width .34s cubic-bezier(.22,.61,.36,1)}
  /* A highlight travelling along the filled part, so a long wait still looks
     alive even while the number is barely moving. */
  #bar i:after{content:'';position:absolute;top:0;right:0;width:90px;height:100%;
       background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55));
       animation:barsheen 1.1s ease-in-out infinite}
  #bar i{position:relative;overflow:hidden}
  @keyframes barsheen{0%{opacity:.15}50%{opacity:.8}100%{opacity:.15}}

  /* NO CIRCULAR SPINNER. The pill already says what is loading in words and
     the bar across the top already shows that something is running. A third
     thing spinning beside them said nothing extra. */
  .island .ring{display:none !important}
  .island{position:fixed;top:12px;left:50%;z-index:401;
          display:inline-flex;align-items:center;gap:11px;
          background:rgba(12,12,18,.94);color:#fff;
          -webkit-backdrop-filter:blur(14px) saturate(160%);
          backdrop-filter:blur(14px) saturate(160%);
          border-radius:999px;padding:9px 18px 9px 13px;
          font-size:12px;font-weight:700;letter-spacing:.1px;white-space:nowrap;
          max-width:min(560px,90vw);overflow:hidden;
          box-shadow:0 10px 30px rgba(0,0,0,.34), inset 0 0 0 .5px rgba(255,255,255,.14);
          pointer-events:none;
          transform:translateX(-50%) translateY(-26px) scale(.80);
          opacity:0;
          transition:transform .46s cubic-bezier(.34,1.56,.64,1),
                     opacity .2s ease}
  .island.on{transform:translateX(-50%) translateY(0) scale(1);opacity:1}

  /* The progress ring. One CSS variable drives it, set from the same number
     that drives the bar, so the two can never disagree. */
  .island .ring{width:17px;height:17px;border-radius:50%;flex:0 0 auto;position:relative;
       background:conic-gradient(#B07CFF calc(var(--p,0) * 1%), rgba(255,255,255,.16) 0);
       transition:background .34s linear}
  .island .ring:after{content:'';position:absolute;inset:3.5px;border-radius:50%;
       background:#0C0C12}
  .island .ring:before{content:'';position:absolute;inset:-3px;border-radius:50%;
       border:1px solid rgba(176,124,255,.35);animation:islepulse 1.6s ease-in-out infinite}
  @keyframes islepulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.12)}}

  /* The label morphs rather than cutting, so switching from one report to
     another feels like the same object changing its mind. */
  .island .txt{display:inline-block;overflow:hidden;text-overflow:ellipsis;
       transition:opacity .16s ease}
  .island.swap .txt{opacity:0}
  .island .pct{font-variant-numeric:tabular-nums;opacity:.55;font-weight:800;
       font-size:10.5px;min-width:30px;text-align:right}

  @media (prefers-reduced-motion: reduce){
    .island{transition:opacity .2s ease}
    .island .ring:before{animation:none}
    #bar i:after{animation:none}
  }
  /* The old spinner is kept out of the way rather than deleted, so any
     markup that still asks for one simply shows nothing. */
  .spin{display:none !important}
  /* ================= date range picker =================
     TWO calendars in ONE popover: the left picks the START date, the right
     picks the END date, each with its own month navigation. They open together
     and close together, and NOTHING loads until Apply.

     Replaced a pair of native date boxes that each opened their own calendar
     and reloaded the report in between. A one-calendar-two-months layout was
     tried first and dropped: it gave no clue which end you were setting. */
  .drwrap{position:relative;display:inline-flex}
  .drbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;
         border:1px solid var(--line);border-radius:8px;padding:7px 12px;
         font-family:inherit;font-size:12.5px;font-weight:700;color:var(--txt);
         cursor:pointer;white-space:nowrap;line-height:1}
  .drbtn:hover{border-color:var(--violet)}
  .drbtn.on{border-color:var(--violet);box-shadow:0 0 0 3px rgba(114,62,195,.13)}
  .drbtn svg{width:14px;height:14px;fill:var(--violet);flex:0 0 auto}
  .drbtn .drcar{font-size:9px;color:var(--mut)}
  .drbtn .drtxt{font-variant-numeric:tabular-nums}

  .drpop{position:absolute;top:calc(100% + 7px);left:0;z-index:400;display:none;
         background:#fff;border:1px solid var(--line);border-radius:12px;
         box-shadow:0 18px 46px rgba(37,42,69,.22);overflow:hidden}
  .drpop.on{display:flex}
  .drside{width:158px;border-right:1px solid var(--line);background:#FAFAFD;
          padding:8px;display:flex;flex-direction:column;gap:2px;
          max-height:400px;overflow:auto}
  .drside b{font-size:9px;font-weight:800;color:var(--mut);text-transform:uppercase;
            letter-spacing:.5px;padding:7px 8px 3px}
  .drps{text-align:left;background:none;border:0;border-radius:7px;padding:7px 9px;
        font-family:inherit;font-size:12px;font-weight:700;color:var(--txt);cursor:pointer;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drps:hover{background:#EFE9FA}
  .drps.on{background:var(--violet);color:#fff}

  .drmain{padding:12px 14px 0;display:flex;flex-direction:column}
  .drcals{display:flex;gap:16px}
  .drcal{width:232px}
  /* Each calendar says which end it owns, and what that end is currently set
     to. Without the label a user cannot tell the two apart at a glance. */
  .drcaphd{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .drtag{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
         background:#EFE9FA;color:var(--violet);padding:3px 8px;border-radius:99px}
  .drtag.end{background:#FFF0D9;color:#8A5B12}
  .drval{font-size:10.5px;font-weight:800;color:var(--navy);
         font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}

  .drnav{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .drnav button{width:24px;height:24px;border:1px solid var(--line);background:#fff;
                border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;
                font-weight:800;color:var(--navy);line-height:1;flex:0 0 auto}
  .drnav button:hover:not(:disabled){border-color:var(--violet);color:var(--violet)}
  .drnav button:disabled{opacity:.3;cursor:default}

       font-weight:700;color:var(--txt);cursor:pointer;border-radius:6px}

  .drfoot button:hover{background:var(--cream);border-color:var(--peach)}

  @media(max-width:900px){
    .drpop{position:fixed;inset:auto 8px 8px 8px;flex-direction:column;max-height:88vh;overflow:auto}
    .drside{width:auto;border-right:0;border-bottom:1px solid var(--line);
            flex-direction:row;flex-wrap:wrap;max-height:none}
    .drcals{flex-direction:column;gap:14px}
    .drcal,.drcal table{width:100%}
  }

</style>
</head>
