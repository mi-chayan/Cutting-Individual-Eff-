<script>
/* =====================================================================
   DATE RANGE PICKER
   ---------------------------------------------------------------------
   TWO calendars: the left one picks the START date, the right one picks the
   END date. Each has its own month navigation. They live in ONE popover, so
   both ends open together and close together, and NOTHING is fetched until
   Apply. The old control was a pair of native date boxes that each opened
   their own calendar and reloaded the report in between, so choosing
   "1 Aug to 19 Aug" loaded 1 Aug to 1 Aug first.

   An earlier build here showed one calendar spanning two months. That reads
   as a single scrolling strip and gives no clue which end you are setting,
   so it is now one labelled calendar per end.

   The host page supplies four things through drInit():
     presets   [{k, label, get:function(){return [from,to]}}], groups via {group:'..'}
     apply     function(from,to,presetKey) - the ONLY place data is fetched
     min,max   optional ISO bounds; days outside are shown but not clickable
     label     optional function(from,to,presetKey) for the button text
   ===================================================================== */
var DR = {
  from:'', to:'', preset:'', viewA:null, viewB:null,
  presets:[], apply:null, min:'', max:'', label:null, open:false, _wired:false
};

function drIso(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function drParse(s){
  var p=String(s||'').split('-');
  if(p.length!==3) return null;
  var d=new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
var DR_MON=['January','February','March','April','May','June','July','August',
            'September','October','November','December'];
var DR_MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function drPretty(iso){
  var d=drParse(iso); if(!d) return '-';
  return d.getDate()+' '+DR_MONS[d.getMonth()]+' '+d.getFullYear();
}
function drEl(i){ return document.getElementById(i); }
function drMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }

/* SNOWTEX weeks run WEDNESDAY to TUESDAY. Not the calendar week, and not
   Saturday to Thursday. Every This Week / Last Week preset uses this. */
function drWeekStart(d){
  var x=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var back=(x.getDay()-3+7)%7;          /* 3 = Wednesday */
  x.setDate(x.getDate()-back);
  return x;
}

function drInit(o){
  DR.presets = o.presets||[];
  DR.apply   = o.apply;
  DR.label   = o.label||null;

  /* ---------- WHAT IS SELECTABLE ----------
     min and max used to be the first and last date the SHEET holds, and days
     outside that were disabled. That looked tidy and was wrong: the report for
     yesterday is not pushed until the morning, so yesterday itself could not
     be clicked. A date the user cannot select is a dead end; a date with no
     data is merely an empty report, which is honest and recoverable.

     So the ONLY hard stop is the future, because data cannot exist there.
     Days the sheet has no rows for are still clickable, just marked. */
  DR.min = o.min||'';                       /* soft floor, for month paging */
  DR.max = drIso(new Date());               /* today, always */
  DR.has = {};
  (o.days||[]).forEach(function(d){ DR.has[d]=true; });
  DR.hasAny = (o.days||[]).length>0;

  /* Wired ONCE. drInit runs again whenever the available dates change, and a
     second set of listeners would close the popover on its own outside-click
     check firing twice. */
  if(DR._wired) return;
  DR._wired = true;

  /* THE POPOVER MUST NOT CLOSE ON ITS OWN CLICKS.
     drRender() replaces the calendar markup on every click, so by the time a
     click bubbled up to document the element that was clicked had already been
     removed from the DOM. pop.contains(target) was then false and the panel
     closed itself the moment a date was picked. Stopping propagation at the
     popover means the document listener only ever sees genuine outside
     clicks, and it cannot be fooled by a re-render. */
  var pop=drEl('drPop');
  if(pop) pop.addEventListener('click', function(ev){ ev.stopPropagation(); });

  document.addEventListener('click', function(ev){
    if(!DR.open) return;
    var btn=drEl('drBtn');
    if(btn && btn.contains(ev.target)) return;
    drClose();
  });
  document.addEventListener('keydown', function(ev){
    if(DR.open && ev.key==='Escape') drClose();
  });
}

/* Set the range WITHOUT opening or fetching. Used on first load. */
function drSet(from,to,preset){
  DR.from=from||''; DR.to=to||''; DR.preset=preset||'';
  drSyncBtn();
}
function drSyncBtn(){
  var t=drEl('drLabel'); if(!t) return;
  if(DR.label){ t.textContent=DR.label(DR.from,DR.to,DR.preset); return; }
  var named=null;
  DR.presets.forEach(function(p){ if(p.k && p.k===DR.preset) named=p.label; });
  t.textContent = named ? named
    : (DR.from&&DR.to ? (DR.from===DR.to ? drPretty(DR.from)
                                         : drPretty(DR.from)+'  –  '+drPretty(DR.to))
                      : 'Pick a date range');
}

function drToggle(){ DR.open ? drClose() : drOpen(); }

function drOpen(){
  DR.open=true;
  DR.dfrom=DR.from; DR.dto=DR.to; DR.dpreset=DR.preset;   /* draft, Cancel restores */
  drSyncViews();
  drEl('drPop').classList.add('on');
  drEl('drBtn').classList.add('on');
  drRender();
}
function drClose(){
  DR.open=false;
  var p=drEl('drPop'), b=drEl('drBtn');
  if(p) p.classList.remove('on');
  if(b) b.classList.remove('on');
}

/* Each calendar opens on its own end of the range. */
function drSyncViews(){
  var a=drParse(DR.dfrom)||new Date();
  var b=drParse(DR.dto)||a;
  DR.viewA=drMonth(a);
  DR.viewB=drMonth(b);
}

function drShiftA(n){ DR.viewA=new Date(DR.viewA.getFullYear(), DR.viewA.getMonth()+n, 1); drRender(); }
function drShiftB(n){ DR.viewB=new Date(DR.viewB.getFullYear(), DR.viewB.getMonth()+n, 1); drRender(); }

/* A preset fills the draft and shows it on both calendars. It does NOT fetch:
   Apply is still the one action that loads, so a mis-click costs nothing. */
function drPreset(k){
  var p=null;
  DR.presets.forEach(function(x){ if(x.k===k) p=x; });
  if(!p||!p.get) return;
  var r=[];
  /* A preset asked before the date list has arrived cannot work out its range.
     Say so instead of silently clearing both ends, which looked like the
     button had done nothing. */
  try{ r=p.get()||[]; }catch(e){ r=[]; }
  if(!r[0]||!r[1]){
    var sel=drEl('drSel');
    if(sel) sel.innerHTML='<span>Still loading the available days, try again in a moment</span>';
    return;
  }
  DR.dfrom=r[0]; DR.dto=r[1]; DR.dpreset=k;
  drSyncViews();
  drRender();
}

/* which is 'a' for the start calendar, 'b' for the end one. Each sets only
   its own end, so there is no hidden click order to learn. */
function drDayClick(iso, which){
  if(which==='a'){
    DR.dfrom=iso;
    if(DR.dto && DR.dto<iso) DR.dto=iso;      /* end cannot sit before start */
  }else{
    DR.dto=iso;
    if(DR.dfrom && DR.dfrom>iso) DR.dfrom=iso;
  }
  DR.dpreset='';                              /* hand-picked, so not a preset */
  drRender();
}

function drCal(view, which){
  var y=view.getFullYear(), m=view.getMonth();
  var lead=new Date(y,m,1).getDay();
  var days=new Date(y,m+1,0).getDate();
  var today=drIso(new Date());
  var mine=(which==='a')?DR.dfrom:DR.dto;

  var h='<table><thead><tr>'
      + ['S','M','T','W','T','F','S'].map(function(d){return '<th>'+d+'</th>'}).join('')
      + '</tr></thead><tbody><tr>';
  for(var i=0;i<lead;i++) h+='<td></td>';
  for(var d=1;d<=days;d++){
    if((lead+d-1)%7===0 && d>1) h+='</tr><tr>';
    var iso=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+d).slice(-2);
    /* Only the future is blocked. Everything else can be picked. */
    var out=(iso>DR.max);
    var cls=[], tip='';
    /* The days between the two ends are shaded on BOTH calendars, so the span
       is still readable even though each calendar owns one end. */
    if(DR.dfrom&&DR.dto&&iso>DR.dfrom&&iso<DR.dto) cls.push('mid');
    if(iso===mine) cls.push('end');
    if(iso===today) cls.push('today');
    /* Marked, not disabled. It tells the user the report will be empty
       without taking the choice away from them. */
    if(!out && DR.hasAny && !DR.has[iso]){ cls.push('nodata'); tip=' title="No data pushed for this day yet"'; }
    h+='<td><button class="drd '+cls.join(' ')+'"'+(out?' disabled':'')+tip
     + ' onclick="drDayClick(\''+iso+'\',\''+which+'\')">'+d+'</button></td>';
  }
  return h+'</tr></tbody></table>';
}

function drRender(){
  if(!drEl('drSide')) return;                 /* picker not on this page */
  if(!DR.viewA || !DR.viewB) drSyncViews();

  var sh='';
  DR.presets.forEach(function(p){
    if(p.group){ sh+='<b>'+p.group+'</b>'; return; }
    sh+='<button class="drps'+(DR.dpreset===p.k?' on':'')+'" onclick="drPreset(\''+p.k+'\')">'
      + p.label+'</button>';
  });
  drEl('drSide').innerHTML=sh;

  drEl('drMoA').textContent=DR_MON[DR.viewA.getMonth()]+' '+DR.viewA.getFullYear();
  drEl('drMoB').textContent=DR_MON[DR.viewB.getMonth()]+' '+DR.viewB.getFullYear();
  drEl('drCalA').innerHTML=drCal(DR.viewA,'a');
  drEl('drCalB').innerHTML=drCal(DR.viewB,'b');
  drEl('drValA').textContent=DR.dfrom?drPretty(DR.dfrom):'not set';
  drEl('drValB').textContent=DR.dto?drPretty(DR.dto):'not set';

  var ok=!!(DR.dfrom&&DR.dto);
  drEl('drSel').innerHTML = ok
    ? drPretty(DR.dfrom)+'  <span>to</span>  '+drPretty(DR.dto)
      + '  <span>('+(Math.round((drParse(DR.dto)-drParse(DR.dfrom))/86400000)+1)+' days)</span>'
    : '<span>Pick a start date and an end date</span>';
  drEl('drGo').disabled=!ok;

  /* Paging is free backwards; forwards stops at the current month, because
     there is nothing to see beyond today. It used to stop at the last month
     the sheet had data for, which is what hid yesterday. */
  var pa=drEl('drPrevA'), pb=drEl('drPrevB'), na=drEl('drNextA'), nb=drEl('drNextB');
  var hi=drMonth(drParse(DR.max)||new Date());
  if(na) na.disabled = DR.viewA>=hi;
  if(nb) nb.disabled = DR.viewB>=hi;
  if(pa) pa.disabled = false;
  if(pb) pb.disabled = false;
}

function drCancel(){ drClose(); }

/* The ONE place a range change reaches the report. */
function drApply(){
  if(!DR.dfrom||!DR.dto) return;
  if(DR.dfrom>DR.dto){ var t=DR.dfrom; DR.dfrom=DR.dto; DR.dto=t; }
  DR.from=DR.dfrom; DR.to=DR.dto; DR.preset=DR.dpreset;
  drSyncBtn();
  drClose();
  if(DR.apply) DR.apply(DR.from, DR.to, DR.preset);
}



/* ==================================================================
   SNOWTEX dashboard kit
   Shared by daily, range, fabric and weekly. Keep the four copies the
   same: they are inlined rather than imported because every page is a
   single self contained file served from Cloudflare Pages.

   1. THE THIN BAR. Counted, not toggled. Two requests can overlap and a
      naive hide on the first response would switch it off while the
      second is still running.

   2. THE SELECTED DATE IS SHARED. Every report used to remember its own
      date, so moving from the Daily report to Fabric Compliance silently
      changed the day under you. One value in sessionStorage, written by
      whichever page the user last touched, read by all of them.

   3. FIRST OPEN LANDS ON YESTERDAY. Not on "the latest day the sheet
      happens to hold", which is a different date depending on whether
      this morning's report has been pulled yet.
   ================================================================== */

/* ---------- the bar and the island ----------
   Counted, not toggled: two requests can overlap and a naive hide on the
   first response would switch it off while the second is still running.

   PROGRESS. A single fetch gives no honest fraction, so the number eases
   toward 90 and waits, fast at first and slower the longer it takes. It never
   goes backwards and never reaches 100 until the work is actually done, which
   is what keeps it honest. Where a real fraction is known, call barSet(). */
var BUSY_N = 0, BUSY_LABELS = [], BAR_P = 0, BAR_T = null, BAR_HIDE = null;

function barPaint(){
  var b=document.getElementById('bar'), i=b?b.firstChild:null;
  if(i) i.style.width = BAR_P + '%';
  var r=document.getElementById('isleRing');
  if(r) r.style.setProperty('--p', Math.round(BAR_P));
  var p=document.getElementById('islePct');
  if(p) p.textContent = BAR_P>=100 ? '100%' : Math.round(BAR_P)+'%';
}

/* Ease toward 90 and stop. The step shrinks as it climbs, so a slow request
   crawls rather than stalling dead or pretending to finish. */
function barTick(){
  if(BAR_P < 90) BAR_P += Math.max(0.4, (90 - BAR_P) * 0.10);
  barPaint();
}

/** A real fraction, 0 to 1. Only ever moves the bar forwards. */
function barSet(frac){
  var v = Math.max(0, Math.min(1, Number(frac)||0)) * 100;
  if(v > BAR_P) { BAR_P = v; barPaint(); }
}

function islandShow(label){
  var isle=document.getElementById('island'), t=document.getElementById('isleTxt');
  if(!isle||!t) return;
  if(t.textContent && t.textContent !== label){
    /* Morph rather than cut: fade the old label out, swap, fade in. */
    isle.classList.add('swap');
    setTimeout(function(){ t.textContent=label; isle.classList.remove('swap'); },160);
  }else{
    t.textContent=label;
  }
  isle.classList.add('on');
}
function islandHide(){
  var isle=document.getElementById('island');
  if(isle) isle.classList.remove('on');
}

function barBusy(on, label){
  if(on){
    BUSY_N++;
    if(label) BUSY_LABELS.push(label);
    if(BUSY_N === 1){
      if(BAR_HIDE){ clearTimeout(BAR_HIDE); BAR_HIDE=null; }
      BAR_P = 8; barPaint();
      var b=document.getElementById('bar'); if(b) b.className='on';
      if(BAR_T) clearInterval(BAR_T);
      BAR_T = setInterval(barTick, 280);
    }
  }else{
    BUSY_N = Math.max(0, BUSY_N - 1);
    if(label){
      var i = BUSY_LABELS.indexOf(label);
      if(i >= 0) BUSY_LABELS.splice(i, 1);
    }
    if(!BUSY_N){
      BUSY_LABELS = [];
      if(BAR_T){ clearInterval(BAR_T); BAR_T=null; }
      BAR_P = 100; barPaint();
      islandHide();
      /* Let 100% be seen before it disappears, or the bar looks like it
         vanished at 80 and the work was abandoned. */
      BAR_HIDE = setTimeout(function(){
        var b=document.getElementById('bar'); if(b) b.className='';
        setTimeout(function(){ BAR_P=0; barPaint(); }, 320);
      }, 360);
      return;
    }
  }
  var txt = BUSY_LABELS.length ? BUSY_LABELS[BUSY_LABELS.length - 1] : '';
  if(txt) islandShow(txt); else islandHide();
}

/* Wrap any promise so the bar follows it, whatever the outcome. */
function track(p, label){
  barBusy(true, label);
  return p.then(function(v){ barBusy(false, label); return v; },
                function(e){ barBusy(false, label); throw e; });
}

var SD_DAY='sosl_dash_day', SD_FROM='sosl_dash_from', SD_TO='sosl_dash_to';
function ssRead(k){ try{ return sessionStorage.getItem(k)||''; }catch(e){ return ''; } }
function ssWrite(k,v){ try{ sessionStorage.setItem(k, v||''); }catch(e){} }

function isoOf(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function yesterdayISO(){
  var d=new Date(); d.setDate(d.getDate()-1); return isoOf(d);
}

/* The day this page should open on: whatever the user last looked at
   anywhere in the dashboard, otherwise yesterday. */
function wantedDay(){ return ssRead(SD_DAY) || yesterdayISO(); }
function shareDay(d){ if(d) ssWrite(SD_DAY, d); }

function wantedFrom(){ return ssRead(SD_FROM) || wantedDay(); }
function wantedTo(){   return ssRead(SD_TO)   || wantedDay(); }
function shareRange(a,b){ if(a) ssWrite(SD_FROM,a); if(b) ssWrite(SD_TO,b); }

/* ------------------------------------------------------------------
   Two views over the same Database_PIB rows.

   Score Matrix  opens first. Operator on the left, one column per date
                 carrying the chosen score, then Days, Total, Average.
   Full Table    the sheet mirrored, all 15 columns, nothing added.

   The metric picker changes which number fills the matrix:
     Final KPI            out of 100
     Individual Eff%      the KPI earned on the man's own efficiency, out of 50
     Floor Performance    the KPI earned on his floor's Eff% or OEE, out of 50

   Colour bands are a percentage of that metric's maximum, so 25 out of 50
   is shaded the same as 50 out of 100. Comparing raw numbers across the
   three metrics would otherwise be misleading.
   ------------------------------------------------------------------ */

var PIB_API = "https://script.google.com/macros/s/AKfycbyx4_1Oe3q03fWNEwIWWeicfSssI-g7TF1_sZrUFakWRsmSf8rGJXj1bHOJ6tS7w9_tDA/exec";

var SOL_FLOORS=['1A','1B','1C','1D','1E','3A'];
var SSL_FLOORS=['2A','2B','2C','2D','2E'];

var METRICS={
  final:{k:'final',  max:100, label:'Final KPI',        note:'Final KPI Score, out of 100'},
  indv: {k:'kpiInd', max:50,  label:'Individual Eff%',  note:'KPI earned on the operator\u2019s own efficiency, out of 50'},
  floor:{k:'kpiTyp', max:50,  label:'Floor Performance',note:'KPI earned on the floor\u2019s Eff% or OEE, out of 50'}
};

var RAW=[], EFFG={cols:[],rows:[]}, OEEG={cols:[],rows:[]};
/* SNAP starts as an EMPTY OBJECT, not null. The picker and the chips are now
   built before the snapshot arrives, and every one of them reads SNAP.weeks,
   SNAP.dates or SNAP.minDate. With null that threw on the first line and took
   the whole page down; with {} they simply find nothing yet, which is true. */
var SNAP={}, STAMP='', THROUGH='', query='', scopeSel='', dateSel='', view='mat', metric='final', gridKind='eff';
var sortKey='', sortDir=1;
var mSortKey='total', mSortDir=-1;
var MROWS={};   /* floor|opId -> matrix row, used by the hover breakdown */

var COLS=[
  {k:'week',   h:'Week',                 t:'n', d:0},
  {k:'floor',  h:'Floor',                t:'s', a:true},
  {k:'date',   h:'Date',                 t:'d', a:true},
  {k:'opId',   h:'Op ID',                t:'s', a:true},
  {k:'name',   h:'Op Name',              t:'s', a:true},
  {k:'desig',  h:'Designation',          t:'s', a:true},
  {k:'inMin',  h:'Input min',            t:'n', d:1},
  {k:'outMin', h:'Output min',           t:'n', d:1},
  {k:'eff',    h:'Indv. Eff%',           t:'p', d:2},
  {k:'kpiInd', h:'KPI on Indv',          t:'n', d:1},
  {k:'type',   h:'Type',                 t:'s', a:true},
  {k:'tScore', h:'Type Score',           t:'p', d:2},
  {k:'kpiTyp', h:'KPI on Type',          t:'n', d:1},
  {k:'unav',   h:'Not Considering Indv', t:'y', c:true, w:true},
  {k:'final',  h:'Final KPI Score',      t:'n', d:1}
];

function el(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function openPicker(i){ if(i.showPicker){ try{i.showPicker()}catch(e){} } }

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* House date format, the SAME one every other report uses: "18 Aug, 2026".
   This page rendered "18-Aug-26" instead, so the one date the whole dashboard
   now shares appeared in two different formats depending which report you had
   open. */
function prettyDate(iso){
  if(!iso) return '';
  var p=String(iso).split('-'); if(p.length!==3) return iso;
  return Number(p[2])+' '+MON[Number(p[1])-1]+', '+p[0];
}
function shortDate(iso){
  var p=String(iso).split('-'); if(p.length!==3) return iso;
  return Number(p[2])+' '+MON[Number(p[1])-1];
}
function dowOf(iso){
  var p=String(iso).split('-'); if(p.length!==3) return '';
  return DOW[new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getDay()];
}
function fmt(v,d){
  var n=Number(v); if(isNaN(n)) n=0;
  return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function padId(id){ var s=String(id||''); return s.length&&s.length<11 ? ('00000000000'+s).slice(-11) : s; }
function scClass(v,max){ var p=(Number(v)||0)/max; return p<0.5?'lo':(p<0.75?'mid':(p<0.9?'hi':'top')); }
function effClass(v){ return v<0.65?'lo':(v<=0.90?'mid':'hi'); }
function oeeClass(v){ return v<0.55?'lo':(v<=0.75?'mid':'hi'); }

function cellText(c,r){
  var v=r[c.k];
  if(c.t==='s') return esc(v||'');
  if(c.t==='y') return v?'Yes':'';
  if(c.t==='d') return prettyDate(v);
  if(c.t==='p') return (v===''||v===null||v===undefined)?'':fmt(v*100,c.d)+'%';
  if(v===''||v===null||v===undefined) return '';
  return fmt(v,c.d);
}

/* ---------- boot ---------- */

/* ---------- session cache ----------
   Same pattern as the other reports in this shell. Whatever was fetched last is
   parked in sessionStorage and painted immediately on the next visit, then a
   fresh copy is pulled in the background and swapped in. Switching tabs feels
   instant instead of reloading from zero every time. */
var SNAP_KEY='sosl_pib_snapshot_v1', DATA_PFX='sosl_pib_data_';

function ssGet(k){ try{ var v=sessionStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function ssSet(k,v){ try{ sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function ssClear(){
  try{
    sessionStorage.removeItem(SNAP_KEY);
    for(var i=sessionStorage.length-1;i>=0;i--){
      var k=sessionStorage.key(i);
      if(k && k.indexOf(DATA_PFX)===0) sessionStorage.removeItem(k);
    }
  }catch(e){}
}

window.addEventListener('load', function(){
  /* Build the picker FIRST, before anything is fetched. It used to be built
     inside buildPeriod(), which only runs once the snapshot arrives, so
     opening the picker during that wait showed a calendar with an EMPTY
     preset column. The presets do not need the snapshot to exist. */
  setupPicker();
  buildChips();

  var c=ssGet(SNAP_KEY);
  if(c && c.ok){
    SNAP=c; if(c.roster) ROSTER=c.roster;
    buildPeriod(); buildChips();
    /* Already held in this tab, so show it rather than making them press
       Load for data that costs nothing to display. */
    var ck=currentKey(), cached=ssGet(ck);
    if(cached && cached.ok){
      applyData(cached);
      LOADED=true; DIRTY=false; paintLoadBtn();
    }else{
      showReady(); markDirty();
    }
    getSnapshot(false);            /* quietly check for a newer one */
  }else{
    showReady(); markDirty();
    getSnapshot(true);
  }
});

/* =====================================================================
   ONE LOADING CONTRACT  (see daily.html for the reasoning)
   Every fetch carries a token; a newer request supersedes an older one and
   the stale reply is dropped rather than painted.
   ===================================================================== */
var RUN={seq:0,label:''};
function runBegin(label){
  RUN.seq++; RUN.label=label;
  barBusy(true,label); islandShow(label);
  return RUN.seq;
}
function runCurrent(tok){ return tok===RUN.seq; }
function runEnd(tok){ if(tok!==RUN.seq) return; barBusy(false,RUN.label); }

/* ---------- the Load button ---------- */
var DIRTY=true, LOADED=false;
function markDirty(){ DIRTY=true; paintLoadBtn(); }
function paintLoadBtn(){
  var b=el('loadBtn'); if(!b) return;
  var t=el('loadTxt');
  var needs = DIRTY || !LOADED;
  b.classList.toggle('needs', needs);
  if(t) t.textContent = needs ? 'Load' : 'Reload';
  b.title = needs ? 'Load this period' : 'Read this period again';
}
function showReady(){
  LOADED=false;
  el('tb').innerHTML='<tr><td colspan="15" class="ready">'
    +'<b>Choose a period, then press Load.</b>'
    +'Nothing is read from the sheet until you press it, so this page opens instantly.'
    +'</td></tr>';
}

function getSnapshot(initial){
  track(fetch(PIB_API+'?action=snapshot'), 'Weekly Individual PIB, checking periods').then(function(r){return r.json()}).then(function(s){
    if(!s.ok){ if(initial) fail(s.msg); return; }
    ssSet(SNAP_KEY,s);
    SNAP=s; if(s.roster) ROSTER=s.roster;
    /* Only build the period selector on a cold start. Rebuilding it later would
       reset the week the user had chosen, mid-read. */
    /* buildPeriod fills the picker and the hidden boxes. load() is NOT called:
       the period list arriving is not a request for a report. */
    if(initial){ buildPeriod(); buildChips(); showReady(); markDirty(); }
  }).catch(function(e){ if(initial) fail(e); });
}

/* ---------- Refresh ----------
   The shell asks whichever report is open to refresh itself, because only this
   page knows which PERIOD is selected. Two phases:
     1. foreground: the period on screen is re-pulled, ignoring the cache
     2. background: every other cached period is dropped, so nothing stale can
        be served from it afterwards
   The shell is told when phase 1 is done, so its button stops spinning. */
function tellDone(err){
  if(window.parent===window) return;
  window.parent.postMessage({type:'refresh-done', stamp:(STAMP||''), error:err||''}, '*');
}

function refreshNow(){
  el('tb').innerHTML='<tr><td colspan="15" class="loading">Refreshing&hellip;</td></tr>';

  /* Phase 2 first, so no stale period can be served while phase 1 runs. */
  var keep = currentKey();
  try{
    for(var i=sessionStorage.length-1;i>=0;i--){
      var k=sessionStorage.key(i);
      if(k && k.indexOf(DATA_PFX)===0 && k!==keep) sessionStorage.removeItem(k);
    }
    sessionStorage.removeItem(SNAP_KEY);
  }catch(e){}

  /* Phase 1: re-pull the period on screen, cache bypassed. */
  track(fetch(PIB_API+'?action=snapshot',{cache:'no-store'}), 'Refreshing Weekly Individual PIB')
    .then(function(r){ return r.json() })
    .then(function(sn){ if(sn && sn.ok){ ssSet(SNAP_KEY,sn); SNAP=sn; if(sn.roster) ROSTER=sn.roster; } })
    .catch(function(){})
    .then(function(){
      load(true);                  /* force = ignore the cached copy */
      setTimeout(function(){ tellDone(); }, 60);
    });
}

/* The cache key load() would use for whatever is selected right now. */
function currentKey(){
  var v=el('period').value;
  if(v==='custom'){
    var r=normaliseRange();
    return DATA_PFX+'?action=data&from='+encodeURIComponent(r.from)
         +'&to='+encodeURIComponent(r.to);
  }
  if(v==='all') return DATA_PFX+'?action=data';
  return DATA_PFX+'?action=data&week='+encodeURIComponent(v.slice(1));
}

window.addEventListener('message', function(ev){
  if(!ev.data) return;
  if(ev.data.type==='do-refresh'){ refreshNow(); return; }
  if(ev.data.type==='snapshot-updated'){ ssClear(); getSnapshot(true); }
});

function fail(e){
  el('tb').innerHTML='<tr><td colspan="15" class="err">Could not reach the API. '+esc(e&&e.message?e.message:e)
    +'<br><br>Check: 1) PIB_API is the /exec link, 2) deployment access is "Anyone", '
    +'3) a NEW VERSION was deployed after the last code change.</td></tr>';
}

function buildPeriod(){
  var h='';
  (SNAP.weeks||[]).forEach(function(w,i){
    h+='<option value="w'+w+'"'+(i===0?' selected':'')+'>Week '+w+'</option>';
  });
  h+='<option value="all">All data</option><option value="custom">Custom range&hellip;</option>';
  el('period').innerHTML=h;
  /* Seed the hidden boxes with the range the rest of the dashboard is on, so
     opening this report does not throw away the dates chosen elsewhere.
     Falls back to the full span the sheet holds. */
  el('f1').value = wantedFrom() || SNAP.minDate || '';
  el('f2').value = wantedTo()   || SNAP.maxDate || '';
  setupPicker();
}

/* ---------- the picker ----------
   The weeks are presets now, not a separate dropdown. A preset returns a
   range, it does not load; Apply is the only thing that loads, so browsing
   the list costs nothing.

   Weeks come from the sheet and each carries its own first and last date, so
   a week preset does not have to guess where the week began. */
/* A week's real first and last date. The API sends weekSpans since 20-Aug-2026;
   before that it sent only week NUMBERS, which left every Week preset returning
   an empty range so the picker's Apply button stayed disabled and the buttons
   looked broken. The fallback derives the span from the dates the snapshot
   carries, so an older deployment degrades instead of dying. */
function weekRange(w){
  var wk=(SNAP.weekSpans||{})[w];
  if(wk && wk.from && wk.to) return [wk.from, wk.to];
  /* Fallback: ask the rows already loaded. */
  var got=RAW.filter(function(r){ return String(r.week)===String(w) && r.date })
             .map(function(r){ return r.date }).sort();
  if(got.length) return [got[0], got[got.length-1]];
  return [];
}

function drPresetList(){
  var list=[{group:'Quick ranges'},
    {k:'d7',  label:'Last 7 Days',  get:function(){ return lastNDataDaysR(7);  }},
    {k:'d30', label:'Last 30 Days', get:function(){ return lastNDataDaysR(30); }},
    {group:'Everything'},
    {k:'all', label:'All data',     get:function(){ return [SNAP.minDate||'', SNAP.maxDate||'']; }}];
  var wks=(SNAP.weeks||[]);
  if(wks.length){
    list.push({group:'Weeks'});
    wks.forEach(function(w){
      list.push({k:'w'+w, label:'Week '+w, get:function(){ return weekRange(w); }});
    });
  }
  return list;
}

/* Last N days counts days the sheet ACTUALLY holds, not calendar days.
   Counting back on the calendar lands on Fridays and unpushed days that carry
   nothing, so asking for 7 days and being shown 4 is the result. */
function lastNDataDaysR(n){
  var d=(SNAP.dates&&SNAP.dates.length) ? SNAP.dates.slice() : datesInData();
  if(!d.length) return [SNAP.minDate||'', SNAP.maxDate||''];
  var pick=d.slice(-n);
  return [pick[0], pick[pick.length-1]];
}

function setupPicker(){
  drInit({
    presets: drPresetList(),
    /* days, not bounds. Marked when empty, never blocked. */
    days: (SNAP.dates&&SNAP.dates.length) ? SNAP.dates.slice() : datesInData(),
    apply: function(from,to,preset){
      /* A week preset keeps using the week query, which the API answers
         directly. Everything else becomes a from/to custom range. */
      if(preset && preset.charAt(0)==='w' && weekRange(preset.slice(1)).length===0){
        el('period').value=preset;
      }else{
        el('period').value = (preset==='all') ? 'all' : 'custom';
        el('f1').value=from; el('f2').value=to;
      }
      /* Apply IS the Load for this page: the user has just told us exactly
         what they want, so fetching it is what they asked for. */
      load(true);
    }
  });
  drSet(el('f1').value, el('f2').value, '');
}

function drLabelFor(k){
  var out=k;
  drPresetList().forEach(function(p){ if(p.k===k) out=p.label; });
  return out;
}

function datesInData(){
  var d={}; RAW.forEach(function(r){ if(r.date) d[r.date]=true; });
  return Object.keys(d).sort();
}

function buildChips(){
  var h='';
  if(view==='sum'){
    /* Summary is already broken out floor by floor, so floor chips would be
       redundant there. Date chips are what is missing: pick one day to see only
       that day, All Dates to return to the whole period. */
    h+='<span class="chip'+(dateSel===''?' on':'')+'" onclick="setDate(\'\')">All Dates</span>'
     + '<span class="fsep"></span>';
    datesInData().forEach(function(d){
      h+='<span class="chip'+(dateSel===d?' on':'')+'" onclick="setDate(\''+d+'\')">'
       + shortDate(d)+' <span style="opacity:.55;font-weight:600">'+dowOf(d)+'</span></span>';
    });
  }else{
    h+='<span class="chip'+(scopeSel===''?' on':'')+'" onclick="setScope(\'\')">All</span>'
     + '<span class="chip fact'+(scopeSel==='SOL'?' on':'')+'" onclick="setScope(\'SOL\')">SOL</span>'
     + '<span class="chip fact'+(scopeSel==='SSL'?' on':'')+'" onclick="setScope(\'SSL\')">SSL</span>'
     + '<span class="fsep"></span>';
    (SNAP.floors||[]).forEach(function(f){
      h+='<span class="chip'+(scopeSel===f?' on':'')+'" onclick="setScope(\''+esc(f)+'\')">'+esc(f)+'</span>';
    });
  }
  /* The metric picker decides which score is being matrixed or summarised.
     The Full Table shows every column already, so it is hidden there. */
  if(view==='mat'||view==='sum'){
    h+='<span class="fsep"></span>';
    ['final','indv','floor'].forEach(function(m){
      h+='<span class="mchip'+(metric===m?' on':'')+'" onclick="setMetric(\''+m+'\')">'
       + (m==='final'?'Final KPI':'Only '+METRICS[m].label)+'</span>';
    });
  }
  el('chips').innerHTML=h;
}
function setScope(s){ scopeSel=(scopeSel===s&&s!=='')?'':s; buildChips(); render(); }
function setDate(d){ dateSel=(dateSel===d&&d!=='')?'':d; buildChips(); render(); }
function setMetric(m){ metric=m; buildChips(); render(); }

/* The Cutting Floor wise Team Efficiency% view was removed on 18-Aug-2026.
   It answered a floor level question inside an operator level report, it had
   to ignore every filter on the strip to stay correct, and the same figure is
   already on the Daily report where it belongs. renderTeamEff below is left in
   place, unreferenced, so nothing else that might call it breaks. */
function setView(v){
  if(v==='team') v='mat';
  var changed = (view !== v);
  view=v;
  el('vMat').classList.toggle('on', v==='mat');
  el('vTbl').classList.toggle('on', v==='tbl');
  el('vSum').classList.toggle('on', v==='sum');
  /* The legend describes the score metric, which the full table does not use. */
  el('lgd').classList.toggle('hide', v==='tbl');

  /* The three views are independent reports, so a filter must never follow the
     user from one into another. Summary showed no floor chips at all, so a
     floor picked in Score Matrix kept trimming it with nothing on screen to
     say so, and no way to clear it. Every view now opens on All. */
  if(changed){
    scopeSel=''; dateSel=''; query='';
    var q=el('q'); if(q) q.value='';
  }

  hideTip();
  buildChips();
  render();
}

function periodChanged(){
  rangeCancelPending();
  /* customWrap is gone: the picker holds both ends now. */
  load();
}
function periodLabel(){
  var v=el('period').value;
  if(v==='custom') return prettyDate(el('f1').value)+' to '+prettyDate(el('f2').value);
  if(v==='all')    return 'All data';
  return 'Week '+v.slice(1);
}
function scopeLabel(){ return scopeSel ? (SOL_FLOORS.concat(SSL_FLOORS).indexOf(scopeSel)>=0 ? ('Floor '+scopeSel) : scopeSel) : 'All Floors'; }

function applyData(d){
  RAW=d.rows||[]; EFFG=d.eff||{cols:[],rows:[]}; OEEG=d.oee||{cols:[],rows:[]};
  if(d.roster) ROSTER=d.roster;
  STAMP=d.stamp||''; THROUGH=d.through||'';
  buildChips();          /* the date chips are built from the rows themselves */
  render();
}

/* ---------- ONE date is enough ----------
   A custom range used to need BOTH boxes filled before anything would load, so
   picking a single day meant picking it twice. Fill either box and the other
   follows it, which reads as "just that day" and is what people actually do.
   Filling the second one then widens it. Reversed dates are swapped rather
   than refused, because a range typed backwards is a slip, not a question. */

/* ---------- commit the date range once, not once per box ----------
   Every change restarts a short timer. Pick From and To one after the other
   and only ONE load happens, on the pair. Pick just one and it loads that
   single day when the timer runs out. The chip says which, and offers a Load
   button for anyone who does not want to wait. */
var RPEND_T = null, RPEND_MS = 2200;

function rangeShowPending(msg){
  var c = document.getElementById('rpend');
  if(!c) return;
  document.getElementById('rpendtxt').textContent = msg || '';
  c.className = msg ? 'rpend on' : 'rpend';
}

function rangeCancelPending(){
  if(RPEND_T){ clearTimeout(RPEND_T); RPEND_T = null; }
  rangeShowPending('');
}

/* Called by BOTH date boxes. */
function onRangeEdit(){
  if(RPEND_T) clearTimeout(RPEND_T);
  rangeSyncLabels();

  var a = rangeBoxes().a.value, b = rangeBoxes().b.value;
  rangeShowPending(
    (a && b) ? ('Loading ' + prettyDate(a) + ' to ' + prettyDate(b))
             : ('Pick the other date, or load ' + prettyDate(a || b) + ' on its own')
  );

  RPEND_T = setTimeout(function(){ rangeCommit(); }, RPEND_MS);
}

function rangeCommit(){
  rangeCancelPending();
  rangeLoadNow();
}

function rangeBoxes(){ return { a: el('f1'), b: el('f2') }; }
/* The separate From and To labels are gone; the picker button IS the label.
   Kept as a shim because it is called from several places. */
function rangeSyncLabels(){
  if(typeof drSet==='function') drSet(el('f1').value, el('f2').value, DR.preset||'');
}
function rangeLoadNow(){ load(); }

function normaliseRange(){
  var a=el('f1'), b=el('f2');
  if(a.value && !b.value) b.value=a.value;
  else if(b.value && !a.value) a.value=b.value;
  if(a.value && b.value && a.value>b.value){ var t=a.value; a.value=b.value; b.value=t; }
  /* A custom range picked here is the range every other report opens with. */
  if(a.value && b.value) shareRange(a.value,b.value);
  return { from:a.value, to:b.value };
}

function load(force){
  var v=el('period').value, q;
  if(v==='custom'){
    var r=normaliseRange();
    if(!r.from && !r.to){
      el('tb').innerHTML='<tr><td colspan="15" class="loading">Pick a date to load.</td></tr>';
      return;
    }
    q='?action=data&from='+encodeURIComponent(r.from)+'&to='+encodeURIComponent(r.to);
  }else if(v==='all'){ q='?action=data'; }
  else { q='?action=data&week='+encodeURIComponent(v.slice(1)); }

  var ck=DATA_PFX+q;
  var cached = force ? null : ssGet(ck);
  if(cached && cached.ok){
    applyData(cached);
    LOADED=true; DIRTY=false; paintLoadBtn();
    return;                     /* cached is free and already correct */
  }

  var label='Weekly Individual PIB, '+periodLabel();
  var tok=runBegin(label);
  el('tb').innerHTML='<tr><td colspan="15" class="loading">'+esc(label)+'&hellip;</td></tr>';

  fetch(PIB_API+q,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    if(!runCurrent(tok)) return;      /* superseded by a newer Load */
    runEnd(tok);
    if(!d.ok){ fail(d.msg); return; }
    ssSet(ck,d);
    applyData(d);
    LOADED=true; DIRTY=false; paintLoadBtn();
  }).catch(function(e){
    if(!runCurrent(tok)) return;
    runEnd(tok); fail(e);
  });
}

/* The Load button. Always forces a re-read, because pressing it is a
   deliberate "go and look again". */
function doLoad(){ load(true); }

/* ---------- scope ---------- */

function floorsInScope(){
  if(scopeSel==='SOL') return SOL_FLOORS;
  if(scopeSel==='SSL') return SSL_FLOORS;
  if(scopeSel)         return [scopeSel];
  return null;
}
function inScope(){
  var fl=floorsInScope();
  return RAW.filter(function(r){
    if(fl && fl.indexOf(r.floor)<0) return false;
    if(dateSel && r.date!==dateSel) return false;
    if(!query) return true;
    var hay=(r.floor+' '+r.date+' '+r.opId+' '+r.name+' '+r.desig+' '+r.type).toLowerCase();
    return hay.indexOf(query)>=0;
  });
}

function setSort(k){ if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=1;} render(); }
function setMSort(k){ if(mSortKey===k) mSortDir*=-1; else {mSortKey=k; mSortDir=(['floor','name','opId','desig','type'].indexOf(k)>=0)?1:-1;} render(); }
function renderKeepFocus(){
  query=(el('q').value||'').toLowerCase(); render();
  var q=el('q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length);
}

function render(){
  var list=inScope();
  var M=METRICS[metric];
  var when = dateSel ? prettyDate(dateSel) : periodLabel();
  el('showing').textContent=when+' · '+scopeLabel()+' · '+list.length+' rows';
  /* The shell owns the Last updated display beside its Refresh button. Post the
     sheet's real modified time up to it; without this the shell has nothing to
     show for this tab and the label sits on a dash. */
  try{ parent.postMessage({type:'stamp', value: STAMP || prettyDate(THROUGH)}, '*'); }catch(e){}
  el('ph1').textContent=periodLabel();
  el('ph2').textContent=scopeLabel();
  el('ph4').textContent=STAMP;
  el('ph5').textContent=M.label;
  el('lgdNote').textContent = (view==='sum')
    ? (M.note+'. Band counts are per operator, using each man’s average over the period')
    : M.note;

  if(view==='mat'){
    el('tblTitle').textContent='Score Matrix — '+M.label;
    el('phTitle').textContent='SOSL Cutting Section – PIB Score Matrix ('+M.label+')';
    renderMatrix(list);
  }else if(view==='sum'){
    el('tblTitle').textContent='Summary — '+M.label;
    el('phTitle').textContent='SOSL Cutting Section – PIB Summary ('+M.label+')';
    renderSummary(list);
  }else{
    el('tblTitle').textContent='Database PIB';
    el('phTitle').textContent='SOSL Cutting Section – Individual PIB Report';
    renderTable(list);
  }
}

/* ---------- view: summary ----------
   Floor by floor, then a SOL and an SSL subtotal, then SOSL overall.

   Two different averages appear here on purpose:
     Avg Score  is the mean across operator-days, the true weighted average
     the band counts are per OPERATOR, using each man's own average over the
     period, because payout is decided per man and not per man-day.
   Counting operator-days into bands would let one bad Tuesday drag a man into
   the low band while his week was fine. */

/* Each operator is averaged over the days he actually has a record, never over
   the calendar. Absence neither rewards nor punishes him here, it is already
   handled by loss time. The floor figure is then the mean of those operator
   averages, so every man counts once regardless of how many days he worked. */
/* ---------- people, not floor-people ----------
   Everything used to be keyed floor|opId, so an operator who spent 5 days on
   1A and 1 day on 2B became TWO people: two rows in the matrix, counted twice
   in the operator count, and each fragment got its own weekly average. A one
   day fragment could then win Best Operator or lose Lowest Operator, while the
   report claimed to be weekly.

   Two different things are being measured and they need different keys:
     floor minutes  -> keyed by FLOOR   (the minutes were worked there)
     person scores  -> keyed by OPERATOR (a person is one person)

   This index is built from whatever is currently in scope, so filtering to one
   floor still shows that person's performance on THAT floor only. */
var FLOOR_ALL = SOL_FLOORS.concat(SSL_FLOORS);

/* Which floor an operator BELONGS to, taken from the R_<floor> roster tabs in
   the Loss Time sheet and delivered with the snapshot. This is a fact, unlike
   "the floor he worked most days on", which is only a guess and is decided
   arbitrarily on an even split. Keyed with leading zeros stripped so it lines
   up with the Op IDs in Database_PIB. */
var ROSTER = {};
var HOME_CENTRAL = 'CENTRAL';
/* Priority: the floor STAMPED on the row when it was first seen, then the live
   roster, then nothing. The stamp is what makes an old report reproducible
   after a reorganisation, so it must win. */
function homeFloorOf(opId, stamped){
  if(stamped) return String(stamped).toUpperCase();
  return ROSTER[String(opId).replace(/^0+/,'')] || '';
}

/* Tooltip that explains, in words, why this operator sits on this floor. */
function floorTitle(o){
  var t = o.central
        ? 'Central booster, works across floors. Counted in the Central group, never in a floor headcount'
        : (o.rostered
            ? ('Rostered to '+o.mainFloor)
            : ('No roster line, counted on '+o.mainFloor+', the floor worked most'));
  if(o.moved)    t += '. Worked on '+o.floorList.length+' floors this period';
  if(o.awayOnly) t += '. Did not work on his rostered floor at all';
  return ' title="'+escAttr(t)+'"';
}
function escAttr(x){
  return String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function personIndex(list){
  var mk=METRICS[metric].k, m={};

  list.forEach(function(r){
    var o = m[r.opId] || (m[r.opId] = {
      opId:r.opId, name:r.name, desig:r.desig, type:r.type,
      floors:{}, d:{}, raw:{}, unav:0
    });
    o.floors[r.floor] = (o.floors[r.floor]||0) + 1;
    if(r.home && !o.stampedHome) o.stampedHome = String(r.home).toUpperCase();

    /* One operator on two floors on the SAME day is rare but real. The two
       scores are combined weighted by input minutes, so a twenty minute stint
       cannot count as much as a full shift. */
    var w = Number(r.inMin)||0, v = Number(r[mk])||0;
    var c = o.d[r.date] || (o.d[r.date] = {sum:0, w:0, plain:0, n:0});
    c.sum += v*w; c.w += w; c.plain += v; c.n++;

    (o.raw[r.date] = o.raw[r.date] || []).push(r);
    if(r.unav) o.unav++;
    if(r.name)  o.name  = r.name;
    if(r.desig) o.desig = r.desig;
    if(r.type)  o.type  = r.type;
  });

  Object.keys(m).forEach(function(k){
    var o=m[k], tot=0, nd=0;
    o.s={};
    Object.keys(o.d).forEach(function(dt){
      var c=o.d[dt];
      var v = c.w>0 ? c.sum/c.w : (c.n ? c.plain/c.n : 0);
      o.s[dt]=v; tot+=v; nd++;
    });
    /* days = distinct DATES worked, not rows. Two floors in one day is one day. */
    o.days = nd;
    o.total = tot;
    o.avg = nd ? tot/nd : 0;

    var fl = Object.keys(o.floors).sort(function(a,b){
      var d = o.floors[b]-o.floors[a];          /* most days first */
      return d || (FLOOR_ALL.indexOf(a)-FLOOR_ALL.indexOf(b));
    });

    /* The roster decides where he belongs. Most-days-worked is only the
       fallback for an operator with no roster line, so nobody drops out of
       the report because of a missing entry. */
    var home = homeFloorOf(o.opId, o.stampedHome);
    o.rostered  = !!home;
    o.central   = (home === HOME_CENTRAL);
    o.mainFloor = home || fl[0] || '';

    /* Home floor first in the list, so the column reads "where he belongs,
       then where else he went". */
    if(home && home!==HOME_CENTRAL && fl.indexOf(home) > 0){
      fl = [home].concat(fl.filter(function(x){ return x!==home }));
    }
    o.floorList = fl;
    o.floor     = fl.join(', ');
    o.moved     = fl.length > 1;
    /* Worked entirely away from his rostered floor: worth seeing, and a sign
       the roster may need a line changing. */
    o.awayOnly  = !!home && home!==HOME_CENTRAL && fl.indexOf(home) < 0;
  });

  return m;
}

/* Person level stats come from `people`; minute totals come from `rows`.
   Keeping them separate is what makes floor accounting and headcount both
   correct at the same time. */
function statsOf(rows, people){
  var max=METRICS[metric].max;
  var inM=0, outM=0;
  rows.forEach(function(r){ inM+=r.inMin; outM+=r.outMin; });

  var ppl = people || [];
  var avgs = ppl.map(function(o){ return o.avg; });
  var dayc = ppl.map(function(o){ return o.days; });
  var unav = ppl.reduce(function(a,o){ return a+(o.unav||0) }, 0);

  var b={top:0,hi:0,mid:0,lo:0};
  avgs.forEach(function(v){ b[scClass(v,max)]++; });
  var mean=function(a){ return a.length ? a.reduce(function(x,y){return x+y},0)/a.length : 0; };
  return {
    nOps:ppl.length, avgDays:mean(dayc), inM:inM, outM:outM,
    eff:(inM>0?outM/inM:0), avg:mean(avgs),
    best:(avgs.length?Math.max.apply(null,avgs):0),
    worst:(avgs.length?Math.min.apply(null,avgs):0),
    b:b, unav:unav
  };
}

/* ================= view: Cutting Floor wise Team Efficiency% =================
   The same table the Daily report shows, but for the whole period instead of
   one day, so every date can be read at once.

   The maths is deliberately identical to daily.html:
       Team Eff% = SUM(Output Min) / SUM(Input Min) * 100
   Summing the minutes first, rather than averaging each day's percentage, is
   what makes a long day count more than a short one. Averaging the daily
   percentages would let a two hour Saturday weigh the same as a full Tuesday
   and quietly flatter or punish a floor.

   Man Count is DISTINCT operators seen on that floor in the period, not
   operator-days, so a floor of 30 men reads 30 whether the range is one day or
   one month.

   Eff% < 65 counts an OPERATOR whose own average over the period is below 65,
   not every bad day. One poor Tuesday should not put a man in that column if
   his week was fine. This matches how the Summary view treats its bands.

   No filters by design: this view always covers every floor and every date in
   the loaded period. ============================================================ */
function teamEffAgg(rows){
  var f={}, ppl={};

  function fl(k){
    return f[k] || (f[k] = {floor:k, inMin:0, outMin:0, ids:{}});
  }

  rows.forEach(function(r){
    var floor = r.floor; if(!floor) return;
    var inn = Number(r.inMin)||0, out = Number(r.outMin)||0;

    var b = fl(floor);
    b.inMin += inn; b.outMin += out; b.ids[r.opId] = 1;

    /* Per operator per floor, so a man who moved floors is judged on each. */
    var pk = floor + '|' + r.opId;
    var p = ppl[pk] || (ppl[pk] = {floor:floor, inMin:0, outMin:0});
    p.inMin += inn; p.outMin += out;
  });

  /* Attach the below-65 count once every operator total is complete. */
  Object.keys(ppl).forEach(function(k){
    var p = ppl[k];
    if(p.inMin <= 0) return;                       /* no input, no verdict */
    var e = p.outMin / p.inMin * 100;
    var b = f[p.floor]; if(!b) return;
    b.u65 = b.u65 || 0;
    if(e < 65) b.u65++;
  });

  var order = SOL_FLOORS.concat(SSL_FLOORS);
  var seen  = Object.keys(f);
  var extra = seen.filter(function(k){ return order.indexOf(k) < 0 }).sort();

  return order.concat(extra)
    .filter(function(k){ return f[k] })
    .map(function(k){
      var b = f[k];
      b.man = Object.keys(b.ids).length;
      b.u65 = b.u65 || 0;
      b.eff = b.inMin > 0 ? (b.outMin / b.inMin * 100) : 0;
      return b;
    });
}

function renderTeamEff(rows){
  var list = teamEffAgg(rows || []);

  el('showing').textContent = periodLabel() + ' \u00b7 all floors, all dates \u00b7 '
                            + list.length + ' floor(s)';
  el('ph3').textContent = list.length;

  el('cg').innerHTML =
      '<col style="width:120px"><col style="width:120px">'
    + '<col style="width:150px"><col style="width:140px">'
    + '<col style="width:130px"><col style="width:130px">';
  el('mainTbl').classList.add('fixed');

  function hd(label,unit,cls){
    return '<th class="two '+(cls||'')+'">'+label+'<span class="u">'+unit+'</span></th>';
  }
  el('th').innerHTML = '<tr>'
    + '<th class="two l">Floor</th>'
    + hd('Man Count','operators')
    + hd('Team Avg Eff%','%')
    + hd('Eff% &lt; 65%','operators')
    + hd('Input','minutes')
    + hd('Output','minutes')
    + '</tr>';

  function sum(keys){
    var t = {inMin:0, outMin:0, u65:0, ids:{}};
    list.forEach(function(b){
      if(keys && keys.indexOf(b.floor) < 0) return;
      t.inMin += b.inMin; t.outMin += b.outMin; t.u65 += b.u65;
      Object.keys(b.ids).forEach(function(i){ t.ids[i] = 1 });
    });
    t.man = Object.keys(t.ids).length;
    t.eff = t.inMin > 0 ? (t.outMin / t.inMin * 100) : 0;
    return t;
  }

  function line(label, b, cls){
    return '<tr class="' + (cls||'') + '">'
      + '<td class="l"><b>' + esc(label) + '</b></td>'
      + '<td class="mono">' + b.man + '</td>'
      + '<td class="mono ' + effCls(b.eff) + '">' + fmt(b.eff,1) + '%</td>'
      + '<td class="mono">' + b.u65 + '</td>'
      + '<td class="mono">' + fmt(b.inMin,0) + '</td>'
      + '<td class="mono">' + fmt(b.outMin,0) + '</td>'
      + '</tr>';
  }

  if(!list.length){
    el('tb').innerHTML = '<tr><td class="loading" colspan="6">No data in this period.</td></tr>';
    return;
  }

  var solHas = list.filter(function(b){ return SOL_FLOORS.indexOf(b.floor) >= 0 });
  var sslHas = list.filter(function(b){ return SSL_FLOORS.indexOf(b.floor) >= 0 });
  var other  = list.filter(function(b){
    return SOL_FLOORS.indexOf(b.floor) < 0 && SSL_FLOORS.indexOf(b.floor) < 0;
  });

  var h = '';
  solHas.forEach(function(b){ h += line('Floor ' + b.floor, b); });
  if(solHas.length) h += line('SOL Total', sum(SOL_FLOORS), 'grp');
  sslHas.forEach(function(b){ h += line('Floor ' + b.floor, b); });
  if(sslHas.length) h += line('SSL Total', sum(SSL_FLOORS), 'grp');
  other.forEach(function(b){ h += line('Floor ' + b.floor, b); });
  h += line('SOSL Overall', sum(null), 'totalrow');

  el('tb').innerHTML = h;
}

/* Reuses this page's own band classes rather than inventing new ones, so the
   Team Efficiency view is coloured exactly like every other table here. */
function effCls(v){
  if(v >= 90) return 'sc hi';
  if(v >= 65) return 'sc mid';
  return 'sc lo';
}

function renderSummary(list){
  var MX=METRICS[metric], max=MX.max;

  var present={}; list.forEach(function(r){ present[r.floor]=true; });
  var sol=SOL_FLOORS.filter(function(f){return present[f]});
  var ssl=SSL_FLOORS.filter(function(f){return present[f]});
  var other=Object.keys(present).filter(function(f){
    return SOL_FLOORS.indexOf(f)<0 && SSL_FLOORS.indexOf(f)<0;
  }).sort();

  el('ph3').textContent=sol.length+ssl.length+other.length;

  /* Fixed widths sized to the content. Left to itself the browser gave Input and
     Output half the table and squeezed the four band columns into nothing. */
  el('cg').innerHTML=
      '<col style="width:96px"><col style="width:82px"><col style="width:82px">'
    + '<col style="width:104px"><col style="width:104px"><col style="width:92px">'
    + '<col style="width:96px"><col style="width:84px"><col style="width:84px">'
    + '<col style="width:74px"><col style="width:74px"><col style="width:74px"><col style="width:74px">'
    + '<col style="width:88px">';
  el('mainTbl').classList.add('fixed');

  function hd(label,unit,cls){
    return '<th class="two '+(cls||'')+'">'+label+'<span class="u">'+unit+'</span></th>';
  }
  el('th').innerHTML='<tr>'
    + '<th class="two l">Floor</th>'
    + hd('Operators','count')
    + hd('Avg Days<br>Worked','count')
    + hd('Input','minutes')
    + hd('Output','minutes')
    + hd('Efficiency','%')
    + hd('Avg '+esc(MX.label),'points')
    + hd('Best<br>Operator','points')
    + hd('Lowest<br>Operator','points')
    + hd('&ge;90%','operators','c bs')
    + hd('75&ndash;89%','operators','c')
    + hd('50&ndash;74%','operators','c')
    + hd('&lt;50%','operators','c be')
    + hd('Indv Not<br>Counted','days','c')
    + '</tr>';

  /* Person level stats are attributed to an operator's MAIN floor, the one
     they worked most days on, and counted there ONCE. Minute totals still come
     from every row worked on the floor, including visitors. So floor minutes
     stay honest AND the floor operator counts add up to the real headcount
     instead of exceeding it. */
  var PEOPLE = personIndex(list);
  var PLIST  = Object.keys(PEOPLE).map(function(k){ return PEOPLE[k] });
  function peopleOf(fl){
    if(!fl) return PLIST;                       /* SOSL overall: everyone, once */
    return PLIST.filter(function(o){ return fl.indexOf(o.mainFloor) >= 0 });
  }
  /* Central boosters have no home floor by design. They are counted in their
     own row so no floor's headcount moves week to week, while the minutes they
     worked still credit whichever floor got the benefit. */
  var CENTRAL_PEOPLE = PLIST.filter(function(o){ return o.central });
  function centralRows(){
    var ids={}; CENTRAL_PEOPLE.forEach(function(o){ ids[o.opId]=1 });
    return list.filter(function(r){ return ids[r.opId] });
  }

  function line(label,rows,kind,fl){
    var s=statsOf(rows, peopleOf(fl));
    if(!s.nOps && kind==='floor') return '';
    return '<tr class="'+(kind||'')+'">'
     + '<td class="l"><b>'+esc(label)+'</b></td>'
     + '<td class="mono">'+s.nOps+'</td>'
     + '<td class="mono">'+fmt(s.avgDays,1)+'</td>'
     + '<td class="mono">'+fmt(s.inM,0)+'</td>'
     + '<td class="mono">'+fmt(s.outM,0)+'</td>'
     + '<td class="mono">'+fmt(s.eff*100,1)+'%</td>'
     + '<td class="mono sc '+scClass(s.avg,max)+'">'+fmt(s.avg,1)+'</td>'
     + '<td class="mono">'+fmt(s.best,1)+'</td>'
     + '<td class="mono">'+fmt(s.worst,1)+'</td>'
     + '<td class="c mono bs">'+(s.b.top||'&ndash;')+'</td>'
     + '<td class="c mono">'+(s.b.hi||'&ndash;')+'</td>'
     + '<td class="c mono">'+(s.b.mid||'&ndash;')+'</td>'
     + '<td class="c mono be">'+(s.b.lo||'&ndash;')+'</td>'
     + '<td class="c mono">'+(s.unav||'&ndash;')+'</td></tr>';
  }
  function pick(fl){ return list.filter(function(r){ return fl.indexOf(r.floor)>=0; }); }

  var h='';
  sol.forEach(function(f){ h+=line(f, pick([f]), 'floor', [f]); });
  if(sol.length) h+=line('SOL total', pick(sol), 'grp', sol);
  ssl.forEach(function(f){ h+=line(f, pick([f]), 'floor', [f]); });
  if(ssl.length) h+=line('SSL total', pick(ssl), 'grp', ssl);
  other.forEach(function(f){ h+=line(f, pick([f]), 'floor', [f]); });

  if(CENTRAL_PEOPLE.length){
    h+=line('Central (boosters)', centralRows(), 'grp', [HOME_CENTRAL]);
  }

  if(!h){ el('tb').innerHTML='<tr><td colspan="14" class="loading">No rows for this selection.</td></tr>'; return; }
  h+=line('SOSL overall', list, 'totalrow', null);
  el('tb').innerHTML=h;
}

/* ---------- view: full table ---------- */

function renderTable(list){
  el('ph3').textContent=list.length;
  el('cg').innerHTML=''; el('mainTbl').classList.remove('fixed');
  if(sortKey){
    var d=sortDir;
    list=list.slice().sort(function(a,b){
      var x=a[sortKey], y=b[sortKey];
      if(typeof x==='string'||typeof y==='string'){
        x=String(x||'').toLowerCase(); y=String(y||'').toLowerCase();
        return x<y?-d:(x>y?d:0);
      }
      return ((x?1:0)-(y?1:0)||(x||0)-(y||0))*d;
    });
  }
  el('th').innerHTML='<tr>'+COLS.map(function(c){
    var arr=sortKey===c.k?(sortDir===1?'&#9650;':'&#9660;'):'';
    var cls=((c.a?'l ':'')+(c.c?'c ':'')+(c.w?'wr':'')).trim();
    return '<th class="'+cls+'" onclick="setSort(\''+c.k+'\')">'+esc(c.h)+'<span class="arr">'+arr+'</span></th>';
  }).join('')+'</tr>';

  var h='';
  list.forEach(function(r){
    h+='<tr>'+COLS.map(function(c){
      var v = c.k==='opId' ? esc(padId(r.opId)) : cellText(c,r);
      return '<td class="'+(c.a?'l ':'')+(c.c?'c ':'')+(c.w?'wr ':'')+'mono">'+v+'</td>';
    }).join('')+'</tr>';
  });
  el('tb').innerHTML = h || '<tr><td colspan="15" class="loading">No rows for this selection.</td></tr>';
}

/* ---------- view: score matrix ---------- */

function buildMatrix(list){
  var dates={};
  list.forEach(function(r){ dates[r.date]=true; });
  var m=personIndex(list);
  var rows=Object.keys(m).map(function(k){ return m[k]; });
  return {dates:Object.keys(dates).sort(), rows:rows};
}

function renderMatrix(list){
  var M=buildMatrix(list), MX=METRICS[metric];
  el('ph3').textContent=M.rows.length;
  el('cg').innerHTML=''; el('mainTbl').classList.remove('fixed');
  MROWS={}; M.rows.forEach(function(o){ MROWS[o.opId]=o; });

  var rows=M.rows.slice().sort(function(a,b){
    var d=mSortDir, x=a[mSortKey], y=b[mSortKey];
    if(typeof x==='string'||typeof y==='string'){
      x=String(x||'').toLowerCase(); y=String(y||'').toLowerCase();
      return x<y?-d:(x>y?d:0);
    }
    return ((x||0)-(y||0))*d;
  });

  function mth(k,label,cls){
    var arr=mSortKey===k?(mSortDir===1?'&#9650;':'&#9660;'):'';
    return '<th class="'+(cls||'')+'" onclick="setMSort(\''+k+'\')">'+label+'<span class="arr">'+arr+'</span></th>';
  }

  var h='<tr><th class="l">#</th>'
      + mth('floor','Floor','l') + mth('opId','Op ID','l') + mth('name','Op Name','l')
      + mth('desig','Designation','l') + mth('type','Type','l');
  M.dates.forEach(function(d){
    h+='<th class="c">'+shortDate(d)+'<span class="d2">'+dowOf(d)+'</span></th>';
  });
  h+= mth('days','Days') + mth('total','Total') + mth('avg','Average') + mth('unav','Indv N/C');
  el('th').innerHTML=h+'</tr>';

  var b='', colSum=[], colDay=[], tTot=0, tDays=0, tUn=0;
  rows.forEach(function(o,i){
    tTot+=o.total; tDays+=o.days; tUn+=o.unav;
    b+='<tr><td class="l mono">'+(i+1)+'</td>'
     + '<td class="l"'+floorTitle(o)+'>'
     +   (o.central ? '<span class="ctrl">Central</span> ' : '')
     +   esc(o.floor)
     +   (o.moved?' <span class="movd" title="Worked on more than one floor">&#8644;</span>':'')
     +   (o.awayOnly?' <span class="away" title="Rostered elsewhere, worked only away this period">&#9888;</span>':'')
     +   (!o.rostered?' <span class="noro" title="Not found in any floor roster, counted on the floor he worked most">?</span>':'')
     +   '</td>'
     + '<td class="l mono">'+esc(padId(o.opId))+'</td>'
     + '<td class="l">'+esc(o.name)+'</td>'
     + '<td class="l">'+esc(o.desig)+'</td>'
     + '<td class="l">'+esc(o.type||'')+'</td>';
    var key=o.opId;
    M.dates.forEach(function(d,j){
      var v=o.s[d];
      if(v===undefined||v===null){ b+='<td class="c sc na">&ndash;</td>'; }
      else{
        colSum[j]=(colSum[j]||0)+v; colDay[j]=(colDay[j]||0)+1;
        b+='<td class="c sc '+scClass(v,MX.max)+'" data-op="'+esc(key)+'" data-d="'+d+'">'+fmt(v,1)+'</td>';
      }
    });
    /* No data-op on Days, Total, Average or Indv N/C. They are simple roll-ups
       of the row you can already see, so a hover card would only get in the way. */
    b+='<td class="mono">'+o.days+'</td>'
     + '<td class="mono tot">'+fmt(o.total,1)+'</td>'
     + '<td class="mono tot">'+fmt(o.avg,1)+'</td>'
     + '<td class="mono">'+(o.unav||'')+'</td></tr>';
  });

  if(!rows.length){
    b='<tr><td class="loading" colspan="'+(M.dates.length+10)+'">No rows for this selection.</td></tr>';
  }else{
    b+='<tr class="totalrow"><td class="l" colspan="6">Average &bull; '+rows.length+' operators</td>';
    M.dates.forEach(function(d,j){
      b+= colDay[j] ? '<td class="c">'+fmt(colSum[j]/colDay[j],1)+'</td>' : '<td class="c">&ndash;</td>';
    });
    b+='<td class="mono">'+tDays+'</td><td class="mono">'+fmt(tTot,1)+'</td>'
     + '<td class="mono">'+(tDays?fmt(tTot/tDays,1):'0.0')+'</td>'
     + '<td class="mono">'+(tUn||'')+'</td></tr>';
  }
  el('tb').innerHTML=b;
}

/* ---------- score breakdown on hover ----------
   Every matrix cell carries the operator key and the date, so the card can
   rebuild the arithmetic from the original Database_PIB row rather than from
   the displayed number. If the two ever disagree, the sheet is wrong, not this. */

function tipRow(a,b){ return '<span>'+a+'</span><span>'+b+'</span>'; }

function buildTip(td){
  var o=MROWS[td.getAttribute('data-op')];
  if(!o) return '';
  var d=td.getAttribute('data-d'), MX=METRICS[metric];
  if(!d) return '';

  var head='<h4>'+esc(o.name||o.opId)+'</h4>'
         + '<div class="sub">'+esc(padId(o.opId))+'  &middot;  Floor '+esc(o.floor)
         + '  &middot;  '+prettyDate(d)+'</div>';

  var recs=o.raw[d];
  if(!recs || !recs.length) return head+'<div class="note">No record for this date.</div>';

  /* Two floors on one day is rare but possible, so the card names which floor
     each record belongs to rather than silently showing one of them. */
  var multi = recs.length > 1;
  var r = recs[0];

  var g='<div class="g">'
      + (multi ? tipRow('Floors this day',
            esc(recs.map(function(x){return x.floor}).join(', '))) : '')
      + tipRow('Floor', esc(r.floor))
      + tipRow('Input min',  fmt(r.inMin,1))
      + tipRow('Output min', fmt(r.outMin,1))
      + tipRow('Indv. Eff%', fmt((r.eff||0)*100,2)+'%')
      + tipRow('KPI on Indv &nbsp;<i>/50</i>', fmt(r.kpiInd,1))
      + tipRow('Type', esc(r.type||'&ndash;'))
      + tipRow((r.type==='OEE'?'Floor OEE':'Floor Eff%'), fmt((r.tScore||0)*100,2)+'%')
      + tipRow('KPI on Type &nbsp;<i>/50</i>', fmt(r.kpiTyp,1))
      + '</div>';

  var sum = r.unav
    ? ('Type '+fmt(r.kpiTyp,1)+' &times; 2, individual not counted')
    : (fmt(r.kpiInd,1)+' + '+fmt(r.kpiTyp,1));

  var note = sum;
  if(metric!=='final'){
    note += '<br>Cell shows '+MX.label+': '+fmt(metric==='indv'?r.kpiInd:r.kpiTyp,1)+' / '+MX.max;
  }

  return head + g
    + '<div class="r"><span>Final KPI</span><span>'+fmt(r.final,1)+' / 100</span></div>'
    + '<div class="note">'+note+'</div>';
}

function showTip(td,e){
  var html=buildTip(td);
  if(!html){ hideTip(); return; }
  var t=el('tip');
  t.innerHTML=html;
  t.classList.add('on');
  moveTip(e);
}
function moveTip(e){
  var t=el('tip');
  if(!t.classList.contains('on')) return;
  var w=t.offsetWidth||290, h=t.offsetHeight||160;
  var x=e.clientX+16, y=e.clientY+16;
  if(x+w>window.innerWidth-10)  x=e.clientX-w-16;
  if(y+h>window.innerHeight-10) y=e.clientY-h-16;
  t.style.left=Math.max(8,x)+'px';
  t.style.top =Math.max(8,y)+'px';
}
function hideTip(){ el('tip').classList.remove('on'); }

(function(){
  var tb=el('tb');
  tb.addEventListener('mouseover',function(e){
    if(view!=='mat'){ hideTip(); return; }
    var td=e.target.closest ? e.target.closest('td[data-op]') : null;
    if(td) showTip(td,e); else hideTip();
  });
  tb.addEventListener('mousemove',function(e){
    var td=e.target.closest ? e.target.closest('td[data-op]') : null;
    if(td) moveTip(e); else hideTip();
  });
  tb.addEventListener('mouseleave',hideTip);
  window.addEventListener('scroll',hideTip,true);
})();

/* ---------- floor grid modal ---------- */

function curGrid(){ return gridKind==='oee'?OEEG:EFFG; }

function openGrid(kind){
  gridKind=kind;
  var g=curGrid(), isOee=(kind==='oee'), fl=floorsInScope();
  el('mTitle').textContent = isOee?'Floor OEE — day by day':'Floor Efficiency — day by day';
  el('mSub').textContent   = periodLabel()+'  ·  '+(g.rows||[]).length+' days';

  /* Honour the floor or factory chip, but always keep the SOL, SSL and SOSL
     roll-up columns visible, since those are the comparison you actually want. */
  var keep=[];
  (g.cols||[]).forEach(function(c,i){
    if(!fl || fl.indexOf(c)>=0 || ['SOL','SSL','SOSL'].indexOf(c)>=0) keep.push(i);
  });

  var h='<tr><th class="l">Date</th>';
  keep.forEach(function(i){ h+='<th class="c">'+esc(g.cols[i])+'</th>'; });
  el('mth').innerHTML=h+'</tr>';

  var b='', sums={}, cnts={};
  (g.rows||[]).forEach(function(r){
    b+='<tr><td class="l"><b>'+shortDate(r[0])+'</b></td>';
    keep.forEach(function(i){
      var v=r[i+1];
      if(v===null||v===undefined||v===0){ b+='<td class="c sc na">&ndash;</td>'; }
      else{
        sums[i]=(sums[i]||0)+v; cnts[i]=(cnts[i]||0)+1;
        b+='<td class="c sc '+(isOee?oeeClass(v):effClass(v))+'">'+fmt(v*100,2)+'%</td>';
      }
    });
    b+='</tr>';
  });

  if(!(g.rows||[]).length){
    b='<tr><td class="loading" colspan="'+(keep.length+1)+'">No floor data for this period. '
     + 'If this stays empty, the Apps Script needs a new version deployed.</td></tr>';
  }else{
    b+='<tr class="totalrow"><td class="l">Average</td>';
    keep.forEach(function(i){
      b+= cnts[i] ? '<td class="c">'+fmt(sums[i]/cnts[i]*100,2)+'%</td>' : '<td class="c">&ndash;</td>';
    });
    b+='</tr>';
  }
  el('mtb').innerHTML=b;

  el('mlgd').innerHTML = isOee
    ? '<span><i style="background:#FBE9EB"></i>Below 55%</span><span><i style="background:#E7F4EC"></i>55 to 75%</span><span><i style="background:#E8F0FC"></i>Above 75%</span><span style="margin-left:auto">Source: OEE tab</span>'
    : '<span><i style="background:#FBE9EB"></i>Below 65%</span><span><i style="background:#E7F4EC"></i>65 to 90%</span><span><i style="background:#E8F0FC"></i>Above 90%</span><span style="margin-left:auto">Source: Efficiency tab</span>';

  el('ovl').classList.add('on');
}
function closeGrid(){ el('ovl').classList.remove('on'); }
/* Escape closes it too. */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && el('ovl') && el('ovl').classList.contains('on')) closeGrid();
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeGrid(); });

/* ---------- Excel ---------- */
function th2(s){return '<th style="background:#333D6D;color:#fff;font-weight:bold">'+esc(s)+'</th>'}
function xlsWrap(t,sheetName,fileName){
  var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">'
    +'<head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
    +'<x:Name>'+sheetName+'</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'
    +'</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
    +'<style>td,th{font-family:Calibri,sans-serif;font-size:11pt;vertical-align:middle}</style></head><body>'+t+'</body></html>';
  var blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fileName;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a)},1200);
}
function safeName(s){ return String(s).replace(/[^A-Za-z0-9]+/g,'_'); }

function exportGrid(){
  var g=curGrid(), isOee=(gridKind==='oee');
  var t='<table><tr><td colspan="'+((g.cols||[]).length+1)+'" style="font-size:15pt;font-weight:bold;color:#333D6D">'
      + 'SOSL Cutting Section &ndash; '+(isOee?'Floor OEE':'Floor Efficiency')+', day by day</td></tr>'
      + '<tr><td colspan="'+((g.cols||[]).length+1)+'">Period: '+esc(periodLabel())
      + '&nbsp;&nbsp;|&nbsp;&nbsp;Data through: '+esc(prettyDate(THROUGH))
      + '&nbsp;&nbsp;|&nbsp;&nbsp;Sheet updated: '+esc(STAMP)+'</td></tr><tr><td></td></tr></table>';
  t+='<table border="1"><tr>'+th2('Date');
  (g.cols||[]).forEach(function(c){ t+=th2(c); });
  t+='</tr>';
  (g.rows||[]).forEach(function(r){
    t+='<tr><td>'+esc(prettyDate(r[0]))+'</td>';
    for(var i=1;i<r.length;i++){
      t+= (r[i]===null||r[i]===undefined) ? '<td></td>'
        : '<td style="mso-number-format:\'0.00%\'">'+r[i]+'</td>';
    }
    t+='</tr>';
  });
  t+='</table><table><tr><td></td></tr><tr><td>&copy; 2026 SNOWTEX CI Team | Help 2803</td></tr></table>';
  xlsWrap(t,(isOee?'Floor OEE':'Floor Eff'),'SOSL_'+(isOee?'Floor_OEE':'Floor_Eff')+'_'+safeName(periodLabel())+'.xls');
}

function exportExcel(){
  var list=inScope(), MX=METRICS[metric];
  var viewTxt = view==='mat' ? ('Score Matrix - '+MX.label)
              : view==='sum' ? ('Summary - '+MX.label) : 'Full Table';

  var t='<table><tr><td colspan="20" style="font-size:15pt;font-weight:bold;color:#333D6D">'
      + 'SOSL Cutting Section &ndash; Individual PIB '+(view==='mat'?'Score Matrix':'Report')+'</td></tr>'
      + '<tr><td colspan="20">Period: '+esc(periodLabel())
      + '&nbsp;&nbsp;|&nbsp;&nbsp;Scope: '+esc(scopeLabel())
      + '&nbsp;&nbsp;|&nbsp;&nbsp;Metric: '+esc(MX.label)+' ('+esc(MX.note)+')'
      + '&nbsp;&nbsp;|&nbsp;&nbsp;Data through: '+esc(prettyDate(THROUGH))
      + '&nbsp;&nbsp;|&nbsp;&nbsp;Sheet updated: '+esc(STAMP)+'</td></tr><tr><td></td></tr></table>';

  if(view==='mat'){
    var M=buildMatrix(list);
    t+='<table border="1"><tr>'+th2('Floor')+th2('Op. ID')+th2('Op. Name')+th2('Designation')+th2('Type');
    M.dates.forEach(function(d){ t+=th2(prettyDate(d)); });
    t+=th2('Days')+th2('Total')+th2('Average')+th2('Indv Not Counted')+'</tr>';
    M.rows.forEach(function(o){
      t+='<tr><td>'+esc(o.floor)+'</td>'
       + '<td style="mso-number-format:\'\\@\'">'+esc(padId(o.opId))+'</td>'
       + '<td>'+esc(o.name)+'</td><td>'+esc(o.desig)+'</td><td>'+esc(o.type||'')+'</td>';
      M.dates.forEach(function(d){
        var v=o.s[d];
        t+= (v===undefined||v===null) ? '<td></td>' : '<td>'+v+'</td>';
      });
      t+='<td>'+o.days+'</td><td>'+(Math.round(o.total*10)/10)+'</td>'
       + '<td>'+(Math.round(o.avg*10)/10)+'</td><td>'+(o.unav||0)+'</td></tr>';
    });
    t+='</table>';
  }else if(view==='sum'){
    var present={}; list.forEach(function(r){ present[r.floor]=true; });
    var sol=SOL_FLOORS.filter(function(f){return present[f]});
    var ssl=SSL_FLOORS.filter(function(f){return present[f]});
    var oth=Object.keys(present).filter(function(f){
      return SOL_FLOORS.indexOf(f)<0 && SSL_FLOORS.indexOf(f)<0; }).sort();

    t+='<table border="1"><tr>'+th2('Floor')+th2('Operators (count)')+th2('Avg Days Worked (count)')
     + th2('Input (min)')+th2('Output (min)')+th2('Efficiency (%)')
     + th2('Avg '+MX.label+' (points)')+th2('Best Operator (points)')+th2('Lowest Operator (points)')
     + th2('>=90% (operators)')+th2('75-89% (operators)')+th2('50-74% (operators)')+th2('<50% (operators)')
     + th2('Indv Not Counted (days)')+'</tr>';

    var pick=function(fl){ return list.filter(function(r){return fl.indexOf(r.floor)>=0}); };
    /* Same rule as the screen: a person is counted once, at their main floor. */
    var XP = personIndex(list);
    var XL = Object.keys(XP).map(function(k){ return XP[k] });
    var peopleOf=function(fl){
      if(!fl) return XL;
      return XL.filter(function(o){ return fl.indexOf(o.mainFloor)>=0 });
    };
    var row=function(label,rows,bold,fl){
      var s=statsOf(rows, peopleOf(fl)), st=bold?' style="font-weight:bold"':'';
      return '<tr'+st+'><td>'+esc(label)+'</td><td>'+s.nOps+'</td>'
       + '<td>'+(Math.round(s.avgDays*10)/10)+'</td>'
       + '<td>'+fmt(s.inM,0)+'</td><td>'+fmt(s.outM,0)+'</td>'
       + '<td style="mso-number-format:\'0.0%\'">'+s.eff+'</td>'
       + '<td>'+(Math.round(s.avg*10)/10)+'</td><td>'+(Math.round(s.best*10)/10)+'</td>'
       + '<td>'+(Math.round(s.worst*10)/10)+'</td>'
       + '<td>'+s.b.top+'</td><td>'+s.b.hi+'</td><td>'+s.b.mid+'</td><td>'+s.b.lo+'</td>'
       + '<td>'+s.unav+'</td></tr>';
    };
    sol.forEach(function(f){ t+=row(f,pick([f]),false,[f]); });
    if(sol.length) t+=row('SOL total',pick(sol),true,sol);
    ssl.forEach(function(f){ t+=row(f,pick([f]),false,[f]); });
    if(ssl.length) t+=row('SSL total',pick(ssl),true,ssl);
    oth.forEach(function(f){ t+=row(f,pick([f]),false,[f]); });
    var XC = XL.filter(function(o){ return o.central });
    if(XC.length){
      var cid={}; XC.forEach(function(o){ cid[o.opId]=1 });
      t+=row('Central (boosters)', list.filter(function(r){ return cid[r.opId] }), true, ['CENTRAL']);
    }
    t+=row('SOSL overall',list,true,null);
    t+='</table>';
  }else{
    t+='<table border="1"><tr>'+COLS.map(function(c){return th2(c.h)}).join('')+'</tr>';
    list.forEach(function(r){
      t+='<tr>'+COLS.map(function(c){
        var v=r[c.k];
        if(c.k==='opId') return '<td style="mso-number-format:\'\\@\'">'+esc(padId(v))+'</td>';
        if(c.t==='s')    return '<td>'+esc(v||'')+'</td>';
        if(c.t==='y')    return '<td>'+(v?'Yes':'')+'</td>';
        if(c.t==='d')    return '<td>'+esc(prettyDate(v))+'</td>';
        if(c.t==='p')    return '<td style="mso-number-format:\'0.00%\'">'+(Number(v)||0)+'</td>';
        return '<td>'+(Number(v)||0)+'</td>';
      }).join('')+'</tr>';
    });
    t+='</table>';
  }
  t+='<table><tr><td></td></tr><tr><td colspan="20">&copy; 2026 SNOWTEX CI Team | Help 2803</td></tr></table>';

  xlsWrap(t,'PIB','SOSL_PIB_'+safeName(viewTxt)+'_'+safeName(periodLabel())+'_'+(scopeSel||'All')+'.xls');
}

/* ---------- which copy am I looking at? ----------
   Published files get cached by the browser and by Cloudflare, so "I uploaded
   it" and "the site is running it" are two different statements. This prints
   the build stamp into the footer and the console, which settles the question
   in two seconds instead of a round of guessing. */
(function(){
  var B='23 Aug 2026 17:58';
  try{ console.log('%c SNOWTEX build '+B+' | Weekly Individual PIB ','background:#333D6D;color:#fff;padding:2px 6px;border-radius:3px'); }catch(e){}
  function stamp(){
    var f=document.querySelector('.ftr, .printfoot, footer');
    if(f && f.textContent.indexOf('build')<0){
      var s=document.createElement('span');
      s.style.cssText='opacity:.55;font-size:9.5px;margin-left:10px';
      s.textContent='build '+B;
      f.appendChild(s);
    }
  }
  if(document.readyState!=='loading') stamp();
  else document.addEventListener('DOMContentLoaded', stamp);
})();
</script>
