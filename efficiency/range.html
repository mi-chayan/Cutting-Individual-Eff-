<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Individual PIB Report</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --card:#fff; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
    --red:#D64550; --green:#1E8E4E; --blue:#1D6FD0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;-webkit-text-size-adjust:100%}

  .strip{background:#fff;border-bottom:1px solid var(--line);padding:7px 16px;
         display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .strip h2{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap}
  .sep{width:1px;height:22px;background:var(--line)}
  .strip label{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .showing{font-size:11px;color:var(--mut);white-space:nowrap}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
  .mini{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:7px;
        padding:5px 11px;font-family:inherit;font-weight:700;font-size:11.5px;cursor:pointer;
        display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .mini:hover{background:var(--cream);border-color:var(--peach)}
  .mini svg{width:12px;height:12px;fill:var(--violet)}
  .mini.xls{background:#E8F5EE;color:#14663A;border-color:#9FD5B8;font-weight:800}
  .mini.xls svg{fill:#1E8E4E}
  .mini.xls:hover{background:#1E8E4E;color:#fff;border-color:#1E8E4E}
  .mini.xls:hover svg{fill:#fff}
  .mini.prn{background:#EEF1FA;color:#2B3566;border-color:#B9C2E4;font-weight:800}
  .mini.prn svg{fill:#333D6D}
  .mini.prn:hover{background:#333D6D;color:#fff;border-color:#333D6D}
  .mini.prn:hover svg{fill:#fff}
  select,input[type=text]{font-family:inherit;font-size:12px;font-weight:700;color:var(--txt);
        padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
  select:focus,input:focus{outline:none;border-color:var(--violet)}
  .dpick{position:relative;display:inline-flex;align-items:center;gap:6px;
         border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;
         font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
  .dpick:hover{border-color:var(--violet)}
  .dpick svg{width:13px;height:13px;fill:var(--violet);flex:0 0 auto}
  .dpick input[type=date]{position:absolute;inset:0;width:100%;height:100%;
         opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-family:inherit}
  .hide{display:none !important}

  .wrap{padding:13px 16px 24px;max-width:1560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        box-shadow:0 1px 2px rgba(37,42,69,.05);overflow:hidden}
  .card .hd{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
            font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}
  .scroll{max-height:calc(100vh - 190px);min-height:260px;overflow:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
  thead th{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;
           padding:8px;text-align:right;font-weight:700;font-size:10.5px;
           text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;cursor:pointer;user-select:none}
  thead th.l{text-align:left}
  thead th:hover{background:#2B3566}
  thead th .arr{font-size:8px;margin-left:3px}
  tbody td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  tbody td.l{text-align:left}
  tbody tr:nth-child(even) td{background:#F6F7FB}
  tbody tr:hover td{background:var(--cream)}
  .mono{font-variant-numeric:tabular-nums}
  .loading{text-align:center;padding:56px;color:var(--mut);font-size:12px}
  .err{padding:22px;color:var(--red);font-size:12.5px;line-height:1.8;font-weight:600}

  .printhead{display:none}
  .printfoot{display:none}
  @media print{
    @page{size:A4 landscape;margin:9mm 8mm}
    body{background:#fff;font-size:8pt}
    .strip{display:none !important}
    .wrap{padding:0;max-width:none}
    .card{border:0;box-shadow:none;border-radius:0}
    .card .hd{display:none}
    .scroll{max-height:none;min-height:0;overflow:visible}
    .printhead{display:flex;align-items:center;gap:5mm;margin-bottom:4mm;
               border-bottom:.6mm solid #333D6D;padding-bottom:2.5mm}
    .printhead img{height:9mm;width:auto;flex:0 0 auto;display:block}
    .printhead h1{font-size:11pt;font-weight:800;color:#333D6D;margin:0 0 1.5mm 0}
    .printhead .meta{display:flex;gap:6mm;font-size:7pt;color:#555;flex-wrap:wrap}
    .printhead .meta b{color:#111}
    thead th{background:#333D6D !important;color:#fff !important;font-size:6.4pt;padding:1.5mm 1mm;
             -webkit-print-color-adjust:exact;print-color-adjust:exact}
    tbody td{font-size:6.8pt;padding:1.1mm}
    tbody tr:nth-child(even) td{background:#F6F7FB !important;
             -webkit-print-color-adjust:exact;print-color-adjust:exact}
    tbody tr{page-break-inside:avoid}
    thead{display:table-header-group}
    .printfoot{display:block !important;margin-top:4mm;font-size:6.5pt;color:#666;text-align:center;
               border-top:.3mm solid #ccc;padding-top:2mm}
  }
  @media(max-width:700px){ .strip{padding:6px 9px;gap:7px} .wrap{padding:10px 9px 20px} }
</style>
</head>
<body>

<div class="strip">
  <h2>Weekly Individual PIB Report</h2>
  <div class="sep"></div>

  <label>Period</label>
  <select id="period" onchange="periodChanged()"></select>

  <span id="customWrap" class="hide">
    <span class="dpick">
      <span id="f1label">&ndash;</span>
      <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 00-2 2v13a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 7v10H5V9h14z"/></svg>
      <input type="date" id="f1" onchange="load()" onclick="openPicker(this)" aria-label="From date">
    </span>
    <span style="font-size:11px;color:var(--mut);font-weight:800">to</span>
    <span class="dpick">
      <span id="f2label">&ndash;</span>
      <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 00-2 2v13a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 7v10H5V9h14z"/></svg>
      <input type="date" id="f2" onchange="load()" onclick="openPicker(this)" aria-label="To date">
    </span>
  </span>

  <input type="text" id="q" placeholder="Search" oninput="renderKeepFocus()" style="width:170px">
  <span class="showing" id="showing"></span>

  <div class="acts">
    <button class="mini xls" onclick="exportExcel()" title="Export current view to Excel">
      <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg> Excel
    </button>
    <button class="mini prn" onclick="doPrint()" title="Print current view, A4 landscape">
      <svg viewBox="0 0 24 24"><path d="M7 3h10v4H7V3zm12 6H5a2 2 0 00-2 2v6h4v4h10v-4h4v-6a2 2 0 00-2-2zm-4 10H9v-4h6v4z"/></svg> Print
    </button>
  </div>
</div>

<div class="wrap">
  <div class="printhead">
    <img src="../logo.jpg" alt="">
    <div>
      <h1>SOSL Cutting Section &ndash; Individual PIB Report</h1>
      <div class="meta">
        <span>Period: <b id="ph1">&ndash;</b></span>
        <span>Rows: <b id="ph2">&ndash;</b></span>
        <span>Generated: <b id="ph3">&ndash;</b></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="hd"><span>Database PIB</span><span class="showing" id="stamp"></span></div>
    <div class="scroll"><table>
      <thead id="th"></thead>
      <tbody id="tb"><tr><td class="loading" colspan="15">Loading&hellip;</td></tr></tbody>
    </table></div>
  </div>

  <div class="printfoot">&copy; 2026 SNOWTEX CI Team &bull; Help 2803</div>
</div>

<script>
/* ------------------------------------------------------------------
   A plain mirror of Database_PIB in the Cutting Individual PIB sheet.
   Same 15 columns, same order, same values. Period selector, search,
   column sorting, Excel and Print. Nothing else on purpose.
   ------------------------------------------------------------------ */

var PIB_API = "https://script.google.com/macros/s/AKfycbyx4_1Oe3q03fWNEwIWWeicfSssI-g7TF1_sZrUFakWRsmSf8rGJXj1bHOJ6tS7w9_tDA/exec";

var RAW=[], SNAP=null, STAMP='', query='';
var sortKey='', sortDir=1;

/* Column map: sheet order, exactly as Database_PIB holds it.
   k  = key in the API row object
   t  = n number, p percent, d date, s text
   a  = left aligned when true */
var COLS=[
  {k:'week',   h:'Week',                 t:'n', d:0, a:false},
  {k:'floor',  h:'Floor',                t:'s', a:true},
  {k:'date',   h:'Date',                 t:'d', a:true},
  {k:'opId',   h:'Op ID',                t:'s', a:true},
  {k:'name',   h:'Op Name',              t:'s', a:true},
  {k:'desig',  h:'Designation',          t:'s', a:true},
  {k:'inMin',  h:'Input min',            t:'n', d:1},
  {k:'outMin', h:'Output min',           t:'n', d:1},
  {k:'eff',    h:'Indv. Eff%',           t:'p', d:2},
  {k:'kpiInd', h:'KPI on Indv',          t:'n', d:1},
  {k:'type',   h:'Type',                 t:'s', a:true},
  {k:'tScore', h:'Type Score',           t:'p', d:2},
  {k:'kpiTyp', h:'KPI on Type',          t:'n', d:1},
  {k:'unav',   h:'Not Considering Indv', t:'y', a:true},
  {k:'final',  h:'Final KPI Score',      t:'n', d:1}
];

function el(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function openPicker(i){ if(i.showPicker){ try{i.showPicker()}catch(e){} } }

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function prettyDate(iso){
  if(!iso) return '';
  var p=String(iso).split('-'); if(p.length!==3) return iso;
  return Number(p[2])+'-'+MON[Number(p[1])-1]+'-'+p[0].slice(2);
}
function fmt(v,d){
  var n=Number(v); if(isNaN(n)) n=0;
  return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
/* Op IDs are 11 characters in the source. Numeric ones arrive stripped of the
   leading zero, so pad them back rather than showing a 10 digit ID. */
function padId(id){ var s=String(id||''); return s.length&&s.length<11 ? ('00000000000'+s).slice(-11) : s; }

function cellText(c,r){
  var v=r[c.k];
  if(c.t==='s') return esc(v||'');
  if(c.t==='y') return v?'Yes':'';
  if(c.t==='d') return prettyDate(v);
  if(c.t==='p') return (v===''||v===null||v===undefined)?'':fmt(v*100,c.d)+'%';
  if(v===''||v===null||v===undefined) return '';
  return fmt(v,c.d);
}

/* ---------- boot ---------- */

window.addEventListener('load', function(){
  fetch(PIB_API+'?action=snapshot').then(function(r){return r.json()}).then(function(s){
    if(!s.ok){ fail(s.msg); return; }
    SNAP=s; buildPeriod(); load();
  }).catch(fail);
});

function fail(e){
  el('tb').innerHTML='<tr><td colspan="15" class="err">Could not reach the API. '+esc(e&&e.message?e.message:e)
    +'<br><br>Check: 1) PIB_API is the /exec link, 2) deployment access is "Anyone", '
    +'3) a NEW VERSION was deployed after the last code change.</td></tr>';
}

function buildPeriod(){
  var h='';
  (SNAP.weeks||[]).forEach(function(w,i){
    h+='<option value="w'+w+'"'+(i===0?' selected':'')+'>Week '+w+'</option>';
  });
  h+='<option value="all">All data</option><option value="custom">Custom range&hellip;</option>';
  el('period').innerHTML=h;
  el('f1').value=SNAP.minDate||''; el('f2').value=SNAP.maxDate||'';
  el('f1label').textContent=prettyDate(SNAP.minDate);
  el('f2label').textContent=prettyDate(SNAP.maxDate);
}

function periodChanged(){
  el('customWrap').classList.toggle('hide', el('period').value!=='custom');
  load();
}

function periodLabel(){
  var v=el('period').value;
  if(v==='custom') return prettyDate(el('f1').value)+' to '+prettyDate(el('f2').value);
  if(v==='all')    return 'All data';
  return 'Week '+v.slice(1);
}

function load(){
  var v=el('period').value, q;
  if(v==='custom'){
    el('f1label').textContent=prettyDate(el('f1').value);
    el('f2label').textContent=prettyDate(el('f2').value);
    q='?action=data&from='+encodeURIComponent(el('f1').value)+'&to='+encodeURIComponent(el('f2').value);
  }else if(v==='all'){ q='?action=data'; }
  else { q='?action=data&week='+encodeURIComponent(v.slice(1)); }

  el('tb').innerHTML='<tr><td colspan="15" class="loading">Loading&hellip;</td></tr>';
  fetch(PIB_API+q).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){ fail(d.msg); return; }
    RAW=d.rows||[]; STAMP=d.stamp||''; render();
  }).catch(fail);
}

/* ---------- render ---------- */

function setSort(k){
  if(sortKey===k) sortDir*=-1;
  else { sortKey=k; sortDir=1; }
  render();
}
function renderKeepFocus(){
  query=(el('q').value||'').toLowerCase(); render();
  var q=el('q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length);
}

function render(){
  var list=RAW.filter(function(r){
    if(!query) return true;
    var hay=(r.floor+' '+r.date+' '+r.opId+' '+r.name+' '+r.desig+' '+r.type).toLowerCase();
    return hay.indexOf(query)>=0;
  });

  if(sortKey){
    var d=sortDir;
    list=list.slice().sort(function(a,b){
      var x=a[sortKey], y=b[sortKey];
      if(typeof x==='string'||typeof y==='string'){
        x=String(x||'').toLowerCase(); y=String(y||'').toLowerCase();
        return x<y?-d:(x>y?d:0);
      }
      return ((x?1:0)-(y?1:0)||(x||0)-(y||0))*d;
    });
  }

  el('th').innerHTML='<tr>'+COLS.map(function(c){
    var arr=sortKey===c.k?(sortDir===1?'&#9650;':'&#9660;'):'';
    return '<th class="'+(c.a?'l':'')+'" onclick="setSort(\''+c.k+'\')">'+esc(c.h)+'<span class="arr">'+arr+'</span></th>';
  }).join('')+'</tr>';

  var h='';
  list.forEach(function(r){
    h+='<tr>'+COLS.map(function(c){
      var v = c.k==='opId' ? esc(padId(r.opId)) : cellText(c,r);
      return '<td class="'+(c.a?'l ':'')+'mono">'+v+'</td>';
    }).join('')+'</tr>';
  });
  el('tb').innerHTML = h || '<tr><td colspan="15" class="loading">No rows for this selection.</td></tr>';

  el('showing').textContent=periodLabel()+' · '+list.length+' rows';
  el('stamp').textContent=STAMP?('Last updated '+STAMP):'';
  el('ph1').textContent=periodLabel();
  el('ph2').textContent=list.length;
  el('ph3').textContent=STAMP;
}

/* ---------- print ---------- */
function doPrint(){ window.focus(); window.print(); }

/* ---------- Excel ---------- */
function exportExcel(){
  var list=RAW.filter(function(r){
    if(!query) return true;
    var hay=(r.floor+' '+r.date+' '+r.opId+' '+r.name+' '+r.desig+' '+r.type).toLowerCase();
    return hay.indexOf(query)>=0;
  });

  var t='<table><tr><td colspan="15" style="font-size:15pt;font-weight:bold;color:#333D6D">'
      + 'SOSL Cutting Section &ndash; Individual PIB Report</td></tr>'
      + '<tr><td colspan="15">Period: '+esc(periodLabel())
      + '&nbsp;&nbsp;|&nbsp;&nbsp;Rows: '+list.length
      + '&nbsp;&nbsp;|&nbsp;&nbsp;Last updated: '+esc(STAMP)+'</td></tr><tr><td></td></tr></table>';

  t+='<table border="1"><tr>'+COLS.map(function(c){
    return '<th style="background:#333D6D;color:#fff;font-weight:bold">'+esc(c.h)+'</th>';
  }).join('')+'</tr>';

  list.forEach(function(r){
    t+='<tr>'+COLS.map(function(c){
      var v=r[c.k];
      if(c.k==='opId') return '<td style="mso-number-format:\'\\@\'">'+esc(padId(v))+'</td>';
      if(c.t==='s')    return '<td>'+esc(v||'')+'</td>';
      if(c.t==='y')    return '<td>'+(v?'Yes':'')+'</td>';
      if(c.t==='d')    return '<td>'+esc(prettyDate(v))+'</td>';
      if(c.t==='p')    return '<td style="mso-number-format:\'0.00%\'">'+(Number(v)||0)+'</td>';
      return '<td>'+(Number(v)||0)+'</td>';
    }).join('')+'</tr>';
  });
  t+='</table><table><tr><td></td></tr><tr><td colspan="15">&copy; 2026 SNOWTEX CI Team | Help 2803</td></tr></table>';

  var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">'
    +'<head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
    +'<x:Name>PIB</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'
    +'</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
    +'<style>td,th{font-family:Calibri,sans-serif;font-size:11pt;vertical-align:middle}</style></head><body>'+t+'</body></html>';

  var name='SOSL_PIB_'+String(periodLabel()).replace(/[^A-Za-z0-9]+/g,'_')+'.xls';
  var blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a)},1200);
}
</script>
</body>
</html>
