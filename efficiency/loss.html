<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loss Time Entry</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --card:#fff; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
    --red:#D64550; --green:#1E8E4E; --blue:#1D6FD0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}

  /* ---- control strip ---- */
  .strip{background:#fff;border-bottom:1px solid var(--line);padding:9px 18px;
         display:flex;align-items:center;gap:11px;flex-wrap:wrap;position:sticky;top:0;z-index:20;flex:0 0 auto}
  .strip h2{font-size:14px;font-weight:800;color:var(--navy);white-space:nowrap}
  .sep{width:1px;height:24px;background:var(--line)}
  .strip label{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .dpick{position:relative;display:inline-flex;align-items:center;gap:7px;
         border:1px solid var(--line);border-radius:7px;padding:7px 11px;background:#fff;
         font-size:12.5px;font-weight:700;color:var(--txt);white-space:nowrap;cursor:pointer}
  .dpick:hover{border-color:var(--violet)}
  .dpick svg{width:13px;height:13px;fill:var(--violet);flex:0 0 auto}
  .dpick input[type=date]{position:absolute;inset:0;width:100%;height:100%;
         opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-family:inherit}
  .mini{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:7px;
        padding:6px 12px;font-family:inherit;font-weight:700;font-size:11.5px;cursor:pointer;
        display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .mini:hover{background:var(--cream);border-color:var(--peach)}

  /* the two actions people actually press, deliberately oversized */
  .big{padding:11px 24px;font-size:14px;font-weight:800;border-radius:9px;
       display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;
       font-family:inherit;cursor:pointer;letter-spacing:.2px;line-height:1}
  .big svg{width:17px;height:17px}
  .big.reload{background:#fff;color:var(--navy);border-color:#C8CDE4}
  .big.reload svg{fill:var(--navy)}
  .big.reload:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
  .big.reload:hover svg{fill:#fff}
  .big.submit{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 3px 10px rgba(214,69,80,.35)}
  .big.submit svg{fill:#fff}
  .big.submit:hover{background:#B8323C;border-color:#B8323C;box-shadow:0 4px 14px rgba(214,69,80,.45)}
  .big:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

  .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
  select,input[type=text],input[type=password]{
        font-family:inherit;font-size:12.5px;font-weight:600;color:var(--txt);
        padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
  select:focus,input:focus{outline:none;border-color:var(--violet)}
  select:disabled,input:disabled{background:#F1F2F7;color:#B2B7C9;cursor:not-allowed}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .pill{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:800;
        text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;display:inline-block}
  .pill.fl{background:#EFE8FB;color:var(--violet)}
  .pill.sv{background:#E7F4EC;color:var(--green)}
  .pill.no{background:#F1F2F7;color:var(--mut)}
  .pill.un{background:#EFE8FB;color:var(--violet)}
  .pill.dt{background:#F1F2F7;color:var(--mut)}

  /* ---- body ---- */
  .wrap{flex:1 1 auto;display:flex;flex-direction:column;padding:14px 18px 18px;min-height:0;
        width:100%;max-width:1400px;margin:0 auto}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:13px;flex:0 0 auto}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;
       position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(37,42,69,.05)}
  .kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
  .kpi.k2:before{background:var(--peach)} .kpi.k3:before{background:var(--red)}
  .kpi.k4:before{background:var(--blue)}  .kpi.k5:before{background:var(--green)}
  .kpi .k{font-size:8.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .kpi .v{font-size:23px;font-weight:800;margin-top:1px;line-height:1.05}
  .kpi .s{font-size:9.5px;color:var(--mut);margin-top:1px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        box-shadow:0 1px 2px rgba(37,42,69,.05);flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .card .hd{padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;
            font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;
            display:flex;align-items:center;gap:10px}
  .card .bd{padding:13px;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

  /* overflow-x is hidden on purpose. Every column has a percentage width that
     totals 100, so the table always fits and a sideways scrollbar could only
     ever mean something has broken. Chasing a report left and right on a
     factory floor tablet is what made this screen unusable. */
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
          border:1px solid var(--line);border-radius:9px}
  table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:12px}
  /* Headings WRAP. With fourteen columns a nowrap heading simply gets clipped,
     which is how "Eff %", "Reason" and "Status" turned into "EFF 9", "REAS"
     and "SHEE". Two short lines beat one cut-off line. */
  thead th{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;
           padding:7px 6px;text-align:left;font-weight:700;font-size:9.5px;
           text-transform:uppercase;letter-spacing:.2px;
           white-space:normal;line-height:1.25;vertical-align:middle}
  thead th.ctr{text-align:center}
  tbody td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Controls fill their column instead of forcing it wider. */
  tbody td select,tbody td input[type=text]{max-width:100%;padding:5px 6px;font-size:11.5px}
  .rsn{width:100%;min-width:0}
  .num{width:100%;min-width:0;text-align:right;font-weight:700}
  tbody tr:nth-child(even) td{background:#F6F7FB}
  tbody tr.has td{background:#FFF7F8}
  tbody tr.warn td{background:#FFF6E6}
  tbody tr.unav td{background:#F4EDFB}
  .mono{font-variant-numeric:tabular-nums}
  .sl{color:var(--mut);font-weight:700;text-align:right}
  .mins{font-weight:800;color:var(--red)}
  .chk{width:17px;height:17px;accent-color:var(--violet);cursor:pointer}
  .whhint{font-size:9px;font-weight:700;opacity:.65}
  .whv{font-variant-numeric:tabular-nums;font-weight:700}
  .whna{color:var(--mut);opacity:.6}

  /* ---------- live Input / Output / Eff% projection ----------
     A floor leader typing 60 minutes of loss could not see what it did until
     after submitting and then opening another report. These three columns show
     the effect while they type: the current figure, an arrow, the projected
     one. Green means efficiency reads higher, which is what removing input
     minutes does, and that is exactly the thing they need to understand. */
  .eh{white-space:nowrap}
  .ec{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11px;text-align:center}
  .pill{padding:3px 7px;font-size:9px}
  .effnow{font-weight:700;color:#40405C}
  .effarr{margin:0 2px;color:var(--mut);opacity:.7}
  .effup{font-weight:800;color:#1E8E4E}
  .effdn{font-weight:800;color:#C77700}
  .effsame{font-weight:800;color:#40405C}
  .effbad{font-weight:800;color:#B3261E}
  /* Over the cap. Loud on purpose: this one blocks the submit, so it must not
     look like the milder 10 hour warning. */
  tr.over .mins{color:#B3261E;font-weight:800}
  tr.over td{background:#FDECEA !important}
  tr.over .num{border-color:#B3261E;background:#FFF6F5}
  .overmin{color:#B3261E;font-weight:800;white-space:nowrap;cursor:help}
  .overmin b{font-weight:800}
  /* master tick that sits in the column heading */
  .allchk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .allchk input{width:15px;height:15px;accent-color:#fff;cursor:pointer;margin:0}
  .allchk input:disabled{cursor:not-allowed;opacity:.45}
  .ctr{text-align:center}

  .msg{padding:10px 13px;border-radius:8px;margin-bottom:11px;font-size:12px;font-weight:700;display:none;flex:0 0 auto}
  .msg.g{background:#E7F4EC;color:var(--green);display:block}
  .msg.r{background:#FBE9EB;color:var(--red);display:block}
  .msg.i{background:var(--cream);color:#8A5B12;display:block}

  .login{max-width:350px;margin:8vh auto}
  .login .bd{padding:20px;display:block}
  .login h3{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:14px}
  .login input{width:100%;margin-bottom:10px;padding:10px 12px;font-size:13px}
  .login .big{width:100%;justify-content:center}
  .hide{display:none !important}
  .loading{text-align:center;padding:44px;color:var(--mut);font-size:12px;white-space:normal}
</style>
</head>
<body>

<!-- ===== LOGIN, only if the page was opened without a live session ===== -->
<div id="loginBox" class="card login hide">
  <div class="bd">
    <h3>Floor Login</h3>
    <div class="msg" id="lmsg"></div>
    <input type="text" id="uid" placeholder="ID" autocomplete="off">
    <input type="password" id="pwd" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="big submit" onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hide" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0">

  <div class="strip">
    <button class="mini" onclick="goBack()" title="Back to the report">&larr; Report</button>
    <h2>Loss Time Entry</h2>
    <div class="sep"></div>

    <span id="floorWrap"><label>Floor</label>
      <select id="floorSel" onchange="switchFloor()"></select>
    </span>
    <span id="floorPill" class="pill fl hide">-</span>

    <div class="sep"></div>
    <label>Date</label>
    <span class="dpick">
      <span id="dlabel">&ndash;</span>
      <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 00-2 2v13a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 7v10H5V9h14z"/></svg>
      <input type="date" id="dt" onchange="loadDay()" onclick="openPicker(this)" aria-label="Entry date">
    </span>
    <button class="mini" onclick="goToday()">Today</button>
    <input type="text" id="q" placeholder="Search operator" oninput="render()" style="width:160px">

    <div class="acts">
      <span id="who" style="font-size:11px;color:var(--mut);font-weight:700"></span>
      <button class="big reload" id="reloadBtn" onclick="loadDay(true)">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 106 18.36l1.42-1.42A6 6 0 1112 18a5.94 5.94 0 01-4.24-1.76L6.34 17.66A8 8 0 1017.65 6.35zM13 3v6h6l-2.35-2.65z"/></svg>
        Reload
      </button>
      <button class="big submit" id="saveBtn" onclick="doSave()">
        <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4zm-5 16a3 3 0 110-6 3 3 0 010 6zm3-10H5V5h10v4z"/></svg>
        Submit
      </button>
    </div>
  </div>

  <div class="wrap">
    <div class="kpis">
      <div class="kpi"><div class="k">Operators</div><div class="v" id="k1">0</div><div class="s">active on this floor</div></div>
      <div class="kpi k2"><div class="k">With Loss</div><div class="v" id="k2">0</div><div class="s">operators affected</div></div>
      <div class="kpi k3"><div class="k">Total Loss</div><div class="v" id="k3">0</div><div class="s">minutes</div></div>
      <div class="kpi k4"><div class="k">Equivalent</div><div class="v" id="k4">0.0</div><div class="s">hours</div></div>
      <div class="kpi k5"><div class="k">Already Saved</div><div class="v" id="k5">0</div><div class="s">records in sheet</div></div>
    </div>

    <div class="card">
      <div class="hd"><span>Operator Loss Entry</span><span id="hdDate" class="pill dt"></span></div>
      <div class="bd">
        <div class="msg" id="smsg"></div>
        <div class="scroll">
          <table>
            <!-- 14 columns, sized in PERCENT so the table always fits its card
                 and never needs a left-right scroll. It carried 11 fixed pixel
                 widths for 14 columns, so the last three had no width at all,
                 pushed the table past its container and cut off Eff%, Reason
                 and Status. Percentages total exactly 100. -->
            <colgroup>
              <col style="width:3%">     <!-- #          -->
              <col style="width:8.5%">   <!-- Op ID      -->
              <col style="width:12%">    <!-- Name       -->
              <col style="width:6.5%">   <!-- Process    -->
              <col style="width:4.5%">   <!-- WH         -->
              <col style="width:6%">     <!-- Unavailable-->
              <col style="width:5.5%">   <!-- Loss       -->
              <col style="width:5%">     <!-- Unit       -->
              <col style="width:5%">     <!-- Minutes    -->
              <col style="width:10%">    <!-- Input Min  -->
              <col style="width:6%">     <!-- Output Min -->
              <col style="width:9%">     <!-- Eff %      -->
              <col style="width:11%">    <!-- Reason     -->
              <col style="width:8%">     <!-- Status     -->
            </colgroup>
            <thead><tr>
              <th class="sl">#</th>
              <th>Op ID</th>
              <th>Name</th>
              <th>Process</th>
              <th class="ctr" title="Working hour, read from the efficiency sheet for this date">WH<span class="whhint"> hrs</span></th>
              <th class="ctr"><label class="allchk"
                  title="Tick to mark every operator shown below as unavailable. Untick to clear them.">
                  <input type="checkbox" id="allUnav" onchange="setAllUnav(this.checked)">
                  <span>Unavail.</span></label></th>
              <th>Loss</th>
              <th>Unit</th>
              <th>Minutes</th>
              <th class="ctr" title="Indv. Input Min from the efficiency sheet. Shows now &rarr; projected as you type.">Input<span class="whhint"> min</span></th>
              <th class="ctr" title="Indv. Output Min. Loss time does not change this.">Output<span class="whhint"> min</span></th>
              <th class="ctr" title="Output Min divided by Input Min. Shows now &rarr; projected as you type.">Eff<span class="whhint"> %</span></th>
              <th>Reason</th>
              <th>Status</th>
            </tr></thead>
            <tbody id="tb"><tr><td colspan="14" class="loading">Loading&hellip;</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   Loss Time Entry

   The session is handed over by daily.html through sessionStorage, never
   through the URL. That keeps the address bar on the shell's own domain
   and keeps the token out of history, bookmarks and referrer headers.

   Reads are plain GET. The save is POST with Content-Type text/plain,
   which is what stops the browser firing a CORS preflight that Apps
   Script cannot answer.
   ------------------------------------------------------------------ */

var LOSS_API = "https://script.google.com/macros/s/AKfycbxsRF9KqFfg5zGntReKUCZxj_8lpVcT3GJwg5gmqTDQqGROzc-61uAeEavSprQMdYx2/exec";
var SESS_KEY = 'sosl_loss_sess';
var WARN_MIN = 600;          /* 10 hours. Warns, never blocks. */

/* The efficiency dashboard serves a snapshot that its own timer only rebuilds
   between 8 and 10:30 AM. Loss entered during the day therefore sat invisible
   until the next morning, even though the sheet formulas had already deducted
   it. Saving here now asks that API to rebuild immediately, so Input Min,
   Individual Eff% and Team Eff% all move together. Fire and forget: if it
   fails, the loss is still saved and the morning rebuild will catch it. */
var EFF_API = "https://script.google.com/macros/s/AKfycbxQ2BmHNHGuMpy244VH_Tl2CwlB9Yu6HZUfg28XvqR4TWPcQowPQSMQuaNR27-wuSSP/exec";

/* The date matters. A floor leader often enters loss for an earlier day, and
   syncing only "the latest date" would leave that day's Input Min and Eff%
   untouched in the efficiency sheet. */
function nudgeDashboard(dateStr, done, floorStr){
  var q = EFF_API+'?action=snapshot&fresh=1'
        + (dateStr ? '&lossdate='+encodeURIComponent(dateStr) : '')
        /* Only this floor changed, so only this floor is synced. Without it
           the script walks all eleven tabs while the user waits. */
        + (floorStr ? '&lossfloor='+encodeURIComponent(floorStr) : '');
  fetch(q, {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null })
    .then(function(res){ if(done) done(res && res.loss ? res.loss : '') })
    .catch(function(){ if(done) done('could not reach the dashboard, it will catch up') });
}

var TOKEN=null, FLOOR='', FLOORS=[], CENTRAL=false, USER='';
var OPS=[], RSN=[], VAL={}, SAVED={}, TODAY='', VIEW=[];
/* Operators whose typed loss exceeds the minutes that existed on the date.
   Non-empty means Submit is refused. Kept in one place so the button state
   and the save check can never disagree with each other. */
var OVER=[];
/* Efficiency figures per operator for the selected date, read from the
   efficiency sheet. Empty when that day's report has not been pushed yet,
   which is normal and must read as "not pushed yet", never as zero.
     wh   working hours        inn  Indv. Input Min  (loss already deducted)
     out  Indv. Output Min     eff  Individual Eff%
     loss loss minutes ALREADY saved in the sheet */
var WH={};
function facts(id){ return WH[String(id).replace(/^0+/,'')] || null; }
function whOf(id){
  var f=facts(id);
  return (f && typeof f.wh==='number' && f.wh>0) ? f.wh : null;
}
function whCell(id){
  var v=whOf(id);
  return v===null ? '<span class="whna" title="The efficiency report for this date has not been pushed yet">&ndash;</span>'
                  : '<span class="whv">'+v.toFixed(2)+'</span>';
}

/* ---------- live effect of the minutes being typed ----------
   The sheet computes
     Indv. Input Min = WH*60 - fixed break - unavailable time - Loss Min
   Only the last term moves while a floor leader types, and it moves one for
   one. So the projection below is exact arithmetic, not an estimate:
     base      = Input Min now + loss ALREADY saved
     newInput  = base - minutes being typed now
     newEff%   = Output Min / newInput * 100
   Output Min does not move with loss. That is the point the floor leader
   needs to see: the same output over fewer input minutes reads higher. */
function project(id, mins){
  var f=facts(id);
  if(!f || f.inn===null || f.inn===undefined) return null;
  var base=f.inn + (Number(f.loss)||0);
  var ni=base - (Number(mins)||0);
  var no=(f.out===null||f.out===undefined) ? null : f.out;
  var ne=(no!==null && ni>0) ? (no/ni*100) : null;
  return { base:base, inn:f.inn, newInn:ni, out:no,
           eff:f.eff, newEff:ne, over:(ni<=0) };
}

/* One cell showing "now -> projected". Unchanged values are shown plainly so
   the arrow only ever appears when the leader has actually changed something. */
function effCell(id){
  var f=facts(id);
  if(!f || f.inn===null || f.inn===undefined)
    return '<span class="whna" title="The efficiency report for this date has not been pushed yet">&ndash;</span>';

  var v=VAL[id]||blank(), m=toMin(v);
  var p=project(id, m);
  var savedLoss=Number(f.loss)||0;
  var cur=(f.eff===null||f.eff===undefined)?null:f.eff;

  var curTxt=(cur===null)?'&ndash;':cur.toFixed(1)+'%';

  /* Nothing typed and nothing different from what is already saved */
  if(!p || m===savedLoss) return '<span class="effnow">'+curTxt+'</span>';

  if(p.over){
    return '<span class="effnow">'+curTxt+'</span>'
         + '<span class="effarr">&rarr;</span>'
         + '<span class="effbad" title="This much loss would leave no input minutes at all. Check the figure.">over</span>';
  }
  if(p.newEff===null) return '<span class="effnow">'+curTxt+'</span>';

  var up=(cur!==null && p.newEff>cur);
  var same=(cur!==null && Math.abs(p.newEff-cur)<0.05);
  var cls=same?'effsame':(up?'effup':'effdn');
  return '<span class="effnow">'+curTxt+'</span>'
       + '<span class="effarr">&rarr;</span>'
       + '<span class="'+cls+'">'+p.newEff.toFixed(1)+'%</span>';
}

/* Input Min the same way. */
function inCell(id){
  var f=facts(id);
  if(!f || f.inn===null || f.inn===undefined)
    return '<span class="whna">&ndash;</span>';

  var v=VAL[id]||blank(), m=toMin(v);
  var p=project(id, m);
  var savedLoss=Number(f.loss)||0;

  if(!p || m===savedLoss) return '<span class="effnow">'+Math.round(f.inn)+'</span>';
  if(p.over)
    return '<span class="effnow">'+Math.round(f.inn)+'</span>'
         + '<span class="effarr">&rarr;</span><span class="effbad">0</span>';

  return '<span class="effnow">'+Math.round(f.inn)+'</span>'
       + '<span class="effarr">&rarr;</span>'
       + '<span class="effdn">'+Math.round(p.newInn)+'</span>';
}

function outCell(id){
  var f=facts(id);
  if(!f || f.out===null || f.out===undefined) return '<span class="whna">&ndash;</span>';
  return '<span class="effnow">'+Math.round(f.out)+'</span>';
}

function el(i){return document.getElementById(i)}
function say(id,t,c){var m=el(id); m.innerHTML=t||''; m.className = t ? ('msg '+c) : 'msg';}
function openPicker(i){ if(i.showPicker){ try{i.showPicker()}catch(e){} } }
function goBack(){ location.href='daily.html'; }

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pretty(iso){
  if(!iso) return '–';
  var p=String(iso).split('-'); if(p.length!==3) return iso;
  return Number(p[2])+' '+MON[Number(p[1])-1]+', '+p[0];
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function blank(){ return {min:'',unit:'Min',reason:'',unav:false}; }

/* Apps Script does not always answer with JSON. When a request runs too long,
   or Google hiccups, or the deployment is mid-update, Google serves an HTML
   error page instead. Calling r.json() on that produced the raw browser error
   "Unexpected token '<', "<!DOCTYPE"... is not valid JSON", which told the
   floor leader nothing and looked like the app was broken.

   Read the body as TEXT, then decide. Real JSON parses. Anything starting with
   "<" is Google's HTML, which is a transport failure, not a data failure, so
   it is worth one silent retry before bothering the user. */
function readJson(r){
  return r.text().then(function(t){
    var head=String(t||'').trim().slice(0,1);
    if(head==='<'){
      /* No "trying again" in this text. A GET is retried by withRetry, a POST
         is not, and promising a retry that never happens is worse than saying
         nothing. The caller decides what to do and says so. */
      var e=new Error('The server answered with a web page instead of data, '
        +'which usually means the request took too long.');
      e.isHtml=true;
      throw e;
    }
    try{ return JSON.parse(t); }
    catch(err){ throw new Error('The server sent something unreadable. Please retry.'); }
  });
}

/* One retry, once, only for the HTML case. A second failure is reported
   properly instead of being hidden behind an endless loop. */
function withRetry(run){
  return run().catch(function(e){
    if(!e || !e.isHtml) throw e;
    return new Promise(function(res){ setTimeout(res, 1200); }).then(run)
      .catch(function(e2){
        if(e2 && e2.isHtml){
          throw new Error('The server is busy and did not answer in time. '
            +'Wait a few seconds and press Reload.');
        }
        throw e2;
      });
  });
}

function api(params){
  var q=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');
  return withRetry(function(){
    return fetch(LOSS_API+'?'+q,{cache:'no-store'}).then(readJson);
  });
}
/* Saves are NOT retried automatically. The write is an idempotent upsert so a
   repeat is harmless to the sheet, but a silent retry would leave the user
   unsure whether their entry landed. They are told, and they decide. */
function apiPost(body){
  return fetch(LOSS_API,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)
  }).then(readJson);
}

/* ---------- start ---------- */

window.addEventListener('load',function(){
  var s=null;
  try{ s=JSON.parse(sessionStorage.getItem(SESS_KEY)||'null'); }catch(e){ s=null; }
  if(s && s.token){
    TOKEN=s.token; CENTRAL=!!s.central; FLOORS=s.floors||[]; USER=s.user||'';
    FLOOR=FLOORS[0]||''; TODAY=s.today||'';
    startApp();
  }else{
    el('loginBox').classList.remove('hide');
    el('uid').focus();
  }
});

function doLogin(){
  var id=el('uid').value.trim(), pw=el('pwd').value.trim();
  if(!id||!pw){ say('lmsg','Enter both ID and password.','r'); return; }
  say('lmsg','Checking…','i');
  api({action:'login',id:id,pw:pw}).then(function(r){
    if(!r.ok){ say('lmsg',r.msg||'Login failed.','r'); return; }
    TOKEN=r.token; CENTRAL=r.central; FLOORS=r.floors||[]; USER=r.user; TODAY=r.today;
    FLOOR=FLOORS[0]||'';
    if(!FLOOR){ say('lmsg','No floor is mapped to this login. Check the Users tab.','r'); return; }
    try{ sessionStorage.setItem(SESS_KEY,JSON.stringify({token:TOKEN,central:CENTRAL,floors:FLOORS,user:USER,today:TODAY})); }catch(e){}
    el('loginBox').classList.add('hide');
    startApp();
  }).catch(function(e){ say('lmsg','Cannot reach the API. '+e.message,'r'); });
}

function startApp(){
  el('app').classList.remove('hide');
  el('who').textContent = USER ? (USER+'  ·') : '';
  setupFloorControl();
  boot();
}

function setupFloorControl(){
  if(CENTRAL && FLOORS.length>1){
    el('floorSel').innerHTML=FLOORS.map(function(f){return '<option'+(f===FLOOR?' selected':'')+'>'+esc(f)+'</option>'}).join('');
    el('floorWrap').classList.remove('hide');
    el('floorPill').classList.add('hide');
  }else{
    el('floorWrap').classList.add('hide');
    el('floorPill').textContent='Floor '+FLOOR;
    el('floorPill').classList.remove('hide');
  }
}
function switchFloor(){ FLOOR=el('floorSel').value; boot(); }

/* ---------- load ---------- */

function boot(){
  el('tb').innerHTML='<tr><td colspan="14" class="loading">Loading…</td></tr>';
  api({action:'boot',token:TOKEN,floor:FLOOR}).then(function(r){
    if(!r.ok){ fail(r.msg); return; }
    OPS=r.operators; RSN=r.reasons; TODAY=r.today; CENTRAL=r.central; FLOORS=r.floors||FLOORS;
    /* boot sends the working hour on each operator; day sends a lookup map.
       Both are normalised into WH here so the rest of the page has one shape. */
    /* boot sends the figures ON each operator, day sends them as a lookup map.
       Both are normalised into WH here so the rest of the page has one shape. */
    WH={}; OPS.forEach(function(o){
      if(typeof o.wh==='number' && o.wh>0){
        WH[String(o.id).replace(/^0+/,'')] =
          { wh:o.wh, inn:o.inn, out:o.out, eff:o.eff, loss:Number(o.loss)||0 };
      }
    });
    if(!el('dt').value) el('dt').value=TODAY;
    el('dlabel').textContent=pretty(el('dt').value);
    apply(r.day); render();
  }).catch(function(e){ fail(e.message) });
}

/* fresh=true bypasses the 10 minute cache the API keeps on the efficiency
   figures. Used by the Reload button and straight after a save, when the
   sheet has just been rewritten and the cached copy is known to be stale. */
function loadDay(fresh){
  var d=el('dt').value||TODAY;
  el('dlabel').textContent=pretty(d);
  say('smsg','','');
  el('tb').innerHTML='<tr><td colspan="14" class="loading">Loading…</td></tr>';
  var q={action:'day',token:TOKEN,floor:FLOOR,date:d};
  if(fresh===true) q.fresh=1;
  api(q).then(function(r){
    if(!r.ok){ fail(r.msg); return; }
    WH={};
    if(r.wh) for(var k in r.wh) if(r.wh.hasOwnProperty(k)){
      var f=r.wh[k];
      /* Tolerate the old shape, where the map held a bare number, so a stale
         deployment of the Apps Script cannot blank the working hour column. */
      WH[String(k).replace(/^0+/,'')] =
        (typeof f==='number') ? {wh:f,inn:null,out:null,eff:null,loss:0} : f;
    }
    apply(r.day); render();
  }).catch(function(e){ fail(e.message) });
}

function goToday(){
  api({action:'ping'}).then(function(r){ TODAY=r.today; el('dt').value=TODAY; loadDay(); });
}

function fail(m){
  el('tb').innerHTML='<tr><td colspan="14" class="loading">–</td></tr>';
  say('smsg',esc(m||'Something went wrong.'),'r');
  if(String(m||'').indexOf('Session expired')>=0){
    try{ sessionStorage.removeItem(SESS_KEY); }catch(e){}
    el('app').classList.add('hide');
    el('loginBox').classList.remove('hide');
    say('lmsg','Session expired. Please log in again.','r');
  }
}

/* ---------- state ---------- */

/* ---------- baseline: what the sheet held when this day was loaded ----------
   Keyed by operator, holding only what a save actually writes: minutes,
   reason, unavailable. Everything sent to the server is the DIFFERENCE against
   this, so an untouched operator is never rewritten.

   That matters for more than speed. A full rewrite stamped every row on the
   floor with the current user and the current time, so one leader correcting a
   single operator replaced the Submitted By and Timestamp of the seventeen
   rows somebody else had entered that morning. Sending only what changed keeps
   those rows, and their history, exactly as they were. */
var BASE = {};

function snap(v){
  var m = toMin(v);
  return { min: (v && v.unav) ? 0 : m,
           reason: String((v && v.reason) || ''),
           unav: !!(v && v.unav) };
}
function sameEntry(a,b){
  return a.min===b.min && a.unav===b.unav && a.reason===b.reason;
}

/* Operators whose value differs from the baseline. A cleared operator counts
   as changed: min 0 and not unavailable means "delete his row", and leaving
   him out would silently keep the old figure in the sheet. */
function changedOps(){
  var out=[];
  OPS.forEach(function(o){
    var now  = snap(VAL[o.id]||blank());
    var was  = BASE[o.id] || {min:0,reason:'',unav:false};
    if(!sameEntry(now,was)) out.push({op:o, now:now, was:was});
  });
  return out;
}

function apply(day){
  VAL={}; SAVED={}; BASE={};
  OPS.forEach(function(o){ VAL[o.id]=blank(); });
  (day.entries||[]).forEach(function(e){
    SAVED[e.opId]=e;
    if(!VAL[e.opId]) VAL[e.opId]=blank();
    VAL[e.opId].unav   = !!e.unav;
    VAL[e.opId].min    = e.unav ? '' : (e.min || '');
    VAL[e.opId].unit   = 'Min';
    VAL[e.opId].reason = e.reason;
  });
  /* Taken AFTER VAL is filled, so the baseline is exactly what is on screen
     the moment the day finishes loading. */
  OPS.forEach(function(o){ BASE[o.id] = snap(VAL[o.id]); });
  el('hdDate').textContent = pretty(day.dateStr);
}

function toMin(v){
  if(!v || v.unav) return 0;
  var n=parseFloat(String(v.min).replace(/[^0-9.]/g,''));
  if(isNaN(n)||n<0) n=0;
  return Math.round(v.unit==='Hr' ? n*60 : n);
}

/* ---------- render ----------
   render() rebuilds the whole tbody and is called only on load, floor change
   and search. Typing must NEVER call it: rebuilding the row while the caret is
   in the box destroys the input and you lose focus after a single digit.
   Keystrokes go through setv() -> touch(), which edits only the derived cells. */

function render(){
  var q=(el('q').value||'').toLowerCase(), h='', sl=0;
  VIEW=[];
  OPS.forEach(function(o){
    if(q && (o.id+' '+o.name+' '+o.process).toLowerCase().indexOf(q)<0) return;
    VIEW.push(o.id); sl++;
    var v=VAL[o.id]||blank();
    var m=toMin(v);
    var s=SAVED[o.id];

    h+='<tr id="tr_'+o.id+'" class="'+rowCls(v,m,o.id)+'">'
     + '<td class="sl">'+sl+'</td>'
     + '<td class="mono">'+esc(o.id)+'</td>'
     + '<td title="'+esc(o.name)+'">'+esc(o.name)+'</td>'
     + '<td style="color:var(--mut)" title="'+esc(o.process)+'">'+esc(o.process)+'</td>'
     + '<td class="ctr">'+whCell(o.id)+'</td>'
     + '<td class="ctr"><input class="chk" type="checkbox" id="c_'+o.id+'" '+(v.unav?'checked':'')
     +   ' onchange="setv(\''+o.id+'\',\'unav\',this.checked)"></td>'
     + '<td><input class="num" type="text" inputmode="decimal" id="i_'+o.id+'" value="'+esc(v.min)+'"'
     +   (v.unav?' disabled':'')+' oninput="setv(\''+o.id+'\',\'min\',this.value)"></td>'
     + '<td><select id="u_'+o.id+'" '+(v.unav?'disabled':'')+' onchange="setv(\''+o.id+'\',\'unit\',this.value)">'
     +   '<option'+(v.unit==='Min'?' selected':'')+'>Min</option>'
     +   '<option'+(v.unit==='Hr'?' selected':'')+'>Hr</option></select></td>'
     + '<td class="mono mins" id="m_'+o.id+'">'+minsCell(v,m,o.id)+'</td>'
     + '<td class="ctr ec" id="in_'+o.id+'">'+inCell(o.id)+'</td>'
     + '<td class="ctr ec" id="ot_'+o.id+'">'+outCell(o.id)+'</td>'
     + '<td class="ctr ec" id="ef_'+o.id+'">'+effCell(o.id)+'</td>'
     + '<td><select class="rsn" onchange="setv(\''+o.id+'\',\'reason\',this.value)">'
     +   '<option value="">&ndash;</option>'
     +   RSN.map(function(r){return '<option'+(v.reason===r?' selected':'')+'>'+esc(r)+'</option>'}).join('')
     +   '</select></td>'
     + '<td>'+statCell(s)+'</td></tr>';
  });
  el('tb').innerHTML = h || '<tr><td colspan="14" class="loading">No operators match.</td></tr>';
  updateKpis();
  syncAllUnav();
}

/* One tick in the heading marks every operator currently listed. It follows
   the search box on purpose: filter to Manual Spreading and only those are
   affected, which is what a floor leader actually wants. VIEW already holds
   exactly the rows on screen, so nothing hidden is ever touched. */
var BULK = false;
function setAllUnav(on){
  BULK = true;
  VIEW.forEach(function(id){
    var cb = el('c_'+id);
    if(cb) cb.checked = on;
    setv(id, 'unav', on);
  });
  BULK = false;
  syncAllUnav();
}

/* The heading box reflects the rows under it: ticked when every one is
   unavailable, a dash when only some are, empty when none. */
function syncAllUnav(){
  var box = el('allUnav');
  if(!box) return;
  var n = VIEW.length, on = 0;
  VIEW.forEach(function(id){ if((VAL[id]||blank()).unav) on++; });
  box.checked = (n > 0 && on === n);
  box.indeterminate = (on > 0 && on < n);
  box.disabled = (n === 0);
}

/* Loss beyond the operator's own working hour is almost always a typo, most
   often minutes typed where hours were meant. It is flagged, not blocked: a
   genuine long stoppage does happen and a floor leader must still be able to
   record it. Same stance as the existing over-10-hours warning. */
/* ---------- the real ceiling on a loss entry ----------
   The sheet computes
     Indv. Input Min = WH*60 - fixed break - unavailable time - Loss Min
   so the most loss that can be recorded before Input Min goes NEGATIVE is
     cap = WH*60 - fixed break - unavailable time
   which is exactly the "base" the projection already works out:
     base = current Input Min + loss already saved

   This used to be compared against WH*60 alone, which is too generous: it
   ignores the break and the unavailable allowance, so an entry could pass the
   check and still drive Input Min below zero. A negative Input Min does not
   just spoil one cell, it drags the whole floor's Team Eff% and the KPI with
   it, because those sum input minutes across the floor.

   Returns null when the efficiency report for that date has not been pushed
   yet. The cap is genuinely unknown then, so entry is never frozen by a
   missing report; the softer WARN_MIN warning still applies. */
function capOf(id){
  var f=facts(id);
  if(!f || f.inn===null || f.inn===undefined) return null;
  var base=f.inn + (Number(f.loss)||0);
  return base>0 ? base : 0;
}

/* Over the cap, and therefore refused at submit. */
function overCap(id,v,m){
  if(v.unav) return false;                 /* unavailable records no minutes */
  var cap=capOf(id);
  return (cap!==null && m>0 && m>cap);
}

function rowCls(v,m,id){
  if(v.unav) return 'unav';
  if(overCap(id,v,m)) return 'over';
  return m>WARN_MIN ? 'warn' : (m>0 ? 'has' : '');
}

function minsCell(v,m,id){
  if(v.unav) return '<span class="pill un">PIB N/A</span>';
  if(id!==undefined && overCap(id,v,m)){
    var cap=capOf(id);
    return '<span class="overmin" title="Only '+Math.floor(cap)+' minutes were available on this date. '
         + 'More loss than that would make Input Min negative. If the operator was out all day, tick Unavailable instead.">'
         + m+' <b>&gt; '+Math.floor(cap)+'</b></span>';
  }
  return (m||'');
}
/* Whether the row reached the sheet, nothing more. The minutes and the
   unavailable flag are already visible in their own columns on the same row,
   so repeating them here was noise. */
function statCell(s){
  return s ? '<span class="pill sv">Submitted</span>'
           : '<span class="pill no">Not submitted</span>';
}

/* ---------- edits, no rebuild ---------- */

function setv(id,k,v){
  if(!VAL[id]) VAL[id]=blank();
  VAL[id][k]=v;

  if(k==='unav'){
    /* Unavailable means the whole working day is out. No loss figure is
       taken, and the operator's individual PIB does not apply that day. */
    var inp=el('i_'+id), un=el('u_'+id);
    if(v){
      VAL[id].min='';
      if(inp){ inp.value=''; inp.disabled=true; }
      if(un) un.disabled=true;
    }else{
      if(inp) inp.disabled=false;
      if(un) un.disabled=false;
    }
  }
  touch(id);
  updateKpis();
  if(!BULK) syncAllUnav();     /* skipped mid bulk, done once at the end */
}

function touch(id){
  var v=VAL[id]||blank(), m=toMin(v);
  var mc=el('m_'+id); if(mc) mc.innerHTML=minsCell(v,m,id);
  /* The whole reason the columns are there: they move as the leader types. */
  var ic=el('in_'+id); if(ic) ic.innerHTML=inCell(id);
  var ec=el('ef_'+id); if(ec) ec.innerHTML=effCell(id);
  var tr=el('tr_'+id); if(tr) tr.className=rowCls(v,m,id);
}

function updateKpis(){
  var tot=0, cnt=0, warn=[], over=[];
  OPS.forEach(function(o){
    var v=VAL[o.id]||blank(), m=toMin(v);
    if(m>0){ tot+=m; cnt++; }
    /* The 10 hour rule only earns its keep when the real cap is unknown,
       which is the case until that day's efficiency report is pushed. Once
       the cap IS known it is both tighter and correct, so it takes over. */
    if(capOf(o.id)===null && m>WARN_MIN) warn.push(esc(o.name)+' ('+m+' min)');
    if(overCap(o.id,v,m)) over.push({name:o.name, m:m, cap:Math.floor(capOf(o.id))});
  });
  el('k1').textContent=OPS.length;
  el('k2').textContent=cnt;
  el('k3').textContent=tot;
  el('k4').textContent=(tot/60).toFixed(1);
  el('k5').textContent=Object.keys(SAVED).length;

  /* Over the cap BLOCKS the submit, so the button is disabled the moment it
     happens rather than letting a leader fill the whole floor and only then
     be refused. */
  OVER = over;
  var sb=el('saveBtn');
  if(sb) sb.disabled = over.length>0;

  var m=el('smsg');
  /* The over-cap notice takes priority: it names a specific operator whose
     figure cannot be right, which is more actionable than the blanket rule. */
  if(over.length){
    say('smsg','<b>Cannot submit.</b> Loss is more than the minutes available for '
      + over.map(function(o){ return esc(o.name)+' ('+o.m+' min, only '+o.cap+' available)' }).join(', ')
      + '. Check the Min / Hr unit. If the operator was out all day, tick <b>Unavailable</b> instead.','r');
  }
  else if(warn.length) say('smsg','Over 10 hours, please double check: '+warn.join(', ')+'. You can still submit.','i');
  else if(m.className.indexOf('i')>=0 || m.className.indexOf('r')>=0) say('smsg','','');
}

/* ---------- save ---------- */

/* ---------- send only what changed ----------
   This used to send every operator with any loss, and the server then deleted
   the whole floor-and-date block and wrote it back. Correcting one operator
   therefore rewrote all eighteen rows on the floor, which was needless work on
   both sides AND overwrote the Submitted By and Timestamp of rows somebody
   else had entered earlier that day.

   Now the page compares against BASE, the snapshot taken when the day loaded,
   and sends only the operators whose value actually moved. An operator whose
   entry was CLEARED is included with min 0 and unav false, which the server
   reads as "remove his row"; leaving him out would quietly keep the old figure.
   Untouched rows are never named, so the server never touches them. */
function doSave(){
  var rows=[], bad=[], over=[], seen={};
  var changed = changedOps();

  changed.forEach(function(c){
    var o=c.op, v=VAL[o.id]||blank(), m=toMin(v);

    /* HARD STOP. More loss than the minutes that existed would drive Indv.
       Input Min below zero, and a negative input does not stay in one cell:
       Team Eff% and the KPI both sum input minutes across the floor, so one
       bad entry drags the whole floor's figure with it. Checked again here
       and not only in updateKpis, because the button state is a convenience
       and this is the actual gate. */
    if(overCap(o.id,v,m)){
      over.push(esc(o.name)+' ('+m+' min, only '+Math.floor(capOf(o.id))+' available)');
      return;
    }

    /* A reason is required to RECORD something. Clearing an entry needs none,
       there is nothing left to explain. */
    if((m>0 || v.unav) && !v.reason){ bad.push(o.name); return; }

    /* Belt and braces against a duplicated operator in the list. The server
       collapses these too, but sending clean rows means the saved count on
       screen matches what a floor leader actually typed. */
    var k=String(o.id).replace(/^0+/,'');
    if(seen[k]) return;
    seen[k]=1;

    rows.push({opId:o.id, min:m, reason:v.reason||'', unav:!!v.unav});
  });

  if(!rows.length && !bad.length && !over.length){
    say('smsg','Nothing has changed since this day was loaded, so there is nothing to submit.','i');
    return;
  }

  if(over.length){
    say('smsg','<b>Cannot submit.</b> Loss is more than the minutes available for '
      + over.join(', ') + '. Check whether the unit should be Min or Hr. '
      + 'If the operator was out for the whole day, tick <b>Unavailable</b> instead of typing the full shift.','r');
    return;
  }
  if(bad.length){ say('smsg','Reason missing for: '+esc(bad.join(', ')),'r'); return; }

  el('saveBtn').disabled=true; el('reloadBtn').disabled=true;
  say('smsg','Submitting…','i');
  var theDate = el('dt').value;

  /* Everything that has to happen AFTER the rows are safely in the sheet.
     Pulled out of the .then so the recovery path below can run it too. */
  function afterSave(msg){
    say('smsg', esc(msg)+' Refreshing the efficiency dashboard\u2026','g');
    nudgeDashboard(theDate, function(note){
      say('smsg', esc(msg)+' Efficiency dashboard updated'
          + (note ? ' ('+esc(note)+')' : '') + '.', 'g');
      /* The sheet has just recalculated, so the projection can be replaced by
         the real figures. The arrows disappear and the columns settle on the
         new numbers, which is the confirmation the leader is looking for. */
      loadDay(true);
    }, FLOOR);
  }

  /* partial:1 scopes the server's delete to the operators named in rows.
     Without it the server clears the whole floor and date, which would
     wipe every operator this save is deliberately not mentioning. */
  apiPost({action:'save',token:TOKEN,floor:FLOOR,date:theDate,rows:rows,partial:1}).then(function(r){
    el('reloadBtn').disabled=false;
    updateKpis();          /* updateKpis owns the Submit button's enabled state */
    if(!r.ok){ fail(r.msg); return; }
    if(r.day){ apply(r.day); render(); }
    afterSave(r.msg);
  }).catch(function(e){
    el('reloadBtn').disabled=false;
    updateKpis();

    /* ---------- the write may well have SUCCEEDED ----------
       Apps Script can finish writing and still miss the response window, and
       Google then serves an HTML page. The old code treated that as a failure
       and stopped, which is how a submit ended up in the LossTime sheet while
       the efficiency sheet never moved: the rows were saved, but the dashboard
       sync only ran on the success path and so was never called at all.

       So do not guess. Read the day back and compare it with what was sent.
       The save is an idempotent upsert, so re-reading is safe and cheap.
       If the sheet agrees, this was a slow response and not a failure, and the
       sync must still run. */
    if(!e || !e.isHtml){
      say('smsg','Submit failed. '+esc(e.message),'r');
      return;
    }

    say('smsg','The server was slow to answer. Checking whether your entry was saved\u2026','i');

    api({action:'day',token:TOKEN,floor:FLOOR,date:theDate,fresh:1}).then(function(chk){
      if(!chk || !chk.ok){ throw new Error('could not read the day back'); }

      /* Match on operator AND minutes, so a stale earlier entry cannot be
         mistaken for the one just submitted. A CLEARED operator is expected to
         be ABSENT from the day, not present with zero, so it is checked the
         other way round. */
      var got={};
      ((chk.day&&chk.day.entries)||[]).forEach(function(en){
        got[String(en.opId).replace(/^0+/,'')]={
          min:Math.round(Number(en.min)||0), unav:!!en.unav };
      });
      var missing=rows.filter(function(r){
        var k=String(r.opId).replace(/^0+/,'');
        var want=Math.round(Number(r.min)||0);
        var g=got[k];
        if(want<=0 && !r.unav) return g!==undefined;      /* cleared: must be gone */
        if(g===undefined) return true;                    /* recorded: must be there */
        return g.min!==want || g.unav!==!!r.unav;
      });

      if(!missing.length){
        if(chk.wh){
          WH={};
          for(var k in chk.wh) if(chk.wh.hasOwnProperty(k)){
            var f=chk.wh[k];
            WH[String(k).replace(/^0+/,'')] =
              (typeof f==='number') ? {wh:f,inn:null,out:null,eff:null,loss:0} : f;
          }
        }
        apply(chk.day); render();
        afterSave(rows.length+' change'+(rows.length===1?'':'s')+' saved');
        return;
      }

      say('smsg','The server was slow and '+missing.length+' entr'
        +(missing.length===1?'y is':'ies are')+' not in the sheet. '
        +'Press Submit once more.','r');

    }).catch(function(){
      say('smsg','The server was slow and the entry could not be confirmed. '
        +'Press <b>Reload</b> to see what reached the sheet, then submit again '
        +'only if it is missing.','r');
    });
  });
}
</script>
