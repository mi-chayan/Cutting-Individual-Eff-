<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loss Time Entry</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --card:#fff; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
    --red:#D64550; --green:#1E8E4E; --blue:#1D6FD0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}

  /* ---- control strip ---- */
  .strip{background:#fff;border-bottom:1px solid var(--line);padding:9px 18px;
         display:flex;align-items:center;gap:11px;flex-wrap:wrap;position:sticky;top:0;z-index:20;flex:0 0 auto}
  .strip h2{font-size:14px;font-weight:800;color:var(--navy);white-space:nowrap}
  .sep{width:1px;height:24px;background:var(--line)}
  .strip label{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .dpick{position:relative;display:inline-flex;align-items:center;gap:7px;
         border:1px solid var(--line);border-radius:7px;padding:7px 11px;background:#fff;
         font-size:12.5px;font-weight:700;color:var(--txt);white-space:nowrap;cursor:pointer}
  .dpick:hover{border-color:var(--violet)}
  .dpick svg{width:13px;height:13px;fill:var(--violet);flex:0 0 auto}
  .dpick input[type=date]{position:absolute;inset:0;width:100%;height:100%;
         opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-family:inherit}
  .mini{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:7px;
        padding:6px 12px;font-family:inherit;font-weight:700;font-size:11.5px;cursor:pointer;
        display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .mini:hover{background:var(--cream);border-color:var(--peach)}

  /* the two actions people actually press, deliberately oversized */
  .big{padding:11px 24px;font-size:14px;font-weight:800;border-radius:9px;
       display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;
       font-family:inherit;cursor:pointer;letter-spacing:.2px;line-height:1}
  .big svg{width:17px;height:17px}
  .big.reload{background:#fff;color:var(--navy);border-color:#C8CDE4}
  .big.reload svg{fill:var(--navy)}
  .big.reload:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
  .big.reload:hover svg{fill:#fff}
  .big.submit{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 3px 10px rgba(214,69,80,.35)}
  .big.submit svg{fill:#fff}
  .big.submit:hover{background:#B8323C;border-color:#B8323C;box-shadow:0 4px 14px rgba(214,69,80,.45)}
  .big:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

  .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
  select,input[type=text],input[type=password]{
        font-family:inherit;font-size:12.5px;font-weight:600;color:var(--txt);
        padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
  select:focus,input:focus{outline:none;border-color:var(--violet)}
  select:disabled,input:disabled{background:#F1F2F7;color:#B2B7C9;cursor:not-allowed}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .pill{padding:3px 10px;border-radius:99px;font-size:10px;font-weight:800;
        text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;display:inline-block}
  .pill.fl{background:#EFE8FB;color:var(--violet)}
  .pill.sv{background:#E7F4EC;color:var(--green)}
  .pill.no{background:#F1F2F7;color:var(--mut)}
  .pill.un{background:#EFE8FB;color:var(--violet)}
  .pill.dt{background:#F1F2F7;color:var(--mut)}

  /* ---- body ---- */
  .wrap{flex:1 1 auto;display:flex;flex-direction:column;padding:14px 18px 18px;min-height:0;
        width:100%;max-width:1400px;margin:0 auto}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:13px;flex:0 0 auto}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;
       position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(37,42,69,.05)}
  .kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
  .kpi.k2:before{background:var(--peach)} .kpi.k3:before{background:var(--red)}
  .kpi.k4:before{background:var(--blue)}  .kpi.k5:before{background:var(--green)}
  .kpi .k{font-size:8.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .kpi .v{font-size:23px;font-weight:800;margin-top:1px;line-height:1.05}
  .kpi .s{font-size:9.5px;color:var(--mut);margin-top:1px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        box-shadow:0 1px 2px rgba(37,42,69,.05);flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .card .hd{padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;
            font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;
            display:flex;align-items:center;gap:10px}
  .card .bd{padding:13px;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

  .scroll{flex:1 1 auto;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:9px}
  table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:12px}
  thead th{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;
           padding:9px;text-align:left;font-weight:700;font-size:10.5px;
           text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tbody td{padding:5px 9px;border-bottom:1px solid var(--line);vertical-align:middle;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  tbody tr:nth-child(even) td{background:#F6F7FB}
  tbody tr.has td{background:#FFF7F8}
  tbody tr.warn td{background:#FFF6E6}
  tbody tr.unav td{background:#F4EDFB}
  .mono{font-variant-numeric:tabular-nums}
  .sl{color:var(--mut);font-weight:700;text-align:right}
  .num{width:100%;text-align:right;font-weight:700}
  .rsn{width:100%}
  .mins{font-weight:800;color:var(--red)}
  .chk{width:17px;height:17px;accent-color:var(--violet);cursor:pointer}
  .whhint{font-size:9px;font-weight:700;opacity:.65}
  .whv{font-variant-numeric:tabular-nums;font-weight:700}
  .whna{color:var(--mut);opacity:.6}
  tr.over .mins{color:#B4400F;font-weight:800}
  tr.over{background:#FFF3E8}
  /* master tick that sits in the column heading */
  .allchk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .allchk input{width:15px;height:15px;accent-color:#fff;cursor:pointer;margin:0}
  .allchk input:disabled{cursor:not-allowed;opacity:.45}
  .ctr{text-align:center}

  .msg{padding:10px 13px;border-radius:8px;margin-bottom:11px;font-size:12px;font-weight:700;display:none;flex:0 0 auto}
  .msg.g{background:#E7F4EC;color:var(--green);display:block}
  .msg.r{background:#FBE9EB;color:var(--red);display:block}
  .msg.i{background:var(--cream);color:#8A5B12;display:block}

  .login{max-width:350px;margin:8vh auto}
  .login .bd{padding:20px;display:block}
  .login h3{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:14px}
  .login input{width:100%;margin-bottom:10px;padding:10px 12px;font-size:13px}
  .login .big{width:100%;justify-content:center}
  .hide{display:none !important}
  .loading{text-align:center;padding:44px;color:var(--mut);font-size:12px;white-space:normal}
</style>
</head>
<body>

<!-- ===== LOGIN, only if the page was opened without a live session ===== -->
<div id="loginBox" class="card login hide">
  <div class="bd">
    <h3>Floor Login</h3>
    <div class="msg" id="lmsg"></div>
    <input type="text" id="uid" placeholder="ID" autocomplete="off">
    <input type="password" id="pwd" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="big submit" onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hide" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0">

  <div class="strip">
    <button class="mini" onclick="goBack()" title="Back to the report">&larr; Report</button>
    <h2>Loss Time Entry</h2>
    <div class="sep"></div>

    <span id="floorWrap"><label>Floor</label>
      <select id="floorSel" onchange="switchFloor()"></select>
    </span>
    <span id="floorPill" class="pill fl hide">-</span>

    <div class="sep"></div>
    <label>Date</label>
    <span class="dpick">
      <span id="dlabel">&ndash;</span>
      <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 00-2 2v13a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 7v10H5V9h14z"/></svg>
      <input type="date" id="dt" onchange="loadDay()" onclick="openPicker(this)" aria-label="Entry date">
    </span>
    <button class="mini" onclick="goToday()">Today</button>
    <input type="text" id="q" placeholder="Search operator" oninput="render()" style="width:160px">

    <div class="acts">
      <span id="who" style="font-size:11px;color:var(--mut);font-weight:700"></span>
      <button class="big reload" id="reloadBtn" onclick="loadDay()">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 106 18.36l1.42-1.42A6 6 0 1112 18a5.94 5.94 0 01-4.24-1.76L6.34 17.66A8 8 0 1017.65 6.35zM13 3v6h6l-2.35-2.65z"/></svg>
        Reload
      </button>
      <button class="big submit" id="saveBtn" onclick="doSave()">
        <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4zm-5 16a3 3 0 110-6 3 3 0 010 6zm3-10H5V5h10v4z"/></svg>
        Submit
      </button>
    </div>
  </div>

  <div class="wrap">
    <div class="kpis">
      <div class="kpi"><div class="k">Operators</div><div class="v" id="k1">0</div><div class="s">active on this floor</div></div>
      <div class="kpi k2"><div class="k">With Loss</div><div class="v" id="k2">0</div><div class="s">operators affected</div></div>
      <div class="kpi k3"><div class="k">Total Loss</div><div class="v" id="k3">0</div><div class="s">minutes</div></div>
      <div class="kpi k4"><div class="k">Equivalent</div><div class="v" id="k4">0.0</div><div class="s">hours</div></div>
      <div class="kpi k5"><div class="k">Already Saved</div><div class="v" id="k5">0</div><div class="s">records in sheet</div></div>
    </div>

    <div class="card">
      <div class="hd"><span>Operator Loss Entry</span><span id="hdDate" class="pill dt"></span></div>
      <div class="bd">
        <div class="msg" id="smsg"></div>
        <div class="scroll">
          <table>
            <colgroup>
              <col style="width:46px"><col style="width:118px"><col style="width:190px">
              <col style="width:136px"><col style="width:74px"><col style="width:98px">
              <col style="width:82px"><col style="width:70px"><col style="width:82px">
              <col style="width:172px"><col style="width:140px">
            </colgroup>
            <thead><tr>
              <th class="sl">#</th>
              <th>Op ID</th>
              <th>Name</th>
              <th>Process</th>
              <th class="ctr">WH<span class="whhint" title="Working hour, read from the efficiency sheet for this date">&nbsp;hrs</span></th>
              <th class="ctr"><label class="allchk"
                  title="Tick to mark every operator shown below as unavailable. Untick to clear them.">
                  <input type="checkbox" id="allUnav" onchange="setAllUnav(this.checked)">
                  <span>Unavailable</span></label></th>
              <th>Loss</th>
              <th>Unit</th>
              <th>Minutes</th>
              <th>Reason</th>
              <th>Sheet Status</th>
            </tr></thead>
            <tbody id="tb"><tr><td colspan="11" class="loading">Loading&hellip;</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   Loss Time Entry

   The session is handed over by daily.html through sessionStorage, never
   through the URL. That keeps the address bar on the shell's own domain
   and keeps the token out of history, bookmarks and referrer headers.

   Reads are plain GET. The save is POST with Content-Type text/plain,
   which is what stops the browser firing a CORS preflight that Apps
   Script cannot answer.
   ------------------------------------------------------------------ */

var LOSS_API = "https://script.google.com/macros/s/AKfycbxsRF9KqFfg5zGntReKUCZxj_8lpVcT3GJwg5gmqTDQqGROzc-61uAeEavSprQMdYx2/exec";
var SESS_KEY = 'sosl_loss_sess';
var WARN_MIN = 600;          /* 10 hours. Warns, never blocks. */

/* The efficiency dashboard serves a snapshot that its own timer only rebuilds
   between 8 and 10:30 AM. Loss entered during the day therefore sat invisible
   until the next morning, even though the sheet formulas had already deducted
   it. Saving here now asks that API to rebuild immediately, so Input Min,
   Individual Eff% and Team Eff% all move together. Fire and forget: if it
   fails, the loss is still saved and the morning rebuild will catch it. */
var EFF_API = "https://script.google.com/macros/s/AKfycbxQ2BmHNHGuMpy244VH_Tl2CwlB9Yu6HZUfg28XvqR4TWPcQowPQSMQuaNR27-wuSSP/exec";

/* The date matters. A floor leader often enters loss for an earlier day, and
   syncing only "the latest date" would leave that day's Input Min and Eff%
   untouched in the efficiency sheet. */
function nudgeDashboard(dateStr, done){
  var q = EFF_API+'?action=snapshot&fresh=1'
        + (dateStr ? '&lossdate='+encodeURIComponent(dateStr) : '');
  fetch(q, {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null })
    .then(function(res){ if(done) done(res && res.loss ? res.loss : '') })
    .catch(function(){ if(done) done('could not reach the dashboard, it will catch up') });
}

var TOKEN=null, FLOOR='', FLOORS=[], CENTRAL=false, USER='';
var OPS=[], RSN=[], VAL={}, SAVED={}, TODAY='', VIEW=[];
/* Working hour per operator for the selected date, read from the efficiency
   sheet. Empty when that day's report has not been pushed yet, which is
   normal and must read as "not pushed yet", never as zero. */
var WH={};
function whOf(id){
  var v=WH[String(id).replace(/^0+/,'')];
  return (typeof v==='number' && v>0) ? v : null;
}
function whCell(id){
  var v=whOf(id);
  return v===null ? '<span class="whna" title="The efficiency report for this date has not been pushed yet">&ndash;</span>'
                  : '<span class="whv">'+v.toFixed(2)+'</span>';
}

function el(i){return document.getElementById(i)}
function say(id,t,c){var m=el(id); m.innerHTML=t||''; m.className = t ? ('msg '+c) : 'msg';}
function openPicker(i){ if(i.showPicker){ try{i.showPicker()}catch(e){} } }
function goBack(){ location.href='daily.html'; }

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pretty(iso){
  if(!iso) return '–';
  var p=String(iso).split('-'); if(p.length!==3) return iso;
  return Number(p[2])+' '+MON[Number(p[1])-1]+', '+p[0];
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function blank(){ return {min:'',unit:'Min',reason:'',unav:false}; }

function api(params){
  var q=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');
  return fetch(LOSS_API+'?'+q).then(function(r){return r.json()});
}
function apiPost(body){
  return fetch(LOSS_API,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)
  }).then(function(r){return r.json()});
}

/* ---------- start ---------- */

window.addEventListener('load',function(){
  var s=null;
  try{ s=JSON.parse(sessionStorage.getItem(SESS_KEY)||'null'); }catch(e){ s=null; }
  if(s && s.token){
    TOKEN=s.token; CENTRAL=!!s.central; FLOORS=s.floors||[]; USER=s.user||'';
    FLOOR=FLOORS[0]||''; TODAY=s.today||'';
    startApp();
  }else{
    el('loginBox').classList.remove('hide');
    el('uid').focus();
  }
});

function doLogin(){
  var id=el('uid').value.trim(), pw=el('pwd').value.trim();
  if(!id||!pw){ say('lmsg','Enter both ID and password.','r'); return; }
  say('lmsg','Checking…','i');
  api({action:'login',id:id,pw:pw}).then(function(r){
    if(!r.ok){ say('lmsg',r.msg||'Login failed.','r'); return; }
    TOKEN=r.token; CENTRAL=r.central; FLOORS=r.floors||[]; USER=r.user; TODAY=r.today;
    FLOOR=FLOORS[0]||'';
    if(!FLOOR){ say('lmsg','No floor is mapped to this login. Check the Users tab.','r'); return; }
    try{ sessionStorage.setItem(SESS_KEY,JSON.stringify({token:TOKEN,central:CENTRAL,floors:FLOORS,user:USER,today:TODAY})); }catch(e){}
    el('loginBox').classList.add('hide');
    startApp();
  }).catch(function(e){ say('lmsg','Cannot reach the API. '+e.message,'r'); });
}

function startApp(){
  el('app').classList.remove('hide');
  el('who').textContent = USER ? (USER+'  ·') : '';
  setupFloorControl();
  boot();
}

function setupFloorControl(){
  if(CENTRAL && FLOORS.length>1){
    el('floorSel').innerHTML=FLOORS.map(function(f){return '<option'+(f===FLOOR?' selected':'')+'>'+esc(f)+'</option>'}).join('');
    el('floorWrap').classList.remove('hide');
    el('floorPill').classList.add('hide');
  }else{
    el('floorWrap').classList.add('hide');
    el('floorPill').textContent='Floor '+FLOOR;
    el('floorPill').classList.remove('hide');
  }
}
function switchFloor(){ FLOOR=el('floorSel').value; boot(); }

/* ---------- load ---------- */

function boot(){
  el('tb').innerHTML='<tr><td colspan="11" class="loading">Loading…</td></tr>';
  api({action:'boot',token:TOKEN,floor:FLOOR}).then(function(r){
    if(!r.ok){ fail(r.msg); return; }
    OPS=r.operators; RSN=r.reasons; TODAY=r.today; CENTRAL=r.central; FLOORS=r.floors||FLOORS;
    /* boot sends the working hour on each operator; day sends a lookup map.
       Both are normalised into WH here so the rest of the page has one shape. */
    WH={}; OPS.forEach(function(o){
      if(typeof o.wh==='number' && o.wh>0) WH[String(o.id).replace(/^0+/,'')]=o.wh;
    });
    if(!el('dt').value) el('dt').value=TODAY;
    el('dlabel').textContent=pretty(el('dt').value);
    apply(r.day); render();
  }).catch(function(e){ fail(e.message) });
}

function loadDay(){
  var d=el('dt').value||TODAY;
  el('dlabel').textContent=pretty(d);
  say('smsg','','');
  el('tb').innerHTML='<tr><td colspan="11" class="loading">Loading…</td></tr>';
  api({action:'day',token:TOKEN,floor:FLOOR,date:d}).then(function(r){
    if(!r.ok){ fail(r.msg); return; }
    WH={};
    if(r.wh) for(var k in r.wh) if(r.wh.hasOwnProperty(k)) WH[String(k).replace(/^0+/,'')]=r.wh[k];
    apply(r.day); render();
  }).catch(function(e){ fail(e.message) });
}

function goToday(){
  api({action:'ping'}).then(function(r){ TODAY=r.today; el('dt').value=TODAY; loadDay(); });
}

function fail(m){
  el('tb').innerHTML='<tr><td colspan="11" class="loading">–</td></tr>';
  say('smsg',esc(m||'Something went wrong.'),'r');
  if(String(m||'').indexOf('Session expired')>=0){
    try{ sessionStorage.removeItem(SESS_KEY); }catch(e){}
    el('app').classList.add('hide');
    el('loginBox').classList.remove('hide');
    say('lmsg','Session expired. Please log in again.','r');
  }
}

/* ---------- state ---------- */

function apply(day){
  VAL={}; SAVED={};
  OPS.forEach(function(o){ VAL[o.id]=blank(); });
  (day.entries||[]).forEach(function(e){
    SAVED[e.opId]=e;
    if(!VAL[e.opId]) VAL[e.opId]=blank();
    VAL[e.opId].unav   = !!e.unav;
    VAL[e.opId].min    = e.unav ? '' : (e.min || '');
    VAL[e.opId].unit   = 'Min';
    VAL[e.opId].reason = e.reason;
  });
  el('hdDate').textContent = pretty(day.dateStr);
}

function toMin(v){
  if(!v || v.unav) return 0;
  var n=parseFloat(String(v.min).replace(/[^0-9.]/g,''));
  if(isNaN(n)||n<0) n=0;
  return Math.round(v.unit==='Hr' ? n*60 : n);
}

/* ---------- render ----------
   render() rebuilds the whole tbody and is called only on load, floor change
   and search. Typing must NEVER call it: rebuilding the row while the caret is
   in the box destroys the input and you lose focus after a single digit.
   Keystrokes go through setv() -> touch(), which edits only the derived cells. */

function render(){
  var q=(el('q').value||'').toLowerCase(), h='', sl=0;
  VIEW=[];
  OPS.forEach(function(o){
    if(q && (o.id+' '+o.name+' '+o.process).toLowerCase().indexOf(q)<0) return;
    VIEW.push(o.id); sl++;
    var v=VAL[o.id]||blank();
    var m=toMin(v);
    var s=SAVED[o.id];

    h+='<tr id="tr_'+o.id+'" class="'+rowCls(v,m,o.id)+'">'
     + '<td class="sl">'+sl+'</td>'
     + '<td class="mono">'+esc(o.id)+'</td>'
     + '<td title="'+esc(o.name)+'">'+esc(o.name)+'</td>'
     + '<td style="color:var(--mut)" title="'+esc(o.process)+'">'+esc(o.process)+'</td>'
     + '<td class="ctr">'+whCell(o.id)+'</td>'
     + '<td class="ctr"><input class="chk" type="checkbox" id="c_'+o.id+'" '+(v.unav?'checked':'')
     +   ' onchange="setv(\''+o.id+'\',\'unav\',this.checked)"></td>'
     + '<td><input class="num" type="text" inputmode="decimal" id="i_'+o.id+'" value="'+esc(v.min)+'"'
     +   (v.unav?' disabled':'')+' oninput="setv(\''+o.id+'\',\'min\',this.value)"></td>'
     + '<td><select id="u_'+o.id+'" '+(v.unav?'disabled':'')+' onchange="setv(\''+o.id+'\',\'unit\',this.value)">'
     +   '<option'+(v.unit==='Min'?' selected':'')+'>Min</option>'
     +   '<option'+(v.unit==='Hr'?' selected':'')+'>Hr</option></select></td>'
     + '<td class="mono mins" id="m_'+o.id+'">'+minsCell(v,m)+'</td>'
     + '<td><select class="rsn" onchange="setv(\''+o.id+'\',\'reason\',this.value)">'
     +   '<option value="">&ndash;</option>'
     +   RSN.map(function(r){return '<option'+(v.reason===r?' selected':'')+'>'+esc(r)+'</option>'}).join('')
     +   '</select></td>'
     + '<td>'+statCell(s)+'</td></tr>';
  });
  el('tb').innerHTML = h || '<tr><td colspan="11" class="loading">No operators match.</td></tr>';
  updateKpis();
  syncAllUnav();
}

/* One tick in the heading marks every operator currently listed. It follows
   the search box on purpose: filter to Manual Spreading and only those are
   affected, which is what a floor leader actually wants. VIEW already holds
   exactly the rows on screen, so nothing hidden is ever touched. */
var BULK = false;
function setAllUnav(on){
  BULK = true;
  VIEW.forEach(function(id){
    var cb = el('c_'+id);
    if(cb) cb.checked = on;
    setv(id, 'unav', on);
  });
  BULK = false;
  syncAllUnav();
}

/* The heading box reflects the rows under it: ticked when every one is
   unavailable, a dash when only some are, empty when none. */
function syncAllUnav(){
  var box = el('allUnav');
  if(!box) return;
  var n = VIEW.length, on = 0;
  VIEW.forEach(function(id){ if((VAL[id]||blank()).unav) on++; });
  box.checked = (n > 0 && on === n);
  box.indeterminate = (on > 0 && on < n);
  box.disabled = (n === 0);
}

/* Loss beyond the operator's own working hour is almost always a typo, most
   often minutes typed where hours were meant. It is flagged, not blocked: a
   genuine long stoppage does happen and a floor leader must still be able to
   record it. Same stance as the existing over-10-hours warning. */
function overWh(id,v,m){
  if(v.unav) return false;
  var w=whOf(id);
  return (w!==null && m>0 && m > w*60);
}
function rowCls(v,m,id){
  if(v.unav) return 'unav';
  if(overWh(id,v,m)) return 'over';
  return m>WARN_MIN ? 'warn' : (m>0 ? 'has' : '');
}
function minsCell(v,m){ return v.unav ? '<span class="pill un">PIB N/A</span>' : (m||''); }
/* Whether the row reached the sheet, nothing more. The minutes and the
   unavailable flag are already visible in their own columns on the same row,
   so repeating them here was noise. */
function statCell(s){
  return s ? '<span class="pill sv">Submitted</span>'
           : '<span class="pill no">Not submitted</span>';
}

/* ---------- edits, no rebuild ---------- */

function setv(id,k,v){
  if(!VAL[id]) VAL[id]=blank();
  VAL[id][k]=v;

  if(k==='unav'){
    /* Unavailable means the whole working day is out. No loss figure is
       taken, and the operator's individual PIB does not apply that day. */
    var inp=el('i_'+id), un=el('u_'+id);
    if(v){
      VAL[id].min='';
      if(inp){ inp.value=''; inp.disabled=true; }
      if(un) un.disabled=true;
    }else{
      if(inp) inp.disabled=false;
      if(un) un.disabled=false;
    }
  }
  touch(id);
  updateKpis();
  if(!BULK) syncAllUnav();     /* skipped mid bulk, done once at the end */
}

function touch(id){
  var v=VAL[id]||blank(), m=toMin(v);
  var mc=el('m_'+id); if(mc) mc.innerHTML=minsCell(v,m);
  var tr=el('tr_'+id); if(tr) tr.className=rowCls(v,m,id);
}

function updateKpis(){
  var tot=0, cnt=0, warn=[], over=[];
  OPS.forEach(function(o){
    var v=VAL[o.id]||blank(), m=toMin(v);
    if(m>0){ tot+=m; cnt++; }
    if(m>WARN_MIN) warn.push(esc(o.name)+' ('+m+' min)');
    if(overWh(o.id,v,m)) over.push(esc(o.name)+' '+m+' min vs '+whOf(o.id).toFixed(2)+' hr');
  });
  el('k1').textContent=OPS.length;
  el('k2').textContent=cnt;
  el('k3').textContent=tot;
  el('k4').textContent=(tot/60).toFixed(1);
  el('k5').textContent=Object.keys(SAVED).length;

  var m=el('smsg');
  /* The over-working-hour notice takes priority: it points at a specific
     operator whose figure cannot be right, which is more actionable than the
     blanket 10 hour rule. */
  if(over.length) say('smsg','Loss is longer than the working hour for '+over.join(', ')
                      +'. Check the Min / Hr unit. You can still submit.','i');
  else if(warn.length) say('smsg','Over 10 hours, please double check: '+warn.join(', ')+'. You can still submit.','i');
  else if(m.className.indexOf('i')>=0) say('smsg','','');
}

/* ---------- save ---------- */

function doSave(){
  var rows=[], bad=[];
  OPS.forEach(function(o){
    var v=VAL[o.id]||blank(), m=toMin(v);
    if(m<=0 && !v.unav) return;
    if(!v.reason){ bad.push(o.name); return; }
    rows.push({opId:o.id,min:m,reason:v.reason,unav:!!v.unav});
  });
  if(bad.length){ say('smsg','Reason missing for: '+esc(bad.join(', ')),'r'); return; }

  el('saveBtn').disabled=true; el('reloadBtn').disabled=true;
  say('smsg','Submitting…','i');
  apiPost({action:'save',token:TOKEN,floor:FLOOR,date:el('dt').value,rows:rows}).then(function(r){
    el('saveBtn').disabled=false; el('reloadBtn').disabled=false;
    if(!r.ok){ fail(r.msg); return; }
    if(r.day){ apply(r.day); render(); }
    say('smsg',esc(r.msg)+' Refreshing the efficiency dashboard\u2026','g');
    /* The rebuild also forces the loss-time IMPORTRANGE to re-fetch, which
       takes a few seconds, so the result is reported rather than assumed. */
    nudgeDashboard(el('dt').value, function(note){
      say('smsg', esc(r.msg)+' Efficiency dashboard updated'
          + (note ? ' ('+esc(note)+')' : '') + '.', 'g');
    });
  }).catch(function(e){
    el('saveBtn').disabled=false; el('reloadBtn').disabled=false;
    say('smsg','Submit failed. '+esc(e.message),'r');
  });
}
</script>
