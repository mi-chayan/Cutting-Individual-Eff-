<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Individual Eff% Report</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --card:#fff; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
    /* Efficiency bands: 90% is the practical ceiling, not 100%.
       red below 65, green 65 to 90, blue above 90. */
    --red:#D64550; --green:#1E8E4E; --blue:#1D6FD0; --stripH:40px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;-webkit-text-size-adjust:100%}

  /* ---- compact control strip ---- */
  .strip{background:#fff;border-bottom:1px solid var(--line);padding:7px 16px;
         display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .strip h2{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap}
  .strip .rsub{font-size:10px;color:var(--mut);white-space:nowrap}
  .sep{width:1px;height:22px;background:var(--line)}
  .strip label{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  /* A native date input always renders in the browser's own locale format
     (mm/dd/yyyy here) and that cannot be restyled. So the real input is laid
     transparently over a label we format ourselves, keeping the native
     calendar popup while showing "1 Aug, 2026". */
  .dpick{position:relative;display:inline-flex;align-items:center;gap:7px;
         border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;
         font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;cursor:pointer}
  .dpick:hover{border-color:var(--violet)}
  .dpick svg{width:13px;height:13px;fill:var(--violet);flex:0 0 auto}
  .dpick input[type=date]{position:absolute;inset:0;width:100%;height:100%;
         opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-family:inherit}
  .mini{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:7px;
        padding:5px 11px;font-family:inherit;font-weight:700;font-size:11.5px;cursor:pointer;
        display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .mini:hover{background:var(--cream);border-color:var(--peach)}
  .mini svg{width:12px;height:12px;fill:var(--violet)}
  .showing{font-size:11px;color:var(--mut);white-space:nowrap}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}

  /* Excel and Print are the two things people actually reach for, so they get
     real colour instead of disappearing into the neutral filter buttons.
     Tinted at rest, solid on hover, same shape as every other .mini. */
  .mini.xls{background:#E8F5EE;color:#14663A;border-color:#9FD5B8;font-weight:800}
  .mini.xls svg{fill:#1E8E4E}
  .mini.xls:hover{background:#1E8E4E;color:#fff;border-color:#1E8E4E}
  .mini.xls:hover svg{fill:#fff}
  .mini.prn{background:#EEF1FA;color:#2B3566;border-color:#B9C2E4;font-weight:800}
  .mini.prn svg{fill:#333D6D}
  .mini.prn:hover{background:#333D6D;color:#fff;border-color:#333D6D}
  .mini.prn:hover svg{fill:#fff}
  /* Loss Time sits left of Excel and Print. Red family, because it is a data
     entry action that writes to the sheet, not a read-only export. */
  .mini.loss{background:#FDECEE;color:#8E1B2A;border-color:#F0B4BD;font-weight:800}
  .mini.loss svg{fill:#D7263D}
  .mini.loss:hover{background:#D7263D;color:#fff;border-color:#D7263D}
  .mini.loss:hover svg{fill:#fff}

  /* ---- Loss Time login modal. Blurs the report behind it, then hands off
         to loss.html in a new tab. Nothing is rendered inside this modal
         except the login, so the report stays readable underneath. ---- */
  .lossovl{display:none;position:fixed;inset:0;z-index:9000;
           background:rgba(37,42,69,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .lossovl.on{display:flex;align-items:center;justify-content:center;padding:20px}
  .lossmodal{width:100%;max-width:352px;background:#fff;border:1px solid var(--line);
             border-radius:12px;box-shadow:0 18px 48px rgba(37,42,69,.28);overflow:hidden}
  .lossmodal .mh{display:flex;align-items:center;gap:10px;padding:11px 14px;
                 background:var(--navy);color:#fff}
  .lossmodal .mh b{font-size:12.5px;font-weight:800;letter-spacing:.3px}
  .lossmodal .mh .gap{flex:1}
  .lossmodal .mh button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:6px;
                        width:24px;height:24px;font-family:inherit;font-size:15px;line-height:1;
                        cursor:pointer;font-weight:700}
  .lossmodal .mh button:hover{background:var(--red)}
  .lossmodal .mb{padding:17px}
  .lossmodal .sub{font-size:10.5px;color:var(--mut);font-weight:700;margin-bottom:12px;line-height:1.5}
  .lossmodal input{width:100%;margin-bottom:9px;padding:10px 12px;font-family:inherit;font-size:13px;
                   font-weight:600;color:var(--txt);border:1px solid var(--line);border-radius:8px;background:#fff}
  .lossmodal input:focus{outline:none;border-color:var(--violet)}
  .lossmodal .go{width:100%;padding:11px;background:var(--red);color:#fff;border:0;border-radius:8px;
                 font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;
                 box-shadow:0 3px 10px rgba(214,69,80,.32)}
  .lossmodal .go:hover{background:#B8323C}
  .lossmodal .go:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
  .lossmsg{display:none;padding:9px 11px;border-radius:7px;font-size:11.5px;font-weight:700;margin-bottom:10px}
  .lossmsg.r{display:block;background:#FBE9EB;color:var(--red)}
  .lossmsg.i{display:block;background:var(--cream);color:#8A5B12}
  .lossmsg.g{display:block;background:#E7F4EC;color:var(--green)}
  .lossmsg a{color:inherit;font-weight:800}
  @media print{.lossovl{display:none !important}}

  .wrap{padding:13px 16px 26px;max-width:1560px;margin:0 auto}

  /* Floor Wise Report on the left, the 3 KPI cards stacked on the right - uses the width better */
  /* align-items:stretch (the default) so the card column and the floor table
     share one row height and their bottom edges line up */
  .toprow{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;margin-bottom:15px}
  .toprow #floorcard{margin-bottom:0}
  .kpis{display:flex;flex-direction:column;gap:9px;height:100%}
  /* Compact so three cards plus the donut finish level with the floor table */
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;position:relative;overflow:hidden;
       box-shadow:0 1px 2px rgba(37,42,69,.05)}
  .kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
  .kpi.k2:before{background:var(--peach)} .kpi.k3:before{background:var(--red)}
  .kpi .k{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;line-height:1.25}
  .kpi .v{font-size:22px;font-weight:800;margin-top:1px;line-height:1.05}
  .kpi .s{font-size:9.5px;color:var(--mut);margin-top:1px;line-height:1.3}
  .v.red{color:var(--red)} .v.green{color:var(--green)} .v.blue{color:var(--blue)}

  /* ---- efficiency band donut ---- */
  .chartcard{padding:9px 12px;display:flex;flex-direction:column}
  .chartcard:before{background:var(--blue)}
  .chartrow{display:flex;align-items:center;gap:10px;margin-top:6px}
  .donutwrap{position:relative;width:104px;height:104px;flex:0 0 auto}
  .donut{width:104px;height:104px;display:block}
  .donut circle{transition:stroke-dasharray .5s cubic-bezier(.22,.61,.36,1)}
  /* Dimming is driven from JS, not :hover, so the legend rows can trigger the
     exact same highlight as the slices themselves. */
  .donut circle.seg{cursor:pointer;transition:opacity .13s}
  .dcen{position:absolute;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;pointer-events:none;text-align:center;line-height:1.15}
  /* kept compact: the thicker ring leaves a smaller hole to write into */
  .dcen b{font-size:15px;font-weight:800;line-height:1}
  .dcen span{font-size:7.5px;font-weight:700;color:var(--mut);margin-top:1px;white-space:nowrap}
  .dcen span.pc{font-size:9px;color:var(--txt);margin-top:0}
  .legend{display:flex;flex-direction:column;gap:7px;flex:1 1 auto;min-width:0}
  .lgrow{display:flex;align-items:center;gap:7px;font-size:11px;cursor:pointer;
         padding:2px 5px;margin:-2px -5px;border-radius:6px;transition:background .12s}
  .lgrow:hover{background:#F2F4FA}
  .lgrow .dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .lgrow .lgl{color:var(--txt);font-weight:700;white-space:nowrap}

  /* overflow:clip, not hidden. Both clip the rounded corners identically, but
     'hidden' creates a scroll container which breaks position:sticky headers. */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:15px;overflow:clip;
        box-shadow:0 1px 2px rgba(37,42,69,.05);transition:box-shadow .15s}
  .card .hd{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(90deg,var(--cream),#fff)}
  .card .hd h3{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.2px}

  /* Floor Wise Report: raised "pop" card, visually distinct from Individual Report below it */
  #floorcard{border:1px solid var(--peach);border-radius:14px;
        box-shadow:0 10px 26px -8px rgba(51,61,109,.30),0 2px 8px rgba(114,62,195,.10);
        background:linear-gradient(180deg,#fff 0%,var(--cream) 260%)}
  #floorcard .hd{background:linear-gradient(90deg,var(--navy),#4A56A0)}
  #floorcard .hd h3{color:#fff}
  #floorcard .hd h3:before{content:'\25A0';color:var(--peach);margin-right:6px;font-size:9px;vertical-align:1px}
  #floorcard th{background:#404B8C}
  #floorcard th:hover{background:#4A56A0}
  /* Sits on the navy Floor Wise header bar, so muted grey was unreadable.
     Peach on translucent white reads clearly against that background. */
  .hint{font-size:10px;font-weight:700;color:var(--peach);letter-spacing:.2px;
        background:rgba(255,255,255,.13);border:1px solid rgba(255,207,149,.5);
        border-radius:20px;padding:3px 10px;white-space:nowrap}
  /* Individual card header is cream, not navy, so peach would disappear there */
  #indcard .hint{color:var(--violet);background:#F3EEFC;border-color:#D6C8F0}
  .fsel{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-family:inherit;font-size:11px;background:#fff;color:var(--txt);font-weight:700;max-width:100%}
  .search{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-family:inherit;font-size:11.5px;width:200px}
  .push{margin-left:auto}

  /* overflow stays visible at every width. A scrolling wrapper would become the
     anchor for the sticky headers below and stop them pinning to the screen, so
     instead the two tables are made to fit narrow screens (see phone rules). */
  .scroll{overflow:visible}
  table{width:100%;border-collapse:collapse;min-width:700px}
  th{background:var(--navy);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:8px 9px;text-align:center;cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{background:#3D4880}
  th .arr{font-size:8px;opacity:.85;margin-left:2px}

  /* Sticky headers, all screen sizes including mobile.
     Two layers stack: the card title bar (.hd) sits directly under the control
     strip, and the table's column header row sits directly under that. Both
     stick only while their own card is on screen, then scroll away with it.
     Detail drill-down table is deliberately excluded. */
  /* Desktop: all four cards share the leftover height rather than one card
     growing and holding a big empty middle. The chart takes a larger share
     because the donut needs the room. */
  @media(min-width:901px){
    .toprow .kpis>.kpi{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
    .toprow .kpis>.chartcard{flex:1.7 1 auto}
  }

  #floorcard>.hd,#indcard>.hd{position:sticky;top:var(--stripH);z-index:16}
  /* Direct child combinator (>) between table and thead is the important
     part: #indtable's tbody holds the drill-down's own <table class="dettable">,
     which also has its own thead>th. A plain descendant selector would catch
     that nested header too and stick it right under the real one. This only
     matches a thead that is a direct child of #flrtable/#indtable itself. */
  #flrtable>thead th{position:sticky;top:calc(var(--stripH) + var(--flrHdH,0px));z-index:15}
  #indtable>thead th{position:sticky;top:calc(var(--stripH) + var(--indHdH,0px));z-index:15}
  /* border-collapse drops cell borders when sticky, so redraw them */
  #flrtable>thead th,#indtable>thead th{box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}

  /* Third layer: the drill-down's own header, once an operator row is expanded.
     Sits directly under the Individual Report column header, so it stays fixed
     only while that operator's cut list is scrolling by.

     .detscroll must stay overflow:visible for this to work. A scroll container
     ancestor makes the browser measure --detTop from that box instead of the
     page, and because sticky also pushes an element DOWN when it sits above the
     threshold, the header got parked ~99px into the cut list permanently.
     Its overflow is therefore declared in a max-width rule further down rather
     than as a base rule, since a later same-specificity declaration would
     otherwise override this block regardless of the media query.
     Gated at 1200px because the table is 1080px wide and below that the card is
     too narrow, so .detscroll has to stay a real horizontal scroller. */
  @media(min-width:1200px){
    /* border-collapse:separate avoids Chrome's sticky-offset miscalculation on
       collapsed-border tables. Visually identical, the cells draw their own
       bottom border already. */
    table.dettable{border-collapse:separate;border-spacing:0}
    table.dettable>thead th{position:sticky;top:var(--detTop,0px);
      z-index:14;box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}
  }
  td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  td.l{text-align:left}
  /* a real loss should catch the eye without shouting */
  td.lossy{color:#C77700;font-weight:800}
  td.nolss{color:#C3C8DA}
  /* a small dot means there is a reason behind the figure, hover to read it */
  td.lossy.hasr{cursor:help;position:relative}
  td.lossy.hasr .rdot{display:inline-block;width:4px;height:4px;border-radius:50%;
        background:#C77700;vertical-align:5px;margin-left:4px;opacity:.75}
  td.lossy.hasr:hover{background:#FFF3E8}
  tbody tr:nth-child(even){background:#FAFBFE}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--cream)}
  tr.clickable{cursor:pointer}
  tr.active-floor{background:#EFE7FB !important;box-shadow:inset 3px 0 0 var(--violet)}
  tr.totalrow{background:var(--navy) !important;color:#fff;font-weight:800}
  tr.totalrow td{border-bottom:0}
  tr.totalrow .pct{color:#fff !important}

  .pct{font-weight:800}
  .pct.red{color:var(--red)} .pct.green{color:var(--green)} .pct.blue{color:var(--blue)}
  .idshort{display:none}
  .lblp{display:none}   /* short header label, print only */

  /* ---- operator drill-down ---- */
  tr.oprow{cursor:pointer}
  /* The opened row is now the detail block's heading, so it carries the weight
     and closes the top of the bordered group. */
  tr.oprow.open{background:#EFE7FB !important;font-weight:800;color:#3A2470}
  tr.oprow.open>td{border-top:2px solid var(--violet);border-bottom:0}
  tr.oprow.open>td:first-child{border-left:2px solid var(--violet)}
  tr.oprow.open>td:last-child{border-right:2px solid var(--violet)}
  .caret{display:inline-block;width:0;height:0;border-left:4px solid var(--mut);
         border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
         margin-right:5px;transition:transform .15s;vertical-align:middle}
  tr.oprow.open .caret{transform:rotate(90deg);border-left-color:var(--violet)}
  /* Violet-tinted throughout so the nested cut-by-cut table never reads as
     part of the white parent table above it. */
  tr.detrow>td{padding:0;background:#EFE9FA;
               border:2px solid var(--violet);border-top:0}
  .detbox{padding:11px 13px}
  /* No overflow here on purpose, so it stays 'visible' and the sticky header
     below can anchor to the page. Horizontal scrolling is added back only on
     narrow screens, in the max-width rule further down. */
  .detscroll{border:1px solid #D6C8F0;border-radius:8px;background:#FBF9FE}
  @media(max-width:1199px){
    .detscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  }
  table.dettable{min-width:1080px;margin:0}
  table.dettable td:first-child{color:#8A7CB0;font-weight:700}
  /* violet header, against the parent table's navy, so the two never blur together */
  /* wrap onto two lines so the extra MP column does not widen the table */
  table.dettable th{background:#6A46B5;font-size:8.5px;padding:6px 6px;cursor:default;
                    white-space:normal;line-height:1.2}
  table.dettable th:hover{background:#6A46B5}
  table.dettable td{padding:5px 7px;font-size:11px;border-bottom:1px solid #E7DFF7}
  table.dettable tbody tr{background:#FBF9FE}
  table.dettable tbody tr:nth-child(even){background:#F4EFFC}
  table.dettable tbody tr:hover{background:#E8DEFA}
  .detloading{padding:20px;text-align:center;color:#6B5B92;font-size:11.5px;font-weight:700}

  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:800;cursor:pointer;color:var(--mut)}
  .chip:hover{border-color:var(--violet);color:var(--violet)}
  .chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
  /* Factory chips read as a separate tier from the floor chips beside them */
  .chip.fact{color:var(--navy);border-color:#C3C9E4;background:#F1F3FA;letter-spacing:.3px}
  .chip.fact:hover{border-color:var(--navy);color:var(--navy);background:#E7EAF6}
  .chip.fact.on{background:var(--navy);border-color:var(--navy);color:#fff}

  .foot{font-size:10px;color:var(--mut);padding:8px 13px;background:#FAFBFE}
  .loading{padding:60px;text-align:center;color:var(--mut);font-weight:700}
  .spin{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp .9s linear infinite;margin-bottom:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{padding:40px;text-align:center;color:var(--mut);line-height:1.7}

  /* ---- print-only header ---- */
  .printhead{display:none}

  /* ---------------- Tablet ---------------- */
  @media(max-width:900px){
    .strip{padding:6px 11px;gap:9px}
    .strip h2{font-size:11.5px}
    .strip .rsub,.sep{display:none}
    .wrap{padding:11px 11px 22px}
    .search{width:170px}
    .toprow{grid-template-columns:1fr;gap:11px}
    .toprow #floorcard{margin-bottom:0}
    .kpis{flex-direction:row;flex-wrap:wrap;height:auto}
    .kpis .kpi{flex:1 1 180px}
    .toprow .chartcard{flex:1 1 260px}

    /* Both tables must fit the screen from here down, otherwise they would need
       a scrolling wrapper and the sticky headers above would stop pinning.
       Input Min and Output Min drop out, and text wraps instead of forcing
       width. Both columns still appear in the Excel export and the PDF. */
    .hp{display:none}
    #flrtable,#indtable{min-width:0}
    #flrtable th,#indtable th{white-space:normal;line-height:1.2}
    #indtable td.l{white-space:normal}
  }

  /* ---------------- Phone ---------------- */
  @media(max-width:560px){
    /* Strip is sticky, so every extra wrapped row costs permanent screen
       height. Left-aligned and compact keeps it to two rows at most. */
    .strip{padding:6px 9px;gap:6px 8px;justify-content:flex-start}
    .strip h2{font-size:11px}
    .strip label{display:none}
    /* size the visible wrapper, not the transparent input inside it */
    .dpick{font-size:11.5px;padding:6px 8px;gap:5px;flex:0 1 auto;min-width:0}
    .mini{padding:7px 11px;font-size:11px}      /* ~34px tall, thumb friendly */
    .showing{font-size:10px;order:5;width:100%}
    .acts{margin-left:auto}
    .wrap{padding:10px 9px 20px}

    .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .kpi{padding:9px 11px}
    .kpi:first-child{grid-column:span 2}
    .chartcard{grid-column:span 2}
    .kpi .v{font-size:21px}
    .kpi .k{font-size:9.5px}
    .kpi .s{font-size:9px}

    .card .hd{padding:8px 10px;gap:6px}
    .card .hd h3{font-size:11px;width:100%}
    .hint{display:none}
    .push{display:none}                          /* no room to push things apart */
    .fsel{font-size:11px;padding:7px 8px;flex:1 1 100%;min-width:0}
    .search{width:100%;padding:7px 9px;font-size:12px}

    /* Floor chips: one swipeable row instead of 12 chips wrapping into four
       rows and burying the table below the fold. */
    .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
           scrollbar-width:none;width:100%;padding-bottom:2px}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:6px 12px;font-size:11px}

    th{font-size:8.5px;padding:7px 6px}
    td{padding:7px 6px;font-size:11.5px}
    .hs{display:none}          /* hide lower-priority columns on phone */


    .detbox{padding:8px 9px}
    .foot{font-size:9px;padding:7px 10px}
  }

  /* ---------------- Small phone ---------------- */
  @media(max-width:400px){
    .strip h2{font-size:10.5px}
    .mini{padding:7px 9px;font-size:10.5px}
    .kpi .v{font-size:19px}
    .card .hd h3{font-size:10.5px}
  }

  /* ---------------- Print: A4 portrait ---------------- */
  @page{ size:A4 portrait; margin:11mm 9mm; }
  @media print{

  .printfoot{display:none}


  /* ================= the loading island =================
     Two pieces that work together.

     1. A REAL progress bar across the very top. It used to be a block sliding
        left to right for ever, which says "something is happening" and
        nothing else. Left is 0, right is 100, and it only ever moves
        forwards.

        Most of these fetches are ONE request, so there is no honest fraction
        to report until it lands. Rather than lie with a fake percentage, it
        eases toward 90 and waits there: fast at first, slower the longer it
        takes, which is the same trick GitHub uses and it reads as real
        because it never goes backwards and never completes early. Where a
        genuine fraction IS known, the weekly report fetching six days in
        chunks, barSet() overrides the easing with the true number.

     2. An island under the header saying WHAT is loading. Detached from the
        title bar, dark, rounded, with a progress ring on the left. It springs
        in, morphs when the text changes, and springs out.
     ---------------------------------------------------------------- */
  #bar{position:fixed;top:0;left:0;height:3px;width:100%;z-index:400;
       pointer-events:none;opacity:0;transition:opacity .3s ease}
  #bar.on{opacity:1}
  #bar i{display:block;height:100%;width:0;border-radius:0 3px 3px 0;
         background:linear-gradient(90deg,#5B33A8,#723EC3 55%,#B07CFF);
         box-shadow:0 0 10px rgba(176,124,255,.7);
         transition:width .34s cubic-bezier(.22,.61,.36,1)}
  /* A highlight travelling along the filled part, so a long wait still looks
     alive even while the number is barely moving. */
  #bar i:after{content:'';position:absolute;top:0;right:0;width:90px;height:100%;
       background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55));
       animation:barsheen 1.1s ease-in-out infinite}
  #bar i{position:relative;overflow:hidden}
  @keyframes barsheen{0%{opacity:.15}50%{opacity:.8}100%{opacity:.15}}

  .island{position:fixed;top:12px;left:50%;z-index:401;
          display:inline-flex;align-items:center;gap:11px;
          background:rgba(12,12,18,.94);color:#fff;
          -webkit-backdrop-filter:blur(14px) saturate(160%);
          backdrop-filter:blur(14px) saturate(160%);
          border-radius:999px;padding:9px 18px 9px 13px;
          font-size:12px;font-weight:700;letter-spacing:.1px;white-space:nowrap;
          max-width:min(560px,90vw);overflow:hidden;
          box-shadow:0 10px 30px rgba(0,0,0,.34), inset 0 0 0 .5px rgba(255,255,255,.14);
          pointer-events:none;
          transform:translateX(-50%) translateY(-26px) scale(.80);
          opacity:0;
          transition:transform .46s cubic-bezier(.34,1.56,.64,1),
                     opacity .2s ease}
  .island.on{transform:translateX(-50%) translateY(0) scale(1);opacity:1}

  /* The progress ring. One CSS variable drives it, set from the same number
     that drives the bar, so the two can never disagree. */
  .island .ring{width:17px;height:17px;border-radius:50%;flex:0 0 auto;position:relative;
       background:conic-gradient(#B07CFF calc(var(--p,0) * 1%), rgba(255,255,255,.16) 0);
       transition:background .34s linear}
  .island .ring:after{content:'';position:absolute;inset:3.5px;border-radius:50%;
       background:#0C0C12}
  .island .ring:before{content:'';position:absolute;inset:-3px;border-radius:50%;
       border:1px solid rgba(176,124,255,.35);animation:islepulse 1.6s ease-in-out infinite}
  @keyframes islepulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.12)}}

  /* The label morphs rather than cutting, so switching from one report to
     another feels like the same object changing its mind. */
  .island .txt{display:inline-block;overflow:hidden;text-overflow:ellipsis;
       transition:opacity .16s ease}
  .island.swap .txt{opacity:0}
  .island .pct{font-variant-numeric:tabular-nums;opacity:.55;font-weight:800;
       font-size:10.5px;min-width:30px;text-align:right}

  @media (prefers-reduced-motion: reduce){
    .island{transition:opacity .2s ease}
    .island .ring:before{animation:none}
    #bar i:after{animation:none}
  }
  /* The old spinner is kept out of the way rather than deleted, so any
     markup that still asks for one simply shows nothing. */
  .spin{display:none !important}
  /* Said out loud when the date asked for is not in the sheet yet. Falling
     back silently is how "I pushed this morning" turns into an argument. */
  .dnote{display:none;margin:0 auto;max-width:1500px;padding:8px 14px;
         background:#FFF0D9;color:#8A5B12;border:1px solid #F2DDB6;border-radius:9px;
         font-size:11.5px;font-weight:700}
  .dnote.on{display:block;margin:10px auto 0}
</style>
</head>

<script>

/* ==================================================================
   SNOWTEX dashboard kit
   Shared by daily, range, fabric and weekly. Keep the four copies the
   same: they are inlined rather than imported because every page is a
   single self contained file served from Cloudflare Pages.

   1. THE THIN BAR. Counted, not toggled. Two requests can overlap and a
      naive hide on the first response would switch it off while the
      second is still running.

   2. THE SELECTED DATE IS SHARED. Every report used to remember its own
      date, so moving from the Daily report to Fabric Compliance silently
      changed the day under you. One value in sessionStorage, written by
      whichever page the user last touched, read by all of them.

   3. FIRST OPEN LANDS ON YESTERDAY. Not on "the latest day the sheet
      happens to hold", which is a different date depending on whether
      this morning's report has been pulled yet.
   ================================================================== */

/* ---------- the bar and the island ----------
   Counted, not toggled: two requests can overlap and a naive hide on the
   first response would switch it off while the second is still running.

   PROGRESS. A single fetch gives no honest fraction, so the number eases
   toward 90 and waits, fast at first and slower the longer it takes. It never
   goes backwards and never reaches 100 until the work is actually done, which
   is what keeps it honest. Where a real fraction is known, call barSet(). */
var BUSY_N = 0, BUSY_LABELS = [], BAR_P = 0, BAR_T = null, BAR_HIDE = null;

function barPaint(){
  var b=document.getElementById('bar'), i=b?b.firstChild:null;
  if(i) i.style.width = BAR_P + '%';
  var r=document.getElementById('isleRing');
  if(r) r.style.setProperty('--p', Math.round(BAR_P));
  var p=document.getElementById('islePct');
  if(p) p.textContent = BAR_P>=100 ? '100%' : Math.round(BAR_P)+'%';
}

/* Ease toward 90 and stop. The step shrinks as it climbs, so a slow request
   crawls rather than stalling dead or pretending to finish. */
function barTick(){
  if(BAR_P < 90) BAR_P += Math.max(0.4, (90 - BAR_P) * 0.10);
  barPaint();
}

/** A real fraction, 0 to 1. Only ever moves the bar forwards. */
function barSet(frac){
  var v = Math.max(0, Math.min(1, Number(frac)||0)) * 100;
  if(v > BAR_P) { BAR_P = v; barPaint(); }
}

function islandShow(label){
  var isle=document.getElementById('island'), t=document.getElementById('isleTxt');
  if(!isle||!t) return;
  if(t.textContent && t.textContent !== label){
    /* Morph rather than cut: fade the old label out, swap, fade in. */
    isle.classList.add('swap');
    setTimeout(function(){ t.textContent=label; isle.classList.remove('swap'); },160);
  }else{
    t.textContent=label;
  }
  isle.classList.add('on');
}
function islandHide(){
  var isle=document.getElementById('island');
  if(isle) isle.classList.remove('on');
}

function barBusy(on, label){
  if(on){
    BUSY_N++;
    if(label) BUSY_LABELS.push(label);
    if(BUSY_N === 1){
      if(BAR_HIDE){ clearTimeout(BAR_HIDE); BAR_HIDE=null; }
      BAR_P = 8; barPaint();
      var b=document.getElementById('bar'); if(b) b.className='on';
      if(BAR_T) clearInterval(BAR_T);
      BAR_T = setInterval(barTick, 280);
    }
  }else{
    BUSY_N = Math.max(0, BUSY_N - 1);
    if(label){
      var i = BUSY_LABELS.indexOf(label);
      if(i >= 0) BUSY_LABELS.splice(i, 1);
    }
    if(!BUSY_N){
      BUSY_LABELS = [];
      if(BAR_T){ clearInterval(BAR_T); BAR_T=null; }
      BAR_P = 100; barPaint();
      islandHide();
      /* Let 100% be seen before it disappears, or the bar looks like it
         vanished at 80 and the work was abandoned. */
      BAR_HIDE = setTimeout(function(){
        var b=document.getElementById('bar'); if(b) b.className='';
        setTimeout(function(){ BAR_P=0; barPaint(); }, 320);
      }, 360);
      return;
    }
  }
  var txt = BUSY_LABELS.length ? BUSY_LABELS[BUSY_LABELS.length - 1] : '';
  if(txt) islandShow(txt); else islandHide();
}

/* Wrap any promise so the bar follows it, whatever the outcome. */
function track(p, label){
  barBusy(true, label);
  return p.then(function(v){ barBusy(false, label); return v; },
                function(e){ barBusy(false, label); throw e; });
}

var SD_DAY='sosl_dash_day', SD_FROM='sosl_dash_from', SD_TO='sosl_dash_to';
function ssRead(k){ try{ return sessionStorage.getItem(k)||''; }catch(e){ return ''; } }
function ssWrite(k,v){ try{ sessionStorage.setItem(k, v||''); }catch(e){} }

function isoOf(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function yesterdayISO(){
  var d=new Date(); d.setDate(d.getDate()-1); return isoOf(d);
}

/* The day this page should open on: whatever the user last looked at
   anywhere in the dashboard, otherwise yesterday. */
function wantedDay(){ return ssRead(SD_DAY) || yesterdayISO(); }
function shareDay(d){ if(d) ssWrite(SD_DAY, d); }

function wantedFrom(){ return ssRead(SD_FROM) || wantedDay(); }
function wantedTo(){   return ssRead(SD_TO)   || wantedDay(); }
function shareRange(a,b){ if(a) ssWrite(SD_FROM,a); if(b) ssWrite(SD_TO,b); }

var API_URL = "https://script.google.com/macros/s/AKfycbxQ2BmHNHGuMpy244VH_Tl2CwlB9Yu6HZUfg28XvqR4TWPcQowPQSMQuaNR27-wuSSP/exec";
var SNAP_KEY='sosl_snapshot_v1', DAYPFX='sosl_day_';

/* ---------- Loss Time entry ----------
   The button opens a login modal over a blurred report. Credentials go
   straight to the SOSL Cutting PIB Apps Script API and are checked against
   the Users tab, so nothing sensitive lives in this file. On success the
   entry sheet opens in a new tab, carrying the session token.

   loss.html is served from this same site, so the domain never changes. */
var LOSS_API  = "https://script.google.com/macros/s/AKfycbxsRF9KqFfg5zGntReKUCZxj_8lpVcT3GJwg5gmqTDQqGROzc-61uAeEavSprQMdYx2/exec";
var LOSS_PAGE = "loss.html";

/* Loss REASONS are read from the PIB sheet, not from the efficiency sheet.
   Duplicating them into a column there would have cost roughly 900,000 cells
   a year, and that sheet is already the constrained one. Keyed "floor|idKey"
   with leading zeros stripped, because a numeric id loses its leading zero in
   the efficiency sheet while an alphanumeric one keeps it. */
var LOSSR = {}, LOSSR_DAY = '';
function lossKey(floor,opId){ return floor+'|'+String(opId).replace(/^0+/,''); }
function reasonFor(floor,opId){
  var e=LOSSR[lossKey(floor,opId)];
  return e ? String(e.reason||'') : '';
}

/* Fetched once per date, quietly, after the table is already on screen. A
   failure here must never affect the report: the numbers still show, only the
   hover text is missing. */
function loadReasons(d){
  if(!d || d===LOSSR_DAY) return;
  fetch(LOSS_API+'?action=reasons&date='+encodeURIComponent(d))
    .then(function(r){ return r.ok ? r.json() : null })
    .then(function(res){
      if(!res || !res.ok || !res.map) return;
      LOSSR = res.map; LOSSR_DAY = d;
      paintReasons();
    })
    .catch(function(){});
}

/* Reasons arrive after render, so the tooltips are attached in place rather
   than forcing a full re-render. */
function paintReasons(){
  var cells=document.querySelectorAll('td.lossy[data-lk]');
  for(var i=0;i<cells.length;i++){
    var td=cells[i];
    var e=LOSSR[td.getAttribute('data-lk')];
    var rsn = e ? String(e.reason||'').trim() : '';

    if(!rsn){
      /* no reason recorded: make sure no stale marker is left behind */
      td.removeAttribute('title');
      td.classList.remove('hasr');
      var old=td.querySelector('.rdot'); if(old) old.parentNode.removeChild(old);
      continue;
    }
    td.setAttribute('title', (td.getAttribute('data-nm')||'') + ' \u2014 ' + rsn);
    td.classList.add('hasr');
    if(!td.querySelector('.rdot')){
      var dot=document.createElement('span'); dot.className='rdot'; td.appendChild(dot);
    }
  }
}

function lsay(t,c){ var m=document.getElementById('lossmsg'); m.innerHTML=t||''; m.className = t?('lossmsg '+c):'lossmsg'; }

function openLoss(){
  document.getElementById('lossovl').classList.add('on');
  lsay('','');
  document.getElementById('losspw').value='';
  setTimeout(function(){ document.getElementById('lossid').focus(); },60);
}
function closeLoss(){ document.getElementById('lossovl').classList.remove('on'); }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeLoss(); });

function lossLogin(){
  var id=document.getElementById('lossid').value.trim();
  var pw=document.getElementById('losspw').value.trim();
  if(!id||!pw){ lsay('Enter both ID and password.','r'); return; }
  var btn=document.getElementById('lossgo');
  btn.disabled=true; lsay('Checking&hellip;','i');

  fetch(LOSS_API+'?action=login&id='+encodeURIComponent(id)+'&pw='+encodeURIComponent(pw))
    .then(function(r){return r.json()})
    .then(function(r){
      btn.disabled=false;
      if(!r.ok){ lsay(r.msg||'Login failed.','r'); return; }

      /* Hand the session over through sessionStorage, never through the URL.
         The address bar keeps showing the shell's own domain, and the token
         stays out of history, bookmarks and referrer headers. Navigating this
         iframe does not change the parent URL. */
      try{
        sessionStorage.setItem('sosl_loss_sess', JSON.stringify({
          token: r.token, central: !!r.central, floors: r.floors||[],
          user: r.user||'', today: r.today||''
        }));
      }catch(e){
        lsay('This browser is blocking storage, so the session cannot be passed. Allow site data and try again.','r');
        return;
      }
      lsay('Opening&hellip;','g');
      location.href = LOSS_PAGE;
    })
    .catch(function(e){ btn.disabled=false; lsay('Cannot reach the API. '+e.message,'r'); });
}

var DATA=[], DATES=[], LATEST='', DAY='', STAMP='';
var floorFilter='', sortKey='eff', sortDir=1, query='';
var fSortKey='floor', fSortDir=1;                 /* Floor Wise Report sorting */
var effFloorFilter='all', effIndFilter='all';
var DETAIL={};        /* key: date_floor  ->  array of cut rows */
var DETLOADING={};    /* key: date_floor  ->  true while a background fetch runs */
var expandKey='';     /* floor|opId of the currently open operator */
var FLOOR_ORDER=['1A','1B','1C','1D','1E','3A','2A','2B','2C','2D','2E'];
/* Building filter: '' = both factories, otherwise 'SOL' or 'SSL' */
var FACTORY={SOL:['1A','1B','1C','1D','1E','3A'],SSL:['2A','2B','2C','2D','2E']};
var factFilter='';
/* Floors in scope right now: the selected factory's floors, or all of them */
function scopeFloors(){ return factFilter ? FACTORY[factFilter] : FLOOR_ORDER; }
function inScope(f){ return !factFilter || FACTORY[factFilter].indexOf(f)>-1; }

function fmt(n,d){return (n==null||isNaN(n))?'-':n.toFixed(d==null?0:d)}
/* Bands: red below 65, green 65 to 90, blue above 90. */
function pctClass(p){return p<65?'red':(p<=90?'green':'blue')}
function padId(id){id=String(id||'').trim();return id.charAt(0)==='0'?id:'0'+id}
function shortId(id){return padId(id).slice(-5)}
/* Sort floors in factory order (SOL 1A-1E, 3A, then SSL 2A-2E), not alphabetically */
function floorRank(f){var i=FLOOR_ORDER.indexOf(f);return i<0?999:i}
/* House date format, used everywhere on screen, in print and in exports:
   "1 Aug, 2026" */
function prettyDate(s){
  if(!s)return '';
  var p=s.split('-'),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+', '+p[0];
}
/* Same format for a Date object, plus the clock, for "Generated" stamps */
function prettyStamp(d){
  d=d||new Date();
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var hh=d.getHours(), ap=hh>=12?'PM':'AM';
  hh=hh%12; if(!hh) hh=12;
  var mm=('0'+d.getMinutes()).slice(-2);
  return d.getDate()+' '+m[d.getMonth()]+', '+d.getFullYear()+', '+hh+':'+mm+' '+ap;
}
function effPass(v,mode){
  if(mode==='lt65')return v<65;
  if(mode==='65to90')return v>=65&&v<=90;
  if(mode==='gt90')return v>90;
  return true;
}
function effLabel(mode){
  return mode==='lt65'?'Below 65%':mode==='65to90'?'65% to 90%':mode==='gt90'?'Above 90%':'All';
}
function mapRows(arr){
  return (arr||[]).map(function(r){
    /* lossMin (column AG) arrives as an 11th field. An API that has not been
       redeployed yet sends 10, so it defaults to 0 rather than undefined and
       the column shows a dash instead of breaking the row. */
    return {floor:r[0],opId:r[1],name:r[2],desig:r[3],wh:r[4],eng:r[5],types:r[6],
            inMin:r[7],outMin:r[8],effPct:r[9],
            lossMin:(typeof r[10]==='number'&&!isNaN(r[10]))?r[10]:0};
  });
}
function cacheGet(k){ try{var v=sessionStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null} }
function cacheSet(k,o){ try{sessionStorage.setItem(k,JSON.stringify(o))}catch(e){} }
function tellParent(s){ if(window.parent!==window) window.parent.postMessage({type:'stamp',value:s},'*'); }

/* ---------- boot: cache first, network only if empty ---------- */
function boot(){
  /* The date box is filled BEFORE anything is fetched. It used to stay empty
     until the snapshot came back, so the first thing anyone saw was a blank
     date and the word Loading, with no way to tell WHICH day was on its way
     or to change their mind while waiting. */
  var want = wantedDay();
  document.getElementById('d1').value = want;
  syncDateLabel();
  document.getElementById('content').innerHTML =
    '<div class="loading">Loading '+prettyDate(want)+'&hellip;</div>';

  var snap=cacheGet(SNAP_KEY);
  if(snap) applySnapshot(snap);          /* paint instantly, may be stale */

  /* Always re-check the server, even when the cache painted. If the sheet has
     a newer day than the cache, the page moves to it on its own. This is what
     fixes "I pushed this morning but still see yesterday". */
  track(fetch(API_URL+'?action=snapshot'), 'Daily Individual Report, latest day')
    .then(function(r){ if(!r.ok)throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(res.error)throw new Error(res.error);
      cacheSet(SNAP_KEY,res);
      if(!snap || res.latest!==snap.latest || res.generatedAt!==snap.generatedAt){
        applySnapshot(res);
      }
    }).catch(function(e){ if(!snap) showErr(e); });
}

function dnote(txt){
  var n=document.getElementById('dnote');
  if(!n) return;
  n.innerHTML=txt||'';
  n.className = txt ? 'dnote on' : 'dnote';
}

function applySnapshot(res){
  DATES=res.dates||[]; LATEST=res.latest||''; STAMP=res.generatedAt||'';
  DATA=mapRows(res.rows);
  DETAIL={}; DETLOADING={};
  tellParent(STAMP);
  if(!DATA.length && !LATEST){
    document.getElementById('content').innerHTML='<div class="empty">No dated rows found in the floor tabs yet.</div>';
    return;
  }

  /* Honour the day the user asked for. The old code jumped straight to
     LATEST, so opening the page after picking 12 Aug somewhere else threw
     that choice away without saying anything. */
  var want = document.getElementById('d1').value || wantedDay();

  if(DATES.length && DATES.indexOf(want) < 0){
    dnote('<b>'+prettyDate(want)+'</b> has not been loaded into the report yet. '
        + 'Showing <b>'+prettyDate(LATEST)+'</b>, the most recent day available.');
    want = LATEST;
  }else{
    dnote('');
  }

  document.getElementById('d1').value = want;
  syncDateLabel();
  shareDay(want);
  DAY = want;

  if(want === LATEST){
    resetFilters(); render();
  }else{
    pickDate();          /* fetches that one day, cache first */
  }
}

/* The shell's Refresh asks the OPEN page to refresh itself, because only this
   page knows which date is selected. Refreshing "the latest day" when the user
   is looking at last Tuesday was simply the wrong answer. */
function tellDone(err){
  if(window.parent===window) return;
  window.parent.postMessage({type:'refresh-done', stamp:STAMP||'', error:err||''}, '*');
}

/* Drop the cache for ONE day only. Refresh means "re-read what I am looking
   at", so a refresh of 29 Jul must not throw away yesterday's cached data
   that the user may switch straight back to. */
function clearDay(d){
  try{
    var kill=[];
    for(var i=0;i<sessionStorage.length;i++){
      var k=sessionStorage.key(i);
      if(!k) continue;
      if(k===DAYPFX+d) kill.push(k);
      if(k.indexOf('sosl_det')===0 && k.indexOf(d)>-1) kill.push(k);
      if(d===LATEST && k===SNAP_KEY) kill.push(k);
    }
    kill.forEach(function(k){ sessionStorage.removeItem(k) });
  }catch(e){}
  Object.keys(DETAIL).forEach(function(k){ if(k.indexOf(d)===0) delete DETAIL[k] });
  Object.keys(DETLOADING).forEach(function(k){ if(k.indexOf(d)===0) delete DETLOADING[k] });
}

/* Refresh runs in two phases.
     Phase 1, foreground: the date ON SCREEN is re-read and redrawn.
     Phase 2, background: every OTHER cached date is dropped immediately, so
       nothing stale can be served, then the most recent few are quietly
       re-fetched. The user waits only for phase 1. */
function purgeOtherDays(keep){
  var gone=[];
  try{
    var kill=[];
    for(var i=0;i<sessionStorage.length;i++){
      var k=sessionStorage.key(i);
      if(!k) continue;
      if(k.indexOf(DAYPFX)===0 && k!==DAYPFX+keep){ kill.push(k); gone.push(k.slice(DAYPFX.length)); }
      if(k.indexOf('sosl_det')===0 && k.indexOf(keep)<0) kill.push(k);
    }
    kill.forEach(function(k){ sessionStorage.removeItem(k) });
  }catch(e){}
  Object.keys(DETAIL).forEach(function(k){ if(k.indexOf(keep)!==0) delete DETAIL[k] });
  Object.keys(DETLOADING).forEach(function(k){ if(k.indexOf(keep)!==0) delete DETLOADING[k] });
  return gone;
}

/* Quietly re-fetch a handful of recently viewed days so switching back is
   still instant. Bounded on purpose: this must never become a stampede. */
var REWARM_MAX = 4;
function rewarmDays(list){
  var pick = list.slice().sort().slice(-REWARM_MAX);
  var run = function(){
    pick.forEach(function(d, i){
      setTimeout(function(){
        fetch(API_URL+'?action=data&from='+encodeURIComponent(d)+'&to='+encodeURIComponent(d),
              {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : null })
          .then(function(res){ if(res && !res.error) cacheSet(DAYPFX+d, res) })
          .catch(function(){});
      }, i*700);
    });
  };
  if(window.requestIdleCallback) requestIdleCallback(run,{timeout:6000}); else setTimeout(run,900);
}

function refreshNow(){
  var d = DAY || LATEST;
  clearDay(d);
  /* The loss-time sync needs the date being viewed, not "the latest". */
  var url = (d && d===LATEST)
      ? API_URL+'?action=snapshot&fresh=1&lossdate='+encodeURIComponent(d)
      : API_URL+'?action=data&fresh=1&from='+encodeURIComponent(d)+'&to='+encodeURIComponent(d);

  document.getElementById('content').innerHTML=
    '<div class="loading">Refreshing '+prettyDate(d)+'&hellip;</div>';

  track(fetch(url,{cache:'no-store'}), 'Refreshing Daily Individual Report, '+prettyDate(d))
    .then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(res.error) throw new Error(res.error);
      if(d===LATEST){ cacheSet(SNAP_KEY,res); applySnapshot(res); }
      else {
        cacheSet(DAYPFX+d,res);
        DATA=mapRows(res.rows); STAMP=res.generatedAt; tellParent(STAMP);
        LOSSR_DAY=''; resetFilters(); render();
      }
      tellDone();
      rewarmDays(purgeOtherDays(d));      /* phase 2, nobody waits for this */
    })
    .catch(function(e){ showErr(e); tellDone(e.message); });
}

window.addEventListener('message',function(ev){
  if(ev.data && ev.data.type==='do-refresh'){ refreshNow(); return; }
  if(ev.data && ev.data.type==='snapshot-updated'){
    var snap=cacheGet(SNAP_KEY);
    if(snap) applySnapshot(snap);
  }
});

/* Latest Day must mean "the newest date in the Google Sheet", not "the newest
   date this browser tab happens to remember". The old version trusted LATEST
   from the sessionStorage snapshot, so after the morning push it kept showing
   yesterday until the tab was closed. Now it asks the server to rebuild and
   re-read, and clears the local caches first so nothing stale can win. */
function goLatest(){
  document.getElementById('content').innerHTML=
    '<div class="loading">Checking for the latest day&hellip;</div>';
  clearCaches();
  track(fetch(API_URL+'?action=snapshot&fresh=1'), 'Checking for the latest day')
    .then(function(r){ if(!r.ok)throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(res.error)throw new Error(res.error);
      cacheSet(SNAP_KEY,res);
      applySnapshot(res);
    }).catch(showErr);
}

/* Drop every cached snapshot, day and detail this page owns. */
function clearCaches(){
  try{
    var kill=[];
    for(var i=0;i<sessionStorage.length;i++){
      var k=sessionStorage.key(i);
      if(k===SNAP_KEY || k.indexOf(DAYPFX)===0 || k.indexOf('sosl_det')===0) kill.push(k);
    }
    kill.forEach(function(k){sessionStorage.removeItem(k)});
  }catch(e){}
  DETAIL={}; DETLOADING={};
}

function pickDate(){
  var d=document.getElementById('d1').value;
  if(!d)return;
  DAY=d;
  syncDateLabel();
  shareDay(d);            /* every other report opens on this day too */
  dnote('');
  if(d===LATEST){
    var snap=cacheGet(SNAP_KEY);
    if(snap){ DATA=mapRows(snap.rows); STAMP=snap.generatedAt; tellParent(STAMP); resetFilters(); render(); return; }
  }
  var cached=cacheGet(DAYPFX+d);
  if(cached){ DATA=mapRows(cached.rows); STAMP=cached.generatedAt; tellParent(STAMP); resetFilters(); render(); return; }

  document.getElementById('content').innerHTML='<div class="loading">Loading '+prettyDate(d)+'&hellip;</div>';
  /* The date box stays live while this runs. Changing it again simply starts
     another load, and the LAST one to arrive wins, which is what a person
     flicking through three days expects. */
  track(fetch(API_URL+'?action=data&from='+encodeURIComponent(d)+'&to='+encodeURIComponent(d)),
        'Daily Individual Report, '+prettyDate(d))
    .then(function(r){ if(!r.ok)throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(res.error)throw new Error(res.error);
      cacheSet(DAYPFX+d,res);
      DATA=mapRows(res.rows); STAMP=res.generatedAt; tellParent(STAMP);
      resetFilters(); render();
    }).catch(showErr);
}

function resetFilters(){floorFilter='';factFilter='';query='';effFloorFilter='all';effIndFilter='all';expandKey=''}

/* ---------- operator drill-down ---------- */
function detKey(floor){ return DAY+'_'+floor }

/* Warm the cut-level data for a floor quietly in the background.
   No spinner, no layout change. By the time an operator row is clicked
   the data is normally already sitting in memory. */
function prefetchDetail(floor){
  if(!floor||!DAY) return;
  var k=detKey(floor);
  if(DETAIL[k]||DETLOADING[k]) return;

  var cached=cacheGet('sosl_det2_'+k);
  if(cached){ DETAIL[k]=cached.rows||[]; return; }

  DETLOADING[k]=true;
  fetch(API_URL+'?action=detail&date='+encodeURIComponent(DAY)+'&floor='+encodeURIComponent(floor))
    .then(function(r){ if(!r.ok)throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      DETLOADING[k]=false;
      if(res.error) return;
      DETAIL[k]=res.rows||[];
      cacheSet('sosl_det2_'+k,res);
      /* only repaint if the user is already waiting on this floor */
      if(expandKey && expandKey.split('|')[0]===floor) render();
    })
    .catch(function(){ DETLOADING[k]=false; });
}

/* Warm every floor currently on screen, one at a time so the ERP is not hammered */
function prefetchVisibleFloors(list){
  var queue=list.slice(), i=0;
  (function next(){
    if(i>=queue.length) return;
    prefetchDetail(queue[i++]);
    setTimeout(next,400);
  })();
}

/* Combined height of whatever is pinned at the top right now, so a scrolled
   row lands just below it instead of hiding underneath. Which layers are
   actually sticky depends on the breakpoint, so mirror that here. */
function stickyStackH(){
  var h=boxH('.strip');
  if(window.matchMedia('(min-width:901px)').matches){
    h+=boxH('#indcard>.hd')+boxH('#indtable>thead>tr');
  }
  return h;
}

/* Glide the opened operator row up under the pinned headers so the eye can
   follow where the page jumped to. */
function scrollRowIntoView(){
  var row=document.querySelector('tr.oprow.open');
  if(!row) return;
  var smooth=!window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var top=window.pageYOffset+row.getBoundingClientRect().top-stickyStackH()-10;
  if(top<0) top=0;
  window.scrollTo({top:top,behavior:smooth?'smooth':'auto'});
}

function toggleDetail(floor,opId,ev){
  if(ev) ev.stopPropagation();
  var k=floor+'|'+opId;
  var opening = (expandKey!==k);
  expandKey = opening ? k : '';
  if(expandKey) prefetchDetail(floor);
  render();
  /* next frame, so the expanded block is laid out before we measure */
  if(opening) requestAnimationFrame(scrollRowIntoView);
}

function detailRowsFor(floor,opId){
  var rows=DETAIL[detKey(floor)];
  if(!rows) return null;
  var target=padId(opId);
  return rows.filter(function(r){ return padId(r[0])===target; });
}
function showErr(e){
  document.getElementById('content').innerHTML='<div class="empty">Error: '+e.message
    +'<br><br>Check: 1) API_URL is the /exec link, 2) deployment access is "Anyone with the link", 3) a NEW VERSION was deployed after the last code change.</div>';
}

/* The Loss Min cell. Hovering shows WHY the time was lost, which comes from
   column AI of the efficiency sheet. Until that column exists the reason is
   blank and the cell simply has no tooltip, so nothing looks broken. */
/* The cell carries only its KEY. The tooltip text is attached afterwards with
   setAttribute, never built into the HTML string.
   Reason: esc() in this file does not escape double quotes, so a reason such as
   Machine "A" down silently broke the title attribute and mangled the cell.
   Filtering to one floor surfaced operators the default 25 row view never
   showed, which is why it looked like a filtering bug. Setting the attribute
   through the DOM needs no escaping at all, so the whole class of problem is
   gone rather than patched. */
function lossTd(o){
  if(!(o.lossMin>0)) return '<td class="nolss">&ndash;</td>';
  return '<td class="lossy" data-lk="'+escAttr(lossKey(o.floor,o.opId))+'"'
       + ' data-nm="'+escAttr(o.name)+'">'+fmt(o.lossMin,0)+'</td>';
}

/* esc() is for text between tags. This one is for values inside an attribute,
   where a quote would end the attribute early. */
function escAttr(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- aggregation ---------- */
function operatorAgg(){
  var map={};
  DATA.forEach(function(r){
    var k=r.floor+'|'+r.opId;
    if(!map[k])map[k]={floor:r.floor,opId:r.opId,name:r.name,desig:r.desig,n:0,wh:0,eng:0,inMin:0,outMin:0,eff:0,lossMin:0,types:{}};
    var o=map[k];
    o.n++; o.wh+=r.wh; o.eng+=r.eng; o.inMin+=r.inMin; o.outMin+=r.outMin;
    /* Loss Time is written once per operator per day on the block-start row,
       so it is taken, not summed, exactly like Individual Eff%. */
    if(typeof r.lossMin==='number' && r.lossMin>o.lossMin) o.lossMin=r.lossMin;
    /* Prefer the sheet's own Individual Eff% (column AD) verbatim. Only if the
       API hasn't been redeployed yet and that field is absent do we fall back
       to computing it, so the column never goes blank. */
    if(typeof r.effPct==='number' && !isNaN(r.effPct)) o.eff=r.effPct;
    String(r.types||'').split(',').forEach(function(t){t=t.trim();if(t)o.types[t]=1});
    if(r.name)o.name=r.name; if(r.desig)o.desig=r.desig;
  });
  return Object.keys(map).map(function(k){
    var o=map[k];
    o.avgWh=o.wh/o.n;
    /* Engagement% is capped at 100. An operator cannot be more than fully
       engaged, so anything above that is a data artefact, not a real figure.
       Capped here at the source so the table, sorting, print and the Excel
       export all agree. No other column is touched. */
    o.avgEng=Math.min(o.eng/o.n,100);
    if(!o.eff) o.eff=o.inMin>0?(o.outMin/o.inMin*100):0;
    /* Types are NOT hardcoded. The old list was ['MS','AS','MC','AC'], so the
       day numbering operators are added their type would silently vanish from
       this column. Known types keep their reading order, anything new is
       appended rather than dropped. */
    var known=['MS','AS','MC','AC'];
    var mine=Object.keys(o.types);
    o.typeStr = known.filter(function(t){ return o.types[t] })
      .concat(mine.filter(function(t){ return known.indexOf(t)<0 }).sort())
      .join(', ');
    return o;
  });
}
function floorAgg(ops){
  var map={};
  FLOOR_ORDER.forEach(function(f){map[f]={floor:f,man:0,inMin:0,outMin:0,u65:0}});
  ops.forEach(function(o){
    var f=map[o.floor]; if(!f)return;
    f.man++; f.inMin+=o.inMin; f.outMin+=o.outMin;
    if(o.eff<65)f.u65++;
  });
  return FLOOR_ORDER.map(function(k){
    var f=map[k]; f.eff=f.inMin>0?(f.outMin/f.inMin*100):0; return f;
  });
}

/* current visible sets, shared by render + export + print */
function currentSets(){
  var ops=operatorAgg();
  var floorsAll=floorAgg(ops);

  /* Total row covers the selected factory only, or both when none is picked */
  var grand={man:0,inMin:0,outMin:0,u65:0};
  floorsAll.filter(function(f){return inScope(f.floor)})
    .forEach(function(f){grand.man+=f.man;grand.inMin+=f.inMin;grand.outMin+=f.outMin;grand.u65+=f.u65});
  grand.eff=grand.inMin>0?(grand.outMin/grand.inMin*100):0;

  /* KPI totals follow the floor selection, else the factory scope */
  var tot;
  if(floorFilter){
    var sel=floorsAll.filter(function(f){return f.floor===floorFilter})[0]
            || {man:0,inMin:0,outMin:0,u65:0,eff:0};
    tot={man:sel.man,inMin:sel.inMin,outMin:sel.outMin,u65:sel.u65,eff:sel.eff};
  } else {
    tot=grand;
  }

  /* Operator counts per efficiency band, in the same scope the KPI cards use,
     so the chart follows both the factory and the floor selection. */
  var bandOps = ops.filter(function(o){
    return floorFilter ? o.floor===floorFilter : inScope(o.floor);
  });
  var bands={lo:0,mid:0,hi:0,total:bandOps.length};
  bandOps.forEach(function(o){
    if(o.eff<65) bands.lo++; else if(o.eff<=90) bands.mid++; else bands.hi++;
  });

  /* Floor table lists every floor of the selected factory. Clicking a single
     floor row only highlights it, it does not shorten this list. */
  var floorsShown=floorsAll.filter(function(f){
    if(f.man===0)return false;
    if(!inScope(f.floor))return false;
    return effPass(f.eff,effFloorFilter);
  });
  floorsShown.sort(function(a,b){
    if(fSortKey==='floor') return (floorRank(a.floor)-floorRank(b.floor))*fSortDir;
    var va=a[fSortKey],vb=b[fSortKey];
    if(typeof va==='string')return String(va).localeCompare(String(vb))*fSortDir;
    return (va-vb)*fSortDir;
  });

  var indShown=ops.filter(function(o){
    if(!inScope(o.floor))return false;
    if(floorFilter&&o.floor!==floorFilter)return false;
    if(!effPass(o.eff,effIndFilter))return false;
    if(query){
      var q=query.toLowerCase();
      if(o.name.toLowerCase().indexOf(q)<0 && padId(o.opId).indexOf(q)<0 && o.desig.toLowerCase().indexOf(q)<0)return false;
    }
    return true;
  });
  indShown.sort(function(a,b){
    if(sortKey==='floor') return (floorRank(a.floor)-floorRank(b.floor))*sortDir;
    var va=a[sortKey],vb=b[sortKey];
    if(typeof va==='string')return String(va).localeCompare(String(vb))*sortDir;
    return (va-vb)*sortDir;
  });

  return {ops:ops,floorsAll:floorsAll,floorsShown:floorsShown,indShown:indShown,tot:tot,grand:grand,bands:bands};
}

/* The native calendar only opens from the small icon by default, so a click
   anywhere on the field opens it. showPicker is Chrome/Edge; elsewhere the
   field still works normally. */
function openPicker(el){
  try{ if(el.showPicker) el.showPicker(); }catch(e){}
}
/* Keeps the visible label in our own format, in step with the real input */
function syncDateLabel(){
  var l=document.getElementById('d1label');
  if(l) l.textContent=prettyDate(document.getElementById('d1').value)||'-';
}

/* ---------- render ---------- */
function render(){
  document.getElementById('showing').textContent='Showing: '+prettyDate(DAY);
  syncDateLabel();
  var S=currentSets(), tot=S.tot;
  var scopeLabel = floorFilter ? ('Floor '+floorFilter)
                 : (factFilter ? (factFilter+' (all floors)') : 'All Floors');
  document.body.classList.toggle('single-floor', !!floorFilter);

  var h='<div class="wrap">';

  /* print-only header */
  h+='<div class="printhead">'
    +'<img src="../logo.jpg" alt="SNOWTEX">'
    +'<div class="phbody">'
      +'<h1>SOSL Cutting Section &mdash; Daily Individual Eff% Report</h1>'
      +'<div class="meta">'
        +'<span>Date <b>'+prettyDate(DAY)+'</b></span>'
        +'<span>Scope <b>'+scopeLabel+'</b></span>'
        +'<span>Team Avg Eff% filter <b>'+effLabel(effFloorFilter)+'</b></span>'
        +'<span>Individual Eff% filter <b>'+effLabel(effIndFilter)+'</b></span>'
        +'<span>Last updated <b>'+(STAMP||'-')+'</b></span>'
      +'</div>'
    +'</div></div>';

/* Donut of the three efficiency bands. Plain inline SVG, no chart library, so
   the page stays a single self-contained file with nothing to load. */
function bandChart(b){
  var t=b.total||0;
  if(!t) return '';
  var segs=[
    {n:b.lo, c:'var(--red)',   label:'&lt; 65%'},
    {n:b.mid,c:'var(--green)', label:'65 &ndash; 90%'},
    {n:b.hi, c:'var(--blue)',  label:'&gt; 90%'}
  ];
  /* Thick ring on a slightly smaller radius: widens the hover target a lot
     while keeping the outer edge inside the 140 unit viewBox. */
  var R=50, W=27, C=2*Math.PI*R, off=0, ring='';
  segs.forEach(function(s){
    if(!s.n) return;
    var len=C*(s.n/t);
    /* tiny gap between slices, but never wider than the slice itself */
    var gap=Math.min(2,len/3);
    ring+='<circle class="seg" cx="70" cy="70" r="'+R+'" fill="none" stroke="'+s.c+'" stroke-width="'+W+'"'
        + ' stroke-dasharray="'+(len-gap).toFixed(2)+' '+(C-len+gap).toFixed(2)+'"'
        + ' stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 70 70)"'
        + ' data-l="'+s.label+'" data-n="'+s.n+'" data-p="'+fmt(s.n/t*100,1)+'" data-c="'+s.c+'"'
        + ' onmouseenter="segHover(this)" onmouseleave="segOut()" onclick="segHover(this)"></circle>';
    off+=len;
  });
  /* Colour guide. Counts and shares stay off the label, they appear in the
     middle of the donut on hover. Carries the same data attributes and
     handlers as the slices, so hovering a legend row reads out identically. */
  var legend='';
  segs.forEach(function(s){
    legend+='<div class="lgrow"'
      +' data-l="'+s.label+'" data-n="'+s.n+'" data-p="'+fmt(s.n/t*100,1)+'" data-c="'+s.c+'"'
      +' onmouseenter="segHover(this)" onmouseleave="segOut()" onclick="segHover(this)">'
      +'<span class="dot" style="background:'+s.c+'"></span>'
      +'<span class="lgl">'+s.label+'</span></div>';
  });

  /* Donut and legend sit side by side, not stacked, so the card stays short
     enough for the three KPI cards plus this one to match the floor table. */
  return '<div class="kpi chartcard">'
    +'<div class="k">Operators by Eff% Band</div>'
    +'<div class="chartrow">'
      +'<div class="donutwrap">'
        +'<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Operators by efficiency band">'
          +'<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="#EDEFF7" stroke-width="'+W+'"></circle>'
          +ring
        +'</svg>'
        /* filled on hover, empty otherwise, so the card stays clean and the
           readout can never be clipped the way a floating tooltip would be */
        +'<div class="dcen" id="dcen"></div>'
      +'</div>'
      +'<div class="legend">'+legend+'</div>'
    +'</div>'
  +'</div>';
}

/* Hovering a slice OR its legend row writes that band's count and share into
   the middle of the donut and dims the other slices. Both carry the same data
   attributes, so one pair of handlers serves both. Click is bound too, for
   touch screens where there is no hover. */
function segHover(el){
  var d=document.getElementById('dcen');
  if(!d) return;
  var c=el.getAttribute('data-c');
  d.innerHTML='<b style="color:'+c+'">'+el.getAttribute('data-n')+'</b>'
    +'<span>'+esc(el.getAttribute('data-l'))+'</span>'
    +'<span class="pc">'+el.getAttribute('data-p')+'%</span>';
  var segs=document.querySelectorAll('.donut circle.seg');
  for(var i=0;i<segs.length;i++){
    segs[i].style.opacity = (segs[i].getAttribute('data-c')===c) ? '1' : '.3';
  }
}
function segOut(){
  var d=document.getElementById('dcen');
  if(d) d.innerHTML='';
  var segs=document.querySelectorAll('.donut circle.seg');
  for(var i=0;i<segs.length;i++) segs[i].style.opacity='';
}

      +'<td>'+fmt(r[5],2)+'</td><td>'+fmt(r[6],2)+'</td><td>'+fmt(r[7],0)+'</td><td>'+fmt(r[8],0)+'</td>'

      +'<td class="pct '+pctClass(r[17])+'">'+fmt(r[17],2)+'%</td></tr>';
  });
  h+='</tbody></table></div></div></td></tr>';
  return h;

function th2(s){return '<th style="background:#333D6D;color:#fff;font-weight:bold">'+esc(s)+'</th>'}

/* Real Excel percentage: value stored as a fraction, displayed with a % sign,
   so the column still sorts and averages correctly instead of being plain text. */
function pctTd(v,dec,extra){
  if(v==null||isNaN(v)) return '<td>-</td>';
  var f='0'+(dec>0?'.'+Array(dec+1).join('0'):'')+'%';
  var st="mso-number-format:'"+f+"';"+(extra||'');
  return '<td style="'+st+'">'+(v/100)+'</td>';
}

/* Keeps the sticky headers resting right under the control strip,
   whatever its actual rendered height is at the current screen width. */
function syncStripH(){
  var s=document.querySelector('.strip');
  if(s) document.documentElement.style.setProperty('--stripH', s.offsetHeight+'px');
}

/* Each card's title bar sticks first, then its table's column header row sits
   directly below it. The two title bars are different heights (the Individual
   Report one carries the floor chips), so each offset is measured separately
   after every render instead of being hard coded. */
/* Heights are read with getBoundingClientRect, not offsetHeight. offsetHeight
   on a <thead> is unreliable across engines (table sections are not ordinary
   boxes), and a wrong reading here pushes a sticky header far down the page.
   Reading the header <tr> instead gives the true rendered row height. */
function boxH(sel){
  var el=document.querySelector(sel);
  return el ? el.getBoundingClientRect().height : 0;
}
function syncStickyOffsets(){
  syncStripH();
  var r=document.documentElement;
  var strip=boxH('.strip');
  var flrHd=boxH('#floorcard>.hd');
  var indHd=boxH('#indcard>.hd');
  var indCol=boxH('#indtable>thead>tr');

  r.style.setProperty('--flrHdH',flrHd+'px');
  r.style.setProperty('--indHdH',indHd+'px');

  /* One resolved number for the drill-down header instead of a chain of three
     CSS vars, so a single bad reading cannot silently offset it down the page.
     Clamped because an absurd value is what strands the header mid-table. */
  var detTop=strip+indHd+indCol;
  if(!isFinite(detTop) || detTop<0 || detTop>400) detTop=strip+indHd+28;
  r.style.setProperty('--detTop',detTop+'px');
}
window.addEventListener('resize', syncStickyOffsets);
/* Web font swaps in after first paint and changes row heights, so re-measure
   once everything has settled. */
window.addEventListener('load', syncStickyOffsets);

boot();
syncStickyOffsets();
