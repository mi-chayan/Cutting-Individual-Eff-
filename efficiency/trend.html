<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutting Efficiency Trend</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --card:#fff; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
    /* Same compliance ladder as the daily report on purpose: a floor must
       never look green on one page and red on the other. */
    --red:#D64550; --green:#1E8E4E; --blue:#1D6FD0; --amber:#C77700;
    --gap:14px;
    /* Measured at runtime by syncStickyOffsets(). Same idea as fabric.html and
       daily.html: everything that must stay on screen is stacked from the top
       of the viewport downwards, using real measured heights. */
    --stripH:44px; --cardHdH:34px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;-webkit-text-size-adjust:100%}

  .strip{background:#fff;border-bottom:1px solid var(--line);padding:7px 16px;
         display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
         position:sticky;top:0;z-index:30}
  .strip h2{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap}
  .sep{width:1px;height:22px;background:var(--line)}
  .strip label{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .dpick{position:relative;display:inline-flex;align-items:center;gap:7px;
         border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;
         font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;cursor:pointer}
  .dpick:hover{border-color:var(--violet)}
  .dpick svg{width:13px;height:13px;fill:var(--violet);flex:0 0 auto}
  .dpick input[type=date]{position:absolute;inset:0;width:100%;height:100%;
         opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-family:inherit}
  .mini{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:7px;
        padding:5px 11px;font-family:inherit;font-weight:700;font-size:11.5px;cursor:pointer;
        display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .mini:hover{background:var(--cream);border-color:var(--peach)}
  .mini.on{background:var(--violet);color:#fff;border-color:var(--violet)}
  .mini svg{width:12px;height:12px;fill:var(--violet)}
  .mini.on svg{fill:#fff}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}

  /* Excel and Print are the two things people actually reach for, so they get
     real colour instead of disappearing into the neutral filter buttons.
     Tinted at rest, solid on hover, same shape as every other .mini. */
  .mini.xls{background:#E8F5EE;color:#14663A;border-color:#9FD5B8;font-weight:800}
  .mini.xls svg{fill:#1E8E4E}
  .mini.xls:hover{background:#1E8E4E;color:#fff;border-color:#1E8E4E}
  .mini.xls:hover svg{fill:#fff}
  .mini.prn{background:#EEF1FA;color:#2B3566;border-color:#B9C2E4;font-weight:800}
  .mini.prn svg{fill:#333D6D}
  .mini.prn:hover{background:#333D6D;color:#fff;border-color:#333D6D}
  .mini.prn:hover svg{fill:#fff}

  .cachetag{font-size:9.5px;font-weight:700;color:var(--green);background:#E8F5EE;
            border:1px solid #BFE3CE;border-radius:20px;padding:3px 9px;white-space:nowrap}

  /* One gutter value everywhere: cards, grid gaps and card spacing all use
   --gap, so nothing sits a few pixels off from its neighbour. */
  /* Identical to fabric.html and daily.html so the content block does not
     jump wider when you switch to this report. */
  .wrap{padding:13px 16px 26px;max-width:1560px;margin:0 auto}

  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--gap)}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
       position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(37,42,69,.05)}
  .kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
  .kpi.k2:before{background:var(--navy)} .kpi.k3:before{background:var(--peach)}
  .kpi.k4:before{background:var(--red)}  .kpi.k5:before{background:var(--amber)}
  .kpi.k6:before{background:var(--green)}
  .kpi .k{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;line-height:1.25}
  .kpi .v{font-size:23px;font-weight:800;margin-top:1px;line-height:1.05}
  .kpi .s{font-size:9.5px;color:var(--mut);margin-top:1px;line-height:1.3}
  .v.red{color:var(--red)} .v.green{color:var(--green)} .v.blue{color:var(--blue)} .v.amber{color:var(--amber)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:var(--gap);
        overflow:clip;box-shadow:0 1px 2px rgba(37,42,69,.05)}
  .card .hd{padding:8px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;
            gap:8px;flex-wrap:wrap;background:linear-gradient(90deg,var(--cream),#fff)}
  /* The card title bar sticks directly under the control strip, so you always
     know which table you are looking at. */
  @media(min-width:901px){
    .card>.hd{position:sticky;top:var(--stripH);z-index:16}
    .afbar{position:sticky;top:calc(var(--stripH) + var(--cardHdH));z-index:15}
  }
  .card .hd h3{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.2px}
  .hint{font-size:10px;font-weight:700;color:var(--violet);letter-spacing:.2px;
        background:#F3EEFC;border:1px solid #D6C8F0;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .push{margin-left:auto}
  .srch{border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-family:inherit;
        font-size:11px;width:150px;background:#fff;color:var(--txt)}
  .srch:focus{outline:none;border-color:var(--violet)}

  /* scope chips, only on the Fabric Type card */
  .chips{display:flex;gap:5px;flex-wrap:wrap;padding:7px 13px;
         background:#FAFBFE;border-bottom:1px solid var(--line)}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;
        font-size:10px;font-weight:800;cursor:pointer;color:var(--mut);font-family:inherit}
  .chip:hover{border-color:var(--violet);color:var(--violet)}
  .chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
  /* factory chips read as a separate tier from the floor chips beside them */
  .chip.fact{color:var(--navy);border-color:#C3C9E4;background:#F1F3FA;letter-spacing:.3px}
  .chip.fact:hover{border-color:var(--navy);color:var(--navy);background:#E7EAF6}
  .chip.fact.on{background:var(--navy);border-color:var(--navy);color:#fff}

  #floorcard{border:1px solid var(--peach);border-radius:14px;
        box-shadow:0 10px 26px -8px rgba(51,61,109,.30),0 2px 8px rgba(114,62,195,.10);
        background:linear-gradient(180deg,#fff 0%,var(--cream) 260%)}
  #floorcard .hd{background:linear-gradient(90deg,var(--navy),#4A56A0)}
  #floorcard .hd h3{color:#fff}
  #floorcard .hd h3:before{content:'\25A0';color:var(--peach);margin-right:6px;font-size:9px;vertical-align:1px}
  #floorcard .hint{color:var(--peach);background:rgba(255,255,255,.13);border-color:rgba(255,207,149,.5)}
  #floorcard th{background:#404B8C}

  /* ---- active filter bar, one per card ---- */
  .afbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
         padding:6px 13px;background:#F6F4FD;border-bottom:1px solid #E4DDF6}
  .aflabel{font-size:9px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .afchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
          color:var(--navy);background:#fff;border:1px solid #D6C8F0;border-radius:20px;padding:3px 5px 3px 10px}
  .afchip b{color:var(--violet)}
  .afchip i{font-style:normal;cursor:pointer;width:15px;height:15px;border-radius:50%;
            display:inline-flex;align-items:center;justify-content:center;
            background:#EFE7FB;color:var(--violet);font-size:12px;line-height:1}
  .afchip i:hover{background:var(--violet);color:#fff}
  .afclear{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;
           padding:3px 11px;font-family:inherit;font-size:10.5px;font-weight:800;
           color:var(--mut);cursor:pointer}
  .afclear:hover{border-color:var(--red);color:var(--red)}

  /* ---------- Detailed Summary filter bar ---------- */
  .detbar{display:flex;align-items:center;gap:8px;padding:0 13px 9px}
  .detq{flex:1 1 auto;min-width:0;font-family:inherit;font-size:12px;font-weight:600;
        color:var(--txt);padding:7px 11px;border:1px solid var(--line);border-radius:7px;
        background:#fff}
  .detq:focus{outline:none;border-color:var(--violet)}
  .detbar .afclear{margin-left:0;flex:0 0 auto}

  table{width:100%;border-collapse:collapse}
  /* Column headings must stay visible while the rows scroll. They pin to the
     top of their own scroll box (.tscroll / .mx), which is why those boxes
     carry a max-height: a sticky header needs a container that actually
     scrolls, otherwise it has nothing to stick to. */
  th{background:var(--navy);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;
     letter-spacing:.4px;padding:7px 9px;text-align:right;white-space:nowrap;cursor:pointer;
     user-select:none;box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}
  th:first-child,td:first-child{text-align:left}
  th:hover{background:#4A56A0}
  th .ar{font-size:8px;opacity:.95;margin-left:3px}
  td{padding:6px 9px;text-align:right;font-size:12px;border-bottom:1px solid #EFF1F7;
     font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr:hover{background:#F6F4FD}
  tbody tr:last-child td{border-bottom:0}
  td.f{font-weight:800}
  td.clk{cursor:pointer}
  td.clk:hover{text-decoration:underline;color:var(--violet)}
  .pill{display:inline-block;min-width:56px;padding:2px 8px;border-radius:20px;
        font-size:11px;font-weight:800;color:#fff;text-align:center}
  .pill.red{background:var(--red)} .pill.green{background:var(--green)} .pill.blue{background:var(--blue)}
  /* The totals row pins to the bottom of the same box, so you can scroll the
     middle of a long list and still read the header and the total. */
  tfoot td{background:#F6F7FB;font-weight:800;border-top:2px solid var(--line);border-bottom:0}
  /* Totals stay readable while you scroll the rows above them. */
  @media(min-width:901px){
    .tscroll table>tfoot td{position:sticky;bottom:0;z-index:13;
        box-shadow:0 -1px 0 var(--line)}
  }
  /* THIS is what makes the sticky header work. A fixed 660px cap was useless:
     these tables are only 11 rows tall, so the box never scrolled and the
     header had nothing to stick to while the PAGE scrolled past it. Sizing the
     box to whatever viewport is left under the sticky strip and card title
     means the box itself scrolls, and the header pins inside it. */
  /* A plain table flows with the PAGE, exactly like fabric.html and
     daily.html. It is NOT a scroll container, because these tables are only
     11 rows: a box that never scrolls gives a sticky header nothing to pin
     to, which is precisely why the first attempt failed. Instead the heading
     pins to the viewport, below the control strip and the card title bar. */
  .tscroll{overflow:visible}
  @media(min-width:901px){
    .tscroll table>thead th{position:sticky;
        top:calc(var(--stripH) + var(--cardHdH) + var(--afH,0px));z-index:14}
  }

  /* ---- matrix ---- */
  .mx{overflow:auto;
      max-height:calc(100vh - var(--stripH) - var(--cardHdH) - 34px);
      scrollbar-width:thin;scrollbar-color:#C9CEE4 transparent}
  .mx::-webkit-scrollbar{width:9px;height:9px}
  .mx::-webkit-scrollbar-thumb{background:#C9CEE4;border-radius:8px}
  .mx table{min-width:100%;width:max-content}
  /* Three sticky layers, so the z-index order matters:
       6 corner cell   pinned top AND left, must sit above both
       5 header row    pinned top
       4 floor column  pinned left */
  /* Floor column is centred: the codes are all two characters, so left
     alignment left them looking loose against the centred data columns. */
  /* The matrix MUST be its own scroll box, because the date columns run off
     the right. So its headings pin inside that box rather than to the page.
     Three sticky layers, z-index order matters:
       6 corner cell   pinned top AND left
       5 header row    pinned top
       4 floor column  pinned left */
  .mx thead th{position:sticky;top:0;z-index:5}
  .mx tfoot td{position:sticky;bottom:0;z-index:5}
  .mx th:first-child,.mx td:first-child{position:sticky;left:0;z-index:4;background:var(--navy);
        color:#fff;font-weight:800;text-align:center;min-width:70px}
  .mx thead th:first-child{z-index:6}
  .mx tfoot td:first-child{z-index:6}
  .mx tbody td:first-child{background:#F0F2F8;color:var(--txt);border-right:2px solid var(--line)}
  /* Row highlight has to reach EVERY cell, including the shaded waste cells
     and the Range column, both of which carry an inline background that a
     plain background rule cannot beat. A huge inset shadow tints straight over
     whatever colour is already there, and unlike filter: it does not create a
     containing block, so the sticky first column keeps working. */
  .mx tbody tr:hover td{box-shadow:inset 0 0 0 2000px rgba(114,62,195,.10)}
  .mx tbody tr:hover td:first-child{box-shadow:inset 0 0 0 2000px rgba(114,62,195,.16)}
  .mx td{text-align:center;font-size:11.5px;padding:5px 7px;min-width:62px}
  .mx th{text-align:center;font-size:9px;padding:6px 7px}
  .mx td.cell{font-weight:700}
  .mx tfoot td{background:#F6F7FB}
  .mx tfoot td:first-child{background:#404B8C;color:#fff}
  .mxlgd{display:flex;gap:14px;align-items:center;padding:7px 13px;font-size:10px;
         font-weight:700;color:var(--mut);border-top:1px solid var(--line);flex-wrap:wrap}
  .mxlgd i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  /* ---- bar list ---- */
  .bars{padding:10px 13px 13px;overflow-y:auto;
        scrollbar-width:thin;scrollbar-color:#C9CEE4 transparent}
  .bars::-webkit-scrollbar{width:8px}
  .bars::-webkit-scrollbar-thumb{background:#C9CEE4;border-radius:8px}
  .brow{display:grid;grid-template-columns:118px 1fr 196px;align-items:center;gap:9px;
        padding:4px 5px;margin:0 -5px;border-radius:6px}
  .brow:hover{background:#F2F4FA}
  .bname{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btrack{height:12px;background:#EDEFF6;border-radius:3px;overflow:hidden}
  .bfill{height:100%;border-radius:3px;background:var(--red);
         transition:width .45s cubic-bezier(.22,.61,.36,1)}
  /* three fixed columns so the numbers line up down the whole list */
  .bval{display:grid;grid-template-columns:60px 62px 74px;align-items:baseline;
        font-variant-numeric:tabular-nums}
  .bval span{text-align:right;white-space:nowrap}
  .bval b{font-size:11.5px;font-weight:800;color:var(--txt)}
  .bval b.bad{color:var(--red)} .bval b.wst{color:var(--amber)}
  .bval i{font-style:normal;font-size:8.5px;font-weight:700;color:var(--mut);
          margin-left:3px;letter-spacing:.2px}
  .barhd{display:grid;grid-template-columns:118px 1fr 196px;gap:9px;
         padding:6px 18px 5px 18px;border-bottom:1px solid var(--line);background:#FAFBFE}
  .barhd .h3c{display:grid;grid-template-columns:60px 62px 74px}
  .barhd span{font-size:8.5px;font-weight:800;color:var(--mut);text-transform:uppercase;
              letter-spacing:.5px;text-align:right;white-space:nowrap}
  .barhd .lft{text-align:left}

  /* ---- chart ---- */
  .chartbox{padding:12px 13px 8px;position:relative}
  #chhost{width:100%;overflow:hidden}
  /* SVG text is styled here, not with font-size attributes, so it inherits the
     page font and stays the same physical size as the tables beside it. */
  #chartsvg text{font-family:'Plus Jakarta Sans',sans-serif}
  #chartsvg .axl{font-size:10.5px;font-weight:600;fill:#7A81A0}
  #chartsvg .axb{font-size:10px;font-weight:800}
  #chartsvg .axt{font-size:11px;font-weight:800;letter-spacing:.3px}
  /* on-chart value labels */
  #chartsvg .vlc{font-size:10.5px;font-weight:800;fill:#5B2FA6;
                 paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  /* waste block: value on top, unit beneath in a smaller weight */
  #chartsvg .vlw .vn{font-size:10.5px;font-weight:800;fill:#8A5300;
                     paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  #chartsvg .vlw .vu{font-size:8px;font-weight:700;fill:#A9761F;letter-spacing:.4px;
                     paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  /* centred in the bar: darker, no halo needed against the amber fill */
  #chartsvg .vlw.in .vn{fill:#6B4000;stroke:none}
  #chartsvg .vlw.in .vu{fill:#8A5A12;stroke:none}
  #chartsvg .hid{opacity:0}
  .lgd{display:flex;gap:16px;justify-content:center;padding:0 0 8px;font-size:10.5px;
       font-weight:700;color:var(--mut);flex-wrap:wrap}
  .lgd i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  #chartsvg{display:block;cursor:crosshair;touch-action:none;max-width:100%}
  .tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;
       background:#252A45;color:#fff;border-radius:9px;padding:8px 11px;font-size:11px;
       line-height:1.55;box-shadow:0 8px 22px rgba(37,42,69,.28);z-index:12;min-width:172px}
  .tip.on{opacity:1}
  .tip h4{font-size:11.5px;font-weight:800;margin-bottom:5px;color:var(--peach);
          border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:4px}
  .tip .r{display:flex;justify-content:space-between;gap:14px}
  .tip .r span{color:#BFC4DC} .tip .r b{font-variant-numeric:tabular-nums}
  .tip .r b.red{color:#FF9AA3} .tip .r b.green{color:#7FE0A8} .tip .r b.blue{color:#8CC2FF}

  .loading{padding:70px 0;text-align:center;color:var(--mut);font-size:12.5px}
  .spin{width:26px;height:26px;border:3px solid #E4E6F0;border-top-color:var(--violet);
        border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{padding:50px 0;text-align:center;color:var(--mut);font-size:12.5px}
  .err{margin:16px;padding:13px 15px;border-radius:10px;background:#FDECEE;
       border:1px solid #F5C2C7;color:#8B2530;font-size:12px;font-weight:600;line-height:1.6}
  .note{font-size:10.5px;color:var(--mut);padding:2px 2px 10px;line-height:1.7}
  /* Side-by-side cards must end level even when one has more rows than the
   other, so the row is sized by the taller card and both stretch to it. */
  /* align-items:start, NOT stretch. Stretching made the Floor Ranking card
     grow to match the Fabric Type list beside it, leaving a large empty band
     under 13 rows of data. Each card now takes its natural height. The fabric
     list is capped and scrolls on its own, so it never runs away. */
  /* align-items:start, NOT stretch. Stretch made BOTH cards grow to the
     taller one, and since the fabric list has 36 entries it dragged the floor
     table up with it. Now the Floor Ranking card takes its own natural height
     and syncPairHeight() caps the fabric list to match, so the pair ends level
     without either card carrying dead space. */
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);
       align-items:start;margin-bottom:0}
  .two>.card{margin-bottom:var(--gap)}
  #fabcard>.bars{overflow-y:auto}

  @media(max-width:1180px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .two{grid-template-columns:1fr} }
  @media(max-width:640px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .acts{margin-left:0} }
  @media print{ .strip{position:static} .acts,.srch{display:none} body{background:#fff}
                .card{break-inside:avoid;box-shadow:none}
                /* release every scroll box so nothing is cut off on paper */
                .bars,.tscroll,.mx{max-height:none;overflow:visible}
                th,tfoot td{position:static;box-shadow:none} }


  /* ================= the loading island =================
     Two pieces that work together.

     1. A REAL progress bar across the very top. It used to be a block sliding
        left to right for ever, which says "something is happening" and
        nothing else. Left is 0, right is 100, and it only ever moves
        forwards.

        Most of these fetches are ONE request, so there is no honest fraction
        to report until it lands. Rather than lie with a fake percentage, it
        eases toward 90 and waits there: fast at first, slower the longer it
        takes, which is the same trick GitHub uses and it reads as real
        because it never goes backwards and never completes early. Where a
        genuine fraction IS known, the weekly report fetching six days in
        chunks, barSet() overrides the easing with the true number.

     2. An island under the header saying WHAT is loading. Detached from the
        title bar, dark, rounded, with a progress ring on the left. It springs
        in, morphs when the text changes, and springs out.
     ---------------------------------------------------------------- */
  #bar{position:fixed;top:0;left:0;height:3px;width:100%;z-index:400;
       pointer-events:none;opacity:0;transition:opacity .3s ease}
  #bar.on{opacity:1}
  #bar i{display:block;height:100%;width:0;border-radius:0 3px 3px 0;
         background:linear-gradient(90deg,#5B33A8,#723EC3 55%,#B07CFF);
         box-shadow:0 0 10px rgba(176,124,255,.7);
         transition:width .34s cubic-bezier(.22,.61,.36,1)}
  /* A highlight travelling along the filled part, so a long wait still looks
     alive even while the number is barely moving. */
  #bar i:after{content:'';position:absolute;top:0;right:0;width:90px;height:100%;
       background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55));
       animation:barsheen 1.1s ease-in-out infinite}
  #bar i{position:relative;overflow:hidden}
  @keyframes barsheen{0%{opacity:.15}50%{opacity:.8}100%{opacity:.15}}

  /* NO CIRCULAR SPINNER. The pill already says what is loading in words and
     the bar across the top already shows that something is running. A third
     thing spinning beside them said nothing extra. */
  .island .ring{display:none !important}
  .island{position:fixed;top:12px;left:50%;z-index:401;
          display:inline-flex;align-items:center;gap:11px;
          background:rgba(12,12,18,.94);color:#fff;
          -webkit-backdrop-filter:blur(14px) saturate(160%);
          backdrop-filter:blur(14px) saturate(160%);
          border-radius:999px;padding:9px 18px 9px 13px;
          font-size:12px;font-weight:700;letter-spacing:.1px;white-space:nowrap;
          max-width:min(560px,90vw);overflow:hidden;
          box-shadow:0 10px 30px rgba(0,0,0,.34), inset 0 0 0 .5px rgba(255,255,255,.14);
          pointer-events:none;
          transform:translateX(-50%) translateY(-26px) scale(.80);
          opacity:0;
          transition:transform .46s cubic-bezier(.34,1.56,.64,1),
                     opacity .2s ease}
  .island.on{transform:translateX(-50%) translateY(0) scale(1);opacity:1}

  /* The progress ring. One CSS variable drives it, set from the same number
     that drives the bar, so the two can never disagree. */
  .island .ring{width:17px;height:17px;border-radius:50%;flex:0 0 auto;position:relative;
       background:conic-gradient(#B07CFF calc(var(--p,0) * 1%), rgba(255,255,255,.16) 0);
       transition:background .34s linear}
  .island .ring:after{content:'';position:absolute;inset:3.5px;border-radius:50%;
       background:#0C0C12}
  .island .ring:before{content:'';position:absolute;inset:-3px;border-radius:50%;
       border:1px solid rgba(176,124,255,.35);animation:islepulse 1.6s ease-in-out infinite}
  @keyframes islepulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.12)}}

  /* The label morphs rather than cutting, so switching from one report to
     another feels like the same object changing its mind. */
  .island .txt{display:inline-block;overflow:hidden;text-overflow:ellipsis;
       transition:opacity .16s ease}
  .island.swap .txt{opacity:0}
  .island .pct{font-variant-numeric:tabular-nums;opacity:.55;font-weight:800;
       font-size:10.5px;min-width:30px;text-align:right}

  @media (prefers-reduced-motion: reduce){
    .island{transition:opacity .2s ease}
    .island .ring:before{animation:none}
    #bar i:after{animation:none}
  }
  /* The old spinner is kept out of the way rather than deleted, so any
     markup that still asks for one simply shows nothing. */
  .spin{display:none !important}
  .mini.load.needs{background:var(--violet);color:#fff;border-color:var(--violet)}
  .mini.load.needs svg{fill:#fff}
  .mini.load.needs:hover{background:#5F31A6;border-color:#5F31A6}
  .mini.load svg{width:13px;height:13px;fill:currentColor}
  .ready{text-align:center;padding:60px 20px;color:var(--mut);font-size:12.5px;line-height:1.9}
  .ready b{display:block;color:var(--navy);font-size:15px;margin-bottom:5px}

  .dnote{display:none;margin:0 auto;max-width:1500px;padding:8px 14px;
         background:#FFF0D9;color:#8A5B12;border:1px solid #F2DDB6;border-radius:9px;
         font-size:11.5px;font-weight:700}
  .dnote.on{display:block;margin:10px auto 0}
  /* ================= date range picker =================
     TWO calendars in ONE popover: the left picks the START date, the right
     picks the END date, each with its own month navigation. They open together
     and close together, and NOTHING loads until Apply.

     Replaced a pair of native date boxes that each opened their own calendar
     and reloaded the report in between. A one-calendar-two-months layout was
     tried first and dropped: it gave no clue which end you were setting. */
  .drwrap{position:relative;display:inline-flex}
  .drbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;
         border:1px solid var(--line);border-radius:8px;padding:7px 12px;
         font-family:inherit;font-size:12.5px;font-weight:700;color:var(--txt);
         cursor:pointer;white-space:nowrap;line-height:1}
  .drbtn:hover{border-color:var(--violet)}
  .drbtn.on{border-color:var(--violet);box-shadow:0 0 0 3px rgba(114,62,195,.13)}
  .drbtn svg{width:14px;height:14px;fill:var(--violet);flex:0 0 auto}
  .drbtn .drcar{font-size:9px;color:var(--mut)}
  .drbtn .drtxt{font-variant-numeric:tabular-nums}

  .drpop{position:absolute;top:calc(100% + 7px);left:0;z-index:400;display:none;
         background:#fff;border:1px solid var(--line);border-radius:12px;
         box-shadow:0 18px 46px rgba(37,42,69,.22);overflow:hidden}
  .drpop.on{display:flex}
  .drside{width:158px;border-right:1px solid var(--line);background:#FAFAFD;
          padding:8px;display:flex;flex-direction:column;gap:2px;
          max-height:400px;overflow:auto}
  .drside b{font-size:9px;font-weight:800;color:var(--mut);text-transform:uppercase;
            letter-spacing:.5px;padding:7px 8px 3px}
  .drps{text-align:left;background:none;border:0;border-radius:7px;padding:7px 9px;
        font-family:inherit;font-size:12px;font-weight:700;color:var(--txt);cursor:pointer;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drps:hover{background:#EFE9FA}
  .drps.on{background:var(--violet);color:#fff}

  .drmain{padding:12px 14px 0;display:flex;flex-direction:column}
  .drcals{display:flex;gap:16px}
  .drcal{width:232px}
  /* Each calendar says which end it owns, and what that end is currently set
     to. Without the label a user cannot tell the two apart at a glance. */
  .drcaphd{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .drtag{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
         background:#EFE9FA;color:var(--violet);padding:3px 8px;border-radius:99px}
  .drtag.end{background:#FFF0D9;color:#8A5B12}
  .drval{font-size:10.5px;font-weight:800;color:var(--navy);
         font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}

  .drnav{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .drnav button{width:24px;height:24px;border:1px solid var(--line);background:#fff;
                border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;
                font-weight:800;color:var(--navy);line-height:1;flex:0 0 auto}
  .drnav button:hover:not(:disabled){border-color:var(--violet);color:var(--violet)}
  .drnav button:disabled{opacity:.3;cursor:default}
  .drnav .drmo{flex:1 1 0;text-align:center;font-size:11.5px;font-weight:800;color:var(--navy)}

  .drcal table{border-collapse:collapse;table-layout:fixed;width:232px}
  .drcal th{width:33px;height:22px;font-size:9.5px;font-weight:800;color:var(--mut);
            text-transform:uppercase;background:none;position:static;padding:0;
            text-align:center;letter-spacing:0;border:0}
  .drcal td{width:33px;height:28px;padding:0;text-align:center;border:0;background:none}
  .drd{width:100%;height:28px;border:0;background:none;font-family:inherit;font-size:11.5px;
       font-weight:700;color:var(--txt);cursor:pointer;border-radius:6px}
  .drd:hover:not(:disabled){background:#EFE9FA}
  .drd:disabled{color:#CBCEDC;cursor:default}
  .drd.mid{background:#F3EFFB;border-radius:0}
  .drd.end{background:var(--violet);color:#fff;font-weight:800;border-radius:6px}
  .drd.today{outline:1px dashed var(--violet);outline-offset:-3px}
  /* A day the sheet holds nothing for. Still clickable on purpose: it means
     "this will come back empty", not "you may not ask". */
  .drd.nodata{color:#B9BDCE;font-weight:600}
  .drd.nodata:after{content:'';display:block;width:3px;height:3px;border-radius:50%;
                    background:#D6D9E4;margin:-4px auto 0}
  .drd.nodata.end{color:#fff}
  .drd.nodata.end:after{background:rgba(255,255,255,.6)}

  .drfoot{display:flex;align-items:center;gap:9px;padding:11px 0 13px;margin-top:8px;
          border-top:1px solid var(--line)}
  .drsel{font-size:11.5px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;
         white-space:nowrap}
  .drsel span{color:var(--mut);font-weight:700}
  .drfoot .drsp{flex:1 1 auto}
  .drfoot button{border:1px solid var(--line);background:#fff;border-radius:8px;
                 padding:8px 15px;font-family:inherit;font-size:12px;font-weight:800;
                 color:var(--navy);cursor:pointer}
  .drfoot button:hover{background:var(--cream);border-color:var(--peach)}
  .drfoot button.go{background:var(--violet);border-color:var(--violet);color:#fff}
  .drfoot button.go:hover{filter:brightness(1.08);background:var(--violet)}
  .drfoot button.go:disabled{opacity:.45;cursor:default;filter:none}

  @media(max-width:900px){
    .drpop{position:fixed;inset:auto 8px 8px 8px;flex-direction:column;max-height:88vh;overflow:auto}
    .drside{width:auto;border-right:0;border-bottom:1px solid var(--line);
            flex-direction:row;flex-wrap:wrap;max-height:none}
    .drcals{flex-direction:column;gap:14px}
    .drcal,.drcal table{width:100%}
  }


  /* ---------- trend only ---------- */
  .dir{font-size:12px;font-weight:800}
  .dir.up{color:var(--green)} .dir.dn{color:var(--red)} .dir.flat{color:var(--mut)}
  .spark{display:inline-block;vertical-align:-2px;margin-left:6px}
  .bandbar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin-top:6px}
  .bandbar i{display:block;height:100%}
  .bandkey{display:flex;gap:12px;font-size:10px;font-weight:700;color:var(--mut);margin-top:5px;flex-wrap:wrap}
  .bandkey b{color:var(--txt)}
  .delta{font-weight:800}
  .delta.up{color:var(--green)} .delta.dn{color:var(--red)}
</style>
</head>
<body>

<div id="bar"><i></i></div>
<div id="island" class="island">
  <span class="txt" id="isleTxt"></span>
  <span class="pct" id="islePct"></span>
</div>


<div class="strip">
  <h2>Cutting Efficiency Trend</h2>
  <div class="sep"></div>
  <label>Date range</label>
  <div class="drwrap">
    <button class="drbtn" id="drBtn" onclick="drToggle()" title="Choose the date range">
      <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 00-2 2v13a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 7v10H5V9h14z"/></svg>
      <span class="drtxt" id="drLabel">Loading&hellip;</span>
      <span class="drcar">&#9660;</span>
    </button>
    <div class="drpop" id="drPop">
      <div class="drside" id="drSide"></div>
      <div class="drmain">
        <div class="drcals">

          <div class="drcal">
            <div class="drcaphd"><span class="drtag">Start date</span>
              <span class="drval" id="drValA">not set</span></div>
            <div class="drnav">
              <button id="drPrevA" onclick="drShiftA(-1)" title="Previous month">&#8249;</button>
              <div class="drmo" id="drMoA"></div>
              <button id="drNextA" onclick="drShiftA(1)" title="Next month">&#8250;</button>
            </div>
            <div id="drCalA"></div>
          </div>

          <div class="drcal">
            <div class="drcaphd"><span class="drtag end">End date</span>
              <span class="drval" id="drValB">not set</span></div>
            <div class="drnav">
              <button id="drPrevB" onclick="drShiftB(-1)" title="Previous month">&#8249;</button>
              <div class="drmo" id="drMoB"></div>
              <button id="drNextB" onclick="drShiftB(1)" title="Next month">&#8250;</button>
            </div>
            <div id="drCalB"></div>
          </div>

        </div>
        <div class="drfoot">
          <div class="drsel" id="drSel"></div>
          <div class="drsp"></div>
          <button onclick="drCancel()">Cancel</button>
          <button class="go" id="drGo" onclick="drApply()">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- The old boxes stay as hidden state. Everything downstream, the export,
       the allowance note, the cache keys, still reads f1 and t1, so the picker
       only has to keep them in step instead of every call site being rewritten. -->
  <input type="hidden" id="f1"><input type="hidden" id="t1">
  <button class="mini load needs" id="loadBtn" onclick="doLoad()" title="Load this range">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 106 18.36l1.42-1.42A6 6 0 1112 18a5.94 5.94 0 01-4.24-1.76L6.34 17.66A8 8 0 1017.65 6.35zM13 3v6h6l-2.35-2.65z"/></svg>
    <span id="loadTxt">Load</span>
  </button>
  <span class="showing" id="showing"></span>
  <div class="sep"></div>
  <div class="chips" id="scopeChips"></div>
  <div class="acts">
    <button class="mini xls" onclick="exportExcel()" title="Export to Excel">
      <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg> Excel
    </button>
    <button class="mini prn" onclick="window.print()" title="Print">
      <svg viewBox="0 0 24 24"><path d="M19 8H5a3 3 0 00-3 3v6h4v4h12v-4h4v-6a3 3 0 00-3-3zm-3 11H8v-5h8v5zm3-8a1 1 0 110-2 1 1 0 010 2zM18 3H6v4h12V3z"/></svg> Print
    </button>
  </div>
</div>

<div id="dnote" class="dnote"></div>
<div id="content"><div class="loading">Loading&hellip;</div></div>

<script>
/* =====================================================================
   DATE RANGE PICKER
   ---------------------------------------------------------------------
   TWO calendars: the left one picks the START date, the right one picks the
   END date. Each has its own month navigation. They live in ONE popover, so
   both ends open together and close together, and NOTHING is fetched until
   Apply. The old control was a pair of native date boxes that each opened
   their own calendar and reloaded the report in between, so choosing
   "1 Aug to 19 Aug" loaded 1 Aug to 1 Aug first.

   An earlier build here showed one calendar spanning two months. That reads
   as a single scrolling strip and gives no clue which end you are setting,
   so it is now one labelled calendar per end.

   The host page supplies four things through drInit():
     presets   [{k, label, get:function(){return [from,to]}}], groups via {group:'..'}
     apply     function(from,to,presetKey) - the ONLY place data is fetched
     min,max   optional ISO bounds; days outside are shown but not clickable
     label     optional function(from,to,presetKey) for the button text
   ===================================================================== */
var DR = {
  from:'', to:'', preset:'', viewA:null, viewB:null,
  presets:[], apply:null, min:'', max:'', label:null, open:false, _wired:false
};

function drIso(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function drParse(s){
  var p=String(s||'').split('-');
  if(p.length!==3) return null;
  var d=new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
var DR_MON=['January','February','March','April','May','June','July','August',
            'September','October','November','December'];
var DR_MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function drPretty(iso){
  var d=drParse(iso); if(!d) return '-';
  return d.getDate()+' '+DR_MONS[d.getMonth()]+' '+d.getFullYear();
}
function drEl(i){ return document.getElementById(i); }
function drMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }

/* SNOWTEX weeks run WEDNESDAY to TUESDAY. Not the calendar week, and not
   Saturday to Thursday. Every This Week / Last Week preset uses this. */
function drWeekStart(d){
  var x=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var back=(x.getDay()-3+7)%7;          /* 3 = Wednesday */
  x.setDate(x.getDate()-back);
  return x;
}

function drInit(o){
  DR.presets = o.presets||[];
  DR.apply   = o.apply;
  DR.label   = o.label||null;

  /* ---------- WHAT IS SELECTABLE ----------
     min and max used to be the first and last date the SHEET holds, and days
     outside that were disabled. That looked tidy and was wrong: the report for
     yesterday is not pushed until the morning, so yesterday itself could not
     be clicked. A date the user cannot select is a dead end; a date with no
     data is merely an empty report, which is honest and recoverable.

     So the ONLY hard stop is the future, because data cannot exist there.
     Days the sheet has no rows for are still clickable, just marked. */
  DR.min = o.min||'';                       /* soft floor, for month paging */
  DR.max = drIso(new Date());               /* today, always */
  DR.has = {};
  (o.days||[]).forEach(function(d){ DR.has[d]=true; });
  DR.hasAny = (o.days||[]).length>0;

  /* Wired ONCE. drInit runs again whenever the available dates change, and a
     second set of listeners would close the popover on its own outside-click
     check firing twice. */
  if(DR._wired) return;
  DR._wired = true;

  /* THE POPOVER MUST NOT CLOSE ON ITS OWN CLICKS.
     drRender() replaces the calendar markup on every click, so by the time a
     click bubbled up to document the element that was clicked had already been
     removed from the DOM. pop.contains(target) was then false and the panel
     closed itself the moment a date was picked. Stopping propagation at the
     popover means the document listener only ever sees genuine outside
     clicks, and it cannot be fooled by a re-render. */
  var pop=drEl('drPop');
  if(pop) pop.addEventListener('click', function(ev){ ev.stopPropagation(); });

  document.addEventListener('click', function(ev){
    if(!DR.open) return;
    var btn=drEl('drBtn');
    if(btn && btn.contains(ev.target)) return;
    drClose();
  });
  document.addEventListener('keydown', function(ev){
    if(DR.open && ev.key==='Escape') drClose();
  });
}

/* Set the range WITHOUT opening or fetching. Used on first load. */
function drSet(from,to,preset){
  DR.from=from||''; DR.to=to||''; DR.preset=preset||'';
  drSyncBtn();
}
function drSyncBtn(){
  var t=drEl('drLabel'); if(!t) return;
  if(DR.label){ t.textContent=DR.label(DR.from,DR.to,DR.preset); return; }
  var named=null;
  DR.presets.forEach(function(p){ if(p.k && p.k===DR.preset) named=p.label; });
  t.textContent = named ? named
    : (DR.from&&DR.to ? (DR.from===DR.to ? drPretty(DR.from)
                                         : drPretty(DR.from)+'  –  '+drPretty(DR.to))
                      : 'Pick a date range');
}

function drToggle(){ DR.open ? drClose() : drOpen(); }

function drOpen(){
  DR.open=true;
  DR.dfrom=DR.from; DR.dto=DR.to; DR.dpreset=DR.preset;   /* draft, Cancel restores */
  drSyncViews();
  drEl('drPop').classList.add('on');
  drEl('drBtn').classList.add('on');
  drRender();
}
function drClose(){
  DR.open=false;
  var p=drEl('drPop'), b=drEl('drBtn');
  if(p) p.classList.remove('on');
  if(b) b.classList.remove('on');
}

/* Each calendar opens on its own end of the range. */
function drSyncViews(){
  var a=drParse(DR.dfrom)||new Date();
  var b=drParse(DR.dto)||a;
  DR.viewA=drMonth(a);
  DR.viewB=drMonth(b);
}

function drShiftA(n){ DR.viewA=new Date(DR.viewA.getFullYear(), DR.viewA.getMonth()+n, 1); drRender(); }
function drShiftB(n){ DR.viewB=new Date(DR.viewB.getFullYear(), DR.viewB.getMonth()+n, 1); drRender(); }

/* A preset fills the draft and shows it on both calendars. It does NOT fetch:
   Apply is still the one action that loads, so a mis-click costs nothing. */
function drPreset(k){
  var p=null;
  DR.presets.forEach(function(x){ if(x.k===k) p=x; });
  if(!p||!p.get) return;
  var r=[];
  /* A preset asked before the date list has arrived cannot work out its range.
     Say so instead of silently clearing both ends, which looked like the
     button had done nothing. */
  try{ r=p.get()||[]; }catch(e){ r=[]; }
  if(!r[0]||!r[1]){
    var sel=drEl('drSel');
    if(sel) sel.innerHTML='<span>Still loading the available days, try again in a moment</span>';
    return;
  }
  DR.dfrom=r[0]; DR.dto=r[1]; DR.dpreset=k;
  drSyncViews();
  drRender();
}

/* which is 'a' for the start calendar, 'b' for the end one. Each sets only
   its own end, so there is no hidden click order to learn. */
function drDayClick(iso, which){
  if(which==='a'){
    DR.dfrom=iso;
    if(DR.dto && DR.dto<iso) DR.dto=iso;      /* end cannot sit before start */
  }else{
    DR.dto=iso;
    if(DR.dfrom && DR.dfrom>iso) DR.dfrom=iso;
  }
  DR.dpreset='';                              /* hand-picked, so not a preset */
  drRender();
}

function drCal(view, which){
  var y=view.getFullYear(), m=view.getMonth();
  var lead=new Date(y,m,1).getDay();
  var days=new Date(y,m+1,0).getDate();
  var today=drIso(new Date());
  var mine=(which==='a')?DR.dfrom:DR.dto;

  var h='<table><thead><tr>'
      + ['S','M','T','W','T','F','S'].map(function(d){return '<th>'+d+'</th>'}).join('')
      + '</tr></thead><tbody><tr>';
  for(var i=0;i<lead;i++) h+='<td></td>';
  for(var d=1;d<=days;d++){
    if((lead+d-1)%7===0 && d>1) h+='</tr><tr>';
    var iso=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+d).slice(-2);
    /* Only the future is blocked. Everything else can be picked. */
    var out=(iso>DR.max);
    var cls=[], tip='';
    /* The days between the two ends are shaded on BOTH calendars, so the span
       is still readable even though each calendar owns one end. */
    if(DR.dfrom&&DR.dto&&iso>DR.dfrom&&iso<DR.dto) cls.push('mid');
    if(iso===mine) cls.push('end');
    if(iso===today) cls.push('today');
    /* Marked, not disabled. It tells the user the report will be empty
       without taking the choice away from them. */
    if(!out && DR.hasAny && !DR.has[iso]){ cls.push('nodata'); tip=' title="No data pushed for this day yet"'; }
    h+='<td><button class="drd '+cls.join(' ')+'"'+(out?' disabled':'')+tip
     + ' onclick="drDayClick(\''+iso+'\',\''+which+'\')">'+d+'</button></td>';
  }
  return h+'</tr></tbody></table>';
}

/* =====================================================================
   SNOWTEX - Cutting Efficiency Trend
   ---------------------------------------------------------------------
   A SUMMARY over a date range, not another row-level report. The Daily and
   Weekly reports already answer "who did what". This answers "which way is
   it going, and what is taking the time away".

   Two sources, because neither holds the whole picture:
     EFF_API  ?action=data&from=&to=   rows carry floor, operator, input min,
                                        output min, eff% and loss min PLUS the
                                        date (field 11, added 20-Aug-2026)
     PIB_API  ?action=lossrange&from=&to=  loss ROLLED UP by reason, floor,
                                        date and operator. The reasons live in
                                        the PIB sheet and are deliberately not
                                        duplicated into the efficiency sheet.

   Eff% is ALWAYS Sum(Output Min) / Sum(Input Min) x 100 over whatever is being
   summarised. Averaging daily percentages is never done: a two hour Saturday
   would then weigh the same as a full Tuesday.
   ===================================================================== */
/* The edge cache on this same origin, with the Apps Script deployment behind
   it. Nothing on this page fetches until Load is pressed, so this one small
   probe has always settled by the time a URL is built. */
var EFF_EDGE   = "/api/eff";
var EFF_DIRECT = "https://script.google.com/macros/s/AKfycbxQ2BmHNHGuMpy244VH_Tl2CwlB9Yu6HZUfg28XvqR4TWPcQowPQSMQuaNR27-wuSSP/exec";
var EFF_API    = EFF_EDGE;

try{
  fetch(EFF_EDGE+'?action=ping',{cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if(!j || !j.ok) EFF_API = EFF_DIRECT; })
    .catch(function(){ EFF_API = EFF_DIRECT; });
}catch(e){ EFF_API = EFF_DIRECT; }
var PIB_API = "https://script.google.com/macros/s/AKfycbxsRF9KqFfg5zGntReKUCZxj_8lpVcT3GJwg5gmqTDQqGROzc-61uAeEavSprQMdYx2/exec";

var FLOOR_ORDER=['1A','1B','1C','1D','1E','3A','2A','2B','2C','2D','2E'];
var SOL=['1A','1B','1C','1D','1E','3A'], SSL=['2A','2B','2C','2D','2E'];
var CACHE_PFX='sosl_trend_';

var ROWS=[], LOSS=null, DATES=[], STAMP='';
/* The exact URL of the last data call, so an empty result can show what was
   actually asked for instead of leaving everyone guessing. */
var LASTURL='';
var scopeSel='';           /* '', 'SOL', 'SSL', or one floor */
var D=null;                /* everything the page draws, built by build() */

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n,d){return (n==null||isNaN(n))?'-':Number(n).toFixed(d==null?0:d)}
function num(n){return (n==null||isNaN(n))?'-':Number(n).toLocaleString(undefined,{maximumFractionDigits:0})}
var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function prettyDate(iso){
  var p=String(iso||'').split('-'); if(p.length!==3) return iso||'-';
  return Number(p[2])+' '+MONS[Number(p[1])-1]+', '+p[0];
}
function shortDate(iso){
  var p=String(iso||'').split('-'); if(p.length!==3) return iso||'';
  return Number(p[2])+' '+MONS[Number(p[1])-1];
}
function pctClass(p){ return p<65?'red':(p<90?'amber':'green'); }
function effColour(p){ return p<65?'#D64550':(p<90?'#C77700':'#1E8E4E'); }

/* ---------- progress ----------
   Eases toward 90 and waits there. The step shrinks as it climbs, so a slow
   request crawls rather than stalling dead or pretending to have finished. */
var BAR_P=0, BAR_T=null, BAR_HIDE=null;
function barPaint(){
  var b=$('bar'), i=b?b.firstChild:null;
  if(i) i.style.width=BAR_P+'%';
  var p=$('islePct');
  if(p) p.textContent = BAR_P>=100 ? '100%' : Math.round(BAR_P)+'%';
}
function barTick(){
  if(BAR_P<90) BAR_P += Math.max(0.4,(90-BAR_P)*0.10);
  barPaint();
}
function barStart(){
  if(BAR_HIDE){ clearTimeout(BAR_HIDE); BAR_HIDE=null; }
  if(BAR_T) clearInterval(BAR_T);
  BAR_P=8; barPaint();                 /* every run begins at the LEFT */
  $('bar').className='bar on';
  BAR_T=setInterval(barTick,280);
}
function barStop(){
  if(BAR_T){ clearInterval(BAR_T); BAR_T=null; }
  BAR_P=100; barPaint();
  /* Let 100% be seen, or the bar looks like it gave up at 80. */
  BAR_HIDE=setTimeout(function(){
    $('bar').className='bar';
    setTimeout(function(){ BAR_P=0; barPaint(); },320);
  },360);
}
function barBusy(on){ if(on) barStart(); else barStop(); }
function track(p){ barBusy(true); return p.then(function(v){barBusy(false);return v},
                                                function(e){barBusy(false);throw e}); }

/* =====================================================================
   ONE LOADING CONTRACT  (see daily.html for the reasoning)
   ===================================================================== */
var RUN={seq:0,label:''};
function islandShow(t){
  var i=$('island'), x=$('isleTxt');
  if(!i||!x) return;
  x.textContent=t; i.classList.add('on');
}
function islandHide(){ var i=$('island'); if(i) i.classList.remove('on'); }

function runBegin(label){
  RUN.seq++; RUN.label=label;
  /* Restart from the left. Changing the date mid-load has to LOOK like a new
     request, not like the old one carrying on. */
  barStart();
  islandShow(label);
  $('showing').textContent=label+'\u2026';
  return RUN.seq;
}
function runCurrent(tok){ return tok===RUN.seq; }
function runEnd(tok){
  if(tok!==RUN.seq) return;
  barBusy(false); islandHide();
}

var DIRTY=true, LOADED=false;
function markDirty(){ DIRTY=true; paintLoadBtn(); }
function paintLoadBtn(){
  var b=$('loadBtn'); if(!b) return;
  var t=$('loadTxt');
  var needs = DIRTY || !LOADED;
  b.classList.toggle('needs', needs);
  if(t) t.textContent = needs ? 'Load' : 'Reload';
  b.title = needs ? 'Load this range' : 'Read this range again';
}
function showReady(){
  LOADED=false;
  $('content').innerHTML='<div class="ready"><b>Choose a date range, then press Load.</b>'
    +'Nothing is read from the sheet until you press it, so this page opens instantly.</div>';
}
function doLoad(){ load($('f1').value, $('t1').value, true); }
function busy(msg){ $('content').innerHTML='<div class="loading">'+esc(msg)+'</div>'; }
function showErr(e){
  $('content').innerHTML='<div class="err"><b>Could not load.</b><br>'+esc(e&&e.message?e.message:e)
   +'<br><br>If this mentions a token or a page instead of data, the Apps Script '
   +'needs <b>Deploy &rarr; Manage deployments &rarr; New version</b>.</div>';
}
function tellParent(s){ if(window.parent!==window) window.parent.postMessage({type:'stamp',value:s},'*') }

/* ---------- shared range with the other reports ---------- */
var SD_FROM='sosl_dash_from', SD_TO='sosl_dash_to', SD_DAY='sosl_dash_day';
function ssRead(k){ try{return sessionStorage.getItem(k)||''}catch(e){return ''} }
function ssWrite(k,v){ try{sessionStorage.setItem(k,v||'')}catch(e){} }
function isoOf(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function yesterdayISO(){var d=new Date();d.setDate(d.getDate()-1);return isoOf(d)}
function shareRange(a,b){ if(a)ssWrite(SD_FROM,a); if(b)ssWrite(SD_TO,b); }

/* ---------- fetch ---------- */
function cacheGet(k){ try{var v=sessionStorage.getItem(CACHE_PFX+k);return v?JSON.parse(v):null}catch(e){return null} }
function cacheSet(k,o){ try{sessionStorage.setItem(CACHE_PFX+k,JSON.stringify(o))}catch(e){} }

function load(from,to,force){
  shareRange(from,to); ssWrite(SD_DAY,to);
  $('f1').value=from; $('t1').value=to;
  $('showing').textContent=prettyDate(from)+' to '+prettyDate(to);

  var key=from+'|'+to;
  var hit=force?null:cacheGet(key);
  if(hit){
    ROWS=(hit.rows||[]).map(mapRow); LOSS=hit.loss||null; STAMP=hit.stamp||'';
    build(); render();
    LOADED=true; DIRTY=false; paintLoadBtn();
    return;
  }

  var label='Cutting Efficiency Trend, '+prettyDate(from)+' to '+prettyDate(to);
  var tok=runBegin(label);
  busy(label+'\u2026');

  /* Both calls go out together. The loss analysis is not allowed to sink the
     page: if the PIB sheet is unreachable the efficiency trend still draws and
     the loss cards say so. */
  LASTURL = EFF_API+'?action=data&from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to);
  var a=fetch(LASTURL,{cache:'no-store'})
        .then(function(r){ if(!r.ok) throw new Error('Efficiency API '+r.status); return r.json() });
  var b=fetch(PIB_API+'?action=lossrange&from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to),{cache:'no-store'})
        .then(function(r){ return r.ok ? r.json() : null })
        .catch(function(){ return null });

  Promise.all([a,b]).then(function(res){
    if(!runCurrent(tok)) return;        /* superseded by a newer Load */
    runEnd(tok);
    var d=res[0]||{};
    if(d.error) throw new Error(d.error);
    ROWS=(d.rows||[]).map(mapRow);
    LOSS=(res[1]&&res[1].ok)?res[1]:null;
    STAMP=d.generatedAt||'';
    cacheSet(key,{rows:d.rows||[],loss:LOSS,stamp:STAMP});
    build(); render();
    LOADED=true; DIRTY=false; paintLoadBtn();
  }).catch(function(e){
    if(!runCurrent(tok)) return;
    runEnd(tok); showErr(e);
  });
}

/* Field 11 is the date. An API deployed before 20-Aug-2026 does not send it,
   and without a date there is no trend to draw, so that is stated plainly
   rather than showing an empty chart. */
function mapRow(r){
  return { floor:r[0], opId:String(r[1]||''), name:String(r[2]||''), desig:String(r[3]||''),
           wh:+r[4]||0, eng:+r[5]||0, types:String(r[6]||''),
           inMin:+r[7]||0, outMin:+r[8]||0, eff:+r[9]||0, lossMin:+r[10]||0,
           date:String(r[11]||'') };
}

/* ---------- scope ---------- */
function inScope(f){
  if(!scopeSel) return true;
  if(scopeSel==='SOL') return SOL.indexOf(f)>=0;
  if(scopeSel==='SSL') return SSL.indexOf(f)>=0;
  return f===scopeSel;
}
function setScope(s){ scopeSel=(scopeSel===s)?'':s; buildChips(); build(); render(); }
function buildChips(){
  var h='<button class="chip'+(!scopeSel?' on':'')+'" onclick="setScope(\'\')">All Floors</button>'
       +'<button class="chip'+(scopeSel==='SOL'?' on':'')+'" onclick="setScope(\'SOL\')">SOL</button>'
       +'<button class="chip'+(scopeSel==='SSL'?' on':'')+'" onclick="setScope(\'SSL\')">SSL</button>';
  var list = scopeSel==='SOL'?SOL : scopeSel==='SSL'?SSL : FLOOR_ORDER;
  list.forEach(function(f){
    h+='<button class="chip'+(scopeSel===f?' on':'')+'" onclick="setScope(\''+f+'\')">'+f+'</button>';
  });
  $('scopeChips').innerHTML=h;
}

/* =====================================================================
   BUILD - every figure the page draws, worked out once per render
   ===================================================================== */
function build(){
  var rows=ROWS.filter(function(r){ return r.date && inScope(r.floor) });

  /* ---- by date ---- */
  var day={}, dates={};
  rows.forEach(function(r){
    dates[r.date]=1;
    var d=day[r.date]||(day[r.date]={date:r.date,inMin:0,outMin:0,loss:0,men:{},lo:0,mid:0,hi:0});
    d.inMin+=r.inMin; d.outMin+=r.outMin; d.loss+=r.lossMin;
    d.men[r.floor+'|'+r.opId]=1;
    /* Bands are per operator-day here on purpose: this chart is about how the
       floor looked ON each day, not how a man averaged over the period. */
    if(r.eff<65) d.lo++; else if(r.eff<90) d.mid++; else d.hi++;
  });
  DATES=Object.keys(dates).sort();
  var byDay=DATES.map(function(k){
    var d=day[k];
    d.eff=d.inMin>0?(d.outMin/d.inMin*100):0;
    d.man=Object.keys(d.men).length;
    return d;
  });

  /* ---- by floor ---- */
  var fl={};
  rows.forEach(function(r){
    var f=fl[r.floor]||(fl[r.floor]={floor:r.floor,inMin:0,outMin:0,loss:0,men:{},days:{}});
    f.inMin+=r.inMin; f.outMin+=r.outMin; f.loss+=r.lossMin;
    f.men[r.opId]=1; f.days[r.date]=1;
  });
  var byFloor=FLOOR_ORDER.filter(function(f){return fl[f]}).map(function(k){
    var f=fl[k];
    f.eff=f.inMin>0?(f.outMin/f.inMin*100):0;
    f.man=Object.keys(f.men).length;
    f.nDays=Object.keys(f.days).length;
    return f;
  });

  /* ---- floor x date, for the heatmap ---- */
  var cell={};
  rows.forEach(function(r){
    var k=r.floor+'|'+r.date;
    var c=cell[k]||(cell[k]={inMin:0,outMin:0,loss:0});
    c.inMin+=r.inMin; c.outMin+=r.outMin; c.loss+=r.lossMin;
  });
  Object.keys(cell).forEach(function(k){
    var c=cell[k]; c.eff=c.inMin>0?(c.outMin/c.inMin*100):null;
  });

  /* ---- per operator over the whole range ---- */
  var op={};
  rows.forEach(function(r){
    var k=r.floor+'|'+r.opId;
    var o=op[k]||(op[k]={floor:r.floor,opId:r.opId,name:r.name,desig:r.desig,
                          inMin:0,outMin:0,loss:0,days:{},first:null,last:null});
    o.inMin+=r.inMin; o.outMin+=r.outMin; o.loss+=r.lossMin;
    o.days[r.date]=(o.days[r.date]||{inMin:0,outMin:0});
    o.days[r.date].inMin+=r.inMin; o.days[r.date].outMin+=r.outMin;
    if(r.name) o.name=r.name;
    if(r.desig) o.desig=r.desig;
  });
  var ops=Object.keys(op).map(function(k){
    var o=op[k];
    o.eff=o.inMin>0?(o.outMin/o.inMin*100):0;
    o.nDays=Object.keys(o.days).length;
    /* First half against second half of the days this man actually worked.
       A plain first-day to last-day comparison turns one bad Tuesday into a
       "decline", which is noise, not a trend. */
    var ks=Object.keys(o.days).sort();
    var half=Math.floor(ks.length/2);
    if(ks.length>=4){
      var A={i:0,o:0}, B={i:0,o:0};
      ks.slice(0,half).forEach(function(d){A.i+=o.days[d].inMin;A.o+=o.days[d].outMin});
      ks.slice(ks.length-half).forEach(function(d){B.i+=o.days[d].inMin;B.o+=o.days[d].outMin});
      o.first=A.i>0?(A.o/A.i*100):null;
      o.last =B.i>0?(B.o/B.i*100):null;
      o.delta=(o.first!=null&&o.last!=null)?(o.last-o.first):null;
    }else o.delta=null;
    return o;
  });

  /* ---- band mix over the period, per OPERATOR average ---- */
  var band={lo:0,mid:0,hi:0};
  ops.forEach(function(o){ if(o.eff<65)band.lo++; else if(o.eff<90)band.mid++; else band.hi++; });

  var tIn=0,tOut=0,tLoss=0;
  rows.forEach(function(r){ tIn+=r.inMin; tOut+=r.outMin; tLoss+=r.lossMin; });

  /* First half vs second half of the PERIOD, the headline direction. */
  var h=Math.floor(byDay.length/2), dir=null;
  if(byDay.length>=4){
    var A={i:0,o:0},B={i:0,o:0};
    byDay.slice(0,h).forEach(function(d){A.i+=d.inMin;A.o+=d.outMin});
    byDay.slice(byDay.length-h).forEach(function(d){B.i+=d.inMin;B.o+=d.outMin});
    if(A.i>0&&B.i>0) dir=(B.o/B.i*100)-(A.o/A.i*100);
  }

  D={
    rows:rows, byDay:byDay, byFloor:byFloor, cell:cell, ops:ops, band:band,
    dates:DATES,
    totals:{ inMin:tIn, outMin:tOut, loss:tLoss,
             eff:tIn>0?(tOut/tIn*100):0,
             men:ops.length, days:byDay.length, dir:dir }
  };
}

/* =====================================================================
   CHARTS - hand drawn SVG, no library
   A charting library would be another CDN dependency on a factory network
   that is not always friendly to them, for four chart types.
   ===================================================================== */

/* =====================================================================
   RENDER  -  built on the Weekly Fabric report's layout on purpose.
   Same sticky headings, same matrix, same sortable tables, same chart
   hover, so moving between the two reports feels like one product.
   ===================================================================== */
function render(){
  if(!D) return;
  tellParent(STAMP||prettyDate($('t1').value));
  syncLabels();

  if(!D.rows.length){ renderEmpty(); return; }

  var T=D.totals, h='';

  /* ---------- KPI strip ---------- */
  var dirCls = T.dir==null?'flat':(T.dir>=0.05?'up':(T.dir<=-0.05?'dn':'flat'));
  var dirTxt = T.dir==null ? 'not enough days'
             : (Math.abs(T.dir)<0.05 ? 'holding level'
             : (T.dir>0?'▲ ':'▼ ')+fmt(Math.abs(T.dir),1)+' pts');

  h+='<div class="kpis">'
   + kpi('',   'Overall Eff%', fmt(T.eff,1)+'%', '&Sigma; Output Min &divide; &Sigma; Input Min', pctClass(T.eff))
   + kpi('k2', 'Direction', '<span class="dir '+dirCls+'">'+dirTxt+'</span>',
              'second half of the period vs the first')
   + kpi('k3', 'Loss Time', fmt(T.loss/60,1)+' hrs', num(T.loss)+' min across '+T.days+' day(s)')
   + kpi('k4', 'Operators', num(T.men), 'with data in this range')
   + kpi('k5', 'Best Day', T.bestDay?fmt(T.bestEff,1)+'%':'&ndash;',
              T.bestDay?prettyDate(T.bestDay):'no days')
   +'</div>';

  /* ---------- the trend chart ---------- */
  h+='<div class="card"><div class="hd"><h3>'+esc(headTitle('Efficiency and Loss by Day'))+'</h3>'
   + '<span class="hint">'+T.days+' day(s) &bull; hover for the detail</span></div>'
   + '<div class="bd"><div class="chartwrap" id="chartwrap">'
   + '<div class="chtip" id="chtip"></div><div id="chhost"></div></div></div>'
   + '<div class="lgd">'
   + lg('#723EC3','Eff% (line, right axis)')
   + lg('#C77700','Loss minutes (bars, left axis)')
   + lg('#1E8E4E','90% guide') + lg('#D64550','65% guide')
   + '</div></div>';

  /* ---------- band mix ---------- */
  h+='<div class="card"><div class="hd"><h3>'+esc(headTitle('Operators by Eff% Band'))+'</h3>'
   + '<span class="hint">each operator counted once, on his own average</span></div>'
   + '<div class="bd">'+bandBlock()+'</div></div>';

  /* ---------- two matrices, exactly like the weekly report ---------- */
  h+='<div class="card"><div class="hd"><h3>'+esc(headTitle('Eff% by Floor and Date'))+'</h3>'
   + '<span class="hint">'+D.dates.length+' day(s)</span></div>'+mx('eff')+'</div>';

  h+='<div class="card"><div class="hd"><h3>'+esc(headTitle('Loss Minutes by Floor and Date'))+'</h3>'
   + '<span class="hint">'+num(T.loss)+' min total</span></div>'+mx('loss')+'</div>';

  /* ---------- floor ranking + loss by reason ---------- */
  h+='<div class="two">'
   + '<div class="card" id="floorcard"><div class="hd"><h3>'+esc(headTitle('Floor Ranking'))+'</h3>'
   + '<span class="push"></span><span class="hint">click a heading to sort</span></div>'
   + floorTable()+'</div>'
   + '<div class="card" id="losscard"><div class="hd"><h3>'+esc(headTitle('Loss Time by Reason'))+'</h3>'
   + '<span class="hint">'+(LOSS?num((LOSS.totals||{}).min||0)+' min':'not loaded')+'</span></div>'
   + '<div class="bd">'+reasonBars()+'</div></div>'
   + '</div>';

  /* ---------- movers ---------- */
  h+=moverBlock();

  h+='<div class="note"><b>Eff%</b> is always &Sigma; Output Min &divide; &Sigma; Input Min for whatever is '
   +'being summarised, never the average of daily percentages, so a short day cannot weigh the same as a '
   +'full one. <b>Loss time</b> is already deducted from Input Min by the sheet, so it explains a figure '
   +'rather than adding to it. <b>Direction</b> compares the second half of the period with the first, '
   +'which is steadier than first day against last.</div>';

  $('content').innerHTML='<div class="wrap">'+h+'</div>';
  drawChart();
  syncStickyOffsets();
}

/* ---------- matrix, floor down the side, date across ---------- */
function mx(kind){
  var floors=D.byFloor.map(function(f){return f.floor});
  if(!floors.length||!D.dates.length) return '<div class="bd"><div class="empty">Nothing in this range.</div></div>';

  var h='<div class="mx"><table><thead><tr><th>Floor</th>';
  D.dates.forEach(function(d){ h+='<th>'+esc(shortDate(d))+'</th>' });
  h+='<th>'+(kind==='eff'?'Period':'Total')+'</th></tr></thead><tbody>';

  var maxLoss=0;
  if(kind==='loss') D.dates.forEach(function(d){ floors.forEach(function(f){
    var c=D.cell[f+'|'+d]; if(c&&c.loss>maxLoss) maxLoss=c.loss; }) });

  floors.forEach(function(f){
    var fr=D.byFloor.filter(function(x){return x.floor===f})[0];
    h+='<tr><td>'+esc(f)+'</td>';
    D.dates.forEach(function(d){
      var c=D.cell[f+'|'+d];
      if(!c){ h+='<td class="na">&ndash;</td>'; return; }
      if(kind==='eff'){
        h+='<td class="cell" style="background:'+effBg(c.eff)+';color:'+effFg(c.eff)+'" title="'
          +esc(f+'  '+prettyDate(d)+'\nEff '+fmt(c.eff,1)+'%')+'">'+fmt(c.eff,0)+'</td>';
      }else{
        var a=maxLoss?c.loss/maxLoss:0;
        h+='<td class="cell" style="background:rgba(199,119,0,'+(0.08+a*0.72).toFixed(2)+');color:'
          +(a>0.55?'#fff':'#5A3B00')+'" title="'+esc(f+'  '+prettyDate(d)+'\n'+num(c.loss)+' min')+'">'
          +(c.loss?num(c.loss):'&ndash;')+'</td>';
      }
    });
    h+= kind==='eff'
      ? '<td class="cell" style="background:'+effBg(fr.eff)+';color:'+effFg(fr.eff)+'">'+fmt(fr.eff,1)+'</td>'
      : '<td class="cell"><b>'+num(fr.loss)+'</b></td>';
    h+='</tr>';
  });

  /* the totals row, pinned to the bottom of the box */
  h+='</tbody><tfoot><tr><td>All</td>';
  D.dates.forEach(function(d){
    var day=D.byDay.filter(function(x){return x.date===d})[0];
    h+='<td>'+(kind==='eff' ? (day?fmt(day.eff,0):'&ndash;') : (day&&day.loss?num(day.loss):'&ndash;'))+'</td>';
  });
  h+='<td>'+(kind==='eff'?fmt(D.totals.eff,1):num(D.totals.loss))+'</td></tr></tfoot></table></div>';
  return h;
}
function effBg(p){ return p<65?'#D64550':(p<90?'#1E8E4E':'#1D6FD0') }

/* ---------- the day chart ----------
   Loss minutes as bars on the left axis, Eff% as a line on the right, with the
   65 and 90 guides drawn in. Hovering anywhere gives the whole day, the same
   way the Weekly Fabric chart does. */
var CH={pts:[],L:0,iw:0,n:0,W:1000};
function drawChart(){
  var host=$('chhost'); if(!host||!D||!D.byDay.length) return;
  var W=Math.max(560,Math.floor(host.clientWidth||960));
  host.innerHTML=chartSvg(D.byDay,W);
  wireChart();
}
window.addEventListener('resize',function(){ if(D) drawChart(); });

function chartSvg(days,W){
  var H=300,L=52,R=54,T=18,B=38, iw=W-L-R, ih=H-T-B, n=days.length;
  var maxLoss=0; days.forEach(function(d){ if(d.loss>maxLoss)maxLoss=d.loss });
  if(maxLoss<=0) maxLoss=1;
  var lo=100,hi=0; days.forEach(function(d){ if(d.eff<lo)lo=d.eff; if(d.eff>hi)hi=d.eff });
  lo=Math.max(0,Math.min(60,Math.floor(lo/10)*10-5));
  hi=Math.min(150,Math.max(100,Math.ceil(hi/10)*10+5));
  function y(v){ return T+ih-((v-lo)/(hi-lo))*ih }
  function x(i){ return L+(n===1?iw/2:(i/(n-1))*iw) }
  var bw=Math.max(4,Math.min(30,iw/Math.max(1,n)*0.46));

  var h='<svg id="chartsvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" '
      + 'style="display:block;width:100%;height:auto;cursor:crosshair">';

  [65,90,100].forEach(function(v){
    if(v<lo||v>hi) return;
    var yy=y(v), c=(v===65?'#F3C8CC':v===90?'#CFE6D8':'#E4E6F0');
    h+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="'+c+'" stroke-width="1" '
      +'stroke-dasharray="'+(v===100?'2 4':'5 4')+'"/>'
      +'<text x="'+(W-R+8)+'" y="'+(yy+3.5)+'" font-size="9.5" fill="#7A81A0" font-weight="700">'+v+'%</text>';
  });

  days.forEach(function(d,i){
    if(!(d.loss>0)) return;
    var bh=(d.loss/maxLoss)*(ih*0.45);
    h+='<rect id="bar'+i+'" x="'+(x(i)-bw/2)+'" y="'+(T+ih-bh)+'" width="'+bw+'" height="'+bh
      +'" fill="#C77700" fill-opacity="0.38" rx="2"/>';
  });
  h+='<text x="'+(L-8)+'" y="'+(T+ih)+'" text-anchor="end" font-size="9" fill="#C77700" font-weight="700">0</text>'
   + '<text x="'+(L-8)+'" y="'+(T+ih-ih*0.45+4)+'" text-anchor="end" font-size="9" fill="#C77700" '
   + 'font-weight="700">'+num(maxLoss)+'m</text>';

  CH.pts=[]; CH.L=L; CH.iw=iw; CH.n=n; CH.W=W;
  days.forEach(function(d,i){ CH.pts.push({x:x(i),y:y(d.eff),d:d}) });

  h+='<line id="chair" x1="0" y1="'+T+'" x2="0" y2="'+(T+ih)+'" stroke="#723EC3" '
   + 'stroke-width="1" stroke-dasharray="3 3" opacity="0"/>';
  h+='<polyline fill="none" stroke="#723EC3" stroke-width="2.6" stroke-linejoin="round" '
   + 'stroke-linecap="round" points="'+CH.pts.map(function(p){return p.x+','+p.y}).join(' ')+'"/>';
  CH.pts.forEach(function(p,i){
    h+='<circle id="pt'+i+'" cx="'+p.x+'" cy="'+p.y+'" r="3.6" fill="#fff" stroke="#723EC3" stroke-width="2"/>';
  });

  var step=Math.ceil(n/12);
  days.forEach(function(d,i){
    if(i%step && i!==n-1) return;
    h+='<text x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle" font-size="9" fill="#7A81A0" '
      +'font-weight="700">'+esc(shortDate(d.date))+'</text>';
  });
  return h+'</svg>';
}

function wireChart(){
  var svg=$('chartsvg'); if(!svg) return;
  var box=$('chartwrap'), tip=$('chtip'), hair=$('chair'), last=-1;
  function hide(){
    tip.classList.remove('on'); if(hair) hair.setAttribute('opacity','0');
    if(last>=0){
      var c=$('pt'+last), b=$('bar'+last);
      if(c){ c.setAttribute('r','3.6'); c.setAttribute('fill','#fff') }
      if(b) b.setAttribute('fill-opacity','0.38');
      last=-1;
    }
  }
  function row(k,v){ return '<div class="r"><span>'+k+'</span><b>'+v+'</b></div>' }
  function move(ev){
    var t=(ev.touches&&ev.touches[0])||ev;
    var rc=svg.getBoundingClientRect();
    var vx=(t.clientX-rc.left)/rc.width*CH.W;
    var i=Math.round((vx-CH.L)/CH.iw*(CH.n-1));
    if(i<0)i=0; if(i>CH.n-1)i=CH.n-1;
    var p=CH.pts[i]; if(!p) return;
    if(i!==last){
      hide(); last=i;
      var c=$('pt'+i), b=$('bar'+i);
      if(c){ c.setAttribute('r','5.6'); c.setAttribute('fill','#723EC3') }
      if(b) b.setAttribute('fill-opacity','0.85');
      if(hair){ hair.setAttribute('x1',p.x); hair.setAttribute('x2',p.x); hair.setAttribute('opacity','1'); }
      var d=p.d;
      tip.innerHTML='<h4>'+esc(prettyDate(d.date))+'</h4>'
        +row('Eff%','<b class="'+pctClass(d.eff)+'">'+fmt(d.eff,1)+'%</b>')
        +row('Operators',num(d.man))
        +row('Input Min',num(d.inMin))
        +row('Output Min',num(d.outMin))
        +row('Loss Min','<b>'+(d.loss?num(d.loss):'0')+'</b>')
        +row('Below 65%','<b class="red">'+d.lo+'</b> of '+(d.lo+d.mid+d.hi));
      tip.classList.add('on');
    }
    var bx=box.getBoundingClientRect();
    var lx=t.clientX-bx.left+14, ty=t.clientY-bx.top-10;
    if(lx+tip.offsetWidth>bx.width-8) lx=t.clientX-bx.left-tip.offsetWidth-14;
    if(ty<4) ty=4;
    if(ty+tip.offsetHeight>bx.height-4) ty=bx.height-tip.offsetHeight-4;
    tip.style.left=lx+'px'; tip.style.top=ty+'px';
  }
  svg.addEventListener('mousemove',move);
  svg.addEventListener('mouseleave',hide);
  svg.addEventListener('touchstart',function(e){move(e);e.preventDefault()},{passive:false});
  svg.addEventListener('touchmove', function(e){move(e);e.preventDefault()},{passive:false});
}

/* ---------- presets ---------- */
function weekStartISO(iso){
  var d=drParse(iso)||new Date();
  return drIso(drWeekStart(d));
}
function addDaysISO(iso,n){
  var d=drParse(iso)||new Date();
  d.setDate(d.getDate()+n);
  return drIso(d);
}
function lastNDays(n){
  var end=DATES.length?DATES[DATES.length-1]:isoOf(new Date());
  if(DATES.length){
    var pick=DATES.slice(-n);
    return [pick[0], pick[pick.length-1]];
  }
  return [addDaysISO(end,-(n-1)), end];
}

function setupPicker(){
  var latest = DATES.length ? DATES[DATES.length-1] : yesterdayISO();
  drInit({
    presets:[
      {group:'Quick ranges'},
      {k:'d7',  label:'Last 7 Days',   get:function(){ return lastNDays(7) }},
      {k:'d14', label:'Last 14 Days',  get:function(){ return lastNDays(14) }},
      {k:'d30', label:'Last 30 Days',  get:function(){ return lastNDays(30) }},
      {group:'Weeks'},
      {k:'tw',  label:'This Week',     get:function(){ return [weekStartISO(latest), latest] }},
      {k:'lw',  label:'Last Week',     get:function(){ var st=addDaysISO(weekStartISO(latest),-7);
                                                       return [st, addDaysISO(st,6)] }},
      {group:'Months'},
      {k:'tm',  label:'This Month',    get:function(){ return monthRange(0,latest) }},
      {k:'lm',  label:'Last Month',    get:function(){ return monthRange(-1,latest) }}
    ],
    days: DATES.slice(),
    /* Apply IS the Load here: the user has just said what they want. */
    apply: function(from,to){ load(from,to,true); }
  });
  drSet($('f1').value, $('t1').value, '');
}
function monthRange(off,latest){
  var base=drParse(latest)||new Date();
  var a=new Date(base.getFullYear(), base.getMonth()+off, 1);
  var b=new Date(base.getFullYear(), base.getMonth()+off+1, 0);
  return [drIso(a), drIso(b)];
}

/* ---------- boot ---------- */
function boot(){
  /* Build the picker FIRST, so its buttons exist while the dates load. */
  setupPicker();

  buildChips();
  busy('Checking available days…');
  track(fetch(EFF_API+'?action=snapshot',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json() }))
   .then(function(s){
      DATES=s.dates||[];
      if(s.generatedAt) STAMP=s.generatedAt;
      setupPicker();
      /* Default to the LAST 7 DAYS, and set it without reading anything. The
         page used to fetch on open, which is the slowest thing it did and
         usually not the range the user wanted. */
      var d7=lastNDays(7);
      var to   = ssRead(SD_TO)   || d7[1] || (DATES.length?DATES[DATES.length-1]:yesterdayISO());
      var from = ssRead(SD_FROM) || d7[0];
      if(from>to) from=to;
      drSet(from,to,'');
      $('f1').value=from; $('t1').value=to;
      $('showing').textContent=prettyDate(from)+' to '+prettyDate(to);
      showReady(); markDirty();
   })
   .catch(function(e){
      /* Without the date list the presets cannot be built, but a range can
         still be typed, so the page is not left dead. */
      setupPicker();
      var to=yesterdayISO(), from=addDaysISO(to,-6);
      drSet(from,to,'');
      $('f1').value=from; $('t1').value=to;
      showReady(); markDirty();
   });
}
boot();


/* ---------- which copy am I looking at? ----------
   Published files get cached by the browser and by Cloudflare, so "I uploaded
   it" and "the site is running it" are two different statements. This prints
   the build stamp into the footer and the console, which settles the question
   in two seconds instead of a round of guessing. */
(function(){
  var B='23 Aug 2026 17:58';
  try{ console.log('%c SNOWTEX build '+B+' | Cutting Efficiency Trend ','background:#333D6D;color:#fff;padding:2px 6px;border-radius:3px'); }catch(e){}
  function stamp(){
    var f=document.querySelector('.ftr, .printfoot, footer');
    if(f && f.textContent.indexOf('build')<0){
      var s=document.createElement('span');
      s.style.cssText='opacity:.55;font-size:9.5px;margin-left:10px';
      s.textContent='build '+B;
      f.appendChild(s);
    }
  }
  if(document.readyState!=='loading') stamp();
  else document.addEventListener('DOMContentLoaded', stamp);
})();

/* ---------- sticky offsets ----------
   The control strip and every card title bar are sticky, so each scroll box
   below them has to be told how much height is already pinned above it, or a
   pinned table heading hides behind the card title. Same helper the Weekly
   Fabric report uses. */
function boxH(sel){ var e=document.querySelector(sel); return e?Math.round(e.getBoundingClientRect().height):0; }
function syncStickyOffsets(){
  var r=document.documentElement;
  var strip=boxH('.strip'), hd=boxH('.card>.hd');
  if(strip>0 && strip<200) r.style.setProperty('--stripH', strip+'px');
  if(hd>0 && hd<200)       r.style.setProperty('--cardHdH', hd+'px');
  r.style.setProperty('--afH','0px');
}
window.addEventListener('load', syncStickyOffsets);
window.addEventListener('resize', syncStickyOffsets);

/* Kept because the shared table markup references it. */
function sortRows(rows,st){
  var idx={name:0,rolls:1,fails:2,used:3,waste:4};
  return rows.slice().sort(function(a,b){
    var x=a[idx[st.k]], y=b[idx[st.k]];
    if(typeof x==='string') return st.d*String(x).localeCompare(String(y));
    return st.d*(x-y);
  });
}
</script>
