var DR_PRESETS = [
  {group:'Quick ranges'},
  {k:'tw',  label:'This Week',    get:function(){ var w=weekStart(LATEST); return [w, LATEST]; }},
  {k:'lw',  label:'Last Week',    get:function(){ var st=addDays(weekStart(LATEST),-WEEK_LEN);
                                                  return [st, weekEnd(st)]; }},
  {k:'d7',  label:'Last 7 Days',  get:function(){ var r=lastNDataDays(7);  return r?[r.from,r.to]:[]; }},
  {k:'d30', label:'Last 30 Days', get:function(){ var r=lastNDataDays(30); return r?[r.from,r.to]:[]; }},
  {group:'Months'},
  {k:'tm',  label:'This Month',   get:function(){ return monthRange(0); }},
  {k:'lm',  label:'Last Month',   get:function(){ return monthRange(-1); }},
  {group:'Everything'},
  {k:'all', label:'All Data',     get:function(){ return DATES.length ? [DATES[0], DATES[DATES.length-1]] : []; }}
];

/* Month presets are clamped to the days the sheet actually holds, so "This
   Month" on the 3rd does not ask for a fortnight that does not exist yet. */
function monthRange(off){
  var base=drParse(LATEST)||new Date();
  var first=new Date(base.getFullYear(), base.getMonth()+off, 1);
  var last =new Date(base.getFullYear(), base.getMonth()+off+1, 0);
  var a=drIso(first), b=drIso(last);
  if(DATES.length){
    if(a<DATES[0]) a=DATES[0];
    if(b>DATES[DATES.length-1]) b=DATES[DATES.length-1];
  }
  return (a<=b) ? [a,b] : [];
}

function setupPicker(){
  drInit({
    presets: DR_PRESETS,
    /* days, not bounds. These are only MARKED as empty, never blocked, so a
       day whose report has not been pushed yet can still be selected. */
    days: DATES.slice(),
    /* Apply IS the Load for this page: the user has just said exactly what
       they want, so reading it is what they asked for. */
    apply: function(from,to,preset){
      $('f1').value=from; $('t1').value=to;
      shareRange(from,to); shareDay(to);
      doLoad();
    }
  });
  drSet($('f1').value, $('t1').value, '');
}

function busy(msg){
  $('content').innerHTML='<div class="loading">'+esc(msg)+'</div>';
}

/* "Last N Days" counts DAYS THAT HAVE DATA, not calendar days.
   Counting back on the calendar gave a range like 4 Aug to 10 Aug that held
   only 4 days of data, because Fridays and any unpushed day are simply not in
   the sheet. Asking for the last 7 days and being shown 4 is not what anyone
   means. So the last N entries of the available-dates list are taken, and the
   From and To boxes are set to whatever those actually span.
   This Week and Last Week stay calendar based on purpose: a week IS a calendar
   thing, and Wed to Tue is the SNOWTEX definition. */
function lastNDataDays(n){
  if(!DATES.length) return null;
  var pick = DATES.slice(-n);
  return { from: pick[0], to: pick[pick.length-1], count: pick.length };
}

/* =====================================================================
   ONE LOADING CONTRACT  (see daily.html for the reasoning)
   ===================================================================== */
var RUN={seq:0,label:''};
function runBegin(label){
  RUN.seq++; RUN.label=label;
  barBusy(true,label); islandShow(label);
  return RUN.seq;
}
function runCurrent(tok){ return tok===RUN.seq; }
function runEnd(tok){ if(tok!==RUN.seq) return; barBusy(false,RUN.label); }

var DIRTY=true, LOADED=false;
function markDirty(){ DIRTY=true; paintLoadBtn(); }
function paintLoadBtn(){
  var b=$('loadBtn'); if(!b) return;
  var t=$('loadTxt');
  var needs = DIRTY || !LOADED;
  b.classList.toggle('needs', needs);
  if(t) t.textContent = needs ? 'Load' : 'Reload';
  b.title = needs ? 'Load this range' : 'Read this range again';
}
function showReady(){
  LOADED=false;
  $('content').innerHTML='<div class="ready"><b>Choose a date range, then press Load.</b>'
    +'Nothing is read from the sheet until you press it, so this page opens instantly.</div>';
}
function doLoad(){
  refreshDates(true).then(function(){ load() }).catch(function(){ load() });
}

/* Sets the range for a preset WITHOUT loading. applyPreset still exists for
   the paths that genuinely want to load straight away. */
function setPresetRange(which){
  if(!LATEST) return;
  var ws=weekStart(LATEST), r;
  if(which==='tw'){ $('f1').value=ws; $('t1').value=LATEST; markPreset('p_tw'); }
  else if(which==='lw'){ var st=addDays(ws,-WEEK_LEN); $('f1').value=st; $('t1').value=weekEnd(st); markPreset('p_lw'); }
  else if(which==='d7'){ r=lastNDataDays(7);  if(r){ $('f1').value=r.from; $('t1').value=r.to; } markPreset('p_d7'); }
  else { r=lastNDataDays(30); if(r){ $('f1').value=r.from; $('t1').value=r.to; } markPreset('p_d30'); }
  syncLabels();
}

function applyPreset(which){
  if(!LATEST) return;
  var ws=weekStart(LATEST);
  if(which==='tw'){
    /* This Week: from the Wednesday that opened the current week up to the
       latest day with data. Not to the closing Tuesday, because that day has
       usually not happened yet. */
    markPreset('p_tw'); setRange(ws,LATEST);
  }
  else if(which==='lw'){
    /* Last Week: the full Wednesday to Tuesday block before this one. */
    var s=addDays(ws,-WEEK_LEN);
    markPreset('p_lw'); setRange(s,weekEnd(s));
  }
  else if(which==='d7'){
    var r=lastNDataDays(7);
    markPreset('p_d7'); if(r) setRange(r.from,r.to);
  }
  else {
    var r30=lastNDataDays(30);
    markPreset('p_d30'); if(r30) setRange(r30.from,r30.to);
  }
}

/* ---------- load: only the days we do not already hold ---------- */
function load(){
  var r=normaliseRange();
  var f=r.from, t=r.to;
  if(!f||!t) return;
  shareRange(f,t);
  shareDay(t);
  var _label='Fabric Weekly, '+prettyDate(f)+' to '+prettyDate(t);
  var _tok=runBegin(_label);
  busy(_label+'\u2026');
  LOAD_TOK=_tok;
  if(f>t){ runEnd(_tok); $('content').innerHTML='<div class="err"><b>From date is after To date.</b><br>Fix the order and it will load.</div>'; return }

  RANGE = DATES.filter(function(d){ return d>=f && d<=t });
  if(!RANGE.length){
    runEnd(_tok);
    $('content').innerHTML='<div class="wrap"><div class="empty">No data between '+prettyDate(f)+
      ' and '+prettyDate(t)+'.<br>Those days have not been pushed to the sheet yet.</div></div>';
    LOADED=true; DIRTY=false; paintLoadBtn();
    return;
  }

  var missing=[];
  RANGE.forEach(function(d){
    if(DAYS[d] && DAYS[d].v===DAY_SCHEMA) return;          /* already good */
    var c=lsGet(LS_DAY+d);
    if(c && c.v===DAY_SCHEMA){ DAYS[d]=c; return; }
    delete DAYS[d];
    try{ localStorage.removeItem(LS_DAY+d) }catch(e){}     /* drop the stale copy */
    missing.push(d);
  });

  if(!missing.length){
    runEnd(_tok); merge(); render();
    LOADED=true; DIRTY=false; paintLoadBtn();
    return;
  }

  $('content').innerHTML='<div class="loading">Fetching '+
    missing.length+' new day(s)&hellip;<br><span style="font-size:11px">'+
    (RANGE.length-missing.length)+' of '+RANGE.length+' already cached</span></div>';

  var chunks=[];
  for(var i=0;i<missing.length;i+=FETCH_CHUNK) chunks.push(missing.slice(i,i+FETCH_CHUNK));

  var lbl=_label;

  /* A REAL fraction, the only one in the whole dashboard. The days are
     fetched in chunks, so each chunk that lands is a known share of the work
     and barSet() reports it instead of the eased guess. */
  var doneChunks = 0;
  Promise.all(chunks.map(function(c){
    return fetch(API_URL+'?action=days&dates='+encodeURIComponent(c.join(',')))
      .then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json() })
      .then(function(j){
        doneChunks++;
        /* Capped at 0.95: the rows still have to be parsed and painted after
           the last chunk arrives, and claiming 100 before that is a lie the
           user can see. */
        barSet(Math.min(0.95, doneChunks / chunks.length));
        return j;
      });
  })).then(function(all){
    if(_tok!==RUN.seq) return;          /* superseded by a newer Load */
    runEnd(_tok);
    var oldServer=false;
    all.forEach(function(res){
      if(res.error) throw new Error(res.error);
      var d=res.days||{};
      for(var k in d) if(d.hasOwnProperty(k)){
        if(d[k] && d[k].v!==DAY_SCHEMA) oldServer=true;
        DAYS[k]=d[k]; lsSet(LS_DAY+k,d[k]);
      }
      if(res.generatedAt) setStamp(res.generatedAt);
    });
    if(oldServer){
      $('content').innerHTML='<div class="err"><b>The Apps Script is out of date.</b><br>'
        +'It is still sending the old day format, which has no floor by fabric '
        +'breakdown, so the Fabric Type filter cannot work.<br><br>'
        +'Open the sheet &rarr; Extensions &rarr; Apps Script, paste the current '
        +'Code.gs, then <b>Deploy &rarr; Manage deployments &rarr; pencil &rarr; '
        +'Version: New version &rarr; Deploy</b>.</div>';
      return;
    }
    merge(); render();
    LOADED=true; DIRTY=false; paintLoadBtn();
  }).catch(function(e){
    if(_tok!==RUN.seq) return;
    runEnd(_tok); showErr(e);
  });
}
/* The cache state used to show as a chip in the strip. It was noise: the user
   does not care where the numbers came from, only that they are on screen.
   Kept as a no-op so the call sites stay readable. */
function tag(){}

/* ---------- merge day aggregates into one range object ---------- */
function merge(){
  var f={},fb={},c={},by={}, t=[0,0,0,0,0], byDay=[];
  function add(store,row){
    var b=store[row[0]] || (store[row[0]]=[row[0],0,0,0,0]);
    b[1]+=row[1]; b[2]+=row[2]; b[3]+=row[3]; b[4]+=row[4];
  }
  RANGE.forEach(function(ds){
    var a=DAYS[ds]; if(!a) return;
    (a.f||[]).forEach(function(r){ add(f,r) });
    (a.fb||[]).forEach(function(r){ add(fb,r) });
    (a.c||[]).forEach(function(r){ add(c,r) });
    (a.b||[]).forEach(function(r){ add(by,r) });   /* Buyer, added 12-Aug-2026 */
    for(var i=0;i<5;i++) t[i]+=(a.t&&a.t[i])||0;
    byDay.push([ds,a.t[0],a.t[1],a.t[2],a.t[3]]);
  });
  function pack(o,sort){
    var arr=[]; for(var k in o) if(o.hasOwnProperty(k)) arr.push(o[k]);
    arr.forEach(function(r){ r[3]=Math.round(r[3]*100)/100; r[4]=Math.round(r[4]*100)/100 });
    arr.sort(sort); return arr;
  }
  D = {
    from:$('f1').value, to:$('t1').value,
    byDay: byDay,
    byFloor: pack(f,function(a,b){ return FLOOR_ORDER.indexOf(a[0])-FLOOR_ORDER.indexOf(b[0]) }),
    byFabric: pack(fb,function(a,b){ return (b[4]-a[4])||(b[2]-a[2]) }),
    byConsign: pack(c,function(a,b){ return (b[2]-a[2])||(b[4]-a[4]) }),
    byBuyer: pack(by,function(a,b){ return (b[4]-a[4])||(b[2]-a[2]) }),
    totals: { rolls:t[0], fails:t[1], used:Math.round(t[2]*100)/100,
              waste:Math.round(t[3]*100)/100, markers:t[4],
              days:byDay.length, floors:Object.keys(f).length,
              consignments:Object.keys(c).length,
              buyers:Object.keys(by).length }
  };
}

function showErr(e){
  $('content').innerHTML='<div class="err"><b>Could not load.</b><br>'+esc(e.message||e)+
    '<br><br>If this says <i>Unknown action</i>, the Apps Script still needs deploying: '+
    'Deploy &rarr; Manage deployments &rarr; pencil &rarr; Version: New version &rarr; Deploy.</div>';
}

/* ---------- sorting and filtering ---------- */
function rateOf(r){ return r[1] ? (r[1]-r[2])/r[1]*100 : 0 }
function sortRows(rows,st){
  var idx={name:0,rolls:1,fails:2,used:3,waste:4};
  return rows.slice().sort(function(a,b){
    var x,y;
    if(st.k==='rate'){ x=rateOf(a); y=rateOf(b) }
    else if(st.k==='failpct'){ x=a[1]?a[2]/a[1]:0; y=b[1]?b[2]/b[1]:0 }
    else { x=a[idx[st.k]]; y=b[idx[st.k]] }
    if(typeof x==='string') return st.d*String(x).localeCompare(String(y));
    return st.d*(x-y);
  });
}
function setSort(t,k){ var st=ST[t]; st.d=(st.k===k)?-st.d:(k==='name'?1:-1); st.k=k; render() }
function ar(t,k){ return ST[t].k===k ? '<span class="ar">'+(ST[t].d>0?'▲':'▼')+'</span>' : '' }

/* ---------- interactive chart ---------- */
var CH = { pts:[], L:0, iw:0, n:0, days:[] };
/* The chart is built at the container's REAL pixel width, so one SVG unit is
   one CSS pixel. The old version used a fixed 1000 unit viewBox stretched to
   fill the card, which scaled every label up by about 1.7x and made the chart
   typography clash with the rest of the page. */
function chart(byDay, W){
  var n=byDay.length;
  if(!n) return '<div class="empty">No days in range.</div>';

  var H=280,L=68,R=70,T=16,B=44;   /* wider gutters to hold the axis titles */
  var iw=W-L-R, ih=H-T-B, maxW=0;
  byDay.forEach(function(d){ if(d[4]>maxW) maxW=d[4] });
  if(maxW<=0) maxW=1;
  var bw=Math.max(5,Math.min(44,iw/n*0.5));

  var s='<svg id="chartsvg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" '
       +'aria-label="Compliance percent and waste yards by day">';

  [0,25,50,75,100].forEach(function(v){
    var y=T+ih-(v/100)*ih;
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#EDEFF6"/>';
    s+='<text x="'+(W-R+7)+'" y="'+(y+3.5)+'" class="axl">'+v+'%</text>';
  });
  [0,0.5,1].forEach(function(f){
    var y=T+ih-f*ih;
    s+='<text x="'+(L-7)+'" y="'+(y+3.5)+'" class="axl" text-anchor="end">'+fmt(maxW*f,1)+'</text>';
  });
  /* 90% target line: the band where a floor stops being red */
  var y90=T+ih-0.90*ih;
  s+='<line x1="'+L+'" y1="'+y90+'" x2="'+(W-R)+'" y2="'+y90+'" stroke="#1E8E4E" stroke-width="1.2" stroke-dasharray="5 4" opacity=".65"/>';
  s+='<text x="'+(L+5)+'" y="'+(y90-6)+'" class="axb" fill="#1E8E4E">90% band</text>';

  CH.pts=[]; CH.L=L; CH.iw=iw; CH.n=n; CH.days=byDay; CH.T=T; CH.ih=ih; CH.H=H; CH.W=W;

  /* Values are printed on the chart so it reads without any interaction.
     Hovering a day hides that day's two labels, because the tooltip already
     shows the same numbers and the two would sit on top of each other. */
  var showLbl = n<=12 || iw/n>=54;

  var geo=[];
  s+='<g id="chbars">';
  byDay.forEach(function(d,i){
    var cx=L+iw*((i+0.5)/n), bh=(d[4]/maxW)*ih, barTop=T+ih-bh;
    s+='<rect id="bar'+i+'" x="'+(cx-bw/2)+'" y="'+barTop+'" width="'+bw+'" height="'+Math.max(0,bh)+
       '" rx="2" fill="#C77700" fill-opacity="0.38"/>';
    geo.push({cx:cx,bh:bh,barTop:barTop});
    CH.pts.push({x:cx,y:T+ih-(rateOf(d)/100)*ih,rate:rateOf(d),d:d});
    /* label density follows the real width, so labels never collide */
    var every=Math.max(1,Math.ceil(n/Math.max(4,Math.floor(iw/64))));
    if(i%every===0)
      s+='<text x="'+cx+'" y="'+(H-B+18)+'" class="axl" text-anchor="middle">'+esc(shortDate(d[0]))+'</text>';
  });
  s+='</g>';

  s+='<line id="chair" x1="0" y1="'+T+'" x2="0" y2="'+(T+ih)+'" stroke="#723EC3" stroke-width="1" stroke-dasharray="4 3" opacity="0"/>';
  s+='<polyline fill="none" stroke="#723EC3" stroke-width="2.2" stroke-linejoin="round" points="'+
     CH.pts.map(function(p){return p.x+','+p.y}).join(' ')+'"/>';
  CH.pts.forEach(function(p,i){
    s+='<circle id="pt'+i+'" cx="'+p.x+'" cy="'+p.y+'" r="3.6" fill="#fff" stroke="#723EC3" stroke-width="2"/>';
  });

  /* ---- label placement, collision aware ----
     Two labels share each column: the waste figure belonging to the bar, and
     the compliance figure belonging to the line. Placing both "above" blindly
     put them on top of each other whenever a tall bar reached up to the line,
     which is exactly what happened on 1 Aug. So each pair is resolved:
       1. compliance sits above its point, or below it near the plot ceiling
       2. waste sits above its bar
       3. if the two would land within MINGAP, the waste figure moves INSIDE
          the bar, which is always free space, provided the bar is tall enough
       4. a bar too short to hold text pushes the compliance label away instead
     Both carry a white halo so they stay readable over bars and gridlines. */
  /* ---- label placement ----
     The waste figure sits in the MIDDLE of its bar with a small "Yds" beneath
     it. Middle is the safest place on the whole chart: the compliance line
     runs across the top of the plot, so a centred label can almost never reach
     it, and it reads as belonging to the bar rather than floating above it.
     A bar too short to hold two lines puts the block above itself instead, and
     only then can it argue with the compliance label, which is nudged clear. */
  if(showLbl){
    var MINGAP=14, BLOCK=11;   /* half height of the two line waste block */
    geo.forEach(function(g,i){
      var p=CH.pts[i];
      var cY=p.y-11;                       /* compliance, above its point */
      if(cY < T+11) cY = p.y+18;           /* near the ceiling, drop below */

      var inside = g.bh >= 34, wY, uY;
      if(inside){
        var mid = g.barTop + g.bh/2;
        wY = mid - 1;  uY = mid + 10;      /* value, then the unit under it */
      }else{
        wY = g.barTop - 15; uY = g.barTop - 5;
        /* short bar: the block is above the bar, so it can meet the line */
        if(Math.abs(wY-cY) < MINGAP+BLOCK)
          cY = (cY <= wY) ? (wY - MINGAP - BLOCK) : (uY + MINGAP);
      }

      if(cY < T+10) cY = T+10;
      if(cY > T+ih-4) cY = T+ih-4;

      s+='<g id="lw'+i+'" class="vlw'+(inside?' in':'')+'">'
        +'<text x="'+g.cx+'" y="'+wY+'" class="vn" text-anchor="middle">'+fmt(byDay[i][4],1)+'</text>'
        +'<text x="'+g.cx+'" y="'+uY+'" class="vu" text-anchor="middle">Yds</text></g>';
      s+='<text id="lc'+i+'" x="'+p.x+'" y="'+cY+'" class="vlc" text-anchor="middle">'+
         fmt(p.rate,1)+'%</text>';
    });
  }
  s+='<line x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'" stroke="#D6DAE8"/>';

  /* Axis titles, rotated up the left and right gutters so the reader never has
     to work out which series belongs to which scale. */
  var midY=T+ih/2;
  s+='<text transform="translate(16,'+midY+') rotate(-90)" text-anchor="middle" '
    +'class="axt" fill="#C77700">Waste Yds</text>';
  s+='<text transform="translate('+(W-16)+','+midY+') rotate(90)" text-anchor="middle" '
    +'class="axt" fill="#723EC3">Compliance %</text>';

  s+='<rect id="chhit" x="'+L+'" y="'+T+'" width="'+iw+'" height="'+ih+'" fill="transparent"/>';
  s+='</svg>';
  return s;
}

function wireChart(){
  var svg=$('chartsvg'); if(!svg) return;
  var box=$('chartwrap'), tip=$('chtip'), hair=$('chair');
  var last=-1;

  function lbl(i,on){
    var a=$('lc'+i), b=$('lw'+i);
    if(a) a.classList.toggle('hid',!on);
    if(b) b.classList.toggle('hid',!on);
  }
  function hide(){
    tip.classList.remove('on'); hair.setAttribute('opacity','0');
    if(last>=0){ var c=$('pt'+last), b=$('bar'+last);
      if(c){ c.setAttribute('r','3.6'); c.setAttribute('fill','#fff') }
      if(b) b.setAttribute('fill-opacity','0.38');
      lbl(last,true);          /* put this day's printed values back */
      last=-1; }
  }
  function move(ev){
    var t=(ev.touches&&ev.touches[0])||ev;
    var rc=svg.getBoundingClientRect();
    var vx=(t.clientX-rc.left)/rc.width*CH.W;
    var i=Math.round((vx-CH.L)/CH.iw*CH.n-0.5);
    if(i<0) i=0; if(i>CH.n-1) i=CH.n-1;
    if(!CH.pts[i]) return;
    var p=CH.pts[i], d=p.d;

    if(i!==last){
      hide();
      last=i;
      var c=$('pt'+i), b=$('bar'+i);
      if(c){ c.setAttribute('r','5.6'); c.setAttribute('fill','#723EC3') }
      if(b) b.setAttribute('fill-opacity','0.85');
      lbl(i,false);            /* tooltip is showing these numbers already */
      hair.setAttribute('x1',p.x); hair.setAttribute('x2',p.x); hair.setAttribute('opacity','1');
      var cls=pctClass(p.rate);
      tip.innerHTML='<h4>'+esc(prettyDate(d[0]))+'</h4>'
        +row('Compliance','<b class="'+cls+'">'+fmt(p.rate,2)+'%</b>')
        +row('Rolls',num(d[1]))
        +row('Failed','<b class="red">'+num(d[2])+'</b>')
        +row('Fail %',fmt(d[1]?d[2]/d[1]*100:0,1)+'%')
        +row('Used Yds',num(d[3]))
        +row('Waste Yds','<b>'+fmt(d[4],1)+'</b>');
      tip.classList.add('on');
    }
    /* keep the tooltip inside the card */
    var bx=box.getBoundingClientRect();
    var lx=t.clientX-bx.left+14, ty=t.clientY-bx.top-10;
    if(lx+tip.offsetWidth>bx.width-8) lx=t.clientX-bx.left-tip.offsetWidth-14;
    if(ty<4) ty=4;
    if(ty+tip.offsetHeight>bx.height-4) ty=bx.height-tip.offsetHeight-4;
    tip.style.left=lx+'px'; tip.style.top=ty+'px';
  }
  function row(k,v){ return '<div class="r"><span>'+k+'</span><b>'+v+'</b></div>' }

  svg.addEventListener('mousemove',move);
  svg.addEventListener('mouseleave',hide);
  svg.addEventListener('touchstart',function(e){ move(e); e.preventDefault() },{passive:false});
  svg.addEventListener('touchmove',function(e){ move(e); e.preventDefault() },{passive:false});
  svg.addEventListener('touchend',hide);
}

/* ---------- matrix: floors down, dates across ---------- */
function matrix(kind){
  var floors = FLOOR_ORDER.filter(function(f){
    return D.byFloor.some(function(r){ return r[0]===f });
  });
  if(!floors.length) return '<div class="empty">No floors in range.</div>';
  var h = '';
  var lastHead = kind==='c' ? 'Roll Compliance%' : 'Total Wasted Yds';
  h+='<div class="mx"><table><thead><tr><th>Floor</th>';
  RANGE.forEach(function(d){ h+='<th>'+esc(shortDate(d))+'</th>' });
  h+='<th style="background:#4A56A0">'+lastHead+'</th></tr></thead><tbody>';

  /* one lookup: date -> floor -> row */
  var M={};
  RANGE.forEach(function(ds){
    M[ds]={};
    ((DAYS[ds]||{}).f||[]).forEach(function(r){ M[ds][r[0]]=r });
  });

  var maxW=0;
  if(kind==='w') RANGE.forEach(function(ds){ floors.forEach(function(f){
    var r=M[ds][f]; if(r&&r[4]>maxW) maxW=r[4]; }) });
  if(maxW<=0) maxW=1;

  floors.forEach(function(f){
    h+='<tr><td>'+f+'</td>';
    var tot=[0,0,0,0];
    RANGE.forEach(function(ds){
      var r=M[ds][f];
      if(!r||!r[1]){ h+='<td style="color:#C3C8DA">&ndash;</td>'; return }
      tot[0]+=r[1]; tot[1]+=r[2]; tot[2]+=r[3]; tot[3]+=r[4];
      if(kind==='c'){
        var v=rateOf(r), c=pctClass(v);
        h+='<td class="cell" style="color:var(--'+c+')" title="'+f+' on '+esc(prettyDate(ds))+
           ': '+r[1]+' rolls, '+r[2]+' failed">'+fmt(v,1)+'%</td>';
      }else{
        var op=Math.min(0.82,0.10+(r[4]/maxW)*0.72);
        h+='<td class="cell" style="background:rgba(214,69,80,'+(r[4]>0?op:0)+
           ');color:'+(op>0.45?'#fff':'var(--txt)')+'" title="'+f+' on '+esc(prettyDate(ds))+
           ': '+fmt(r[4],2)+' yds waste from '+r[2]+' failed roll(s)">'+
           (r[4]>0?fmt(r[4],1):'0')+'</td>';
      }
    });
    if(kind==='c'){
      var rv=tot[0]?(tot[0]-tot[1])/tot[0]*100:0;
      h+='<td class="cell" style="background:#F0F2F8"><span class="pill '+pctClass(rv)+'">'+fmt(rv,1)+'%</span></td>';
    }else{
      h+='<td class="cell" style="background:#F0F2F8;font-weight:800">'+fmt(tot[3],1)+
         ' <span style="color:var(--mut);font-size:10px">Yds</span></td>';
    }
    h+='</tr>';
  });

  h+='</tbody><tfoot><tr><td>All</td>';
  var gt=[0,0,0,0];
  RANGE.forEach(function(ds){
    var a=[0,0,0,0];
    floors.forEach(function(f){ var r=M[ds][f]; if(r){ a[0]+=r[1];a[1]+=r[2];a[2]+=r[3];a[3]+=r[4] } });
    gt[0]+=a[0]; gt[1]+=a[1]; gt[2]+=a[2]; gt[3]+=a[3];
    if(kind==='c'){
      var v=a[0]?(a[0]-a[1])/a[0]*100:0;
      h+='<td style="color:var(--'+pctClass(v)+')">'+(a[0]?fmt(v,1)+'%':'&ndash;')+'</td>';
    }else h+='<td>'+fmt(a[3],1)+' <span style="font-size:9.5px;opacity:.65">Yds</span></td>';
  });
  if(kind==='c'){
    var gv=gt[0]?(gt[0]-gt[1])/gt[0]*100:0;
    h+='<td><span class="pill '+pctClass(gv)+'">'+fmt(gv,1)+'%</span></td>';
  }else h+='<td>'+fmt(gt[3],1)+' <span style="font-size:9.5px;opacity:.65">Yds</span></td>';
  h+='</tr></tfoot></table></div>';

  h+='<div class="mxlgd">'+(kind==='c'
     ? '<span><i style="background:var(--red)"></i>below 90%</span><span><i style="background:var(--green)"></i>90 to 98%</span><span><i style="background:var(--blue)"></i>above 98%</span><span>&ndash; means that floor had no rolls that day</span>'
     : '<span><i style="background:rgba(214,69,80,.15)"></i>less waste</span><span><i style="background:rgba(214,69,80,.82)"></i>more waste</span><span>shaded against the worst cell in this table</span>')
     +'</div>';
  return h;
}

/* ---------- plain table ---------- */
function tableOf(rows,firstHead,t){
  var st=ST[t], view=rows;
  if(!view.length) return '<div class="empty">Nothing to show.</div>';

  var h='<div class="tscroll"><table><thead><tr>'
   +'<th onclick="setSort(\''+t+'\',\'name\')">'+firstHead+ar(t,'name')+'</th>'
   +'<th onclick="setSort(\''+t+'\',\'rolls\')">Rolls'+ar(t,'rolls')+'</th>'
   +'<th onclick="setSort(\''+t+'\',\'fails\')">Failed'+ar(t,'fails')+'</th>'
   +'<th onclick="setSort(\''+t+'\',\'failpct\')">Fail %'+ar(t,'failpct')+'</th>'
   +'<th onclick="setSort(\''+t+'\',\'rate\')">Compliance %'+ar(t,'rate')+'</th>'
   +'<th onclick="setSort(\''+t+'\',\'used\')">Used Yds'+ar(t,'used')+'</th>'
   +'<th onclick="setSort(\''+t+'\',\'waste\')">Waste Yds'+ar(t,'waste')+'</th>'
   +'</tr></thead><tbody>';
  var tt={r:0,f:0,u:0,w:0};
  sortRows(view,st).forEach(function(r){
    var rate=rateOf(r);
    tt.r+=r[1]; tt.f+=r[2]; tt.u+=r[3]; tt.w+=r[4];
    h+='<tr><td class="f">'+esc(r[0])+'</td>'
      +'<td>'+num(r[1])+'</td><td>'+num(r[2])+'</td>'
      +'<td>'+fmt(r[1]?r[2]/r[1]*100:0,1)+'%</td>'
      +'<td><span class="pill '+pctClass(rate)+'">'+fmt(rate,2)+'%</span></td>'
      +'<td>'+num(r[3])+' <span style="color:var(--mut);font-size:10px">Yds</span></td>'
      +'<td>'+fmt(r[4],1)+' <span style="color:var(--mut);font-size:10px">Yds</span></td></tr>';
  });
  var tr=tt.r?(tt.r-tt.f)/tt.r*100:0;
  h+='</tbody><tfoot><tr><td>Total</td><td>'+num(tt.r)+'</td><td>'+num(tt.f)+'</td>'
   +'<td>'+fmt(tt.r?tt.f/tt.r*100:0,1)+'%</td>'
   +'<td><span class="pill '+pctClass(tr)+'">'+fmt(tr,2)+'%</span></td>'
   +'<td>'+num(tt.u)+' <span style="font-size:10px">Yds</span></td>'
   +'<td>'+fmt(tt.w,1)+' <span style="font-size:10px">Yds</span></td></tr></tfoot></table></div>';
  return h;
}

/* ================= Detailed Summary =================
   One table, every breakdown. The cards above each answer one fixed question;
   this answers whichever one is being asked right now.

   Filtering is on the NAME, and it is a plain "contains" match, deliberately.
   A floor leader typing "dec" wants every Decathlon row and does not want to
   learn a syntax to get it. Rows are otherwise untouched, so the totals line
   always describes exactly what is on screen rather than the whole period. */
var DET_DIMS = [
  { k:'floor', label:'Floor',        head:'Floor',        src:function(){ return D.byFloor   } },
  { k:'fab',   label:'Fabric Type',  head:'Fabric Type',  src:function(){ return D.byFabric  } },
  { k:'buyer', label:'Buyer',        head:'Buyer',        src:function(){ return D.byBuyer   } },
  { k:'con',   label:'Consignment',  head:'Consignment',  src:function(){ return D.byConsign } },
  { k:'day',   label:'Date',         head:'Date',         src:function(){ return D.byDay     } }
];

function detDim(){
  for(var i=0;i<DET_DIMS.length;i++) if(DET_DIMS[i].k===DET_DIM) return DET_DIMS[i];
  return DET_DIMS[0];
}
function setDetDim(k){ DET_DIM=k; render() }
function setDetQuery(v){
  DET_QUERY=String(v||'');
  /* Redraw only this card, so the cursor stays in the box while typing. */
  var host=document.getElementById('detbody');
  if(host) host.innerHTML=detTable();
  var lbl=document.getElementById('dethint');
  if(lbl) lbl.textContent=detRows().length+' row(s)';
}
function clearDetQuery(){
  DET_QUERY='';
  var i=document.getElementById('detq'); if(i) i.value='';
  render();
}

function detRows(){
  var rows=(detDim().src()||[]).filter(function(r){
    var k=String(r[0]||'').trim();
    /* A row with no label says nothing and cannot be acted on. */
    if(!k || k.toUpperCase()==='(BLANK)') return false;
    if(!DET_QUERY) return true;
    return k.toLowerCase().indexOf(DET_QUERY.toLowerCase())>=0;
  });
  return rows;
}

function detTable(){
  var rows=detRows();
  if(!rows.length){
    return '<div class="empty">'
      + (DET_QUERY ? 'Nothing matches &ldquo;'+esc(DET_QUERY)+'&rdquo;.'
                   : 'Nothing to show for this breakdown.')
      + '</div>';
  }
  return tableOf(rows, detDim().head, 'det');
}

function detCard(){
  var h='<div class="card" id="detcard"><div class="hd"><h3>Detailed Summary</h3>'
   +'<span class="hint" id="dethint">'+detRows().length+' row(s)</span>'
   +'<span class="push" style="font-size:10.5px;color:var(--mut)">click a heading to sort</span></div>';

  h+='<div class="chips">';
  DET_DIMS.forEach(function(d){
    h+='<button class="chip'+(DET_DIM===d.k?' on':'')+'" onclick="setDetDim(\''+d.k+'\')">'
      + esc(d.label)+'</button>';
  });
  h+='</div>';

  h+='<div class="detbar">'
   +'<input class="detq" id="detq" type="text" placeholder="Filter '+esc(detDim().label.toLowerCase())+'\u2026" '
   +'value="'+esc(DET_QUERY)+'" oninput="setDetQuery(this.value)">';
  if(DET_QUERY) h+='<button class="afclear" onclick="clearDetQuery()">Clear</button>';
  h+='</div>';

  h+='<div id="detbody">'+detTable()+'</div></div>';
  return h;
}

/* ---------- bar list ---------- */
/* One bar, one meaning: its LENGTH is wasted yards, measured against the
   worst fabric in the current scope. Colour carries nothing, so every bar is
   red. The three numbers that matter sit to the right in fixed columns:
   total rolls, failed rolls, wasted yards. */
function barList(rows,t,limit){
  if(!rows.length) return '<div class="empty">Nothing in this scope.</div>';
  var use=limit ? rows.slice(0,limit) : rows;
  var maxW=0; use.forEach(function(r){ if(r[4]>maxW) maxW=r[4] });
  if(maxW<=0) maxW=1;
  var h='<div class="bars">';
  use.forEach(function(r){
    h+='<div class="brow" '
      +'title="'+esc(r[0])+': '+num(r[1])+' rolls, '+num(r[2])+' failed, '+fmt(r[4],1)+' Yds wasted.">'
      +'<div class="bname">'+esc(r[0])+'</div>'
      +'<div class="btrack"><div class="bfill" style="width:'+(r[4]/maxW*100)+'%"></div></div>'
      +'<div class="bval">'
        +'<span><b>'+num(r[1])+'</b><i>rolls</i></span>'
        +'<span><b class="bad">'+num(r[2])+'</b><i>failed</i></span>'
        +'<span><b class="wst">'+fmt(r[4],1)+'</b><i>Yds</i></span>'
      +'</div></div>';
  });
  return h+'</div>';
}

/* One line saying what is on screen: range, day count, row count. daily.html

/* Measure first, then draw, so the SVG is 1:1 with CSS pixels. */
function drawChart(){
  var host=$('chhost');
  if(!host||!D||!D.byDay.length) return;
  var W=Math.max(520,Math.floor(host.clientWidth));
  host.innerHTML=chart(D.byDay,W);
  wireChart();
}
var _rsz;
window.addEventListener('resize',function(){
  clearTimeout(_rsz);
  _rsz=setTimeout(function(){ syncStickyOffsets(); syncPairHeight(); drawChart() },180);
});
/* This used to sit INSIDE the resize handler, so it only registered the first
   time the window was resized, by which point the one-shot load event had long
   since fired. It never ran, and every resize added another dead listener. */
window.addEventListener('load', syncPairHeightSoon);

/* ---------- sticky offsets ----------
   Same approach as fabric.html and daily.html. The control strip and the card
   title bars are sticky, so every scroll box below them must be told how much
   viewport is actually left, otherwise it either never scrolls (and the header
   never pins) or it runs off the bottom of the screen. */
function boxH(sel){
  var el=document.querySelector(sel);
  return el ? el.getBoundingClientRect().height : 0;
}
/* Match the Fabric Type card to the Floor Ranking card.
   The floor table sets the height because it must never show blank space
   under its last row. The fabric list is then capped to whatever height is
   left after its own header and chips, and scrolls inside that. Nothing is
   stretched, so neither card carries dead space. */
function syncPairHeight(){
  var fl=document.getElementById('floorcard');
  var fb=document.getElementById('fabcard');
  if(!fl||!fb) return;
  var bars=fb.querySelector('.bars');
  if(!bars) return;

  bars.style.maxHeight='';                       /* measure unconstrained */
  if(window.innerWidth<=1180) return;            /* stacked, let it run free */

  var target=fl.getBoundingClientRect().height;  /* the floor card, natural */
  /* everything in the fabric card that is NOT the scrolling list: title bar,
     the floor chips, the active filter bar, and the column header strip */
  var chrome=fb.getBoundingClientRect().height - bars.getBoundingClientRect().height;
  var h=target-chrome;
  if(h>120) bars.style.maxHeight=h+'px';
}

/* Measuring straight after innerHTML can read a stale layout, and a late web
   font can change the floor table's height after the first pass. Re-run on the
   next frame, and once more when the font has settled, so the two cards end
   level whatever the timing. */
function syncPairHeightSoon(){
  if(window.requestAnimationFrame) requestAnimationFrame(syncPairHeight);
  else syncPairHeight();
  setTimeout(syncPairHeight,120);
  setTimeout(syncPairHeight,400);
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncPairHeight);

function syncStickyOffsets(){
  var r=document.documentElement;
  var strip=boxH('.strip');
  var hd=boxH('.card>.hd');
  var af=boxH('.afbar');            /* only present while a filter is active */
  if(strip>0 && strip<200) r.style.setProperty('--stripH', strip+'px');
  if(hd>0 && hd<200)       r.style.setProperty('--cardHdH', hd+'px');
  r.style.setProperty('--afH', (af>0 && af<120 ? af : 0)+'px');
}
window.addEventListener('load', syncStickyOffsets);

/* ---------- silent background widening ----------
   Runs after the page is on screen and never touches the UI. It fills the
   local store for the last PREFETCH_WINDOW days so switching presets, or
   dragging the range back a couple of weeks, needs no network call at all. */
function prefetchAhead(){
  if(prefetching || !DATES.length) return;
  var want = DATES.slice(-PREFETCH_WINDOW);
  var missing = want.filter(function(d){
    if(DAYS[d] && DAYS[d].v===DAY_SCHEMA) return false;
    var c=lsGet(LS_DAY+d);
    return !(c && c.v===DAY_SCHEMA);
  });
  if(!missing.length) return;

  prefetching = true;
  var chunks=[];
  for(var i=0;i<missing.length;i+=FETCH_CHUNK) chunks.push(missing.slice(i,i+FETCH_CHUNK));

  var run = function(){
    Promise.all(chunks.map(function(c){
      return fetch(API_URL+'?action=days&dates='+encodeURIComponent(c.join(',')))
        .then(function(r){ return r.ok ? r.json() : null });
    })).then(function(all){
      all.forEach(function(res){
        if(!res || res.error || !res.days) return;
        for(var k in res.days) if(res.days.hasOwnProperty(k)){
          if(res.days[k] && res.days[k].v!==DAY_SCHEMA) continue;   /* old shape */
          DAYS[k]=res.days[k]; lsSet(LS_DAY+k,res.days[k]);
        }
      });
      prefetching=false;
    }).catch(function(){ prefetching=false });
  };
  if(window.requestIdleCallback) requestIdleCallback(run,{timeout:5000}); else setTimeout(run,1200);
}
function fabricCard(){
  var rows = fabricRows();
  var scoped = !!(fabFact||fabFloor);

  var h='<div class="card" id="fabcard"><div class="hd"><h3>Fabric Type Wise Wastage Yards</h3>'
   +'<span class="hint">'+rows.length+' type(s)</span>'
   +'<span class="push" style="font-size:10.5px;color:var(--mut)">'+esc(fabScopeLabel())+'</span></div>';

  h+='<div class="chips">'
   +'<button class="chip'+(!scoped?' on':'')+'" onclick="clearFabScope()">All Floors</button>'
   +'<button class="chip fact'+(fabFact==='SOL'?' on':'')+'" onclick="toggleFabFact(\'SOL\')">SOL</button>'
   +'<button class="chip fact'+(fabFact==='SSL'?' on':'')+'" onclick="toggleFabFact(\'SSL\')">SSL</button>';
  fabScopeFloors().forEach(function(f){
    h+='<button class="chip'+(fabFloor===f?' on':'')+'" onclick="toggleFabFloor(\''+f+'\')">'+f+'</button>';
  });
  h+='</div>';

  if(scoped){
    h+='<div class="afbar"><span class="aflabel">Showing</span>'
      +'<span class="afchip"><b>'+esc(fabScopeLabel())+'</b>'
      +'<i onclick="clearFabScope()" title="Remove this filter">&times;</i></span>'
      +'<button class="afclear" onclick="clearFabScope()">Clear filter</button></div>';
  }

  h+='<div class="barhd"><span class="lft">Fabric</span>'
   +'<span class="lft" style="text-align:left">Wasted Yards</span>'
   +'<span class="h3c"><span>Rolls</span><span>Failed</span><span>Waste Yds</span></span></div>';
  h+=barList(rows,'fab',0)+'</div>';

/* Buyer Wise Wastage. Same bar treatment as the Fabric card, but no scope
   chips: Buyer is a property of the marker, not of the floor, so filtering it
   by floor would tell you where a buyer's fabric was cut, not who wasted it.
   Days pushed before 12-Aug-2026 have no Buyer and land in (BLANK). */
function buyerCard(){
  /* A day cached before 12-Aug-2026 may still carry a "(BLANK)" bucket from
     the old shape. DAY_SCHEMA should have thrown those away, but filtering
     here as well costs nothing and guarantees the table only ever lists real
     buyers, which is what was asked for. */
  var rows = ((D && D.byBuyer) || []).filter(function(r){
    var k=String(r[0]||'').trim().toUpperCase();
    return k && k!=='(BLANK)';
  });
  var h='<div class="card" id="buyercard"><div class="hd"><h3>Buyer Wise Wastage Yards</h3>'
   +'<span class="hint">'+rows.length+' buyer(s)</span></div>';
  h+='<div class="barhd"><span class="lft">Buyer</span>'
   +'<span class="lft" style="text-align:left">Wasted Yards</span>'
   +'<span class="h3c"><span>Rolls</span><span>Failed</span><span>Waste Yds</span></span></div>';
  h+=barList(rows,'buy',0)+'</div>';
  return h;
}

function kpi(cls,k,v,s,vc){
  return '<div class="kpi '+cls+'"><div class="k">'+k+'</div><div class="v '+(vc||'')+'">'+v+
         '</div><div class="s">'+s+'</div></div>';
}

/* ---------- Excel ---------- */
function sect(title,rows,firstHead){
  var t='<tr><td colspan="7" style="font-weight:bold;background:#333D6D;color:#fff">'+title+'</td></tr>'
   +'<tr><td><b>'+firstHead+'</b></td><td><b>Rolls</b></td><td><b>Failed</b></td><td><b>Fail %</b></td>'
   +'<td><b>Compliance %</b></td><td><b>Used Yds</b></td><td><b>Waste Yds</b></td></tr>';
  rows.forEach(function(r){
    t+='<tr><td>'+esc(r[0])+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td>'
     +'<td>'+fmt(r[1]?r[2]/r[1]*100:0,2)+'</td><td>'+fmt(rateOf(r),2)+'</td>'
     +'<td>'+fmt(r[3],2)+'</td><td>'+fmt(r[4],2)+'</td></tr>';
  });
  return t+'<tr><td colspan="7"></td></tr>';
}
function mxSect(title,kind){
  var t='<tr><td colspan="'+(RANGE.length+2)+'" style="font-weight:bold;background:#333D6D;color:#fff">'+title+'</td></tr>';
  t+='<tr><td><b>Floor</b></td>';
  RANGE.forEach(function(d){ t+='<td><b>'+esc(shortDate(d))+'</b></td>' });
  t+='<td><b>Range</b></td></tr>';
  var M={};
  RANGE.forEach(function(ds){ M[ds]={}; ((DAYS[ds]||{}).f||[]).forEach(function(r){ M[ds][r[0]]=r }) });
  FLOOR_ORDER.forEach(function(f){
    if(!D.byFloor.some(function(r){return r[0]===f})) return;
    t+='<tr><td>'+f+'</td>';
    var a=[0,0,0,0];
    RANGE.forEach(function(ds){
      var r=M[ds][f];
      if(!r||!r[1]){ t+='<td></td>'; return }
      a[0]+=r[1]; a[1]+=r[2]; a[3]+=r[4];
      t+='<td>'+(kind==='c'?fmt(rateOf(r),2):fmt(r[4],2))+'</td>';
    });
    t+='<td>'+(kind==='c'?fmt(a[0]?(a[0]-a[1])/a[0]*100:0,2):fmt(a[3],2))+'</td></tr>';
  });
  return t+'<tr><td colspan="'+(RANGE.length+2)+'"></td></tr>';
}
function exportExcel(){
  if(!D) return;
  var T=D.totals, rate=T.rolls?(T.rolls-T.fails)/T.rolls*100:0;
  var t='<table><tr><td colspan="7" style="font-size:15pt;font-weight:bold;color:#333D6D">'
   +'SOSL Cutting Section &ndash; Weekly Fabric Roll Compliance Report</td></tr>'
   +'<tr><td colspan="7">'+prettyDate(D.from)+' to '+prettyDate(D.to)+'</td></tr>'
   +'<tr><td colspan="7">Compliance % = passed rolls / total rolls. Allowance '
   +allowTextPlain(D.from,D.to)+'.</td></tr>'
   +'<tr><td colspan="7"></td></tr>'
   +'<tr><td><b>Rolls</b></td><td>'+T.rolls+'</td><td><b>Failed</b></td><td>'+T.fails+'</td>'
   +'<td><b>Compliance %</b></td><td>'+fmt(rate,2)+'</td><td></td></tr>'
   +'<tr><td><b>Used Yds</b></td><td>'+fmt(T.used,2)+'</td><td><b>Waste Yds</b></td><td>'+fmt(T.waste,2)+'</td>'
   +'<td><b>Markers</b></td><td>'+T.markers+'</td><td></td></tr><tr><td colspan="7"></td></tr>';
  t+=sect('DAY BY DAY',D.byDay,'Date');
  t+=mxSect('COMPLIANCE % BY FLOOR AND DATE','c');
  t+=mxSect('WASTE YDS BY FLOOR AND DATE','w');
  t+=sect('FLOOR',sortRows(D.byFloor,ST.floor),'Floor');
  t+=sect('FABRIC TYPE',D.byFabric,'Fabric Type');
  t+=sect('BUYER',(D.byBuyer||[]).filter(function(r){var k=String(r[0]||'').trim().toUpperCase();return k&&k!=='(BLANK)'}),'Buyer');
  t+=sect('CONSIGNMENT',sortRows(D.byConsign,ST.con),'Consignment');
  t+='</table>';
  var blob=new Blob(['﻿<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head>'
    +'<meta charset="utf-8"></head><body>'+t+'</body></html>'],{type:'application/vnd.ms-excel'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='Weekly Fabric Roll Compliance '+D.from+' to '+D.to+'.xls';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* The shell's Refresh delegates to whichever report is open. This page cares
   about the RANGE on screen, not about "the latest day", so only the days in
   that range are dropped and refetched. Days outside it stay cached. */
function tellDone(err){
  if(window.parent===window) return;
  window.parent.postMessage({type:'refresh-done', stamp:STAMP||'', error:err||''}, '*');
}

/* Refresh runs in two phases.
     Phase 1, foreground: the range ON SCREEN is rebuilt on the server and
       redrawn, so what you are looking at is never stale.
     Phase 2, background: every OTHER day still held locally is dropped and
       quietly re-fetched. Until that finishes those days are simply absent,
       so no stale figure can be served from the cache in the meantime.
   The user waits only for phase 1. */
var REFRESHING = false;

function refreshNow(){
  if(REFRESHING) return;
  REFRESHING = true;
  busy('Refreshing\u2026');

  var onScreen = (RANGE||[]).slice();
  onScreen.forEach(function(d){
    delete DAYS[d];
    try{ localStorage.removeItem(LS_DAY+d) }catch(e){}
  });

  refreshDates(true)
    .then(function(){ return forceDays(onScreen) })
    .then(function(){
      merge(); render();
      tellDone();
      REFRESHING = false;
      rewarmRest(onScreen);        /* phase 2, nobody is waiting for this */
    })
    .catch(function(e){
      REFRESHING = false;
      showErr(e); tellDone(e && e.message);
    });
}

/* Ask the server to REBUILD these days rather than serve its parked copy. */
function forceDays(list){
  if(!list.length) return Promise.resolve();
  var chunks=[];
  for(var i=0;i<list.length;i+=FETCH_CHUNK) chunks.push(list.slice(i,i+FETCH_CHUNK));
  var flbl='Rebuilding '+list.length+' day(s)';
  barBusy(true, flbl);
  var fdone=0;
  return Promise.all(chunks.map(function(c){
    return fetch(API_URL+'?action=days&fresh=1&dates='+encodeURIComponent(c.join(',')),
                 {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json() })
      .then(function(j){ fdone++; barSet(Math.min(0.95, fdone/chunks.length)); return j; });
  })).then(function(all){
    barBusy(false, flbl);
    all.forEach(function(res){
      if(!res || res.error || !res.days) return;
      for(var k in res.days) if(res.days.hasOwnProperty(k)){
        if(res.days[k] && res.days[k].v!==DAY_SCHEMA) continue;
        DAYS[k]=res.days[k]; lsSet(LS_DAY+k,res.days[k]);
      }
      if(res.generatedAt) setStamp(res.generatedAt);
    });
  }).catch(function(e){
    /* A failed rebuild must still clear the island, or it hangs on screen
       claiming work that has already stopped. */
    barBusy(false, flbl);
    throw e;
  });
}

/* Every other day this browser is holding is dropped immediately, so it can
   never serve a stale figure, then re-fetched quietly in the background. */
function rewarmRest(skip){
  var others=[];
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf(LS_DAY)===0){
        var d=k.slice(LS_DAY.length);
        if(skip.indexOf(d)===-1) others.push(d);
      }
    }
  }catch(e){}
  if(!others.length) return;

  others.forEach(function(d){
    delete DAYS[d];
    try{ localStorage.removeItem(LS_DAY+d) }catch(e){}
  });

  var run=function(){ forceDays(others.slice(-PREFETCH_WINDOW)).catch(function(){}) };
  if(window.requestIdleCallback) requestIdleCallback(run,{timeout:6000}); else setTimeout(run,900);
}

window.addEventListener('message',function(ev){
  if(!ev.data) return;
  if(ev.data.type==='do-refresh'){ refreshNow(); return; }
  if(ev.data.type==='snapshot-updated'){ clearAllDays(); boot(); }
});

boot();
</script>
