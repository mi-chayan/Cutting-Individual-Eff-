<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Fabric Roll Compliance Report</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --card:#fff; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
    /* Compliance bands. 100% is the target, not 65%, so the ladder is tighter
       than the efficiency report: red below 90, green 90 to 98, blue above 98. */
    --red:#D64550; --green:#1E8E4E; --blue:#1D6FD0; --amber:#C77700; --stripH:40px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;-webkit-text-size-adjust:100%}

  /* ---- compact control strip ---- */
  .strip{background:#fff;border-bottom:1px solid var(--line);padding:7px 16px;
         display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .strip h2{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap}
  .sep{width:1px;height:22px;background:var(--line)}
  .strip label{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  /* A native date input always renders in the browser's own locale format
     (mm/dd/yyyy here) and that cannot be restyled. So the real input is laid
     transparently over a label we format ourselves, keeping the native
     calendar popup while showing "1 Aug, 2026". */
  .dpick{position:relative;display:inline-flex;align-items:center;gap:7px;
         border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;
         font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;cursor:pointer}
  .dpick:hover{border-color:var(--violet)}
  .dpick svg{width:13px;height:13px;fill:var(--violet);flex:0 0 auto}
  .dpick input[type=date]{position:absolute;inset:0;width:100%;height:100%;
         opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-family:inherit}
  .mini{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:7px;
        padding:5px 11px;font-family:inherit;font-weight:700;font-size:11.5px;cursor:pointer;
        display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .mini:hover{background:var(--cream);border-color:var(--peach)}
  .mini svg{width:12px;height:12px;fill:var(--violet)}
  .showing{font-size:11px;color:var(--mut);white-space:nowrap}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}

  /* Excel and Print are the two things people actually reach for, so they get
     real colour instead of disappearing into the neutral filter buttons.
     Tinted at rest, solid on hover, same shape as every other .mini. */
  .mini.xls{background:#E8F5EE;color:#14663A;border-color:#9FD5B8;font-weight:800}
  .mini.xls svg{fill:#1E8E4E}
  .mini.xls:hover{background:#1E8E4E;color:#fff;border-color:#1E8E4E}
  .mini.xls:hover svg{fill:#fff}
  .mini.prn{background:#EEF1FA;color:#2B3566;border-color:#B9C2E4;font-weight:800}
  .mini.prn svg{fill:#333D6D}
  .mini.prn:hover{background:#333D6D;color:#fff;border-color:#333D6D}
  .mini.prn:hover svg{fill:#fff}


  .wrap{padding:13px 16px 26px;max-width:1560px;margin:0 auto}

  /* ---- KPI row ---- */
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;position:relative;overflow:hidden;
       box-shadow:0 1px 2px rgba(37,42,69,.05)}
  .kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
  .kpi.k2:before{background:var(--navy)} .kpi.k3:before{background:var(--peach)}
  .kpi.k4:before{background:var(--red)}  .kpi.k5:before{background:var(--amber)}
  .kpi .k{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;line-height:1.25}
  .kpi .v{font-size:23px;font-weight:800;margin-top:1px;line-height:1.05}
  .kpi .s{font-size:9.5px;color:var(--mut);margin-top:1px;line-height:1.3}
  .v.red{color:var(--red)} .v.green{color:var(--green)} .v.blue{color:var(--blue)} .v.amber{color:var(--amber)}

  /* grid-auto-rows floor stops the row collapsing when the floor table is
     filtered down to one or two rows */
  .toprow{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;margin-bottom:15px;
          grid-auto-rows:minmax(260px,auto)}
  .toprow>.card{margin-bottom:0}

  /* The fabric list is long and was stretching the row, which left the empty
     band under the floor table. height:0 makes this card contribute nothing to
     the row height, so the row is sized by the floor table alone, then
     min-height:100% pulls the card back up to that exact height. The list
     inside then scrolls on its own. */
  .toprow>#fabcard{height:0;min-height:100%;display:flex;flex-direction:column}
  .toprow>#fabcard>.hd{flex:0 0 auto}
  .toprow>#fabcard>.fabbody{flex:1 1 auto;min-height:0;overflow-y:auto;
        scrollbar-width:thin;scrollbar-color:#C9CEE4 transparent}
  .toprow>#fabcard>.fabbody::-webkit-scrollbar{width:8px}
  .toprow>#fabcard>.fabbody::-webkit-scrollbar-thumb{background:#C9CEE4;border-radius:8px}
  .toprow>#fabcard>.fabbody::-webkit-scrollbar-track{background:transparent}

  /* overflow:clip, not hidden. Both clip the rounded corners identically, but
     'hidden' creates a scroll container which breaks position:sticky headers. */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:15px;overflow:clip;
        box-shadow:0 1px 2px rgba(37,42,69,.05)}
  .card .hd{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(90deg,var(--cream),#fff)}
  .card .hd h3{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.2px}

  /* Floor card gets the raised treatment, same language as the daily report */
  #floorcard{border:1px solid var(--peach);border-radius:14px;
        box-shadow:0 10px 26px -8px rgba(51,61,109,.30),0 2px 8px rgba(114,62,195,.10);
        background:linear-gradient(180deg,#fff 0%,var(--cream) 260%)}
  #floorcard .hd{background:linear-gradient(90deg,var(--navy),#4A56A0)}
  #floorcard .hd h3{color:#fff}
  #floorcard .hd h3:before{content:'\25A0';color:var(--peach);margin-right:6px;font-size:9px;vertical-align:1px}
  #floorcard th{background:#404B8C}
  #floorcard th:hover{background:#4A56A0}
  .hint{font-size:10px;font-weight:700;color:var(--peach);letter-spacing:.2px;
        background:rgba(255,255,255,.13);border:1px solid rgba(255,207,149,.5);
        border-radius:20px;padding:3px 10px;white-space:nowrap}
  #mkcard .hint,#fabcard .hint{color:var(--violet);background:#F3EEFC;border-color:#D6C8F0}
  .fsel{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-family:inherit;font-size:11px;background:#fff;color:var(--txt);font-weight:700;max-width:100%}
  .search{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-family:inherit;font-size:11.5px;width:210px}
  .push{margin-left:auto}

  /* ---- fabric type bar list ---- */
  .fabbody{padding:9px 12px 11px}
  .fabrow{display:grid;grid-template-columns:82px 1fr 46px;align-items:center;gap:8px;
          padding:4px 5px;margin:0 -5px;border-radius:6px;cursor:pointer;transition:background .12s}
  .fabrow:hover{background:#F2F4FA}
  .fabrow.on{background:#EFE7FB;box-shadow:inset 2px 0 0 var(--violet)}
  .fabname{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bartrack{height:11px;background:#EDEFF6;border-radius:3px;overflow:hidden;position:relative}
  .barfill{height:100%;border-radius:3px;transition:width .45s cubic-bezier(.22,.61,.36,1)}
  .barfill.red{background:var(--red)} .barfill.green{background:var(--green)} .barfill.blue{background:var(--blue)}
  .fabpct{font-size:10.5px;font-weight:800;text-align:right}
  .fabpct.red{color:var(--red)} .fabpct.green{color:var(--green)} .fabpct.blue{color:var(--blue)}

  /* ---- active filter bar ---- */
  .activebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
             padding:7px 13px;background:#F6F4FD;border-bottom:1px solid #E4DDF6}
  .ablabel{font-size:9px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .afchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
          color:var(--navy);background:#fff;border:1px solid #D6C8F0;border-radius:20px;padding:3px 5px 3px 10px}
  .afchip b{color:var(--violet)}
  .afchip i{font-style:normal;cursor:pointer;width:15px;height:15px;border-radius:50%;
            display:inline-flex;align-items:center;justify-content:center;
            background:#EFE7FB;color:var(--violet);font-size:12px;line-height:1}
  .afchip i:hover{background:var(--violet);color:#fff}
  .afclear{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:20px;
           padding:3px 11px;font-family:inherit;font-size:10.5px;font-weight:800;
           color:var(--mut);cursor:pointer}
  .afclear:hover{border-color:var(--red);color:var(--red)}
  /* Clear button on the fabric card header itself */
  .fabclear{background:var(--red);color:#fff;border:0;border-radius:20px;
            padding:4px 11px;font-family:inherit;font-size:10px;font-weight:800;
            letter-spacing:.2px;cursor:pointer;white-space:nowrap}
  .fabclear:hover{filter:brightness(1.08)}
  .emptyacts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:11px}
  .emptyacts .afclear{margin-left:0;background:#fff}
  .fabsub{font-size:9px;color:var(--mut);grid-column:2 / span 2;margin-top:-2px}

  .scroll{overflow:visible}
  table{width:100%;border-collapse:collapse;min-width:700px}
  th{background:var(--navy);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:8px 9px;text-align:center;cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{background:#3D4880}
  th .arr{font-size:8px;opacity:.85;margin-left:2px}

  @media(min-width:901px){
    #floorcard>.hd,#mkcard>.hd{position:sticky;top:var(--stripH);z-index:16}
    #flrtable>thead th{position:sticky;top:calc(var(--stripH) + var(--flrHdH,0px));z-index:15}
    #mktable>thead th{position:sticky;top:calc(var(--stripH) + var(--mkHdH,0px));z-index:15}
    #flrtable>thead th,#mktable>thead th{box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}
  }

  td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  td.l{text-align:left}
  tbody tr:nth-child(even){background:#FAFBFE}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--cream)}
  tr.clickable{cursor:pointer}
  tr.active-floor{background:#EFE7FB !important;box-shadow:inset 3px 0 0 var(--violet)}
  tr.totalrow{background:var(--navy) !important;color:#fff;font-weight:800}
  tr.totalrow td{border-bottom:0}
  tr.totalrow .pct{color:#fff !important}

  .pct{font-weight:800}
  .pct.red{color:var(--red)} .pct.green{color:var(--green)} .pct.blue{color:var(--blue)}
  .bad{color:var(--red);font-weight:800}
  .waste{color:var(--amber);font-weight:800}
  .lblp{display:none}   /* short header label, print only */

  /* ---- marker drill-down ---- */
  tr.mkrow{cursor:pointer}
  tr.mkrow.open{background:#EFE7FB !important;font-weight:800;color:#3A2470}
  tr.mkrow.open>td{border-top:2px solid var(--violet);border-bottom:0}
  tr.mkrow.open>td:first-child{border-left:2px solid var(--violet)}
  tr.mkrow.open>td:last-child{border-right:2px solid var(--violet)}
  .caret{display:inline-block;width:0;height:0;border-left:4px solid var(--mut);
         border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
         margin-right:5px;transition:transform .15s;vertical-align:middle}
  tr.mkrow.open .caret{transform:rotate(90deg);border-left-color:var(--violet)}
  tr.detrow>td{padding:0;background:#EFE9FA;border:2px solid var(--violet);border-top:0}
  .detbox{padding:11px 13px}
  /* Marker-level facts stated once above the roll table, so Buyer does not
     have to be repeated identically down every roll row. */
  /* No overflow declared here on purpose, so it stays 'visible'. A scroll
     container would become the anchor for the sticky header below and stop it
     pinning to the page. Horizontal scrolling is added back only on narrower
     screens, in the max-width rule right underneath. */
  .detscroll{border:1px solid #D6C8F0;border-radius:8px;background:#FBF9FE}

  /* The roll table is 1360px wide. Allowing for wrap padding, card border and
     detbox padding it needs roughly 1430px of viewport before it fits without
     scrolling, which is where the sticky header can take over. */
  @media(max-width:1429px){
    .detscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  }
  @media(min-width:1430px){
    /* border-collapse:separate avoids Chrome miscalculating a sticky th offset
       on a collapsed-border table. Identical visually, the cells already draw
       their own bottom border. */
    table.dettable{border-collapse:separate;border-spacing:0}
    table.dettable>thead th{position:sticky;top:var(--detTop,0px);z-index:14;
      box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}
  }
  table.dettable{min-width:1360px;margin:0}
  table.dettable th{background:#6A46B5;font-size:8.5px;padding:6px 7px;cursor:default}
  table.dettable th:hover{background:#6A46B5}
  table.dettable td{padding:5px 7px;font-size:11px;border-bottom:1px solid #E7DFF7}
  table.dettable tbody tr{background:#FBF9FE}
  table.dettable tbody tr:nth-child(even){background:#F4EFFC}
  table.dettable tbody tr:hover{background:#E8DEFA}
  table.dettable tbody tr.fail{background:#FDECEC}
  table.dettable tbody tr.fail:hover{background:#FADCDC}
  .detloading{padding:20px;text-align:center;color:#6B5B92;font-size:11.5px;font-weight:700}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:9.5px;font-weight:800}
  .tag.yes{background:#E4F4EA;color:var(--green)}
  .tag.no{background:#FBE3E5;color:var(--red)}

  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:800;cursor:pointer;color:var(--mut)}
  .chip:hover{border-color:var(--violet);color:var(--violet)}
  .chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
  /* Factory chips read as a separate tier from the floor chips beside them */
  .chip.fact{color:var(--navy);border-color:#C3C9E4;background:#F1F3FA;letter-spacing:.3px}
  .chip.fact:hover{border-color:var(--navy);color:var(--navy);background:#E7EAF6}
  .chip.fact.on{background:var(--navy);border-color:var(--navy);color:#fff}

  .foot{font-size:10px;color:var(--mut);padding:8px 13px;background:#FAFBFE;line-height:1.5}
  .loading{padding:60px;text-align:center;color:var(--mut);font-weight:700}
  .spin{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp .9s linear infinite;margin-bottom:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{padding:40px;text-align:center;color:var(--mut);line-height:1.7}

  .printhead{display:none}

  /* ---------------- Tablet ---------------- */
  @media(max-width:900px){
    .strip{padding:6px 11px;gap:9px}
    .strip h2{font-size:11.5px}
    .sep{display:none}
    .wrap{padding:11px 11px 22px}
    .search{width:170px}
    .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
    /* stacked here, so the card sizes to its content and the list is not
       trapped in a short scroll box */
    .toprow{grid-template-columns:1fr;gap:11px;grid-auto-rows:auto}
    .toprow>#fabcard{height:auto;min-height:0;display:block}
    .toprow>#fabcard>.fabbody{overflow:visible;min-height:auto}
    .hp{display:none}
    #flrtable,#mktable{min-width:0}
    #flrtable th,#mktable th{white-space:normal;line-height:1.2}
    #mktable td.l{white-space:normal}
  }

  /* ---------------- Phone ---------------- */
  @media(max-width:560px){
    .strip{padding:6px 9px;gap:6px 8px;justify-content:flex-start}
    .strip h2{font-size:11px}
    .strip label{display:none}
    /* size the visible wrapper, not the transparent input inside it */
    .dpick{font-size:11.5px;padding:6px 8px;gap:5px;flex:0 1 auto;min-width:0}
    .mini{padding:7px 11px;font-size:11px}
    .showing{font-size:10px;order:5;width:100%}
    .acts{margin-left:auto}
    .wrap{padding:10px 9px 20px}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .kpi:first-child{grid-column:span 2}
    .kpi .v{font-size:21px}
    .card .hd{padding:8px 10px;gap:6px}
    .card .hd h3{font-size:11px;width:100%}
    .hint{display:none}
    .push{display:none}
    .fsel{font-size:11px;padding:7px 8px;flex:1 1 100%;min-width:0}
    .search{width:100%;padding:7px 9px;font-size:12px}
    .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
           scrollbar-width:none;width:100%;padding-bottom:2px}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;padding:6px 12px;font-size:11px}
    th{font-size:8.5px;padding:7px 6px}
    td{padding:7px 6px;font-size:11.5px}
    .hs{display:none}
    .detbox{padding:8px 9px}
    .foot{font-size:9px;padding:7px 10px}
  }

  @media(max-width:400px){
    .strip h2{font-size:10.5px}
    .mini{padding:7px 9px;font-size:10.5px}
    .kpi .v{font-size:19px}
    .card .hd h3{font-size:10.5px}
  }

  /* ---------------- Print: A4 landscape ---------------- */
  /* Landscape, not portrait: the marker table carries 11 columns and would be
     squeezed unreadable on a portrait page. */
  @page{ size:A4 landscape; margin:9mm 8mm; }
  @media print{
    body{background:#fff;font-size:9pt}
    /* activebar hidden: the print header already lists every active filter */
    .strip,.chips,.search,.fsel,.hint,.push,.acts,.activebar,.fabclear,.emptyacts,
    .kpi:before{display:none !important}
    .wrap{padding:0;max-width:none}
    .scroll{overflow:visible}
    .card{border:1px solid #bbb;border-radius:0;margin-bottom:6mm;break-inside:auto;
          box-shadow:none !important;background:#fff !important}
    .card .hd{background:#fff !important;padding:4pt 0;border-bottom:1.2pt solid var(--navy);position:static !important}
    .card .hd h3{font-size:10.5pt;color:var(--navy) !important}
    .card .hd h3:before{content:'' !important;margin:0 !important}
    #floorcard th{background:#333D6D !important}
    .printhead{display:flex;align-items:center;gap:6mm;margin-bottom:4mm;
               border-bottom:1.5pt solid #333D6D;padding-bottom:3mm}
    .printhead img{height:9mm;width:auto;flex:0 0 auto;display:block}
    .printhead .phbody{flex:1 1 auto;min-width:0}
    .printhead h1{font-size:11.5pt;font-weight:800;color:#333D6D;line-height:1.2;margin:0 0 2mm 0}
    .printhead .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2mm 5mm;
                     font-size:7.4pt;color:#666;line-height:1.35}
    .printhead .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .printhead .meta b{color:#111;font-weight:700}
    .toprow{display:block;grid-auto-rows:auto}
    #fabcard{page-break-inside:avoid}
    /* paper has no scrollbar, so the whole fabric list must print, not just
       the part that happens to be scrolled into view on screen */
    .toprow>#fabcard{height:auto !important;min-height:0 !important;display:block !important}
    .toprow>#fabcard>.fabbody{overflow:visible !important;min-height:auto !important;max-height:none !important}
    .kpis{display:flex;gap:3mm;margin-bottom:5mm;grid-template-columns:none}
    .kpi{flex:1;border:1px solid #bbb;border-radius:0;padding:2.5mm;page-break-inside:avoid}
    .kpi .v{font-size:13pt}
    .kpi .k{font-size:6.6pt}
    .kpi .s{font-size:6.2pt}
    table{min-width:0 !important;width:100% !important;table-layout:fixed;font-size:7.4pt}
    thead{display:table-header-group}
    tr{page-break-inside:avoid}
    th{background:#333D6D !important;color:#fff !important;padding:3.5pt 2pt;font-size:6.2pt;
       white-space:normal;word-break:break-word;line-height:1.15;position:static !important;
       -webkit-print-color-adjust:exact;print-color-adjust:exact}
    td{padding:2.8pt 2pt;border-bottom:.5pt solid #ddd;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
    td.l{white-space:normal;word-break:break-word}
    .lbl{display:none} .lblp{display:inline}
    tbody tr:nth-child(even){background:#F6F7FB !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    tr.totalrow{background:#333D6D !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .pct.red{color:#C0392B !important} .pct.green{color:#146C3A !important} .pct.blue{color:#14539E !important}
    .hs{display:table-cell !important}
    .hp{display:table-cell !important}
    /* drill-down never prints, paper output stays identical whatever is open */
    tr.detrow{display:none !important}
    tr.mkrow.open{background:transparent !important;box-shadow:none !important}
    .caret{display:none !important}
    .foot{background:#fff;font-size:7pt;padding:3pt 0;border-top:.5pt solid #ddd}
    body.single-floor #floorcard{display:none !important}
    .printfoot{display:block !important;margin-top:4mm;font-size:7pt;color:#666;text-align:center;
               border-top:.5pt solid #ccc;padding-top:2mm}
  }
  .printfoot{display:none}


  /* ================= the loading island =================
     Two pieces that work together.

     1. A REAL progress bar across the very top. It used to be a block sliding
        left to right for ever, which says "something is happening" and
        nothing else. Left is 0, right is 100, and it only ever moves
        forwards.

        Most of these fetches are ONE request, so there is no honest fraction
        to report until it lands. Rather than lie with a fake percentage, it
        eases toward 90 and waits there: fast at first, slower the longer it
        takes, which is the same trick GitHub uses and it reads as real
        because it never goes backwards and never completes early. Where a
        genuine fraction IS known, the weekly report fetching six days in
        chunks, barSet() overrides the easing with the true number.

     2. An island under the header saying WHAT is loading. Detached from the
        title bar, dark, rounded, with a progress ring on the left. It springs
        in, morphs when the text changes, and springs out.
     ---------------------------------------------------------------- */
  #bar{position:fixed;top:0;left:0;height:3px;width:100%;z-index:400;
       pointer-events:none;opacity:0;transition:opacity .3s ease}
  #bar.on{opacity:1}
  #bar i{display:block;height:100%;width:0;border-radius:0 3px 3px 0;
         background:linear-gradient(90deg,#5B33A8,#723EC3 55%,#B07CFF);
         box-shadow:0 0 10px rgba(176,124,255,.7);
         transition:width .34s cubic-bezier(.22,.61,.36,1)}
  /* A highlight travelling along the filled part, so a long wait still looks
     alive even while the number is barely moving. */
  #bar i:after{content:'';position:absolute;top:0;right:0;width:90px;height:100%;
       background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55));
       animation:barsheen 1.1s ease-in-out infinite}
  #bar i{position:relative;overflow:hidden}
  @keyframes barsheen{0%{opacity:.15}50%{opacity:.8}100%{opacity:.15}}

  /* NO CIRCULAR SPINNER. The pill already says what is loading in words and
     the bar across the top already shows that something is running. A third
     thing spinning beside them said nothing extra. */
  .island .ring{display:none !important}
  .island{position:fixed;top:12px;left:50%;z-index:401;
          display:inline-flex;align-items:center;gap:11px;
          background:rgba(12,12,18,.94);color:#fff;
          -webkit-backdrop-filter:blur(14px) saturate(160%);
          backdrop-filter:blur(14px) saturate(160%);
          border-radius:999px;padding:9px 18px 9px 13px;
          font-size:12px;font-weight:700;letter-spacing:.1px;white-space:nowrap;
          max-width:min(560px,90vw);overflow:hidden;
          box-shadow:0 10px 30px rgba(0,0,0,.34), inset 0 0 0 .5px rgba(255,255,255,.14);
          pointer-events:none;
          transform:translateX(-50%) translateY(-26px) scale(.80);
          opacity:0;
          transition:transform .46s cubic-bezier(.34,1.56,.64,1),
                     opacity .2s ease}
  .island.on{transform:translateX(-50%) translateY(0) scale(1);opacity:1}

  /* The progress ring. One CSS variable drives it, set from the same number
     that drives the bar, so the two can never disagree. */
  .island .ring{width:17px;height:17px;border-radius:50%;flex:0 0 auto;position:relative;
       background:conic-gradient(#B07CFF calc(var(--p,0) * 1%), rgba(255,255,255,.16) 0);
       transition:background .34s linear}
  .island .ring:after{content:'';position:absolute;inset:3.5px;border-radius:50%;
       background:#0C0C12}
  .island .ring:before{content:'';position:absolute;inset:-3px;border-radius:50%;
       border:1px solid rgba(176,124,255,.35);animation:islepulse 1.6s ease-in-out infinite}
  @keyframes islepulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.7;transform:scale(1.12)}}

  /* The label morphs rather than cutting, so switching from one report to
     another feels like the same object changing its mind. */
  .island .txt{display:inline-block;overflow:hidden;text-overflow:ellipsis;
       transition:opacity .16s ease}
  .island.swap .txt{opacity:0}
  .island .pct{font-variant-numeric:tabular-nums;opacity:.55;font-weight:800;
       font-size:10.5px;min-width:30px;text-align:right}

  @media (prefers-reduced-motion: reduce){
    .island{transition:opacity .2s ease}
    .island .ring:before{animation:none}
    #bar i:after{animation:none}
  }
  /* The old spinner is kept out of the way rather than deleted, so any
     markup that still asks for one simply shows nothing. */
  .spin{display:none !important}
  .mini.load.needs{background:var(--violet);color:#fff;border-color:var(--violet)}
  .mini.load.needs svg{fill:#fff}
  .mini.load.needs:hover{background:#5F31A6;border-color:#5F31A6}
  .mini.load svg{width:13px;height:13px;fill:currentColor}
  .ready{text-align:center;padding:60px 20px;color:var(--mut);font-size:12.5px;line-height:1.9}
  .ready b{display:block;color:var(--navy);font-size:15px;margin-bottom:5px}

  .dnote{display:none;margin:0 auto;max-width:1500px;padding:8px 14px;
         background:#FFF0D9;color:#8A5B12;border:1px solid #F2DDB6;border-radius:9px;
         font-size:11.5px;font-weight:700}
  .dnote.on{display:block;margin:10px auto 0}
</style>
</head>
<body>

<div id="bar"><i></i></div>
<div id="island" class="island">
  <span class="ring" id="isleRing"></span>
  <span class="txt" id="isleTxt"></span>
  <span class="pct" id="islePct"></span>
</div>


<div class="strip">
  <h2>Daily Fabric Roll Compliance Report</h2>
  <div class="sep"></div>
  <label>Report Date</label>
  <span class="dpick">
    <span id="d1label">&ndash;</span>
    <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 00-2 2v13a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 7v10H5V9h14z"/></svg>
    <input type="date" id="d1" onchange="pickDate()" onclick="openPicker(this)" aria-label="Report date">
  </span>
  <button class="mini load needs" id="loadBtn" onclick="doLoad()" title="Load this date">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 106 18.36l1.42-1.42A6 6 0 1112 18a5.94 5.94 0 01-4.24-1.76L6.34 17.66A8 8 0 1017.65 6.35zM13 3v6h6l-2.35-2.65z"/></svg>
    <span id="loadTxt">Load</span>
  </button>
  <button class="mini" onclick="goLatest()">Latest Day</button>
  <span class="showing" id="showing"></span>
  <div class="acts">
    <button class="mini xls" onclick="exportExcel()" title="Export current view to Excel">
      <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg> Excel
    </button>
    <button class="mini prn" onclick="doPrint()" title="Print current view, A4 landscape">
      <svg viewBox="0 0 24 24"><path d="M7 3h10v4H7V3zm12 6H5a2 2 0 00-2 2v6h4v4h10v-4h4v-6a2 2 0 00-2-2zm-4 10H9v-4h6v4z"/></svg> Print
    </button>
  </div>
</div>

<div id="dnote" class="dnote"></div>
<div id="content"><div class="loading">Loading&hellip;</div></div>

<script>

/* ==================================================================
   SNOWTEX dashboard kit
   Shared by daily, range, fabric and weekly. Keep the four copies the
   same: they are inlined rather than imported because every page is a
   single self contained file served from Cloudflare Pages.

   1. THE THIN BAR. Counted, not toggled. Two requests can overlap and a
      naive hide on the first response would switch it off while the
      second is still running.

   2. THE SELECTED DATE IS SHARED. Every report used to remember its own
      date, so moving from the Daily report to Fabric Compliance silently
      changed the day under you. One value in sessionStorage, written by
      whichever page the user last touched, read by all of them.

   3. FIRST OPEN LANDS ON YESTERDAY. Not on "the latest day the sheet
      happens to hold", which is a different date depending on whether
      this morning's report has been pulled yet.
   ================================================================== */

/* ---------- the bar and the island ----------
   Counted, not toggled: two requests can overlap and a naive hide on the
   first response would switch it off while the second is still running.

   PROGRESS. A single fetch gives no honest fraction, so the number eases
   toward 90 and waits, fast at first and slower the longer it takes. It never
   goes backwards and never reaches 100 until the work is actually done, which
   is what keeps it honest. Where a real fraction is known, call barSet(). */
var BUSY_N = 0, BUSY_LABELS = [], BAR_P = 0, BAR_T = null, BAR_HIDE = null;

function barPaint(){
  var b=document.getElementById('bar'), i=b?b.firstChild:null;
  if(i) i.style.width = BAR_P + '%';
  var r=document.getElementById('isleRing');
  if(r) r.style.setProperty('--p', Math.round(BAR_P));
  var p=document.getElementById('islePct');
  if(p) p.textContent = BAR_P>=100 ? '100%' : Math.round(BAR_P)+'%';
}

/* Ease toward 90 and stop. The step shrinks as it climbs, so a slow request
   crawls rather than stalling dead or pretending to finish. */
function barTick(){
  if(BAR_P < 90) BAR_P += Math.max(0.4, (90 - BAR_P) * 0.10);
  barPaint();
}

/** A real fraction, 0 to 1. Only ever moves the bar forwards. */
function barSet(frac){
  var v = Math.max(0, Math.min(1, Number(frac)||0)) * 100;
  if(v > BAR_P) { BAR_P = v; barPaint(); }
}

function islandShow(label){
  var isle=document.getElementById('island'), t=document.getElementById('isleTxt');
  if(!isle||!t) return;
  if(t.textContent && t.textContent !== label){
    /* Morph rather than cut: fade the old label out, swap, fade in. */
    isle.classList.add('swap');
    setTimeout(function(){ t.textContent=label; isle.classList.remove('swap'); },160);
  }else{
    t.textContent=label;
  }
  isle.classList.add('on');
}
function islandHide(){
  var isle=document.getElementById('island');
  if(isle) isle.classList.remove('on');
}

function barBusy(on, label){
  if(on){
    BUSY_N++;
    if(label) BUSY_LABELS.push(label);
    if(BUSY_N === 1){
      if(BAR_HIDE){ clearTimeout(BAR_HIDE); BAR_HIDE=null; }
      BAR_P = 8; barPaint();
      var b=document.getElementById('bar'); if(b) b.className='on';
      if(BAR_T) clearInterval(BAR_T);
      BAR_T = setInterval(barTick, 280);
    }
  }else{
    BUSY_N = Math.max(0, BUSY_N - 1);
    if(label){
      var i = BUSY_LABELS.indexOf(label);
      if(i >= 0) BUSY_LABELS.splice(i, 1);
    }
    if(!BUSY_N){
      BUSY_LABELS = [];
      if(BAR_T){ clearInterval(BAR_T); BAR_T=null; }
      BAR_P = 100; barPaint();
      islandHide();
      /* Let 100% be seen before it disappears, or the bar looks like it
         vanished at 80 and the work was abandoned. */
      BAR_HIDE = setTimeout(function(){
        var b=document.getElementById('bar'); if(b) b.className='';
        setTimeout(function(){ BAR_P=0; barPaint(); }, 320);
      }, 360);
      return;
    }
  }
  var txt = BUSY_LABELS.length ? BUSY_LABELS[BUSY_LABELS.length - 1] : '';
  if(txt) islandShow(txt); else islandHide();
}

/* Wrap any promise so the bar follows it, whatever the outcome. */
function track(p, label){
  barBusy(true, label);
  return p.then(function(v){ barBusy(false, label); return v; },
                function(e){ barBusy(false, label); throw e; });
}

var SD_DAY='sosl_dash_day', SD_FROM='sosl_dash_from', SD_TO='sosl_dash_to';
function ssRead(k){ try{ return sessionStorage.getItem(k)||''; }catch(e){ return ''; } }
function ssWrite(k,v){ try{ sessionStorage.setItem(k, v||''); }catch(e){} }

function isoOf(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function yesterdayISO(){
  var d=new Date(); d.setDate(d.getDate()-1); return isoOf(d);
}

/* The day this page should open on: whatever the user last looked at
   anywhere in the dashboard, otherwise yesterday. */
function wantedDay(){ return ssRead(SD_DAY) || yesterdayISO(); }
function shareDay(d){ if(d) ssWrite(SD_DAY, d); }

function wantedFrom(){ return ssRead(SD_FROM) || wantedDay(); }
function wantedTo(){   return ssRead(SD_TO)   || wantedDay(); }
function shareRange(a,b){ if(a) ssWrite(SD_FROM,a); if(b) ssWrite(SD_TO,b); }

/* =====================================================================
   Fabric Roll Compliance Report
   ---------------------------------------------------------------------
   Read straight from the Google Sheet, never recomputed here:
     marker compliance %  -> column G
     roll pass / fail     -> column V
     floor compliance %   -> Summary tab
   Calculated in Code.gs because the sheet does not hold it:
     Excess    = Roll Width - MW
     Waste Yds = Used Yds x (Excess - Allowance) / Roll Width, failed rolls only
     Allowance   = EFFECTIVE DATED, see TOLERANCE_RULES below.
                   from 12-08-2026: 2.00 in for padding, quilting, fleece,
                   sherpa, mesh, spandex, needle; 1.00 otherwise
                   before that:     1.50 in for padding, quilting, fleece,
                   sherpa; 1.00 otherwise
   ===================================================================== */

var API_URL = "https://script.google.com/macros/s/AKfycbyUKWEap2AzQqsJ99nYAwj281xETRg7fIQJ2GWR6lQGOL6lM2FBQO0IFMUMSwdO0atz/exec";
/* Cache keys carry a version. Bumped to v2 on 12-Aug-2026 when the Buyer
   column shifted every marker/roll field along by one. A sessionStorage
   copy saved before that change has the old shape and would paint garbage,
   so changing the key throws it away instead of trying to read it. */
var SNAP_KEY='fabric_snapshot_v3', DAYPFX='fabric_day_v3_', DETPFX='fabric_det_v3_';

var MARKERS=[], FLOORRATES={}, DATES=[], LATEST='', DAY='', STAMP='';
var floorFilter='', fabricFilter='', query='', compFilter='all';
var sortKey='waste', sortDir=-1;
var fSortKey='floor', fSortDir=1;
var DETAIL={}, DETLOADING={};
var expandKey='';
var FLOOR_ORDER=['1A','1B','1C','1D','1E','3A','2A','2B','2C','2D','2E'];
/* Building filter: '' = both factories, otherwise 'SOL' or 'SSL' */
var FACTORY={SOL:['1A','1B','1C','1D','1E','3A'],SSL:['2A','2B','2C','2D','2E']};
var factFilter='';
function scopeFloors(){ return factFilter ? FACTORY[factFilter] : FLOOR_ORDER; }
function inScope(f){ return !factFilter || FACTORY[factFilter].indexOf(f)>-1; }
/* Width allowance, mirrored from Code.gs and EFFECTIVE DATED the same way.
   The server prices the waste, but this page still decides which Excess
   figures to flag red, so it has to use the identical rule or the two would
   disagree on screen.

   Keep this list byte for byte in step with TOLERANCE_RULES in Code.gs.
   Newest first, first match wins, never edit an older row.
   Matched on a name FRAGMENT, so "Fleece Check Match" also matches. */
var TOLERANCE_RULES=[
  { from:'2026-08-12', narrow:1.00, wide:2.00,
    wideWords:['padding','quilting','fleece','sherpa','mesh','spandex','needle'] },
  { from:'0000-00-00', narrow:1.00, wide:1.50,
    wideWords:['padding','quilting','fleece','sherpa'] }
];
function toleranceRule(dateStr){
  var d=String(dateStr||'9999-12-31');
  for(var i=0;i<TOLERANCE_RULES.length;i++) if(d>=TOLERANCE_RULES[i].from) return TOLERANCE_RULES[i];
  return TOLERANCE_RULES[TOLERANCE_RULES.length-1];
}
function allowanceFor(fab,dateStr){
  var rule=toleranceRule(dateStr);
  var f=String(fab||'').toLowerCase();
  for(var i=0;i<rule.wideWords.length;i++) if(f.indexOf(rule.wideWords[i])>-1) return rule.wide;
  return rule.narrow;
}
/* Footnote text follows the rule for the date on screen, so a July report
   never claims the August allowance was applied to it. */
function allowText(dateStr){
  var r=toleranceRule(dateStr);
  var w=r.wideWords.slice();
  var last=w.pop();
  return r.wide.toFixed(2)+'&Prime; for '+w.join(', ')+' and '+last
       + ', '+r.narrow.toFixed(2)+'&Prime; otherwise';
}

function fmt(n,d){return (n==null||isNaN(n))?'-':Number(n).toFixed(d==null?0:d)}
/* Compliance bands: red below 90, green 90 to 98, blue above 98. */
function pctClass(p){return p<90?'red':(p<=98?'green':'blue')}
function floorRank(f){var i=FLOOR_ORDER.indexOf(f);return i<0?999:i}
/* House date format, used everywhere on screen, in print and in exports:
   "1 Aug, 2026" */
function prettyDate(s){
  if(!s)return '';
  var p=s.split('-'),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+', '+p[0];
}
/* Same format for a Date object, plus the clock, for "Generated" stamps */
function prettyStamp(d){
  d=d||new Date();
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var hh=d.getHours(), ap=hh>=12?'PM':'AM';
  hh=hh%12; if(!hh) hh=12;
  var mm=('0'+d.getMinutes()).slice(-2);
  return d.getDate()+' '+m[d.getMonth()]+', '+d.getFullYear()+', '+hh+':'+mm+' '+ap;
}
function compPass(v,mode){
  if(mode==='lt90')return v<90;
  if(mode==='90to98')return v>=90&&v<=98;
  if(mode==='gt98')return v>98;
  return true;
}
function compLabel(mode){
  return mode==='lt90'?'Below 90%':mode==='90to98'?'90% to 98%':mode==='gt98'?'Above 98%':'All';
}
function mapMarkers(arr){
  return (arr||[]).map(function(r){
    return {floor:r[0],date:r[1],markerSL:r[2],cutNo:r[3],buyer:r[4],fabric:r[5],
            ml:r[6],mw:r[7],table:r[8],rolls:r[9],fails:r[10],rate:r[11],
            used:r[12],waste:r[13]};
  });
}
function cacheGet(k){ try{var v=sessionStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null} }
function cacheSet(k,o){ try{sessionStorage.setItem(k,JSON.stringify(o))}catch(e){} }
function tellParent(s){ if(window.parent!==window) window.parent.postMessage({type:'stamp',value:s},'*'); }

/* ---------- boot: cache first, network only if empty ---------- */
function boot(){
  /* The date box is filled BEFORE anything is fetched, and it carries the same
     day the rest of the dashboard is on. */
  var want = wantedDay();
  document.getElementById('d1').value = want;
  syncDateLabel();
  /* Cached data in this tab is free, so it paints at once. What no longer
     happens is a network call nobody asked for. */
  /* If this day is already held, show it. Load is only for data we do not
     have; making someone click for a cached day is friction for nothing. */
  var snap=cacheGet(SNAP_KEY);
  var day =cacheGet(DAYPFX+want);

  if(snap && snap.latest===want){
    applySnapshot(snap);
    LOADED=true; DIRTY=false;
  }else if(day){
    DAY=want;
    MARKERS=mapMarkers(day.markers); FLOORRATES=day.floorRates||{};
    STAMP=day.generatedAt; tellParent(STAMP);
    resetFilters(); render();
    LOADED=true; DIRTY=false;
  }else{
    showReady('Press Load to read '+prettyDate(want));
    DIRTY=true;
  }
  paintLoadBtn();
}

/* =====================================================================
   ONE LOADING CONTRACT  (see daily.html for the reasoning)
   ===================================================================== */
var RUN={seq:0,label:''};
function runBegin(label){
  RUN.seq++; RUN.label=label;
  barBusy(true,label); islandShow(label);
  return RUN.seq;
}
function runCurrent(tok){ return tok===RUN.seq; }
function runEnd(tok){ if(tok!==RUN.seq) return; barBusy(false,RUN.label); }

var DIRTY=true, LOADED=false;
function markDirty(){ DIRTY=true; paintLoadBtn(); }
function paintLoadBtn(){
  var b=document.getElementById('loadBtn'); if(!b) return;
  var t=document.getElementById('loadTxt');
  var needs = DIRTY || !LOADED;
  b.classList.toggle('needs', needs);
  if(t) t.textContent = needs ? 'Load' : 'Reload';
  b.title = needs ? 'Load this date' : 'Read this date again';
}
function showReady(msg){
  LOADED=false;
  document.getElementById('content').innerHTML=
    '<div class="ready"><b>'+esc(msg)+'</b>'
    +'Nothing is read from the sheet until you press it, so this page opens instantly.</div>';
}

/* The Load button. */
function doLoad(){
  var d=document.getElementById('d1').value;
  if(d) fetchDay(d, true);
}

function dnote(txt){
  var n=document.getElementById('dnote');
  if(!n) return;
  n.innerHTML=txt||'';
  n.className = txt ? 'dnote on' : 'dnote';
}

function applySnapshot(res){
  DATES=res.dates||[]; LATEST=res.latest||''; STAMP=res.generatedAt||'';
  MARKERS=mapMarkers(res.markers); FLOORRATES=res.floorRates||{};
  DETAIL={}; DETLOADING={};
  tellParent(STAMP);
  if(!MARKERS.length && !LATEST){
    document.getElementById('content').innerHTML='<div class="empty">No dated rows found in the floor tabs yet.</div>';
    return;
  }

  /* Honour the day the user asked for rather than jumping to the newest one
     the sheet happens to hold. Falling back silently is how "I pushed this
     morning" turns into an argument. */
  var want = document.getElementById('d1').value || wantedDay();
  if(DATES.length && DATES.indexOf(want) < 0){
    dnote('<b>'+prettyDate(want)+'</b> has not been loaded into this report yet. '
        + 'Showing <b>'+prettyDate(LATEST)+'</b>, the most recent day available.');
    want = LATEST;
  }else{
    dnote('');
  }

  document.getElementById('d1').value = want;
  syncDateLabel();
  shareDay(want);
  DAY = want;

  if(want === LATEST){ resetFilters(); render(); }
  /* A snapshot only arrives because something was pressed, so show the day
     that was asked for. pickDate() now only ARMS Load, which would leave a
     deliberate press ending on an empty screen. */
  else { fetchDay(want, false); }
}

/* The shell's Refresh delegates to whichever report is open, because only
   this page knows which date is selected. */
function tellDone(err){
  if(window.parent===window) return;
  window.parent.postMessage({type:'refresh-done', stamp:STAMP||'', error:err||''}, '*');
}

/* Drop the cache for ONE day only, so refreshing today does not discard a
   day the user was comparing against. */
function clearDay(d){
  try{
    var kill=[];
    for(var i=0;i<sessionStorage.length;i++){
      var k=sessionStorage.key(i);
      if(!k) continue;
      if(k===DAYPFX+d) kill.push(k);
      if(k.indexOf(DETPFX)===0 && k.indexOf(d)>-1) kill.push(k);
      if(d===LATEST && k===SNAP_KEY) kill.push(k);
    }
    kill.forEach(function(k){ sessionStorage.removeItem(k) });
  }catch(e){}
  Object.keys(DETAIL).forEach(function(k){ if(k.indexOf(d)===0) delete DETAIL[k] });
  Object.keys(DETLOADING).forEach(function(k){ if(k.indexOf(d)===0) delete DETLOADING[k] });
}

/* Refresh runs in two phases.
     Phase 1, foreground: the date ON SCREEN is re-read and redrawn.
     Phase 2, background: every OTHER cached date is dropped immediately, so
       nothing stale can be served, then the most recent few are quietly
       re-fetched. The user waits only for phase 1. */
function purgeOtherDays(keep){
  var gone=[];
  try{
    var kill=[];
    for(var i=0;i<sessionStorage.length;i++){
      var k=sessionStorage.key(i);
      if(!k) continue;
      if(k.indexOf(DAYPFX)===0 && k!==DAYPFX+keep){ kill.push(k); gone.push(k.slice(DAYPFX.length)); }
      if(k.indexOf('fabric_det_')===0 && k.indexOf(keep)<0) kill.push(k);
    }
    kill.forEach(function(k){ sessionStorage.removeItem(k) });
  }catch(e){}
  Object.keys(DETAIL).forEach(function(k){ if(k.indexOf(keep)!==0) delete DETAIL[k] });
  Object.keys(DETLOADING).forEach(function(k){ if(k.indexOf(keep)!==0) delete DETLOADING[k] });
  return gone;
}

/* Quietly re-fetch a handful of recently viewed days so switching back is
   still instant. Bounded on purpose: this must never become a stampede. */
var REWARM_MAX = 4;
function rewarmDays(list){
  var pick = list.slice().sort().slice(-REWARM_MAX);
  var run = function(){
    pick.forEach(function(d, i){
      setTimeout(function(){
        fetch(API_URL+'?action=data&from='+encodeURIComponent(d)+'&to='+encodeURIComponent(d),
              {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : null })
          .then(function(res){ if(res && !res.error) cacheSet(DAYPFX+d, res) })
          .catch(function(){});
      }, i*700);
    });
  };
  if(window.requestIdleCallback) requestIdleCallback(run,{timeout:6000}); else setTimeout(run,900);
}

function refreshNow(){
  var d = DAY || LATEST;
  clearDay(d);
  var url = (d && d===LATEST)
      ? API_URL+'?action=snapshot&fresh=1'
      : API_URL+'?action=data&from='+encodeURIComponent(d)+'&to='+encodeURIComponent(d);

  document.getElementById('content').innerHTML=
    '<div class="loading">Refreshing '+prettyDate(d)+'&hellip;</div>';

  track(fetch(url,{cache:'no-store'}), 'Refreshing Fabric Roll Compliance, '+prettyDate(d))
    .then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(res.error) throw new Error(res.error);
      if(d===LATEST){ cacheSet(SNAP_KEY,res); applySnapshot(res); }
      else {
        cacheSet(DAYPFX+d,res);
        MARKERS=mapMarkers(res.markers); FLOORRATES=res.floorRates||{};
        STAMP=res.generatedAt; tellParent(STAMP); resetFilters(); render();
      }
      tellDone();
      rewarmDays(purgeOtherDays(d));      /* phase 2, nobody waits for this */
    })
    .catch(function(e){ showErr(e); tellDone(e.message); });
}

window.addEventListener('message',function(ev){
  if(ev.data && ev.data.type==='do-refresh'){ refreshNow(); return; }
  if(ev.data && ev.data.type==='snapshot-updated'){
    var snap=cacheGet(SNAP_KEY);
    if(snap) applySnapshot(snap);
  }
});

/* Latest Day must mean "newest date in the Google Sheet", not "newest date
   this browser tab happens to remember". The old version trusted LATEST from
   the sessionStorage snapshot, so after the morning push it kept showing
   yesterday until the tab was closed. Now it asks the server to rebuild and
   re-read, and it clears the local caches so nothing stale can win. */
function goLatest(){
  document.getElementById('content').innerHTML=
    '<div class="loading">Checking for the latest day&hellip;</div>';
  clearCaches();
  track(fetch(API_URL+'?action=snapshot&fresh=1'), 'Checking for the latest day')
    .then(function(r){ if(!r.ok)throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(res.error)throw new Error(res.error);
      cacheSet(SNAP_KEY,res);
      applySnapshot(res);
    }).catch(showErr);
}

/* Drop every cached day, detail and snapshot for this page. */
function clearCaches(){
  try{
    var kill=[];
    for(var i=0;i<sessionStorage.length;i++){
      var k=sessionStorage.key(i);
      if(k===SNAP_KEY||k.indexOf(DAYPFX)===0||k.indexOf(DETPFX)===0) kill.push(k);
    }
    kill.forEach(function(k){sessionStorage.removeItem(k)});
  }catch(e){}
  DETAIL={}; DETLOADING={};
}

/* Choosing a date ARMS Load rather than firing a request, so flicking through
   days costs nothing and cannot leave a slower older reply on screen. */
function pickDate(){
  var d=document.getElementById('d1').value;
  if(!d)return;
  DAY=d; syncDateLabel(); shareDay(d); dnote('');
  showReady('Press Load to read '+prettyDate(d));
  markDirty();
}

/* The actual read. force=true skips the tab cache. */
function fetchDay(d, force){
  DAY=d; syncDateLabel(); shareDay(d); dnote('');

  if(!force){
    var c=(d===LATEST) ? cacheGet(SNAP_KEY) : cacheGet(DAYPFX+d);
    if(c){
      MARKERS=mapMarkers(c.markers); FLOORRATES=c.floorRates||{};
      STAMP=c.generatedAt; tellParent(STAMP); resetFilters(); render();
      LOADED=true; DIRTY=false; paintLoadBtn();
      return;
    }
  }

  var label='Fabric Roll Compliance, '+prettyDate(d);
  var tok=runBegin(label);
  document.getElementById('content').innerHTML='<div class="loading">'+esc(label)+'&hellip;</div>';
  fetch(API_URL+'?action=data&from='+encodeURIComponent(d)+'&to='+encodeURIComponent(d),{cache:'no-store'})
    .then(function(r){ if(!r.ok)throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(!runCurrent(tok)) return;
      runEnd(tok);
      if(res.error)throw new Error(res.error);
      cacheSet(DAYPFX+d,res);
      MARKERS=mapMarkers(res.markers); FLOORRATES=res.floorRates||{};
      STAMP=res.generatedAt; tellParent(STAMP);
      resetFilters(); render();
      LOADED=true; DIRTY=false; paintLoadBtn();
    })
    .catch(function(e){
      if(!runCurrent(tok)) return;
      runEnd(tok); showErr(e);
    });
}

function resetFilters(){floorFilter='';factFilter='';fabricFilter='';query='';compFilter='all';expandKey=''}

/* ---------- roll drill-down ---------- */
function detKey(floor){ return DAY+'_'+floor }

/* Warm the roll-level data for a floor quietly in the background, so the
   first marker click normally finds it already in memory. */
function prefetchDetail(floor){
  if(!floor||!DAY) return;
  var k=detKey(floor);
  if(DETAIL[k]||DETLOADING[k]) return;

  var cached=cacheGet(DETPFX+k);
  if(cached){ DETAIL[k]=cached.rows||[]; return; }

  DETLOADING[k]=true;
  fetch(API_URL+'?action=detail&date='+encodeURIComponent(DAY)+'&floor='+encodeURIComponent(floor))
    .then(function(r){ if(!r.ok)throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      DETLOADING[k]=false;
      if(res.error) return;
      DETAIL[k]=res.rows||[];
      cacheSet(DETPFX+k,res);
      if(expandKey && expandKey.split('|')[0]===floor) render();
    })
    .catch(function(){ DETLOADING[k]=false; });
}

function prefetchVisibleFloors(list){
  var queue=list.slice(), i=0;
  (function next(){
    if(i>=queue.length) return;
    prefetchDetail(queue[i++]);
    setTimeout(next,400);
  })();
}

function stickyStackH(){
  var h=boxH('.strip');
  if(window.matchMedia('(min-width:901px)').matches){
    h+=boxH('#mkcard>.hd')+boxH('#mktable>thead>tr');
  }
  return h;
}
function scrollRowIntoView(){
  var row=document.querySelector('tr.mkrow.open');
  if(!row) return;
  var smooth=!window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var top=window.pageYOffset+row.getBoundingClientRect().top-stickyStackH()-10;
  if(top<0) top=0;
  window.scrollTo({top:top,behavior:smooth?'smooth':'auto'});
}

function toggleDetail(floor,markerSL,cutNo,ev){
  if(ev) ev.stopPropagation();
  var k=floor+'|'+markerSL+'|'+cutNo;
  var opening=(expandKey!==k);
  expandKey=opening?k:'';
  if(expandKey) prefetchDetail(floor);
  render();
  if(opening) requestAnimationFrame(scrollRowIntoView);
}

function detailRowsFor(floor,markerSL,cutNo){
  var rows=DETAIL[detKey(floor)];
  if(!rows) return null;
  return rows.filter(function(r){
    return String(r[0])===String(markerSL) && String(r[1])===String(cutNo);
  });
}
function showErr(e){
  document.getElementById('content').innerHTML='<div class="empty">Error: '+e.message
    +'<br><br>Check: 1) API_URL is the /exec link of the Fabric Compliance sheet, 2) deployment access is "Anyone", 3) a NEW VERSION was deployed after the last code change.</div>';
}

/* ---------- aggregation ---------- */
function floorAgg(list){
  var map={};
  FLOOR_ORDER.forEach(function(f){map[f]={floor:f,markers:0,rolls:0,fails:0,used:0,waste:0}});
  list.forEach(function(m){
    var f=map[m.floor]; if(!f)return;
    f.markers++; f.rolls+=m.rolls; f.fails+=m.fails; f.used+=m.used; f.waste+=m.waste;
  });
  return FLOOR_ORDER.map(function(k){
    var f=map[k];
    /* Summary tab value wins. Roll counts are only the fallback if that floor
       has no Summary row for this date. */
    var sheetRate=FLOORRATES[k];
    f.comp=(typeof sheetRate==='number' && !isNaN(sheetRate))
             ? sheetRate
             : (f.rolls>0 ? (f.rolls-f.fails)/f.rolls*100 : 0);
    return f;
  });
}
function fabricAgg(list){
  var map={},order=[];
  list.forEach(function(m){
    var key=m.fabric||'(blank)';
    if(!map[key]){map[key]={fabric:key,markers:0,rolls:0,fails:0,used:0,waste:0};order.push(key)}
    var o=map[key];
    o.markers++; o.rolls+=m.rolls; o.fails+=m.fails; o.used+=m.used; o.waste+=m.waste;
  });
  return order.map(function(k){
    var o=map[k];
    o.comp=o.rolls>0?(o.rolls-o.fails)/o.rolls*100:0;
    return o;
  }).sort(function(a,b){ return a.comp-b.comp || b.rolls-a.rolls });
}

function currentSets(){
  var floorsAll=floorAgg(MARKERS);

  /* Total row covers the selected factory only, or both when none is picked */
  var grand={markers:0,rolls:0,fails:0,used:0,waste:0};
  MARKERS.filter(function(m){return inScope(m.floor)}).forEach(function(m){
    grand.markers++; grand.rolls+=m.rolls; grand.fails+=m.fails; grand.used+=m.used; grand.waste+=m.waste;
  });
  grand.comp=grand.rolls>0?(grand.rolls-grand.fails)/grand.rolls*100:0;

  /* KPI scope follows the floor selection, else the factory scope */
  var scoped = MARKERS.filter(function(m){
    return floorFilter ? m.floor===floorFilter : inScope(m.floor);
  });
  var tot={markers:0,rolls:0,fails:0,used:0,waste:0};
  scoped.forEach(function(m){
    tot.markers++; tot.rolls+=m.rolls; tot.fails+=m.fails; tot.used+=m.used; tot.waste+=m.waste;
  });
  tot.comp=tot.rolls>0?(tot.rolls-tot.fails)/tot.rolls*100:0;

  var fabrics=fabricAgg(scoped);

  var floorsShown=floorsAll.filter(function(f){return f.markers>0 && inScope(f.floor)});
  floorsShown.sort(function(a,b){
    if(fSortKey==='floor') return (floorRank(a.floor)-floorRank(b.floor))*fSortDir;
    var va=a[fSortKey],vb=b[fSortKey];
    if(typeof va==='string')return String(va).localeCompare(String(vb))*fSortDir;
    return (va-vb)*fSortDir;
  });

  var mkShown=MARKERS.filter(function(m){
    if(!inScope(m.floor))return false;
    if(floorFilter&&m.floor!==floorFilter)return false;
    if(fabricFilter&&m.fabric!==fabricFilter)return false;
    if(!compPass(m.rate,compFilter))return false;
    if(query){
      var q=query.toLowerCase();
      if(String(m.cutNo).toLowerCase().indexOf(q)<0
         && String(m.buyer||'').toLowerCase().indexOf(q)<0
         && String(m.fabric).toLowerCase().indexOf(q)<0
         && String(m.table).toLowerCase().indexOf(q)<0
         && String(m.markerSL).indexOf(q)<0)return false;
    }
    return true;
  });
  mkShown.sort(function(a,b){
    if(sortKey==='floor') return (floorRank(a.floor)-floorRank(b.floor))*sortDir;
    var va=a[sortKey],vb=b[sortKey];
    if(typeof va==='string')return String(va).localeCompare(String(vb))*sortDir;
    return (va-vb)*sortDir;
  });

  return {floorsAll:floorsAll,floorsShown:floorsShown,fabrics:fabrics,mkShown:mkShown,tot:tot,grand:grand};
}

function opt(v,label,cur){

function mth(label,key,shortLabel,cls){

function fth(label,key,shortLabel){

/* Switching factory clears the floor and fabric picks too. Both are scoped to
   the old factory: that floor may not exist in the new one, and that fabric
   may not be used there, which would silently empty the marker table. */
function toggleFact(f){
  factFilter=(factFilter===f)?'':f;
  floorFilter='';
  fabricFilter='';
  expandKey='';
  render();
}
function toggleFloor(f){
  floorFilter=(floorFilter===f)?'':f;
  expandKey='';
  if(floorFilter) prefetchDetail(floorFilter);
  render();
}
function toggleFabric(f){
  fabricFilter=(fabricFilter===f)?'':f;
  expandKey='';
  render();
}

/* ---------- active filter bar ---------- */
/* Every filter except the fabric one already shows its own state: the chips
   highlight, the dropdown displays its choice, the search box holds its text.
   The fabric pick only highlighted a row inside a panel that now scrolls, so
   it could sit active and completely out of sight. This bar states every
   active filter in one place and lets any of them be cleared in one click. */
function clearAllFilters(){
  factFilter=''; floorFilter=''; fabricFilter='';
  compFilter='all'; query=''; expandKey='';
  render();
}
function clearFilter(which){
  if(which==='fact'){ factFilter=''; floorFilter=''; fabricFilter=''; }
  else if(which==='floor') floorFilter='';
  else if(which==='fabric') fabricFilter='';
  else if(which==='comp') compFilter='all';
  else if(which==='query') query='';
  expandKey='';
  render();
}
/* Says exactly which combination came back empty, and offers the one-click way
   out. A bare "no marker matches" leaves the user guessing which of five
   filters is responsible. */
function emptyMarkerMsg(){
  var scope = floorFilter ? ('floor '+floorFilter)
            : (factFilter ? factFilter : 'any floor');
  var h='';

  if(fabricFilter && floorFilter){
    h='<b>'+esc(fabricFilter)+'</b> was not used on <b>floor '+floorFilter+'</b> on '+prettyDate(DAY)+'.';
  }else if(fabricFilter){
    h='No <b>'+esc(fabricFilter)+'</b> marker on '+scope+' on '+prettyDate(DAY)+'.';
  }else if(floorFilter){
    h='No marker on <b>floor '+floorFilter+'</b> on '+prettyDate(DAY)+'.';
  }else{
    h='No marker matches the current filters.';
  }

  if(compFilter!=='all') h+='<br>Compliance filter <b>'+esc(compLabel(compFilter))+'</b> is also on.';
  if(query) h+='<br>Search <b>'+esc(query)+'</b> is also on.';

  h+='<div class="emptyacts">';
  if(fabricFilter) h+='<button class="afclear" onclick="clearFilter(\'fabric\')">Remove fabric filter</button>';
  if(floorFilter)  h+='<button class="afclear" onclick="clearFilter(\'floor\')">Show all floors</button>';
  h+='<button class="afclear" onclick="clearAllFilters()">Clear all filters</button></div>';
  return h;
}

function activeFilterBar(){
  var items=[];
  if(factFilter)  items.push(['fact','Factory',factFilter]);
  if(floorFilter) items.push(['floor','Floor',floorFilter]);
  if(fabricFilter)items.push(['fabric','Fabric',fabricFilter]);
  if(compFilter!=='all') items.push(['comp','Compliance',compLabel(compFilter)]);
  if(query) items.push(['query','Search',query]);
  if(!items.length) return '';

  var h='<div class="activebar"><span class="ablabel">Filtered by</span>';
  items.forEach(function(it){
    h+='<span class="afchip">'+it[1]+': <b>'+esc(it[2])+'</b>'
      +'<i onclick="clearFilter(\''+it[0]+'\')" title="Remove this filter">&times;</i></span>';
  });
  if(items.length>1) h+='<button class="afclear" onclick="clearAllFilters()">Clear all</button>';
  return h+'</div>';
}

function th2(s){return '<th style="background:#333D6D;color:#fff;font-weight:bold">'+esc(s)+'</th>'}

/* Real Excel percentage: value stored as a fraction, displayed with a % sign,
   so the column still sorts and averages correctly instead of being plain text. */
function pctTd(v,dec,extra){
  if(v==null||isNaN(v)) return '<td>-</td>';
  var f='0'+(dec>0?'.'+Array(dec+1).join('0'):'')+'%';
  var st="mso-number-format:'"+f+"';"+(extra||'');
  return '<td style="'+st+'">'+(v/100)+'</td>';
}

/* ---------- sticky offsets ---------- */
function boxH(sel){
  var el=document.querySelector(sel);
  return el ? el.getBoundingClientRect().height : 0;
}
function syncStickyOffsets(){
  var r=document.documentElement;
  var strip=boxH('.strip');
  var mkHd=boxH('#mkcard>.hd');
  r.style.setProperty('--stripH', strip+'px');
  r.style.setProperty('--flrHdH', boxH('#floorcard>.hd')+'px');
  r.style.setProperty('--mkHdH',  mkHd+'px');

  /* Where the opened roll table's header must sit: under the control strip,
     the marker card's title bar and that table's own column header. Measured
     on the header ROW, because getBoundingClientRect on a <thead> is not
     reliable across engines and a wrong reading strands the header mid-table.
     One resolved number rather than a chain of vars, plus a clamp so a bad
     measurement can never push it down the page. */
  var detTop=strip+mkHd+boxH('#mktable>thead>tr');
  if(!isFinite(detTop) || detTop<0 || detTop>500) detTop=strip+mkHd+28;
  r.style.setProperty('--detTop', detTop+'px');
}
window.addEventListener('resize', syncStickyOffsets);
window.addEventListener('load', syncStickyOffsets);

boot();
syncStickyOffsets();

})();
