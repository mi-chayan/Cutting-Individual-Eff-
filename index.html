<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNOWTEX | SOSL Cutting Section Dashboard</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#333D6D">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  /* Mobile browsers shrink the visible area when the address bar shows. With
     plain 100% the footer ends up under it. dvh tracks the real viewport. */
  @supports (height:100dvh){ html,body{height:100dvh} }
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;display:flex;flex-direction:column;overflow:hidden;
       -webkit-text-size-adjust:100%}

  /* Side blocks are absolute, so the title is the only in-flow child and sits
     dead centre. Padding is symmetric and wide enough to clear both blocks,
     which keeps the centring true instead of nudging the title off-axis. */
  .hdr{background:var(--navy);color:#fff;padding:6px 235px;display:flex;align-items:center;
       justify-content:center;position:relative;min-height:44px;flex:0 0 auto}
  .hdr img.logo{height:24px;display:block;border-radius:3px;flex:0 0 auto}
  .hdr h1{font-size:17px;font-weight:800;line-height:1.2;letter-spacing:.2px;text-align:center}
  .hdrright{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:11px}

  /* ---- 3 bar menu + logo ---- */
  .hdrleft{position:absolute;left:14px;top:50%;transform:translateY(-50%);
           display:flex;align-items:center;gap:10px}
  .burger{background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:8px;
          width:34px;height:30px;cursor:pointer;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:4px;padding:0}
  .burger:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5)}
  .burger span{display:block;width:16px;height:2px;background:#fff;border-radius:2px;transition:.18s}
  .burger.on span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .burger.on span:nth-child(2){opacity:0}
  .burger.on span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  /* Dark panel on purpose. A white menu sat on the white report page with no
     visible edge, so the two blended together. */
  .menu{position:absolute;left:0;top:calc(100% + 7px);background:#2B3358;
        border:1px solid rgba(255,255,255,.18);
        border-radius:10px;box-shadow:0 16px 38px -8px rgba(10,14,35,.6);padding:6px;
        min-width:250px;display:none;z-index:60}
  .menu.open{display:block}
  .menu .menuhd{font-size:9px;font-weight:800;color:#9AA2C8;text-transform:uppercase;
                letter-spacing:.7px;padding:6px 9px 5px}
  .menu .mi{display:block;width:100%;text-align:left;background:transparent;border:0;
            font-family:inherit;font-size:12px;font-weight:700;color:#E7EAF6;
            padding:8px 10px;border-radius:7px;cursor:pointer}
  .menu .mi:hover{background:rgba(255,255,255,.12);color:#fff}
  .menu .mi.on{background:var(--violet);color:#fff}
  /* No chip or border, just readable text. The old colour was too dim, so the
     label is lightened and the timestamp itself is solid white. */
  .stamp{font-size:10px;text-align:right;line-height:1.35;white-space:nowrap}
  .stamp .lbl{display:block;color:#C9CFE8;font-size:8.5px;font-weight:700;
              text-transform:uppercase;letter-spacing:.5px}
  .stamp b{color:#fff;font-size:11px;font-weight:800}
  .refresh{background:var(--violet);color:#fff;border:0;border-radius:8px;padding:7px 14px;
    font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .refresh:hover{filter:brightness(1.1)}
  .refresh:disabled{opacity:.75;cursor:default}

  /* ---------- Refresh warning dialog ----------
     Floor leaders were pressing Refresh while a report was still doing its
     first load. That cancels nothing on the server, it just queues a second
     full rebuild behind the first, so the page they were waiting for takes
     LONGER. The button alone could not teach them that, so it now says so. */
  .ovl{position:fixed;inset:0;background:rgba(20,22,45,.55);z-index:9000;
       display:none;align-items:center;justify-content:center;padding:20px}
  .ovl.on{display:flex}
  .dlg{background:#fff;border-radius:12px;max-width:430px;width:100%;
       box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden;
       font-family:inherit;animation:pop .16s ease-out}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .dlg .dh{padding:14px 18px;font-weight:700;font-size:14.5px;color:#fff}
  .dlg.warn .dh{background:#C77700}
  .dlg.stop .dh{background:#B3261E}
  .dlg .db{padding:16px 18px;font-size:13px;line-height:1.6;color:#333}
  .dlg .db b{color:#333D6D}
  .dlg .df{padding:12px 18px 16px;display:flex;gap:9px;justify-content:flex-end}
  .dlg button{border:0;border-radius:8px;padding:9px 16px;font-size:12.5px;
              font-weight:600;cursor:pointer;font-family:inherit}
  .dlg .no{background:#ECECF2;color:#40405C}
  .dlg .no:hover{background:#DEDEE8}
  .dlg .yes{background:var(--violet);color:#fff}
  .dlg .yes:hover{filter:brightness(1.1)}
  .dlg .ok{background:#333D6D;color:#fff}
  @media(max-width:520px){ .dlg .df{flex-direction:column-reverse}
                           .dlg button{width:100%} }
  .dot{width:12px;height:12px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:none;flex:0 0 auto}
  /* The circular spinner is gone. The button already says "Loading" and the
     progress bar already says what is loading, so a spinning ring added a
     third thing saying the same thing. */
  .refresh.busy .dot{display:none}
  @keyframes sp{to{transform:rotate(360deg)}}

  #frame{flex:1 1 auto;width:100%;border:0;display:block;background:var(--bg)}
  @keyframes slideFromRight{from{opacity:0;transform:translateX(45px)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideFromLeft {from{opacity:0;transform:translateX(-45px)}to{opacity:1;transform:translateX(0)}}
  #frame.from-right{animation:slideFromRight .34s cubic-bezier(.22,.61,.36,1)}
  #frame.from-left {animation:slideFromLeft  .34s cubic-bezier(.22,.61,.36,1)}
  @media(prefers-reduced-motion:reduce){#frame.from-right,#frame.from-left{animation:none}}

  .ftr{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);text-align:center;
       font-size:10.5px;color:var(--mut);padding:7px 14px;display:flex;align-items:center;
       justify-content:center;gap:7px;flex-wrap:wrap;
       padding-bottom:calc(7px + env(safe-area-inset-bottom))}
  .ftr .help{display:inline-flex;align-items:center;gap:5px;color:var(--navy);font-weight:700}
  .ftr svg{width:12px;height:12px;fill:var(--violet)}

  /* ---------------- Tablet ---------------- */
  @media(max-width:900px){
    /* stamp is hidden here, so the right block shrinks and the padding with it */
    .hdr{padding:6px 140px;min-height:42px}
    .hdr h1{font-size:15px}
    .hdr img.logo{height:22px}
    .stamp{display:none}
    .hdrright{right:10px}
    .hdrleft{left:10px}
    .refresh{padding:6px 11px;font-size:11px}
  }

  /* ---------------- Phone ---------------- */
  @media(max-width:560px){
    /* Burger sits left and Refresh sits right, both absolute, so the centre
       block is padded clear of them and allowed to shrink instead of colliding. */
    .hdr{padding:6px 104px;min-height:42px}
    .hdr img.logo{height:18px}
    .hdr h1{font-size:13px;line-height:1.2}
    .hdrright{right:8px}
    .hdrleft{left:8px;gap:8px}
    .burger{width:34px;height:30px}              /* keep a real tap target */
    .menu{min-width:min(78vw,250px)}
    .menu .mi{font-size:12px;padding:10px 11px}  /* thumb friendly rows */
    .refresh{padding:8px 10px;font-size:10.5px;gap:5px}
    .refresh #rtxt{display:none}
    .refresh:after{content:'\21BB';font-size:15px;line-height:1}
    .refresh.busy:after{content:''}
    .ftr{font-size:9.5px;padding:6px 10px;gap:5px}
  }

  /* ---------------- Small phone ---------------- */
  @media(max-width:400px){
    .hdr{padding:6px 96px}
    .hdr img.logo{height:18px}
    .hdr h1{font-size:11.5px}
    .hdrleft{left:6px;gap:7px}
    .hdrright{right:6px}
    .burger{width:31px;height:28px}
    .ftr{font-size:9px}
  }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdrleft" id="hdrleft">
    <button class="burger" id="burger" onclick="toggleMenu(event)" title="Reports" aria-label="Reports" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <img src="logo.jpg" alt="SNOWTEX" class="logo">
    <!-- add future report pages here, they will appear in this menu automatically -->
    <div class="menu" id="menu">
      <div class="menuhd">Efficiency</div>
      <button class="mi on" id="t_daily" onclick="go('daily')">Daily Individual Eff% Report</button>
      <button class="mi" id="t_range" onclick="go('range')">Weekly Individual PIB Report</button>
      <button class="mi" id="t_trend" onclick="go('trend')">Cutting Efficiency Trend</button>
      <div class="menuhd">Compliance</div>
      <button class="mi" id="t_fabric" onclick="go('fabric')">Daily Fabric Roll Compliance Report</button>
      <button class="mi" id="t_fabweek" onclick="go('fabweek')">Weekly Fabric Roll Compliance Report</button>
    </div>
  </div>
  <h1>SOSL Cutting Section Dashboard</h1>
  <div class="hdrright">
    <div class="stamp" id="stamp"><span class="lbl">Last updated</span><b>&ndash;</b></div>
    <button class="refresh" id="rbtn" onclick="doRefresh()" title="Refresh data"><span class="dot"></span><span id="rtxt">Refresh</span></button>
  </div>
</div>

<div class="ovl" id="ovl">
  <div class="dlg" id="dlg">
    <div class="dh" id="dlgh"></div>
    <div class="db" id="dlgb"></div>
    <div class="df" id="dlgf"></div>
  </div>
</div>

<iframe id="frame" src="efficiency/daily.html"></iframe>

<div class="ftr">
  <span>&copy; 2026 SNOWTEX CI Team</span>
  <span>|</span>
  <span class="help">
    <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .7-.2 1l-2.3 2.2z"/></svg>
    Help 2803
  </span>
</div>

<script>
/* ------------------------------------------------------------------
   Recursion guard.
   If a report page is missing from the deployed build, the host serves
   this shell in its place. The shell's own iframe then asks for the same
   missing page, gets the shell again, and the header stacks down the
   screen forever. That is a deployment fault, not a code fault, so say
   so plainly instead of looping.
   ------------------------------------------------------------------ */
if (window.self !== window.top) {
  document.body.innerHTML =
    '<div style="font-family:\'Plus Jakarta Sans\',sans-serif;padding:38px 26px;'
    + 'text-align:center;color:#252A45;background:#F4F5F9;min-height:100%">'
    + '<div style="font-size:15px;font-weight:800;color:#D64550;margin-bottom:12px">'
    + 'Report page not found on the server</div>'
    + '<div style="font-size:12.5px;line-height:1.9;max-width:560px;margin:0 auto;color:#7A81A0">'
    + 'The host could not find <b>' + location.pathname + '</b> and returned the '
    + 'dashboard shell instead.<br><br>'
    + 'The <b>efficiency/</b> and <b>compliance/</b> folders are missing from the '
    + 'deployed build. Commit and push both folders, or re-upload the whole '
    + 'Dashboard folder, then redeploy.<br><br>'
    + '<code style="background:#E4E6F0;padding:3px 7px;border-radius:5px;font-size:11.5px">'
    + 'git add -A &amp;&amp; git commit -m "add report folders" &amp;&amp; git push</code>'
    + '</div></div>';
  throw new Error('Shell loaded inside its own iframe, stopping to prevent recursion.');
}

/* Each report is fed by the Apps Script deployed on ITS OWN spreadsheet, so
   there is no single API_URL any more. Refresh has to hit whichever endpoint
   belongs to the tab currently on screen, otherwise pressing it on the Fabric
   report would rebuild the Efficiency snapshot and appear to do nothing.
     page  -> the html file
     url   -> that sheet's /exec deployment
     key   -> sessionStorage key its snapshot is parked under
     drop  -> sessionStorage prefixes to clear so stale days/details go too */
/* Two systems, two spreadsheets, two Apps Script deployments, two folders.
     efficiency/  -> sheet "Cutting Individual Effi% _"   (EFF_API)
     compliance/  -> sheet "Fabric Comlpliance"           (FAB_API)
   Each system's Code.gs lives with its own downloader, not in this repo. */
var EFF_API = "https://script.google.com/macros/s/AKfycbxQ2BmHNHGuMpy244VH_Tl2CwlB9Yu6HZUfg28XvqR4TWPcQowPQSMQuaNR27-wuSSP/exec";
var FAB_API = "https://script.google.com/macros/s/AKfycbyUKWEap2AzQqsJ99nYAwj281xETRg7fIQJ2GWR6lQGOL6lM2FBQO0IFMUMSwdO0atz/exec";
/* Third system. The weekly PIB report reads reviewed rows from the Cutting
   Individual PIB sheet, which is a different spreadsheet with its own script.
   Paste its /exec link here AND into PIB_API in efficiency/range.html. */
var PIB_API = "https://script.google.com/macros/s/AKfycbyx4_1Oe3q03fWNEwIWWeicfSssI-g7TF1_sZrUFakWRsmSf8rGJXj1bHOJ6tS7w9_tDA/exec";

var REPORTS = {
  daily:  { page:'efficiency/daily.html',  url:EFF_API,
            key:'sosl_snapshot_v1',   drop:['sosl_day_','sosl_det'] },
  /* range.html fetches on its own and parks nothing, so Refresh only needs to
     warm the snapshot. No cache keys to drop. */
  range:  { page:'efficiency/range.html',  url:PIB_API,
            key:'sosl_pib_snapshot_v1', drop:['sosl_pib_data_'] },
  /* The trend page reads the efficiency API over a date range and caches per
     range, so Refresh only has to drop those. */
  trend:  { page:'efficiency/trend.html',  url:EFF_API,
            key:'sosl_snapshot_v1',   drop:['sosl_trend_'] },
  fabric: { page:'compliance/fabric.html', url:FAB_API,
            key:'fabric_snapshot_v3', drop:['fabric_day_','fabric_det_'] },
  /* The weekly report aggregates server side and parks nothing, so it has no
     snapshot key of its own. Refresh just clears its per-range cache. */
  fabweek:{ page:'compliance/weekly.html', url:FAB_API,
            key:'fabric_snapshot_v3', drop:['fabwk_d_','fabwk_dates'] }
};

var TABS=['daily','range','trend','fabric','fabweek'], curTab='daily';

/* ---------- pages menu ---------- */
function openMenu(){
  document.getElementById('menu').classList.add('open');
  document.getElementById('burger').classList.add('on');
  document.getElementById('burger').setAttribute('aria-expanded','true');
}
function closeMenu(){
  document.getElementById('menu').classList.remove('open');
  document.getElementById('burger').classList.remove('on');
  document.getElementById('burger').setAttribute('aria-expanded','false');
}
function toggleMenu(ev){
  if(ev) ev.stopPropagation();
  if(document.getElementById('menu').classList.contains('open')) closeMenu(); else openMenu();
}

/* No full-page overlay is used to catch outside clicks, because that overlay
   also swallowed clicks meant for the report underneath. Instead: */
/* 1. a click anywhere in this document outside the menu closes it */
document.addEventListener('click',function(e){
  var left=document.getElementById('hdrleft');
  if(left && !left.contains(e.target)) closeMenu();
});
/* 2. a click inside the iframe cannot bubble up here, but it does move focus
      away from this window, so blur covers the report area */
window.addEventListener('blur',closeMenu);
/* 3. keyboard escape */
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeMenu(); });

function go(which){
  closeMenu();
  /* Only refuse when the frame is ALREADY showing this report. Comparing
     against curTab alone meant that if the menu and the frame ever drifted
     apart, clicking the highlighted entry did nothing at all and the only way
     out was to click a different report first. */
  var actually = frameTab();
  if(which===curTab && actually===which) return;
  var dir = TABS.indexOf(which) > TABS.indexOf(curTab) ? 'from-right' : 'from-left';
  curTab = which;

  TABS.forEach(function(t){
    var b=document.getElementById('t_'+t);
    if(b) b.classList.toggle('on', t===which);
  });

  /* The incoming report posts its own timestamp up as soon as it renders, but
     the header would otherwise show the previous report's until then. */
  setStamp('');

  var f=document.getElementById('frame');
  f.classList.remove('from-right','from-left');
  void f.offsetWidth;                       /* force reflow so the animation restarts */
  f.src = REPORTS[which].page;
  f.classList.add(dir);
  markLoading();            /* new report, new first load */
}

function setBusy(on){
  var b=document.getElementById('rbtn');
  b.classList.toggle('busy',on);
  b.disabled=on;
  document.getElementById('rtxt').textContent = on ? 'Loading' : 'Refresh';
}

function setStamp(t){
  document.getElementById('stamp').innerHTML=
    '<span class="lbl">Last updated</span><b>'+(t||'&ndash;')+'</b>';
}

/* Rebuild server snapshot, cache it, tell the report page to redraw.
   Nothing on screen is dimmed or cleared while this runs. */
/* ---------- Refresh ----------
   The shell used to decide what to fetch on the report's behalf, which meant
   it refreshed the wrong thing: pressing Refresh on the Weekly Fabric report
   rebuilt the DAILY fabric snapshot, and on any page it ignored the date or
   range actually on screen.

   Only the open report knows its own state: which day is selected, which
   range, which presets. So the shell now just asks it to refresh itself and
   waits for it to report back. Every page implements 'do-refresh'. */
var REFRESH_TIMEOUT = 90000;   /* a cold rebuild can genuinely take a while */
var refreshTimer = null;

/* ---------- small dialog ----------
   Replaces alert() and confirm(). Those are blocking, ugly on a phone, and on
   some Android browsers they are suppressed inside an iframe host. */
function dialog(opt){
  var ovl=document.getElementById('ovl');
  document.getElementById('dlg').className='dlg '+(opt.kind||'warn');
  document.getElementById('dlgh').textContent=opt.title||'';
  document.getElementById('dlgb').innerHTML=opt.body||'';
  var f=document.getElementById('dlgf'); f.innerHTML='';

  function close(){ ovl.classList.remove('on'); }

  (opt.buttons||[]).forEach(function(b){
    var el=document.createElement('button');
    el.className=b.cls||'no';
    el.textContent=b.label;
    el.onclick=function(){ close(); if(b.fn) b.fn(); };
    f.appendChild(el);
  });
  ovl.classList.add('on');
  ovl.onclick=function(e){ if(e.target===ovl) close(); };
}

/* ---------- is the open report still doing its first load? ----------
   A report posts its timestamp up ('stamp') the moment it has painted. So
   "loading" means: we navigated, and no stamp has come back yet. This is
   tracked in the shell so no report page needs changing. */
var pageLoading = true;
var loadStarted = Date.now();

function markLoading(){ pageLoading = true; loadStarted = Date.now(); setStamp(''); }
function markLoaded(){  pageLoading = false; }

/* ---------- Refresh ----------
   WHY THE WARNING. Refresh does not cancel anything: it asks the server to
   rebuild the snapshot from scratch. Pressing it while the report is still
   loading queues a SECOND full rebuild behind the first, so the page the user
   is waiting for arrives later, not sooner. They were doing exactly that, then
   pressing it again because it felt stuck. The button now explains itself. */
function doRefresh(){
  var f = document.getElementById('frame');
  if(!f || !f.contentWindow){ return; }

  if(pageLoading){
    var secs = Math.round((Date.now()-loadStarted)/1000);
    dialog({
      kind:'stop',
      title:'The report is still loading',
      body:'This report has been loading for <b>'+secs+' second'+(secs===1?'':'s')+'</b>.'
          +'<br><br>Refresh does <b>not</b> cancel it and does <b>not</b> make it faster. '
          +'It asks the server to rebuild everything again, and that second rebuild '
          +'has to wait for the first one to finish. Pressing it now makes the wait '
          +'<b>longer</b>.'
          +'<br><br>Please wait for the numbers to appear.',
      buttons:[{label:'OK, I will wait', cls:'ok'}]
    });
    return;
  }

  dialog({
    kind:'warn',
    title:'Refresh this report?',
    body:'This rebuilds the report from the Google Sheet. It normally takes '
        +'<b>10 to 60 seconds</b>.'
        +'<br><br>You only need it if someone changed the sheet just now. '
        +'The report already refreshes itself every morning.'
        +'<br><br><b>Please press it once</b> and wait. Pressing it again '
        +'starts another rebuild and slows this one down.',
    buttons:[
      {label:'Cancel', cls:'no'},
      {label:'Yes, refresh', cls:'yes', fn:startRefresh}
    ]
  });
}

function startRefresh(){
  var f = document.getElementById('frame');
  if(!f || !f.contentWindow){ return; }
  setBusy(true);
  pageLoading = true;
  loadStarted = Date.now();
  clearTimeout(refreshTimer);
  /* If the page never answers, release the button rather than spin for ever. */
  refreshTimer = setTimeout(function(){ setBusy(false); markLoaded(); }, REFRESH_TIMEOUT);
  f.contentWindow.postMessage({ type:'do-refresh' }, '*');
}

function refreshDone(msg){
  clearTimeout(refreshTimer);
  setBusy(false);
  markLoaded();
  if(msg && msg.stamp) setStamp(msg.stamp);
  if(msg && msg.error){
    dialog({
      kind:'stop', title:'Refresh failed',
      body:String(msg.error).replace(/</g,'&lt;'),
      buttons:[{label:'Close', cls:'ok'}]
    });
  }
}

window.addEventListener('message', function(ev){
  if(!ev.data) return;
  /* A stamp is a report saying "I have painted", which ends the loading state
     whether it arrived from a first load or from a refresh. */
  if(ev.data.type==='stamp'){ setStamp(ev.data.value); markLoaded(); }
  if(ev.data.type==='refresh-done') refreshDone(ev.data);
});

/* A report that paints without posting a stamp would leave the button locked
   behind the "still loading" warning for ever. The iframe load event is the
   backstop: give it a few seconds after the frame loads, then release. */
document.getElementById('frame').addEventListener('load', function(){
  setTimeout(function(){ markLoaded(); }, 6000);
});

/* ---------- keep the menu in step with what is actually on screen ----------
   curTab was only ever set by go(). If the iframe ended up on a different
   report by any other route (a reload restoring the previous src, a back or
   forward navigation, or an error path), the menu kept highlighting the old
   entry and the header stamp belonged to the wrong report. Reading the
   iframe's real src after every load makes the menu follow the content
   instead of assuming it. */
function tabFromSrc(src){
  if(!src) return null;
  var path = String(src).split('?')[0].split('#')[0];
  for(var k in REPORTS){
    if(REPORTS.hasOwnProperty(k) && path.indexOf(REPORTS[k].page) > -1) return k;
  }
  return null;
}
/* Where the frame REALLY is, not where it was told to go. */
function frameTab(){
  var f=document.getElementById('frame');
  if(!f) return null;
  /* Live location first. The src ATTRIBUTE never changes after the browser
     restores a session or the user navigates back, so reading it first made
     the menu confidently report the wrong page. */
  var live=null;
  try{ live=tabFromSrc(f.contentWindow.location.pathname) }catch(e){ live=null }
  return live || tabFromSrc(f.getAttribute('src'));
}
function syncTabFromFrame(){
  var which = frameTab();
  if(!which || which===curTab) return;
  curTab = which;
  TABS.forEach(function(t){
    var b=document.getElementById('t_'+t);
    if(b) b.classList.toggle('on', t===which);
  });
}
(function(){
  var f=document.getElementById('frame');
  if(f) f.addEventListener('load', syncTabFromFrame);
  syncTabFromFrame();
})();

/* =====================================================================
   Background warm-up for the Weekly Fabric Roll Compliance report
   ---------------------------------------------------------------------
   The weekly report reads its per-day aggregates from localStorage. This
   shell fills that store quietly the moment the dashboard opens, while the
   user is still looking at the first report. By the time they click Weekly,
   the last week is already there and the page renders with no network call
   and no spinner.

   Uses exactly the same keys as weekly.html:
     fabwk_dates      the list of available dates
     fabwk_d_<date>   one aggregate per day
   Silent by design: any failure just means the weekly page fetches for
   itself, exactly as it did before.
   ===================================================================== */
var WARM_DAYS = 7;      /* how far back to pre-load */
/* MUST match DAY_SCHEMA in weekly.html and DAYCACHE_VER in the Fabric Code.gs.
   It sat at 3 while those two moved to 4 and then 5, so every warmed day was
   thrown away on arrival by the !==WARM_SCHEMA check below and the whole
   pre-warm did nothing but burn a background fetch on every dashboard load.
   Nothing errored, which is exactly why it went unnoticed. Bump all three
   together, or do not bump any of them. */
var WARM_SCHEMA = 5;
var WARM_KEY  = 'fabwk_d_', WARM_DATES = 'fabwk_dates';

function warmGet(k){ try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null} }
function warmSet(k,o){ try{localStorage.setItem(k,JSON.stringify(o))}catch(e){} }

function warmWeekly(){
  fetch(FAB_API+'?action=dates')
    .then(function(r){ return r.ok ? r.json() : null })
    .then(function(res){
      if(!res || res.error || !res.dates || !res.dates.length) return;
      warmSet(WARM_DATES,{dates:res.dates,latest:res.latest});

      /* the most recent WARM_DAYS days that actually have data */
      var want = res.dates.slice(-WARM_DAYS);
      var missing = want.filter(function(d){
        var c=warmGet(WARM_KEY+d);
        return !(c && c.v===WARM_SCHEMA);      /* refetch anything older */
      });
      if(!missing.length) return;                 /* already warm, nothing to do */

      return fetch(FAB_API+'?action=days&dates='+encodeURIComponent(missing.join(',')))
        .then(function(r){ return r.ok ? r.json() : null })
        .then(function(dres){
          if(!dres || dres.error || !dres.days) return;
          for(var k in dres.days) if(dres.days.hasOwnProperty(k)){
            if(dres.days[k] && dres.days[k].v!==WARM_SCHEMA) continue;
            warmSet(WARM_KEY+k,dres.days[k]);
          }
        });
    })
    .catch(function(){});                          /* stay silent, never block the UI */
}

/* Wait for the first report to settle so the warm-up never competes with it. */
if(window.requestIdleCallback) requestIdleCallback(function(){ warmWeekly() },{timeout:4000});
else setTimeout(warmWeekly,2000);

/* ---------- which copy am I looking at? ----------
   Published files get cached by the browser and by Cloudflare, so "I uploaded
   it" and "the site is running it" are two different statements. This prints
   the build stamp into the footer and the console, which settles the question
   in two seconds instead of a round of guessing. */
(function(){
  var B='23 Aug 2026 17:58';
  try{ console.log('%c SNOWTEX build '+B+' | Shell ','background:#333D6D;color:#fff;padding:2px 6px;border-radius:3px'); }catch(e){}
  function stamp(){
    var f=document.querySelector('.ftr, .printfoot, footer');
    if(f && f.textContent.indexOf('build')<0){
      var s=document.createElement('span');
      s.style.cssText='opacity:.55;font-size:9.5px;margin-left:10px';
      s.textContent='build '+B;
      f.appendChild(s);
    }
  }
  if(document.readyState!=='loading') stamp();
  else document.addEventListener('DOMContentLoaded', stamp);
})();
</script>
