<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNOWTEX | SOSL Cutting Section Dashboard</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#333D6D">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;display:flex;flex-direction:column;overflow:hidden;
       -webkit-text-size-adjust:100%}

  .hdr{background:var(--navy);color:#fff;padding:6px 20px;display:flex;align-items:center;gap:11px;
       justify-content:center;position:relative;min-height:44px;flex:0 0 auto}
  .hdr img.logo{height:24px;display:block;border-radius:3px}
  .hdr h1{font-size:14px;font-weight:800;line-height:1.2;letter-spacing:.2px}
  .hdr .sub{font-size:9.5px;color:#BFC4E0;margin-top:1px}
  .hdrright{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:11px}

  /* ---- pages menu (3 bar) ---- */
  .hdrleft{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
  .burger{background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:8px;
          width:34px;height:30px;cursor:pointer;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:4px;padding:0}
  .burger:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5)}
  .burger span{display:block;width:16px;height:2px;background:#fff;border-radius:2px;transition:.18s}
  .burger.on span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .burger.on span:nth-child(2){opacity:0}
  .burger.on span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  .menu{position:absolute;left:0;top:calc(100% + 7px);background:#fff;border:1px solid var(--line);
        border-radius:10px;box-shadow:0 12px 30px -6px rgba(20,25,55,.35);padding:6px;
        min-width:250px;display:none;z-index:60}
  .menu.open{display:block}
  .menu .menuhd{font-size:9px;font-weight:800;color:var(--mut);text-transform:uppercase;
                letter-spacing:.7px;padding:6px 9px 5px}
  .menu .mi{display:block;width:100%;text-align:left;background:transparent;border:0;
            font-family:inherit;font-size:12px;font-weight:700;color:var(--txt);
            padding:8px 10px;border-radius:7px;cursor:pointer}
  .menu .mi:hover{background:var(--cream)}
  .menu .mi.on{background:var(--violet);color:#fff}
  .scrim{position:fixed;inset:0;z-index:55;display:none}
  .scrim.open{display:block}
  .stamp{font-size:10px;color:#BFC4E0;text-align:right;line-height:1.45}
  .refresh{background:var(--violet);color:#fff;border:0;border-radius:8px;padding:7px 14px;
    font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .refresh:hover{filter:brightness(1.1)}
  .refresh:disabled{opacity:.75;cursor:default}
  .dot{width:12px;height:12px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:none;flex:0 0 auto}
  .refresh.busy .dot{display:inline-block;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  #frame{flex:1 1 auto;width:100%;border:0;display:block;background:var(--bg)}
  @keyframes slideFromRight{from{opacity:0;transform:translateX(45px)}to{opacity:1;transform:translateX(0)}}
  @keyframes slideFromLeft {from{opacity:0;transform:translateX(-45px)}to{opacity:1;transform:translateX(0)}}
  #frame.from-right{animation:slideFromRight .34s cubic-bezier(.22,.61,.36,1)}
  #frame.from-left {animation:slideFromLeft  .34s cubic-bezier(.22,.61,.36,1)}
  @media(prefers-reduced-motion:reduce){#frame.from-right,#frame.from-left{animation:none}}

  .ftr{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);text-align:center;
       font-size:10.5px;color:var(--mut);padding:7px 14px;display:flex;align-items:center;
       justify-content:center;gap:7px;flex-wrap:wrap;
       padding-bottom:calc(7px + env(safe-area-inset-bottom))}
  .ftr .help{display:inline-flex;align-items:center;gap:5px;color:var(--navy);font-weight:700}
  .ftr svg{width:12px;height:12px;fill:var(--violet)}

  /* ---------------- Tablet ---------------- */
  @media(max-width:900px){
    .hdr{padding:6px 12px 6px 56px;gap:10px;min-height:42px}
    .hdr h1{font-size:13px}
    .hdr .sub{font-size:9px}
    .hdr img.logo{height:22px}
    .stamp{display:none}
    .hdrright{right:10px}
    .hdrleft{left:10px}
    .refresh{padding:6px 11px;font-size:11px}
  }

  /* ---------------- Phone ---------------- */
  @media(max-width:560px){
    .hdr{gap:8px;padding:6px 10px 6px 52px;min-height:40px;justify-content:flex-start}
    .hdr img.logo{height:20px}
    .hdr h1{font-size:11.5px;line-height:1.2}
    .hdr .sub{display:none}
    .hdrright{right:8px}
    .hdrleft{left:8px}
    .burger{width:31px;height:27px}
    .menu{min-width:210px}
    .menu .mi{font-size:11.5px}
    .refresh{padding:6px 9px;font-size:10.5px;gap:5px}
    .refresh #rtxt{display:none}
    .refresh:after{content:'\21BB';font-size:14px;line-height:1}
    .refresh.busy:after{content:''}
    .ftr{font-size:9.5px;padding:6px 10px;gap:5px}
  }
</style>
</head>
<body>

<div class="scrim" id="scrim" onclick="closeMenu()"></div>

<div class="hdr">
  <div class="hdrleft">
    <button class="burger" id="burger" onclick="toggleMenu(event)" title="Reports" aria-label="Reports" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <!-- add future report pages here, they will appear in this menu automatically -->
    <div class="menu" id="menu">
      <div class="menuhd">Reports</div>
      <button class="mi on" id="t_daily" onclick="go('daily')">Daily Individual Eff% Report</button>
      <button class="mi" id="t_range" onclick="go('range')">Weekly Individual Eff% Report</button>
    </div>
  </div>
  <img src="logo.jpg" alt="SNOWTEX" class="logo">
  <div>
    <h1>SOSL Cutting Section Dashboard</h1>
    <div class="sub">Snowtex Outerwear Ltd &bull; Snowtex Sportswear Ltd &bull; 11 Production Floors</div>
  </div>
  <div class="hdrright">
    <div class="stamp" id="stamp">Data as of<br>&ndash;</div>
    <button class="refresh" id="rbtn" onclick="doRefresh()" title="Refresh data"><span class="dot"></span><span id="rtxt">Refresh</span></button>
  </div>
</div>

<iframe id="frame" src="daily.html"></iframe>

<div class="ftr">
  <span>&copy; 2026 SNOWTEX CI Team</span>
  <span>|</span>
  <span class="help">
    <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .7-.2 1l-2.3 2.2z"/></svg>
    Help 2803
  </span>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbxQ2BmHNHGuMpy244VH_Tl2CwlB9Yu6HZUfg28XvqR4TWPcQowPQSMQuaNR27-wuSSP/exec";
var SNAP_KEY = 'sosl_snapshot_v1';

var TABS=['daily','range'], curTab='daily';

/* ---------- pages menu ---------- */
function openMenu(){
  document.getElementById('menu').classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('burger').classList.add('on');
  document.getElementById('burger').setAttribute('aria-expanded','true');
}
function closeMenu(){
  document.getElementById('menu').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('burger').classList.remove('on');
  document.getElementById('burger').setAttribute('aria-expanded','false');
}
function toggleMenu(ev){
  if(ev) ev.stopPropagation();
  if(document.getElementById('menu').classList.contains('open')) closeMenu(); else openMenu();
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeMenu(); });

function go(which){
  closeMenu();
  if(which===curTab) return;
  var dir = TABS.indexOf(which) > TABS.indexOf(curTab) ? 'from-right' : 'from-left';
  curTab = which;

  document.getElementById('t_daily').classList.toggle('on', which==='daily');
  document.getElementById('t_range').classList.toggle('on', which==='range');

  var f=document.getElementById('frame');
  f.classList.remove('from-right','from-left');
  void f.offsetWidth;                       /* force reflow so the animation restarts */
  f.src = (which==='daily') ? 'daily.html' : 'range.html';
  f.classList.add(dir);
}

function setBusy(on){
  var b=document.getElementById('rbtn');
  b.classList.toggle('busy',on);
  b.disabled=on;
  document.getElementById('rtxt').textContent = on ? 'Loading' : 'Refresh';
}

function setStamp(t){
  document.getElementById('stamp').innerHTML='Data as of<br>'+(t||'&ndash;');
}

/* Rebuild server snapshot, cache it, tell the report page to redraw.
   Nothing on screen is dimmed or cleared while this runs. */
function doRefresh(){
  setBusy(true);
  fetch(API_URL+'?action=snapshot&fresh=1')
    .then(function(r){ if(!r.ok) throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(res.error) throw new Error(res.error);
      try{
        sessionStorage.setItem(SNAP_KEY, JSON.stringify(res));
        Object.keys(sessionStorage).forEach(function(k){
          if(k.indexOf('sosl_day_')===0 || k.indexOf('sosl_det')===0) sessionStorage.removeItem(k);
        });
      }catch(e){}
      setStamp(res.generatedAt);
      var f=document.getElementById('frame');
      if(f.contentWindow) f.contentWindow.postMessage({type:'snapshot-updated'},'*');
      setBusy(false);
    })
    .catch(function(e){ setBusy(false); alert('Refresh failed: '+e.message); });
}

window.addEventListener('message', function(ev){
  if(ev.data && ev.data.type==='stamp') setStamp(ev.data.value);
});
</script>
</body>
</html>
