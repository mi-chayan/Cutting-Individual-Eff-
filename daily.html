<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Individual Eff% Report</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#333D6D; --violet:#723EC3; --peach:#FFCF95; --cream:#FFF0D9;
    --bg:#F4F5F9; --card:#fff; --line:#E4E6F0; --txt:#252A45; --mut:#7A81A0;
    --red:#D64550; --amber:#E08A1E; --green:#1E8E4E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);
       font-size:13px;-webkit-text-size-adjust:100%}

  /* ---- compact control strip ---- */
  .strip{background:#fff;border-bottom:1px solid var(--line);padding:7px 16px;
         display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .strip h2{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap}
  .strip .rsub{font-size:10px;color:var(--mut);white-space:nowrap}
  .sep{width:1px;height:22px;background:var(--line)}
  .strip label{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .strip input[type=date]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-family:inherit;font-size:12px;background:#fff;color:var(--txt)}
  .mini{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:7px;
        padding:5px 11px;font-family:inherit;font-weight:700;font-size:11.5px;cursor:pointer;
        display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .mini:hover{background:var(--cream);border-color:var(--peach)}
  .mini svg{width:12px;height:12px;fill:var(--violet)}
  .showing{font-size:11px;color:var(--mut);white-space:nowrap}
  .acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}

  .wrap{padding:13px 16px 26px;max-width:1560px;margin:0 auto}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:13px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;position:relative;overflow:hidden}
  .kpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
  .kpi.k2:before{background:var(--peach)} .kpi.k3:before{background:var(--red)}
  .kpi .k{font-size:9px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;line-height:1.3}
  .kpi .v{font-size:25px;font-weight:800;margin-top:2px;line-height:1.1}
  .kpi .s{font-size:10px;color:var(--mut);margin-top:2px}
  .v.red{color:var(--red)} .v.green{color:var(--green)} .v.amber{color:var(--amber)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:13px;overflow:hidden}
  .card .hd{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(90deg,var(--cream),#fff)}
  .card .hd h3{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:.2px}
  .hint{font-size:10px;color:var(--mut)}
  .fsel{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-family:inherit;font-size:11px;background:#fff;color:var(--txt);font-weight:700;max-width:100%}
  .search{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-family:inherit;font-size:11.5px;width:200px}
  .push{margin-left:auto}

  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;min-width:700px}
  th{background:var(--navy);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:8px 9px;text-align:center;cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{background:#3D4880}
  th .arr{font-size:8px;opacity:.85;margin-left:2px}
  td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  td.l{text-align:left}
  tbody tr:nth-child(even){background:#FAFBFE}
  tbody tr:hover{background:var(--cream)}
  tr.clickable{cursor:pointer}
  tr.active-floor{background:#EFE7FB !important;box-shadow:inset 3px 0 0 var(--violet)}
  tr.totalrow{background:var(--navy) !important;color:#fff;font-weight:800}
  tr.totalrow td{border-bottom:0}
  tr.totalrow .pct{color:#fff !important}

  .pct{font-weight:800}
  .pct.red{color:var(--red)} .pct.amber{color:var(--amber)} .pct.green{color:var(--green)}
  .idshort{display:none}

  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:800;cursor:pointer;color:var(--mut)}
  .chip:hover{border-color:var(--violet);color:var(--violet)}
  .chip.on{background:var(--violet);border-color:var(--violet);color:#fff}

  .foot{font-size:10px;color:var(--mut);padding:8px 13px;background:#FAFBFE}
  .loading{padding:60px;text-align:center;color:var(--mut);font-weight:700}
  .spin{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp .9s linear infinite;margin-bottom:10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{padding:40px;text-align:center;color:var(--mut);line-height:1.7}

  /* ---- ERP source card ---- */
  .erp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
       display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .erp .ic{width:34px;height:34px;border-radius:9px;background:var(--cream);border:1px solid var(--peach);
           display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .erp .ic svg{width:16px;height:16px;fill:var(--violet)}
  .erp .txt h4{font-size:12px;font-weight:800;color:var(--navy)}
  .erp .txt .u{font-size:10.5px;color:var(--mut);margin-top:2px;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
  .erp .go{margin-left:auto;background:var(--violet);color:#fff;text-decoration:none;border-radius:8px;
           padding:8px 15px;font-weight:700;font-size:11.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .erp .go:hover{filter:brightness(1.1)}
  .erp .go svg{width:12px;height:12px;fill:#fff}

  /* ---- print-only header ---- */
  .printhead{display:none}

  /* ---------------- Tablet ---------------- */
  @media(max-width:900px){
    .strip{padding:6px 11px;gap:9px}
    .strip h2{font-size:11.5px}
    .strip .rsub,.sep{display:none}
    .wrap{padding:11px 11px 22px}
    .search{width:170px}
  }

  /* ---------------- Phone ---------------- */
  @media(max-width:560px){
    .strip{padding:6px 9px;gap:7px}
    .strip h2{font-size:11px;width:100%}
    .strip label{display:none}
    .strip input[type=date]{font-size:11.5px;padding:5px 6px}
    .mini{padding:5px 9px;font-size:10.5px}
    .showing{font-size:10px}
    .acts{margin-left:0;width:100%}
    .acts .mini{flex:1;justify-content:center}
    .wrap{padding:10px 9px 20px}
    .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
    .kpi{padding:9px 11px}
    .kpi:first-child{grid-column:span 2}
    .kpi .v{font-size:21px}
    .kpi .k{font-size:8.5px}
    .card .hd{padding:8px 10px;gap:6px}
    .card .hd h3{font-size:11px;width:100%}
    .hint{display:none}
    .erp{padding:11px 12px;gap:10px}
    .erp .txt h4{font-size:11px}
    .erp .txt .u{font-size:9.5px}
    .erp .go{margin-left:0;width:100%;justify-content:center;padding:9px 14px}
    .push{margin-left:0}
    .fsel{font-size:10.5px;flex:1;min-width:0}
    .search{width:100%}
    table{min-width:560px}
    th{font-size:8.5px;padding:7px 6px}
    td{padding:6px 6px;font-size:11.5px}
    .hs{display:none}          /* hide lower-priority columns on phone */
    .foot{font-size:9px;padding:7px 10px}
  }

  /* ---------------- Print: A4 portrait ---------------- */
  @page{ size:A4 portrait; margin:11mm 9mm; }
  @media print{
    body{background:#fff;font-size:9pt}
    .strip,.chips,.search,.fsel,.hint,.push,.acts,.kpi:before,.erp{display:none !important}
    .wrap{padding:0;max-width:none}
    .scroll{overflow:visible}
    .card{border:1px solid #bbb;border-radius:0;margin-bottom:8mm;break-inside:auto}
    .card .hd{background:#fff !important;padding:4pt 0;border-bottom:1.2pt solid var(--navy)}
    .card .hd h3{font-size:10.5pt}
    .printhead{display:block;margin-bottom:6mm;border-bottom:1.5pt solid #333D6D;padding-bottom:4mm}
    .printhead .row1{display:flex;align-items:center;gap:10px}
    .printhead img{height:34px}
    .printhead h1{font-size:13pt;font-weight:800;color:#333D6D}
    .printhead .meta{margin-top:4px;font-size:8.5pt;color:#444;display:flex;gap:16px;flex-wrap:wrap}
    .printhead .meta b{color:#000}
    .kpis{display:flex;gap:4mm;margin-bottom:6mm}
    .kpi{flex:1;border:1px solid #bbb;border-radius:0;padding:3mm;page-break-inside:avoid}
    .kpi .v{font-size:15pt}
    .kpi .k{font-size:7pt}
    .kpi .s{font-size:6.5pt}
    table{min-width:0;width:100%;font-size:7.6pt}
    thead{display:table-header-group}
    tr{page-break-inside:avoid}
    th{background:#333D6D !important;color:#fff !important;padding:4pt 3pt;font-size:6.6pt;
       -webkit-print-color-adjust:exact;print-color-adjust:exact}
    td{padding:3pt;border-bottom:.5pt solid #ddd}
    tbody tr:nth-child(even){background:#F6F7FB !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    tr.totalrow{background:#333D6D !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .pct.red{color:#C0392B !important} .pct.amber{color:#B9700F !important} .pct.green{color:#146C3A !important}
    .hs{display:table-cell !important}
    .nop{display:none !important}                 /* WH column dropped so all others fit */
    .idfull{display:none} .idshort{display:inline}/* last 5 digits of Op. ID only */
    .foot{background:#fff;font-size:7pt;padding:3pt 0;border-top:.5pt solid #ddd}
    .printfoot{display:block !important;margin-top:5mm;font-size:7pt;color:#666;text-align:center;
               border-top:.5pt solid #ccc;padding-top:2mm}
  }
  .printfoot{display:none}
</style>
</head>
<body>

<div class="strip">
  <h2>Daily Individual Eff% Report</h2>
  <span class="rsub">Single day view</span>
  <div class="sep"></div>
  <label>Report Date</label>
  <input type="date" id="d1" onchange="pickDate()">
  <button class="mini" onclick="goLatest()">Latest Day</button>
  <span class="showing" id="showing"></span>
  <div class="acts">
    <button class="mini" onclick="exportExcel()" title="Export current view to Excel">
      <svg viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm-7 2h14v2H5v-2z"/></svg> Excel
    </button>
    <button class="mini" onclick="doPrint()" title="Print current view, A4 portrait">
      <svg viewBox="0 0 24 24"><path d="M7 3h10v4H7V3zm12 6H5a2 2 0 00-2 2v6h4v4h10v-4h4v-6a2 2 0 00-2-2zm-4 10H9v-4h6v4z"/></svg> Print
    </button>
  </div>
</div>

<div id="content"><div class="loading"><div class="spin"></div><br>Loading&hellip;</div></div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbxQ2BmHNHGuMpy244VH_Tl2CwlB9Yu6HZUfg28XvqR4TWPcQowPQSMQuaNR27-wuSSP/exec";
var SNAP_KEY='sosl_snapshot_v1', DAYPFX='sosl_day_';
var ERP_URL="http://192.168.15.15:3000/#/SpreadingCutting/CuttingSectionIndividualPerformance";

var DATA=[], DATES=[], LATEST='', DAY='', STAMP='';
var floorFilter='', sortKey='eff', sortDir=1, query='';
var fSortKey='floor', fSortDir=1;                 /* Floor Wise Report sorting */
var effFloorFilter='all', effIndFilter='all';
var FLOOR_ORDER=['1A','1B','1C','1D','1E','3A','2A','2B','2C','2D','2E'];

function fmt(n,d){return (n==null||isNaN(n))?'-':n.toFixed(d==null?0:d)}
function pctClass(p){return p<65?'red':(p<100?'amber':'green')}
function padId(id){id=String(id||'').trim();return id.charAt(0)==='0'?id:'0'+id}
function shortId(id){return padId(id).slice(-5)}
function prettyDate(s){
  if(!s)return '';
  var p=s.split('-'),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+' '+p[0];
}
function effPass(v,mode){
  if(mode==='lt65')return v<65;
  if(mode==='65to99')return v>=65&&v<100;
  if(mode==='gte100')return v>=100;
  return true;
}
function effLabel(mode){
  return mode==='lt65'?'Below 65%':mode==='65to99'?'65% to 99%':mode==='gte100'?'100% and above':'All';
}
function mapRows(arr){
  return (arr||[]).map(function(r){
    return {floor:r[0],opId:r[1],name:r[2],desig:r[3],wh:r[4],eng:r[5],types:r[6],inMin:r[7],outMin:r[8]};
  });
}
function cacheGet(k){ try{var v=sessionStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null} }
function cacheSet(k,o){ try{sessionStorage.setItem(k,JSON.stringify(o))}catch(e){} }
function tellParent(s){ if(window.parent!==window) window.parent.postMessage({type:'stamp',value:s},'*'); }

/* ---------- boot: cache first, network only if empty ---------- */
function boot(){
  var snap=cacheGet(SNAP_KEY);
  if(snap){ applySnapshot(snap); return; }
  fetch(API_URL+'?action=snapshot')
    .then(function(r){ if(!r.ok)throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(res.error)throw new Error(res.error);
      cacheSet(SNAP_KEY,res); applySnapshot(res);
    }).catch(showErr);
}

function applySnapshot(res){
  DATES=res.dates||[]; LATEST=res.latest||''; DAY=LATEST; STAMP=res.generatedAt||'';
  DATA=mapRows(res.rows);
  document.getElementById('d1').value=LATEST;
  tellParent(STAMP);
  if(!DATA.length && !LATEST){
    document.getElementById('content').innerHTML='<div class="empty">No dated rows found in the floor tabs yet.</div>';return;
  }
  resetFilters(); render();
}

window.addEventListener('message',function(ev){
  if(ev.data && ev.data.type==='snapshot-updated'){
    var snap=cacheGet(SNAP_KEY);
    if(snap) applySnapshot(snap);
  }
});

function goLatest(){
  if(!LATEST){boot();return}
  document.getElementById('d1').value=LATEST;
  pickDate();
}

function pickDate(){
  var d=document.getElementById('d1').value;
  if(!d)return;
  DAY=d;
  if(d===LATEST){
    var snap=cacheGet(SNAP_KEY);
    if(snap){ DATA=mapRows(snap.rows); STAMP=snap.generatedAt; tellParent(STAMP); resetFilters(); render(); return; }
  }
  var cached=cacheGet(DAYPFX+d);
  if(cached){ DATA=mapRows(cached.rows); STAMP=cached.generatedAt; tellParent(STAMP); resetFilters(); render(); return; }

  document.getElementById('content').innerHTML='<div class="loading"><div class="spin"></div><br>Loading '+prettyDate(d)+'&hellip;</div>';
  fetch(API_URL+'?action=data&from='+encodeURIComponent(d)+'&to='+encodeURIComponent(d))
    .then(function(r){ if(!r.ok)throw new Error('API '+r.status); return r.json(); })
    .then(function(res){
      if(res.error)throw new Error(res.error);
      cacheSet(DAYPFX+d,res);
      DATA=mapRows(res.rows); STAMP=res.generatedAt; tellParent(STAMP);
      resetFilters(); render();
    }).catch(showErr);
}

function resetFilters(){floorFilter='';query='';effFloorFilter='all';effIndFilter='all'}
function showErr(e){
  document.getElementById('content').innerHTML='<div class="empty">Error: '+e.message
    +'<br><br>Check: 1) API_URL is the /exec link, 2) deployment access is "Anyone with the link", 3) a NEW VERSION was deployed after the last code change.</div>';
}

/* ---------- aggregation ---------- */
function operatorAgg(){
  var map={};
  DATA.forEach(function(r){
    var k=r.floor+'|'+r.opId;
    if(!map[k])map[k]={floor:r.floor,opId:r.opId,name:r.name,desig:r.desig,n:0,wh:0,eng:0,inMin:0,outMin:0,types:{}};
    var o=map[k];
    o.n++; o.wh+=r.wh; o.eng+=r.eng; o.inMin+=r.inMin; o.outMin+=r.outMin;
    String(r.types||'').split(',').forEach(function(t){t=t.trim();if(t)o.types[t]=1});
    if(r.name)o.name=r.name; if(r.desig)o.desig=r.desig;
  });
  return Object.keys(map).map(function(k){
    var o=map[k];
    o.avgWh=o.wh/o.n; o.avgEng=o.eng/o.n;
    o.eff=o.inMin>0?(o.outMin/o.inMin*100):0;
    o.typeStr=['MS','AS','MC','AC'].filter(function(t){return o.types[t]}).join(', ');
    return o;
  });
}
function floorAgg(ops){
  var map={};
  FLOOR_ORDER.forEach(function(f){map[f]={floor:f,man:0,inMin:0,outMin:0,u65:0}});
  ops.forEach(function(o){
    var f=map[o.floor]; if(!f)return;
    f.man++; f.inMin+=o.inMin; f.outMin+=o.outMin;
    if(o.eff<65)f.u65++;
  });
  return FLOOR_ORDER.map(function(k){
    var f=map[k]; f.eff=f.inMin>0?(f.outMin/f.inMin*100):0; return f;
  });
}

/* current visible sets, shared by render + export + print */
function currentSets(){
  var ops=operatorAgg();
  var floorsAll=floorAgg(ops);
  var tot={man:0,inMin:0,outMin:0,u65:0};
  floorsAll.forEach(function(f){tot.man+=f.man;tot.inMin+=f.inMin;tot.outMin+=f.outMin;tot.u65+=f.u65});
  tot.eff=tot.inMin>0?(tot.outMin/tot.inMin*100):0;

  /* Floor table always lists every floor. Selecting a row only highlights it
     and filters the Individual Report below. */
  var floorsShown=floorsAll.filter(function(f){
    if(f.man===0)return false;
    return effPass(f.eff,effFloorFilter);
  });
  floorsShown.sort(function(a,b){
    var va=a[fSortKey],vb=b[fSortKey];
    if(typeof va==='string')return String(va).localeCompare(String(vb))*fSortDir;
    return (va-vb)*fSortDir;
  });

  var indShown=ops.filter(function(o){
    if(floorFilter&&o.floor!==floorFilter)return false;
    if(!effPass(o.eff,effIndFilter))return false;
    if(query){
      var q=query.toLowerCase();
      if(o.name.toLowerCase().indexOf(q)<0 && padId(o.opId).indexOf(q)<0 && o.desig.toLowerCase().indexOf(q)<0)return false;
    }
    return true;
  });
  indShown.sort(function(a,b){
    var va=a[sortKey],vb=b[sortKey];
    if(typeof va==='string')return String(va).localeCompare(String(vb))*sortDir;
    return (va-vb)*sortDir;
  });

  return {ops:ops,floorsAll:floorsAll,floorsShown:floorsShown,indShown:indShown,tot:tot};
}

/* ---------- render ---------- */
function render(){
  document.getElementById('showing').textContent='Showing: '+prettyDate(DAY);
  var S=currentSets(), tot=S.tot;
  var scopeLabel = floorFilter ? ('Floor '+floorFilter) : 'All Floors';

  var h='<div class="wrap">';

  /* print-only header */
  h+='<div class="printhead"><div class="row1">'
    +'<img src="logo.jpg" alt="SNOWTEX">'
    +'<div><h1>SOSL Cutting Section &mdash; Daily Individual Eff% Report</h1>'
    +'<div class="meta"><span>Date: <b>'+prettyDate(DAY)+'</b></span>'
    +'<span>Scope: <b>'+scopeLabel+'</b></span>'
    +'<span>Team Avg Eff% filter: <b>'+effLabel(effFloorFilter)+'</b></span>'
    +'<span>Individual Eff% filter: <b>'+effLabel(effIndFilter)+'</b></span>'
    +'<span>Data as of: <b>'+(STAMP||'-')+'</b></span></div></div>'
    +'</div></div>';

  h+='<div class="kpis">'
    +'<div class="kpi"><div class="k">Total Man Count</div><div class="v">'+tot.man+'</div><div class="s">operators with data</div></div>'
    +'<div class="kpi k2"><div class="k">Overall Avg Eff% (%)</div><div class="v '+pctClass(tot.eff)+'">'+fmt(tot.eff,1)+'%</div><div class="s">&Sigma; Output Min &divide; &Sigma; Input Min</div></div>'
    +'<div class="kpi k3"><div class="k">Operators Below 65%</div><div class="v '+(tot.u65>0?'red':'')+'">'+tot.u65+'</div><div class="s">'+fmt(tot.man?tot.u65/tot.man*100:0,1)+'% of total man count</div></div>'
    +'</div>';

  h+='<div class="card"><div class="hd"><h3>Floor Wise Report</h3>'
    +'<span class="hint">click a floor row to filter</span><div class="push"></div>'
    +'<select class="fsel" onchange="effFloorFilter=this.value;render()">'
      +opt('all','Team Avg Eff%: All',effFloorFilter)+opt('lt65','Team Avg Eff%: Below 65%',effFloorFilter)
      +opt('65to99','Team Avg Eff%: 65% to 99%',effFloorFilter)+opt('gte100','Team Avg Eff%: 100% and above',effFloorFilter)
    +'</select></div>';
  h+='<div class="scroll"><table><thead><tr>'
    +fTh('floor','Floor')+fTh('man','Man Count (nos)')+fTh('eff','Team Avg Eff% (%)')+fTh('u65','Eff% &lt; 65% (nos)')
    +'</tr></thead><tbody>';
  if(!S.floorsShown.length)h+='<tr><td colspan="4" class="empty">No floor matches this filter.</td></tr>';
  S.floorsShown.forEach(function(f){
    h+='<tr class="clickable'+(floorFilter===f.floor?' active-floor':'')+'" onclick="toggleFloor(\''+f.floor+'\')">'
      +'<td><b>'+f.floor+'</b></td><td>'+f.man+'</td>'
      +'<td class="pct '+pctClass(f.eff)+'">'+fmt(f.eff,1)+'%</td>'
      +'<td>'+f.u65+'</td></tr>';
  });
  h+='<tr class="totalrow clickable" onclick="toggleFloor(\'\')"><td>Total</td><td>'+tot.man+'</td>'
    +'<td class="pct">'+fmt(tot.eff,1)+'%</td><td>'+tot.u65+'</td></tr>';
  h+='</tbody></table></div></div>';

  h+='<div class="card"><div class="hd"><h3>Individual Report</h3>';
  h+='<div class="chips"><span class="chip'+(floorFilter===''?' on':'')+'" onclick="toggleFloor(\'\')">All Floors</span>';
  FLOOR_ORDER.forEach(function(f){h+='<span class="chip'+(floorFilter===f?' on':'')+'" onclick="toggleFloor(\''+f+'\')">'+f+'</span>'});
  h+='</div><div class="push"></div>'
    +'<select class="fsel" onchange="effIndFilter=this.value;render()">'
      +opt('all','Individual Eff%: All',effIndFilter)+opt('lt65','Individual Eff%: Below 65%',effIndFilter)
      +opt('65to99','Individual Eff%: 65% to 99%',effIndFilter)+opt('gte100','Individual Eff%: 100% and above',effIndFilter)
    +'</select>'
    +'<input class="search" id="q" placeholder="Search name / ID / designation" value="'+query+'" oninput="query=this.value;renderKeepFocus()"></div>';
  h+='<div class="scroll"><table><thead><tr>'
    +thSort('floor','Floor','')+thSort('opId','Op. ID','')+thSort('name','Op. Name','')
    +thSort('desig','Designation','hs')+thSort('avgWh','WH (hrs)','hs nop')
    +thSort('avgEng','Engagement% (%)','')+'<th class="hs">Type</th>'
    +thSort('inMin','Input Min (min)','')+thSort('outMin','Output Min (min)','')+thSort('eff','Individual Eff% (%)','')
    +'</tr></thead><tbody>';
  if(!S.indShown.length)h+='<tr><td colspan="10" class="empty">No operators match.</td></tr>';
  S.indShown.forEach(function(o){
    h+='<tr><td>'+o.floor+'</td>'
      +'<td><span class="idfull">'+padId(o.opId)+'</span><span class="idshort">'+shortId(o.opId)+'</span></td>'
      +'<td class="l">'+o.name+'</td>'
      +'<td class="l hs">'+o.desig+'</td><td class="hs nop">'+fmt(o.avgWh,2)+'</td>'
      +'<td>'+fmt(o.avgEng,0)+'%</td><td class="hs">'+o.typeStr+'</td>'
      +'<td>'+fmt(o.inMin,0)+'</td><td>'+fmt(o.outMin,0)+'</td>'
      +'<td class="pct '+pctClass(o.eff)+'">'+fmt(o.eff,0)+'%</td></tr>';
  });
  h+='</tbody></table></div><div class="foot">'+S.indShown.length+' of '+S.ops.length+' operator(s) shown &bull; Ignored operators excluded &bull; Red &lt; 65% &bull; Amber 65&ndash;99% &bull; Green &ge; 100%</div></div>';

  /* ERP source link */
  h+='<div class="erp">'
    +'<div class="ic"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3V5zm0 4h12v2H3V9zm0 4h18v2H3v-2zm0 4h12v2H3v-2z"/></svg></div>'
    +'<div class="txt"><h4>View the full detail report in Snowtex ERP</h4>'
    +'<div class="u">'+ERP_URL+'</div></div>'
    +'<a class="go" href="'+ERP_URL+'" target="_blank" rel="noopener noreferrer">'
    +'Open in ERP <svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h5v2H7v10h10v-3h2v5H5V5z"/></svg></a>'
    +'</div>';

  h+='<div class="printfoot">&copy; 2026 SNOWTEX CI Team &bull; Help 2803 &bull; Generated '+new Date().toLocaleString()+'</div>';
  h+='</div>';

  document.getElementById('content').innerHTML=h;
}

function opt(v,label,cur){return '<option value="'+v+'"'+(cur===v?' selected':'')+'>'+label+'</option>'}
function thSort(key,label,cls){
  var arr=sortKey===key?(sortDir===1?'&#9650;':'&#9660;'):'';
  return '<th class="'+(cls||'')+'" onclick="setSort(\''+key+'\')">'+label+'<span class="arr">'+arr+'</span></th>';
}
function setSort(k){ if(sortKey===k)sortDir*=-1; else {sortKey=k;sortDir=1;} render(); }

/* Floor Wise Report header sorting */
function fTh(key,label){
  var arr=fSortKey===key?(fSortDir===1?'&#9650;':'&#9660;'):'';
  return '<th onclick="setFSort(\''+key+'\')">'+label+'<span class="arr">'+arr+'</span></th>';
}
function setFSort(k){ if(fSortKey===k)fSortDir*=-1; else {fSortKey=k;fSortDir=(k==='floor')?1:-1;} render(); }
function toggleFloor(f){ floorFilter=(floorFilter===f)?'':f; render(); }
function renderKeepFocus(){ render(); var q=document.getElementById('q'); if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);} }

/* ---------- print ---------- */
function doPrint(){ window.focus(); window.print(); }

/* ---------- Excel export ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  var S=currentSets(), tot=S.tot;

  var t='';
  t+='<table><tr><td colspan="10" style="font-size:15pt;font-weight:bold;color:#333D6D">SOSL Cutting Section &ndash; Daily Individual Eff% Report</td></tr>';
  t+='<tr><td colspan="10">Date: '+esc(prettyDate(DAY))+'&nbsp;&nbsp;|&nbsp;&nbsp;Scope: '+esc(scope)
    +'&nbsp;&nbsp;|&nbsp;&nbsp;Team Avg Eff% filter: '+esc(effLabel(effFloorFilter))
    +'&nbsp;&nbsp;|&nbsp;&nbsp;Individual Eff% filter: '+esc(effLabel(effIndFilter))
    +'&nbsp;&nbsp;|&nbsp;&nbsp;Data as of: '+esc(STAMP)+'</td></tr>';
  t+='<tr><td></td></tr></table>';

  /* KPI block */
  t+='<table border="1"><tr>'
    +th2('Total Man Count (nos)')+th2('Overall Avg Eff%')+th2('Operators Below 65% (nos)')+'</tr>'
    +'<tr><td>'+tot.man+'</td>'+pctTd(tot.eff,1)+'<td>'+tot.u65+'</td></tr></table>';
  t+='<table><tr><td></td></tr></table>';

  /* Floor table */
  t+='<table border="1"><tr><td colspan="4" style="font-weight:bold;color:#333D6D">Floor Wise Report</td></tr><tr>'
    +th2('Floor')+th2('Man Count (nos)')+th2('Team Avg Eff%')+th2('Eff% < 65% (nos)')+'</tr>';
  S.floorsShown.forEach(function(f){
    t+='<tr><td>'+esc(f.floor)+'</td><td>'+f.man+'</td>'+pctTd(f.eff,1)+'<td>'+f.u65+'</td></tr>';
  });
  t+='<tr><td style="font-weight:bold">Total</td><td style="font-weight:bold">'+tot.man
    +'</td>'+pctTd(tot.eff,1,'font-weight:bold')+'<td style="font-weight:bold">'+tot.u65+'</td></tr>';
  t+='</table><table><tr><td></td></tr></table>';

  /* Individual table */
  t+='<table border="1"><tr><td colspan="10" style="font-weight:bold;color:#333D6D">Individual Report</td></tr><tr>'
    +th2('Floor')+th2('Op. ID')+th2('Op. Name')+th2('Designation')+th2('WH (hrs)')
    +th2('Engagement%')+th2('Type')+th2('Input Min (min)')+th2('Output Min (min)')+th2('Individual Eff%')+'</tr>';
  S.indShown.forEach(function(o){
    t+='<tr><td>'+esc(o.floor)+'</td>'
      +'<td style="mso-number-format:\'\\@\'">'+esc(padId(o.opId))+'</td>'
      +'<td>'+esc(o.name)+'</td><td>'+esc(o.desig)+'</td><td>'+fmt(o.avgWh,2)+'</td>'
      +pctTd(o.avgEng,0)+'<td>'+esc(o.typeStr)+'</td>'
      +'<td>'+fmt(o.inMin,0)+'</td><td>'+fmt(o.outMin,0)+'</td>'+pctTd(o.eff,0)+'</tr>';
  });
  t+='</table>';
  t+='<table><tr><td></td></tr><tr><td colspan="10">&copy; 2026 SNOWTEX CI Team | Help 2803</td></tr></table>';

  var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">'
    +'<head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
    +'<x:Name>Daily Eff Report</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'
    +'</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
    +'<style>td,th{font-family:Calibri,sans-serif;font-size:11pt;vertical-align:middle}</style></head><body>'+t+'</body></html>';

  var name='SOSL_Daily_Eff_'+DAY+'_'+(floorFilter||'AllFloors')+'.xls';
  var blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a)},1200);
}
function th2(s){return '<th style="background:#333D6D;color:#fff;font-weight:bold">'+esc(s)+'</th>'}

/* Real Excel percentage: value stored as a fraction, displayed with a % sign,
   so the column still sorts and averages correctly instead of being plain text. */
function pctTd(v,dec,extra){
  if(v==null||isNaN(v)) return '<td>-</td>';
  var f='0'+(dec>0?'.'+Array(dec+1).join('0'):'')+'%';
  var st="mso-number-format:'"+f+"';"+(extra||'');
  return '<td style="'+st+'">'+(v/100)+'</td>';
}
